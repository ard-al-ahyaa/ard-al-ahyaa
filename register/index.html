<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | منصة أرض الأحياء</title>

  <!-- صفحة التسجيل لا نحتاج ظهورها في Google -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="canonical"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/register/">

  <link rel="icon"
    type="image/png"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;

    h1 {
      text-align: center;

    .subtitle {
      text-align: center;

    label {
      display: block;

    input {
      width: 100%;

    }

    input:focus {
      border-color: #075e4d;
      box-shadow: 0 0 0 3px rgba(7, 94, 77, 0.08);
    }

    button {
      width: 100%;
      border: none;
      background: #075e4d;

      font-size: 17px;

      transition: 0.2s;

      opacity: 0.6;
      cursor: not-allowed;

    .message {
      display: none;

      display: block;

    .login-link {
      text-align: center;

      text-decoration: underline;
    }

</head>

<body>

  <div class="register-box">

    <img
      src="https://ard-al-ahyaa.github.io/ard-al-ahyaa/logo.png"
      class="logo"
      alt="شعار منصة أرض الأحياء"
      onerror="this.style.display='none'"
    >

    <h1>إنشاء حساب</h1>

    <div class="subtitle">
      منصة أرض الأحياء التعليمية لطلاب الصف الثالث الثانوي
    </div>

    <form id="registerForm">

      <label for="name">اسم الطالب</label>

      <input
        type="text"
        id="name"
        placeholder="اكتب اسمك"
        autocomplete="name"
        maxlength="100"
        required
      >

      <label for="email">البريد الإلكتروني</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        maxlength="150"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="registerButton">
        إنشاء الحساب
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="../login/index.html">تسجيل الدخول</a>
    </div>

  </div>


  <script>

    // =====================================================
    // إعداد Supabase
    // =====================================================

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // =====================================================
    // عناصر الصفحة
    // =====================================================

    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    // =====================================================
    // عرض الرسائل
    // =====================================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // =====================================================
    // إنشاء الحساب
    // =====================================================

    registerForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        // منع إرسال النموذج أكثر من مرة
        if (registerButton.disabled) {
          return;
        }


        // =====================================================
        // قراءة البيانات
        // =====================================================

        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        // =====================================================
        // التحقق من الاسم
        // =====================================================

        if (!name) {

          showMessage(
            "اكتب اسم الطالب.",
            "error"
          );

          return;
        }


        if (name.length < 2) {

          showMessage(
            "اسم الطالب يجب أن يكون حرفين على الأقل.",
            "error"
          );

          return;
        }


        // =====================================================
        // التحقق من البريد
        // =====================================================

        if (!email) {

          showMessage(
            "اكتب البريد الإلكتروني.",
            "error"
          );

          return;
        }


        // =====================================================
        // التحقق من كلمة المرور
        // =====================================================

        if (password.length < 6) {

          showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
            "error"
          );

          return;
        }


        // =====================================================
        // تأكيد كلمة المرور
        // =====================================================

        if (password !== confirmPassword) {

          showMessage(
            "كلمتا المرور غير متطابقتين.",
            "error"
          );

          return;
        }


        // =====================================================
        // بدء التسجيل
        // =====================================================

        registerButton.disabled = true;

        registerButton.textContent =
          "جاري إنشاء الحساب...";

        message.className =
          "message";


        try {

          // =====================================================
          // إنشاء حساب Supabase
          // =====================================================

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: name
                }

              }

            });


          // =====================================================
          // فحص خطأ التسجيل
          // =====================================================

          if (error) {
            throw error;
          }


          if (!data || !data.user) {

            throw new Error(
              "تعذر إنشاء الحساب."
            );

          }


          // =====================================================
          // بيانات المستخدم
          // =====================================================

          const userId =
            data.user.id;


          // =====================================================
          // حفظ بيانات الطالب في profiles
          // =====================================================

          const {
            error: profileError
          } =
            await supabaseClient
              .from("profiles")
              .upsert({

                id: userId,

                full_name: name,

                email: email,

                role: "student"

              });


          // =====================================================
          // لو حدث خطأ في profiles
          // =====================================================

          if (profileError) {

            console.error(
              "Profile error:",
              profileError
            );

          }


          // =====================================================
          // نجاح التسجيل
          // =====================================================

          if (!data.session) {

            showMessage(
              "تم إنشاء الحساب بنجاح باسم " +
              name +
              ". راجع بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.",
              "success"
            );


            // تنظيف النموذج
            registerForm.reset();


          } else {

            showMessage(
              "تم إنشاء حسابك باسم " +
              name +
              " بنجاح. جاري نقلك لتسجيل الدخول...",
              "success"
            );


            setTimeout(function () {

              window.location.href =
                "../login/index.html";

            }, 1800);

          }


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          let errorMessage =
            error.message ||
            "حدث خطأ أثناء إنشاء الحساب.";


          const lowerError =
            errorMessage.toLowerCase();


          // =====================================================
          // رسائل أخطاء مفهومة للمستخدم
          // =====================================================

          if (
            lowerError.includes(
              "already registered"
            ) ||
            lowerError.includes(
              "user already registered"
            )
          ) {

            errorMessage =
              "هذا البريد الإلكتروني مسجل بالفعل.";

          }


          else if (
            lowerError.includes(
              "invalid email"
            )
          ) {

            errorMessage =
              "البريد الإلكتروني غير صحيح.";

          }


          else if (
            lowerError.includes(
              "password should be at least"
            )
          ) {

            errorMessage =
              "كلمة المرور قصيرة جدًا.";

          }


          else if (
            lowerError.includes(
              "email rate limit exceeded"
            )
          ) {

            errorMessage =
              "تم إجراء محاولات تسجيل كثيرة. حاول مرة أخرى لاحقًا.";

          }


          else if (
            lowerError.includes(
              "signup is disabled"
            )
          ) {

            errorMessage =
              "إنشاء الحسابات متوقف حاليًا من إعدادات المنصة.";

          }


          showMessage(
            errorMessage,
            "error"
          );

        }


        // =====================================================
        // إعادة تفعيل الزر
        // =====================================================

        registerButton.disabled = false;

        registerButton.textContent =
          "إنشاء الحساب";

      }
    );

  </script>

</body>

</html>
