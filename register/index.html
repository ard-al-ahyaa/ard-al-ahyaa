<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      color: #075e4d;
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075e4d;
    }

    button {
      width: 100%;
      border: none;
      background: #075e4d;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #064d40;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      display: block;
      background: #e8f7ef;
      color: #176b3a;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a11;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-link a {
      color: #075e4d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <img src="../logo.png" class="logo" alt="منصة أرض الأحياء">

    <h1>إنشاء حساب</h1>

    <div class="subtitle">
      منصة أرض الأحياء التعليمية
    </div>

    <form id="registerForm">

      <label for="name">اسم الطالب</label>
      <input
        type="text"
        id="name"
        placeholder="اكتب اسمك"
        required
      >

      <label for="email">البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        minlength="6"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        إنشاء الحساب
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="../login/index.html">تسجيل الدخول</a>
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cmnmebchevejxhibvgwl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_54UK-Ys41c5wGQvYkeFmYQ_5efdHAQu";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }


    registerForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const name =
          document.getElementById("name")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;


        if (!name) {

          showMessage(
            "اكتب اسم الطالب.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "كلمتا المرور غير متطابقتين.",
            "error"
          );

          return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
          "جاري إنشاء الحساب...";


        try {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: name
                }

              }

            });


          if (error) {

            throw error;

          }


          if (!data.user) {

            throw new Error(
              "تعذر إنشاء المستخدم."
            );

          }


          /*
            الـ Trigger الموجود في Supabase
            سيقوم بإنشاء profiles تلقائيًا.
          */


          if (!data.session) {

            showMessage(
              "تم إنشاء الحساب بنجاح. راجع بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.",
              "success"
            );

          } else {

            showMessage(
              "تم إنشاء الحساب بنجاح. سيتم نقلك لتسجيل الدخول...",
              "success"
            );

            setTimeout(function () {

              window.location.href =
                "../login/index.html";

            }, 1800);

          }


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "حدث خطأ أثناء إنشاء الحساب.",
            "error"
          );

        }


        registerButton.disabled = false;

        registerButton.textContent =
          "إنشاء الحساب";

      }
    );

  </script>

</body>

</html>
