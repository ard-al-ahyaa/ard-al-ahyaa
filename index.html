<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية | منصة أرض الأحياء</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover, .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 40px;
    }

    .welcome-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15);
      margin-bottom: 30px;
    }

    .welcome-card h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome-card p {
      font-size: 16px;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 20px; }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>
      <nav class="menu">
        <a href="index.html" class="active">🏠 الرئيسية</a>
        <a href="videos/index.html">🎥 المحاضرات</a>
        <a href="champion/index.html">🏆 بطل الفصل</a>
        <a href="forum/index.html">💬 المنتدى</a>
        <a href="account/index.html">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="welcome-card">
      <h1>أهلاً بك يا بطل في منصة أرض الأحياء 🌿</h1>
      <p>تفضل بالانتقال إلى قسم المحاضرات لمتابعة الشرح، المذكرات، والواجبات الخاصة بك بكل سهولة.</p>
    </div>
  </main>

</body>

</html>
