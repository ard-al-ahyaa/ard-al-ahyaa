<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | منصة أرض الأحياء</title>

  <meta name="description" content="سجل دخولك إلى منصة أرض الأحياء التعليمية لطلاب الصف الثالث الثانوي.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="canonical"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/login/">

  <link rel="icon" type="image/png"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/favicon.png">

  <link rel="shortcut icon"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #087f5b;
      --green-dark: #066747;
      --blue: #2994f2;
      --blue-light: #eaf4ff;
      --text: #172b3a;
      --muted: #718096;
      --border: #e2e8f0;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 16px;

      background:
        radial-gradient(
          circle at top right,
          rgba(8, 127, 91, .13),
          transparent 38%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(41, 148, 242, .15),
          transparent 40%
        ),
        linear-gradient(135deg, #f5faf8, #f0f6ff);

      color: var(--text);
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    /* رأس الصفحة */

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-wrap {
      width: 94px;
      height: 94px;
      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;
      border: 1px solid rgba(8, 127, 91, .10);
      border-radius: 27px;

      box-shadow: 0 8px 28px rgba(22, 65, 80, .09);
    }

    .logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    .brand h1 {
      color: var(--green-dark);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.6;
    }

    .brand p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    /* بطاقة تسجيل الدخول */

    .login-box {
      width: 100%;
      padding: 30px;

      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 24px;

      box-shadow: 0 18px 55px rgba(25, 55, 75, .10);
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h2 {
      color: var(--text);
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }

    /* حقول الإدخال */

    .input-group {
      margin-bottom: 19px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 8px;

      color: #334155;
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      height: 52px;

      padding: 12px 14px;

      border: 1px solid #dce4ed;
      border-radius: 12px;

      background: #fbfdff;
      color: var(--text);

      font-size: 15px;
      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #9aa8b7;
      font-size: 13px;
    }

    /* التحديد الأزرق الفاتح */

    input:focus {
      border-color: var(--blue);
      background: #ffffff;

      box-shadow: 0 0 0 4px rgba(41, 148, 242, .15);
    }

    input:focus-visible {
      outline: 2px solid rgba(41, 148, 242, .30);
      outline-offset: 2px;
    }

    .password-input {
      padding-left: 54px;
    }

    .toggle-password {
      position: absolute;
      left: 7px;
      top: 7px;

      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 9px;

      background: transparent;
      color: #718096;

      font-size: 19px;
      cursor: pointer;

      transition: background .2s, color .2s;
    }

    .toggle-password:hover,
    .toggle-password:focus-visible {
      background: var(--blue-light);
      color: #0875d1;
      outline: none;
    }

    /* زر تسجيل الدخول */

    .login-btn {
      width: 100%;
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 13px 18px;

      border: 1px solid transparent;
      border-radius: 13px;

      background: linear-gradient(110deg, #087f5b, #09916b);
      color: #fff;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 7px 18px rgba(8, 127, 91, .17);

      transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
    }

    .login-btn:hover {
      background: linear-gradient(110deg, #066747, #087f5b);
      box-shadow: 0 9px 24px rgba(8, 127, 91, .23);
      transform: translateY(-1px);
    }

    .login-btn:focus-visible {
      outline: 3px solid rgba(41, 148, 242, .45);
      outline-offset: 3px;
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* الروابط */

    .forgot {
      display: block;
      width: fit-content;

      margin: 16px auto 0;
      padding: 4px 8px;

      color: #0875c9;
      font-size: 13px;
      font-weight: 700;

      text-decoration: none;
      border-radius: 7px;

      transition: background .2s, color .2s;
    }

    .forgot:hover,
    .forgot:focus-visible {
      color: #075eaa;
      background: var(--blue-light);
      outline: none;
    }

    /* الرسائل */

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px 14px;

      border-radius: 11px;

      font-size: 13px;
      line-height: 1.9;

      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      background: #fff0f1;
      border: 1px solid #f4d0d4;
      color: #a12632;
    }

    .success {
      display: block;
      background: #eaf8ef;
      border: 1px solid #ccebd6;
      color: #176b3a;
    }

    .info {
      display: block;
      background: #edf6ff;
      border: 1px solid #d1e8ff;
      color: #14558b;
    }

    /* إنشاء حساب */

    .register {
      margin-top: 23px;
      padding-top: 19px;

      border-top: 1px solid #edf0f4;

      text-align: center;
      color: var(--muted);

      font-size: 13px;
      line-height: 2;
    }

    .register a {
      display: inline-block;
      margin-right: 3px;
      padding: 1px 5px;

      color: var(--green);
      font-weight: 800;
      text-decoration: none;
      border-radius: 6px;

      transition: background .2s, color .2s;
    }

    .register a:hover,
    .register a:focus-visible {
      color: #0875c9;
      background: var(--blue-light);
      outline: none;
    }

    /* زر تليجرام العائم */

    .telegram-float {
      position: fixed;
      left: 22px;
      bottom: 22px;

      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #229ed9;

      text-decoration: none;
      z-index: 9999;

      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .telegram-float:hover {
      background: #1688c0;
      transform: translateY(-3px);
      box-shadow: 0 9px 25px rgba(0, 0, 0, .23);
    }

    .telegram-float:focus-visible {
      outline: 3px solid rgba(41, 148, 242, .6);
      outline-offset: 4px;
    }

    .telegram-float svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #8b99a8;
      font-size: 11px;
    }

    [hidden] {
      display: none !important;
    }

    /* الموبايل */

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .logo-wrap {
        width: 78px;
        height: 78px;
        border-radius: 22px;
      }

      .logo {
        width: 64px;
        height: 64px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .login-box {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .heading h2 {
        font-size: 21px;
      }

      .telegram-float {
        left: 15px;
        bottom: 15px;
        width: 52px;
        height: 52px;
      }

      .telegram-float svg {
        width: 27px;
        height: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="brand">

      <div class="logo-wrap">
        <img
          src="https://ard-al-ahyaa.github.io/ard-al-ahyaa/logo.png"
          class="logo"
          alt="شعار منصة أرض الأحياء"
          onerror="this.style.display='none'"
        >
      </div>

      <h1>منصة أرض الأحياء</h1>

      <p>
        منصتك التعليمية للصف الثالث الثانوي
      </p>

    </header>

    <section class="login-box">

      <div class="heading">
        <h2>أهلًا بعودتك 👋</h2>

        <p class="subtitle">
          سجل دخولك لمتابعة محاضراتك ودرجاتك التعليمية.
        </p>
      </div>

      <form id="loginForm">

        <div class="input-group">

          <label for="email">
            البريد الإلكتروني
          </label>

          <div class="input-wrap">
            <input
              type="email"
              id="email"
              placeholder="اكتب البريد الإلكتروني"
              required
              autocomplete="email"
              maxlength="150"
              inputmode="email"
            >
          </div>

        </div>

        <div class="input-group">

          <label for="password">
            كلمة المرور
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="password"
              class="password-input"
              placeholder="اكتب كلمة المرور"
              required
              autocomplete="current-password"
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="إظهار كلمة المرور"
              aria-pressed="false"
              title="إظهار أو إخفاء كلمة المرور"
            >◉</button>

          </div>

        </div>

        <button id="loginBtn" class="login-btn" type="submit">
          تسجيل الدخول
        </button>

        <a
          class="forgot"
          href="../reset-password/index.html"
        >
          🔑 نسيت كلمة المرور؟
        </a>

        <div
          id="message"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

      </form>

      <div class="register">
        ليس لديك حساب؟

        <a href="../register/index.html">
          إنشاء حساب جديد
        </a>
      </div>

    </section>

    <footer class="footer">
      منصة أرض الأحياء التعليمية © 2026
    </footer>

  </main>

  <!-- زر تليجرام -->

  <a
    href="https://t.me/+KB1Z0dws0f01YjNk"
    target="_blank"
    rel="noopener noreferrer"
    class="telegram-float"
    aria-label="مجموعة منصة أرض الأحياء على تليجرام"
    title="انضم إلى مجموعة تليجرام"
  >

    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path d="M21.9 3.3L18.6 20c-.25 1.18-.9 1.47-1.82.92l-5.01-3.69-2.42 2.33c-.27.27-.5.5-1.02.5l.36-5.1 9.28-8.38c.4-.36-.09-.56-.62-.2L5.87 13.63.94 12.09c-1.07-.34-1.09-1.07.22-1.58L20.42 2.9c.91-.34 1.7.2 1.48.4z"/>
    </svg>

  </a>

  <script>
    "use strict";

    // إعداد Supabase الحالي

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    // عناصر الصفحة

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    // عرض الرسائل

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    // إظهار وإخفاء كلمة المرور

    togglePassword.addEventListener("click", function () {
      const showing = passwordInput.type === "text";

      passwordInput.type = showing ? "password" : "text";

      togglePassword.textContent = showing ? "◉" : "◎";

      togglePassword.setAttribute(
        "aria-label",
        showing ? "إظهار كلمة المرور" : "إخفاء كلمة المرور"
      );

      togglePassword.setAttribute(
        "aria-pressed",
        String(!showing)
      );
    });

    // تسجيل الدخول

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (loginBtn.disabled) {
        return;
      }

      const email =
        document.getElementById("email").value.trim().toLowerCase();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage(
          "اكتب البريد الإلكتروني وكلمة المرور.",
          "error"
        );
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "جاري تسجيل الدخول...";
      message.className = "message";

      try {
        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        if (!data || !data.user) {
          throw new Error("تعذر العثور على الحساب.");
        }

        showMessage(
          "تم تسجيل الدخول بنجاح، جاري فتح المنصة...",
          "success"
        );

        window.setTimeout(function () {
          window.location.href = "../index.html";
        }, 700);

      } catch (error) {
        console.error("Login error:", error);

        let text =
          "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

        const errorText =
          String(error.message || "").toLowerCase();

        if (
          errorText.includes("invalid login credentials")
        ) {
          text =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        } else if (
          errorText.includes("email not confirmed")
        ) {
          text =
            "يجب تأكيد البريد الإلكتروني أولًا.";
        } else if (
          errorText.includes("rate limit")
        ) {
          text =
            "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";
        } else if (
          errorText.includes("network")
        ) {
          text =
            "تعذر الاتصال بالإنترنت. تحقق من اتصالك وحاول مجددًا.";
        }

        showMessage(text, "error");

        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>

</body>

</html>
