<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      color: #075e4d;
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075e4d;
    }

    button {
      width: 100%;
      border: none;
      background: #075e4d;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #064d40;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      display: block;
      background: #e8f7ef;
      color: #176b3a;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a11;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .register-link a {
      color: #075e4d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      src="../logo.png"
      class="logo"
      alt="منصة أرض الأحياء"
    >

    <h1>تسجيل الدخول</h1>

    <div class="subtitle">
      منصة أرض الأحياء التعليمية
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        تسجيل الدخول
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div class="register-link">

      ليس لديك حساب؟

      <a href="../register/index.html">
        إنشاء حساب
      </a>

    </div>

  </div>


  <script>

    /* =====================================
       Supabase - المشروع الحالي
       ===================================== */

    const SUPABASE_URL =
      "https://otvdxcvikjqgdajjvkib.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_25gtJgsUpaJX843Pbq2Fcg_sVYlSAK5";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "اكتب البريد الإلكتروني وكلمة المرور.",
            "error"
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "جاري تسجيل الدخول...";


        try {

          /* تسجيل الدخول */

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (error) {

            throw error;

          }


          if (!data || !data.user) {

            throw new Error(
              "تعذر العثور على الحساب."
            );

          }


          /*
             تم تسجيل الدخول بنجاح
          */

          showMessage(
            "تم تسجيل الدخول بنجاح، جاري فتح المنصة...",
            "success"
          );


          setTimeout(function () {

            window.location.href =
              "../index.html";

          }, 1000);


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          let errorMessage =
            error.message ||
            "حدث خطأ أثناء تسجيل الدخول.";


          /* رسائل عربية واضحة */

          if (
            errorMessage
              .toLowerCase()
              .includes("invalid login credentials")
          ) {

            errorMessage =
              "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

          }


          if (
            errorMessage
              .toLowerCase()
              .includes("email not confirmed")
          ) {

            errorMessage =
              "يجب تأكيد البريد الإلكتروني أولًا.";

          }


          showMessage(
            errorMessage,
            "error"
          );

        }


        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

      }
    );

  </script>

</body>

</html>
