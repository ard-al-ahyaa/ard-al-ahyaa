<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      color: #075e4d;
      margin: 5px 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      font-family: Tahoma, Arial, sans-serif;
    }

    input:focus {
      border-color: #075e4d;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #075e4d;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-family: Tahoma, Arial, sans-serif;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      min-height: 22px;
      font-size: 14px;
    }

    .register {
      margin-top: 20px;
      color: #666;
    }

    .register a {
      color: #075e4d;
      text-decoration: none;
      font-weight: bold;
    }

    .register a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      src="../logo.png"
      class="logo"
      alt="منصة أرض الأحياء"
    >

    <h1>منصة أرض الأحياء</h1>

    <div class="subtitle">
      تسجيل الدخول
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginBtn"
      >
        تسجيل الدخول
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      ليس لديك حساب؟
      <a href="../register/index.html">
        إنشاء حساب
      </a>
    </div>

  </div>


<script>

  /* =========================
     بيانات Supabase
  ========================= */

  const SUPABASE_URL =
    "https://cmnmebchevejxhibvgwl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_54UK-Ys41c5wGQvYkeFmYQ_5efdHAQu";


  /* =========================
     إنشاء اتصال Supabase
  ========================= */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     عناصر الصفحة
  ========================= */

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  /* =========================
     تسجيل الدخول
  ========================= */

  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    message.textContent =
      "جاري تسجيل الدخول...";

    message.style.color =
      "#075e4d";

    loginBtn.disabled = true;


    try {

      /* تسجيل الدخول من Supabase */

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        message.textContent =
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        message.style.color =
          "#c0392b";

        loginBtn.disabled = false;

        return;
      }


      const user =
        data.user;


      if (!user) {

        message.textContent =
          "حدث خطأ أثناء تسجيل الدخول.";

        message.style.color =
          "#c0392b";

        loginBtn.disabled = false;

        return;
      }


      /* =========================
         الحصول على صلاحية المستخدم
      ========================= */

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();


      if (profileError || !profile) {

        message.textContent =
          "تم تسجيل الدخول، لكن لم يتم العثور على صلاحيات الحساب.";

        message.style.color =
          "#c0392b";

        loginBtn.disabled = false;

        return;
      }


      /* =========================
         تحديد نوع الحساب
      ========================= */

      if (profile.role === "admin") {

        message.textContent =
          "تم تسجيل الدخول كمسؤول...";

        message.style.color =
          "#075e4d";

        setTimeout(function() {

          window.location.href =
            "../admin/index.html";

        }, 500);

      } else {

        message.textContent =
          "تم تسجيل الدخول بنجاح...";

        message.style.color =
          "#075e4d";

        setTimeout(function() {

          window.location.href =
            "../index.html";

        }, 500);

      }

    } catch (error) {

      console.error(error);

      message.textContent =
        "حدث خطأ غير متوقع. حاول مرة أخرى.";

      message.style.color =
        "#c0392b";

      loginBtn.disabled = false;

    }

  });

</script>

</body>
</html>
