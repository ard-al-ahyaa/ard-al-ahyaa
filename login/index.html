<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | منصة أرض الأحياء</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f5132, #198754);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      padding: 35px 28px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: #0f5132;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .input-group {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #333;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: .2s;
    }

    input:focus {
      border-color: #198754;
      box-shadow: 0 0 0 3px rgba(25,135,84,.12);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #146c43;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .register {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .register a {
      color: #198754;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      src="../logo.png"
      class="logo"
      alt="منصة أرض الأحياء"
      onerror="this.style.display='none'"
    >

    <h1>منصة أرض الأحياء</h1>

    <p class="subtitle">
      تسجيل الدخول إلى المنصة التعليمية
    </p>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">البريد الإلكتروني</label>

        <input
          type="email"
          id="email"
          placeholder="اكتب البريد الإلكتروني"
          required
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label for="password">كلمة المرور</label>

        <input
          type="password"
          id="password"
          placeholder="اكتب كلمة المرور"
          required
          autocomplete="current-password"
        >
      </div>

      <button id="loginBtn" type="submit">
        تسجيل الدخول
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="register">
      ليس لديك حساب؟
      <a href="../register/index.html">إنشاء حساب</a>
    </div>

  </div>

<script>

  // ==========================================
  // Supabase
  // ==========================================

  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // عناصر الصفحة
  // ==========================================

  const loginForm =
    document.getElementById("loginForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  // ==========================================
  // الرسائل
  // ==========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  // ==========================================
  // تسجيل الدخول
  // ==========================================

  loginForm.addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      if (!email || !password) {

        showMessage(
          "اكتب البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;
      }

      loginBtn.disabled = true;

      loginBtn.textContent =
        "جاري تسجيل الدخول...";

      message.className = "message";


      try {

        // تسجيل الدخول
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {
          throw error;
        }


        if (!data.user) {

          throw new Error(
            "تعذر العثور على الحساب."
          );

        }


        // ==========================================
        // التأكد من وجود اسم في بيانات الحساب
        // ==========================================

        const user =
          data.user;

        const metadata =
          user.user_metadata || {};


        const savedName =
          metadata.full_name ||
          metadata.name ||
          metadata.username ||
          metadata.user_name ||
          "";


        // الاسم موجود بالفعل
        if (savedName.trim()) {

          console.log(
            "اسم المستخدم:",
            savedName
          );

        } else {

          console.log(
            "الحساب لا يحتوي على اسم مستخدم."
          );

        }


        // ==========================================
        // نجاح تسجيل الدخول
        // ==========================================

        showMessage(
          "تم تسجيل الدخول بنجاح، جاري فتح المنصة...",
          "success"
        );


        setTimeout(function() {

          window.location.href =
            "../index.html";

        }, 700);


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        let text =
          "حدث خطأ أثناء تسجيل الدخول.";


        if (
          error.message &&
          error.message
            .toLowerCase()
            .includes(
              "invalid login credentials"
            )
        ) {

          text =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }


        if (
          error.message &&
          error.message
            .toLowerCase()
            .includes(
              "email not confirmed"
            )
        ) {

          text =
            "يجب تأكيد البريد الإلكتروني أولًا.";

        }


        showMessage(
          text,
          "error"
        );


        loginBtn.disabled =
          false;

        loginBtn.textContent =
          "تسجيل الدخول";

      }

    }
  );

</script>

</body>
</html>
