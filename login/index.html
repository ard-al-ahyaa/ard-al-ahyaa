<body>

  <div class="login-box">

    <img
      src="https://ard-al-ahyaa.github.io/ard-al-ahyaa/logo.png"
      class="logo"
      alt="شعار منصة أرض الأحياء"

    >

      <div class="input-group">

        <label for="email">

      </div>

        <label for="password">

      <button
        id="loginBtn"
        type="submit"
      >
        تسجيل الدخول
      </button>

        class="message"

      ></div>

  <!-- ==========================================

  <a
    href="https://t.me/+s3acvSigmkw2Nzg0"

    rel="noopener noreferrer"
    class="telegram-float"
    aria-label="مجموعة منصة أرض الأحياء على تليجرام"
    title="انضم إلى مجموعة تليجرام"
  >

      viewBox="0 0 24 24"

    </svg>

  </a>


  <script>

    // =====================================================
    // Supabase
    // =====================================================

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // =====================================================
    // عناصر الصفحة
    // =====================================================

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    // =====================================================
    // عرض الرسائل
    // =====================================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // =====================================================
    // تسجيل الدخول
    // =====================================================

    loginForm.addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        // منع الضغط المتكرر
        if (loginBtn.disabled) {
          return;
        }


        // =====================================================
        // قراءة البيانات
        // =====================================================

        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password =
          document
            .getElementById("password")
            .value;


        // =====================================================
        // التحقق من البيانات
        // =====================================================

        if (!email || !password) {

          showMessage(
            "اكتب البريد الإلكتروني وكلمة المرور.",
            "error"
          );

          return;
        }


        // =====================================================
        // تعطيل الزر أثناء تسجيل الدخول
        // =====================================================

        loginBtn.disabled = true;

        loginBtn.textContent =
          "جاري تسجيل الدخول...";

        message.className =
          "message";


        try {

          // =====================================================
          // تسجيل الدخول في Supabase
          // =====================================================

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          // =====================================================
          // فحص الخطأ
          // =====================================================

          if (error) {
            throw error;
          }


          if (!data || !data.user) {

            throw new Error(
              "تعذر العثور على الحساب."
            );

          }


          // =====================================================
          // بيانات المستخدم
          // =====================================================

          const user =
            data.user;

          const metadata =
            user.user_metadata || {};

          const savedName =
            metadata.full_name ||
            metadata.name ||
            metadata.username ||
            metadata.user_name ||
            "";


          if (savedName.trim()) {

            console.log(
              "اسم المستخدم:",
              savedName
            );

          }


          // =====================================================
          // نجاح تسجيل الدخول
          // =====================================================

          showMessage(
            "تم تسجيل الدخول بنجاح، جاري فتح المنصة...",
            "success"
          );


          // =====================================================
          // الانتقال للصفحة الرئيسية
          // =====================================================

          setTimeout(function () {

            window.location.href =
              "../index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          let text =
            "حدث خطأ أثناء تسجيل الدخول.";


          const errorText =
            error.message
              ? error.message.toLowerCase()
              : "";


          // =====================================================
          // بيانات الدخول غير صحيحة
          // =====================================================

          if (
            errorText.includes(
              "invalid login credentials"
            )
          ) {

            text =
              "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

          }


          // =====================================================
          // البريد الإلكتروني غير مؤكد
          // =====================================================

          else if (
            errorText.includes(
              "email not confirmed"
            )
          ) {

            text =
              "يجب تأكيد البريد الإلكتروني أولًا.";

          }


          // =====================================================
          // تسجيل الحسابات متوقف
          // =====================================================

          else if (
            errorText.includes(
              "signup is disabled"
            )
          ) {

            text =
              "تسجيل الحسابات متوقف حاليًا.";

          }


          // =====================================================
          // عدد محاولات كبير
          // =====================================================

          else if (
            errorText.includes(
              "rate limit"
            )
          ) {

            text =
              "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";

          }


          // =====================================================
          // عرض الخطأ
          // =====================================================

          showMessage(
            text,
            "error"
          );


          // إعادة تفعيل الزر
          loginBtn.disabled = false;

          loginBtn.textContent =
            "تسجيل الدخول";

        }

      }
    );

  </script>
