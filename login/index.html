<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | منصة أرض الأحياء</title>
<meta name="description" content="سجل دخولك إلى منصة أرض الأحياء التعليمية لطلاب الصف الثالث الثانوي.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
:root{--green:#087f5b;--green-dark:#045b48;--text:#183348;--muted:#708399}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Cairo",Tahoma,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;color:var(--text);background:#eff7fb}
button,input{font:inherit}
.page{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr;direction:ltr;overflow:hidden}
.visual{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:45px 35px 90px;color:#fff;isolation:isolate;background:radial-gradient(ellipse at 50% 35%,rgba(0,255,191,.2),transparent 45%),radial-gradient(ellipse at 15% 85%,rgba(0,145,255,.22),transparent 45%),linear-gradient(140deg,#061f38 0%,#034d50 55%,#006d60 100%)}
.visual-content{position:relative;z-index:2;width:100%;max-width:570px;text-align:center}
.logo-stage{position:relative;width:230px;height:230px;margin:0 auto 22px;display:grid;place-items:center}
.logo-ring{position:absolute;inset:0;border:2px solid rgba(97,255,222,.85);border-radius:50%;box-shadow:0 0 25px rgba(0,255,200,.2)}
.logo-box{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#e7fff7);box-shadow:0 15px 50px rgba(0,0,0,.25)}
.logo-box img{width:82%;height:82%;object-fit:contain}
.visual h1{font-size:clamp(34px,4vw,53px);font-weight:900;color:#fff}
.visual-subtitle{color:#c8fff0;font-size:17px;line-height:2;margin-top:2px}
.visual-tagline{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:rgba(255,255,255,.07);color:#dcfff7;font-size:15px}
.visual-footer{position:absolute;z-index:2;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:28px;padding:22px 10px;background:rgba(2,20,35,.4);color:#e4f8f4;font-size:12px}

.login-side{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:35px;direction:rtl;background:linear-gradient(145deg,#f8fcff,#edf6fb)}
.login-card{width:100%;max-width:470px;padding:35px 36px 28px;border:1px solid #fff;border-radius:27px;background:rgba(255,255,255,.85);box-shadow:0 25px 80px rgba(23,65,88,.1)}
.mobile-brand{display:none;text-align:center;margin-bottom:24px}
.mobile-brand img{width:65px;height:65px;object-fit:contain}
.mobile-brand strong{display:block;color:var(--green-dark);font-size:20px}
.heading{margin-bottom:27px}
.heading h2{font-size:29px;font-weight:900;color:#142e43;line-height:1.7}
.heading p{font-size:13px;color:var(--muted);line-height:2}
.input-group{margin-bottom:18px}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:800;color:#294256}
.input-wrap{position:relative}
.field-icon{position:absolute;top:50%;right:15px;transform:translateY(-50%);font-size:17px;color:#718ba2;pointer-events:none}
input{width:100%;height:55px;border:1px solid #d7e3ed;border-radius:13px;padding:12px 46px 12px 48px;outline:none;background:rgba(255,255,255,.86);color:#173248;font-size:14px}
input:focus{border-color:#2994f2;background:#fff;box-shadow:0 0 0 4px rgba(41,148,242,.12)}
.toggle-password{position:absolute;left:8px;top:8px;width:39px;height:39px;border:0;border-radius:10px;background:transparent;color:#6e8296;cursor:pointer;font-size:18px}
.login-btn{width:100%;min-height:55px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:13px;background:linear-gradient(110deg,#087f5b,#079b75);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px rgba(8,127,91,.19)}
.login-btn:disabled{opacity:.7;cursor:wait}
.forgot{display:block;width:fit-content;margin:17px auto 0;padding:4px 8px;border-radius:7px;color:#1689dc;text-decoration:none;font-size:12px;font-weight:800}
.message{display:none;margin-top:16px;padding:12px 14px;border-radius:11px;font-size:12px;line-height:1.9;overflow-wrap:anywhere}
.error{display:block;background:#fff0f1;border:1px solid #f4d0d4;color:#a12632}
.success{display:block;background:#eaf8ef;border:1px solid #ccebd6;color:#176b3a}
.register{margin-top:25px;padding-top:20px;border-top:1px solid #e5edf3;text-align:center;color:#718399;font-size:12px}
.register a{display:block;width:100%;margin-top:10px;padding:12px 15px;border:1px solid #0b9877;border-radius:12px;color:#087f68;text-decoration:none;font-size:13px;font-weight:900}
.login-footer{text-align:center;margin-top:23px;color:#91a1b2;font-size:11px}
.telegram-float{position:fixed;z-index:20;left:22px;bottom:22px;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:#229ed9;box-shadow:0 9px 25px rgba(34,158,217,.32)}
.telegram-float svg{width:29px;height:29px;fill:#fff}

@media(max-width:800px){
  .page{grid-template-columns:1fr}
  .visual{min-height:auto;padding:35px 20px 30px}
  .logo-stage{width:135px;height:135px}
  .logo-box{width:110px;height:110px}
  .visual h1{font-size:34px}
  .visual-footer{position:relative;margin-top:25px;padding:12px 0 0;background:transparent;font-size:10px}
  .login-side{min-height:auto;padding:25px 15px 85px}
  .telegram-float{width:51px;height:51px;left:14px;bottom:14px}
}
</style>
</head>
<body>

<main class="page">
  <section class="visual">
    <div class="visual-content">
      <div class="logo-stage">
        <div class="logo-ring"></div>
        <div class="logo-box"><img src="../logo.png" alt="شعار أرض الأحياء" onerror="this.style.opacity='.15'"></div>
      </div>
      <h1>أرض الأحياء</h1>
      <p class="visual-subtitle">منصة تعليمية للثانوية العامة</p>
      <div class="visual-tagline">معًا نحو التفوق</div>
    </div>
    <div class="visual-footer">
      <span>✦ تعليم متميز</span><span>✦ مجتمع داعم</span><span>✦ مستقبل أفضل</span>
    </div>
  </section>

  <section class="login-side">
    <div class="login-card">
      <div class="mobile-brand">
        <img src="../logo.png" alt="شعار أرض الأحياء">
        <strong>منصة أرض الأحياء</strong>
      </div>

      <header class="heading">
        <h2>أهلًا بعودتك 👋</h2>
        <p>سجل دخولك لمتابعة محاضراتك ودرجاتك التعليمية.</p>
      </header>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <span class="field-icon">✉</span>
            <input type="email" id="email" placeholder="اكتب البريد الإلكتروني" required autocomplete="email" maxlength="150">
          </div>
        </div>

        <div class="input-group">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <span class="field-icon">♙</span>
            <input type="password" id="password" placeholder="اكتب كلمة المرور" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">◉</button>
          </div>
        </div>

        <button id="loginBtn" class="login-btn" type="submit">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span aria-hidden="true">←</span>
        </button>

        <a class="forgot" href="../reset-password/index.html">🔑 نسيت كلمة المرور؟</a>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>

      <div class="register">
        ليس لديك حساب؟
        <a href="../register/index.html">إنشاء حساب جديد ↗</a>
      </div>
      <footer class="login-footer">منصة أرض الأحياء التعليمية © 2026</footer>
    </div>
  </section>
</main>

<a href="https://t.me/+KB1Z0dws0f01YjNk" target="_blank" rel="noopener noreferrer" class="telegram-float" aria-label="تليجرام">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 3.3L18.6 20c-.25 1.18-.9 1.47-1.82.92l-5.01-3.69-2.42 2.33c-.27.27-.5.5-1.02.5l.36-5.1 9.28-8.38c.4-.36-.09-.56-.62-.2L5.87 13.63.94 12.09c-1.07-.34-1.09-1.07.22-1.58L20.42 2.9c.91-.34 1.7.2 1.48.4z"/></svg>
</a>

<script>
"use strict";

const SUPABASE_URL="https://fpfbmjtpzamzlyzitmsd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
const AUTH_STORAGE_KEY="ardAlahyaaAuth";
const LOGIN_AT_KEY="ardLoginAt";
const SESSION_MAX_MS=24*60*60*1000;

const loginForm=document.getElementById("loginForm");
const loginBtn=document.getElementById("loginBtn");
const loginBtnText=document.getElementById("loginBtnText");
const message=document.getElementById("message");
const passwordInput=document.getElementById("password");
const togglePassword=document.getElementById("togglePassword");

let sb=null;
function getClient(){
  if(!sb){
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:AUTH_STORAGE_KEY}
    });
  }
  return sb;
}

function showMessage(text,type){
  message.textContent=text;
  message.className="message "+type;
}
function setLoading(on){
  loginBtn.disabled=on;
  loginBtnText.textContent=on?"جاري تسجيل الدخول...":"تسجيل الدخول";
}

/* الجلسة صالحة لمدة 24 ساعة من وقت الدخول */
function loginIsFresh(){
  const at=Number(localStorage.getItem(LOGIN_AT_KEY));
  return !!at && Date.now()-at<SESSION_MAX_MS;
}

/* لو الطالب مسجل دخول والجلسة لسه صالحة، ودّيه المنصة على طول */
async function redirectIfLoggedIn(){
  try{
    const {data}=await getClient().auth.getSession();
    if(data?.session?.user && loginIsFresh()){
      window.location.replace("../index.html");
    }
  }catch(e){
    console.warn("تعذر التحقق من الجلسة:",e);
  }
}

togglePassword.addEventListener("click",()=>{
  const show=passwordInput.type==="password";
  passwordInput.type=show?"text":"password";
  togglePassword.textContent=show?"◎":"◉";
});

loginForm.addEventListener("submit",async(event)=>{
  event.preventDefault();
  if(loginBtn.disabled)return;

  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=passwordInput.value;
  if(!email||!password){showMessage("اكتب البريد الإلكتروني وكلمة المرور.","error");return}

  setLoading(true);
  message.className="message";

  try{
    const {data,error}=await getClient().auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.user)throw new Error("تعذر العثور على الحساب.");

    /* تسجيل وقت الدخول لتحسب 24 ساعة */
    localStorage.setItem(LOGIN_AT_KEY,String(Date.now()));

    showMessage("تم تسجيل الدخول بنجاح، جاري فتح المنصة...","success");
    setTimeout(()=>window.location.replace("../index.html"),700);
  }catch(error){
    console.error("Login error:",error);
    const t=String(error.message||"").toLowerCase();
    let text="حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";
    if(t.includes("invalid login credentials"))text="البريد الإلكتروني أو كلمة المرور غير صحيحة.";
    else if(t.includes("email not confirmed"))text="يجب تأكيد البريد الإلكتروني أولًا.";
    else if(t.includes("rate limit"))text="تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";
    else if(t.includes("network")||t.includes("failed to fetch"))text="تعذر الاتصال بالإنترنت. تحقق من اتصالك وحاول مجددًا.";
    showMessage(text,"error");
    setLoading(false);
  }
});

redirectIfLoggedIn();
</script>
</body>
</html>
