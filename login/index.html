<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background: #f5f7f6;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .login-box {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.10);

    }


    .logo {

      width: 90px;

      height: 90px;

      object-fit: contain;

      display: block;

      margin: 0 auto 15px;

    }


    h1 {

      text-align: center;

      color: #075e4d;

      margin: 0 0 8px;

      font-size: 27px;

    }


    .subtitle {

      text-align: center;

      color: #777;

      margin-bottom: 25px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      color: #333;

      font-weight: bold;

    }


    input {

      width: 100%;

      padding: 13px;

      margin-bottom: 17px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #075e4d;

    }


    button {

      width: 100%;

      border: none;

      background: #075e4d;

      color: white;

      padding: 14px;

      border-radius: 10px;

      font-size: 17px;

      cursor: pointer;

    }


    button:hover {

      background: #064d40;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .message {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 9px;

      text-align: center;

      line-height: 1.6;

    }


    .success {

      display: block;

      background: #e8f7ef;

      color: #176b3a;

    }


    .error {

      display: block;

      background: #fdeaea;

      color: #a11;

    }


    .register-link {

      text-align: center;

      margin-top: 20px;

      color: #666;

    }


    .register-link a {

      color: #075e4d;

      text-decoration: none;

      font-weight: bold;

    }

  </style>

</head>


<body>


  <div class="login-box">


    <img
      src="../logo.png"
      class="logo"
      alt="منصة أرض الأحياء"
    >


    <h1>
      تسجيل الدخول
    </h1>


    <div class="subtitle">
      منصة أرض الأحياء التعليمية
    </div>


    <form id="loginForm">


      <label for="email">
        البريد الإلكتروني
      </label>


      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >


      <label for="password">
        كلمة المرور
      </label>


      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
      >


      <button
        type="submit"
        id="loginButton"
      >
        تسجيل الدخول
      </button>


    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="register-link">

      ليس لديك حساب؟

      <a href="../register/index.html">
        إنشاء حساب جديد
      </a>

    </div>


  </div>


  <script>


    const SUPABASE_URL =
      "https://cmnmebchevejxhibvgwl.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_54UK-Ys41c5wGQvYkeFmYQ_5efdHAQu";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");


    const loginButton =
      document.getElementById("loginButton");


    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document.getElementById("email")
            .value.trim();


        const password =
          document.getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "جاري تسجيل الدخول...";


        try {


          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {

            throw error;

          }


          if (!data.user) {

            throw new Error(
              "تعذر العثور على المستخدم."
            );

          }


          const user =
            data.user;


          const { data: profile, error: profileError } =
            await supabaseClient
              .from("profiles")
              .select(
                "id, full_name, role"
              )
              .eq("id", user.id)
              .maybeSingle();


          if (profileError) {

            console.error(profileError);

            throw new Error(
              "حدث خطأ أثناء قراءة بيانات الحساب."
            );

          }


          /*
            لو الحساب موجود في Auth
            ولكن Profile غير موجود،
            ننشئه تلقائيًا كطالب.
          */


          if (!profile) {


            const name =
              user.user_metadata?.full_name ||
              user.email?.split("@")[0] ||
              "طالب";


            const { data: newProfile, error: insertError } =
              await supabaseClient
                .from("profiles")
                .insert({

                  id: user.id,

                  full_name: name,

                  role: "student"

                })
                .select()
                .single();


            if (insertError) {

              console.error(insertError);

              throw new Error(
                "تم تسجيل الدخول ولكن تعذر إنشاء بيانات الحساب. تأكد من تشغيل SQL الخاص بـ profiles."
              );

            }


            if (newProfile.role === "admin") {

              window.location.href =
                "../admin/index.html";

            } else {

              window.location.href =
                "../index.html";

            }


            return;

          }


          /*
            تحديد نوع الحساب
          */


          if (profile.role === "admin") {

            window.location.href =
              "../admin/index.html";

          } else {

            window.location.href =
              "../index.html";

          }


        } catch (error) {


          console.error(error);


          showMessage(

            error.message ||
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

            "error"

          );


          loginButton.disabled = false;

          loginButton.textContent =
            "تسجيل الدخول";

        }

      }

    );

  </script>


</body>

</html>
