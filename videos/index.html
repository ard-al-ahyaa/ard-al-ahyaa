<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحاضرات | منصة أرض الأحياء</title>
<meta name="description" content="محاضرات الأحياء للثانوية العامة في منصة أرض الأحياء.">
<meta name="theme-color" content="#026857">
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../progress.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
:root{--green:#026857;--green-dark:#014d40;--blue:#1e3a8a;--bg:#f0f4f8;--border:#e2e8f0;--text:#2c3e50;--muted:#64748b;--sidebar-width:270px;--sidebar-collapsed-width:82px}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}

/* الشريط الجانبي */
.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#026857 0%,#075e54 48%,#1e3a8a 100%);color:#fff;position:fixed;right:0;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;z-index:1000;overflow-x:hidden;overflow-y:auto;transition:width .25s ease}
.sidebar-top{padding:18px}
.sidebar-control{display:flex;justify-content:flex-start;margin-bottom:18px}
.sidebar-toggle{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.23);border-radius:11px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;flex-shrink:0;transition:background .2s,transform .2s}
.sidebar-toggle:hover{background:rgba(255,255,255,.23);transform:scale(1.04)}
.sidebar-toggle svg,.menu-icon svg,.top-icon svg,.mobile-bottom svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sidebar-toggle svg{width:20px;height:20px;stroke-width:2;transition:transform .25s}
.logo-box{display:flex;align-items:center;gap:13px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.16);min-width:0}
.logo-box img{width:49px;height:49px;object-fit:contain;border-radius:13px;background:#fff;padding:3px;flex-shrink:0}
.logo-text{min-width:0;overflow:hidden;white-space:nowrap}
.logo-box h2{font-size:17px;color:#fff;font-weight:900}
.logo-box p{font-size:11px;opacity:.8;margin-top:4px}
.menu-title{color:rgba(255,255,255,.62);font-size:10px;font-weight:700;padding:0 12px;margin-bottom:10px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:7px}
.menu a{text-decoration:none;color:#e2f1ee;padding:12px 13px;border-radius:11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;transition:background .2s,transform .2s;min-height:46px;white-space:nowrap}
.menu a:hover,.menu a.active{background:rgba(255,255,255,.17);color:#fff}
.menu a:hover{transform:translateX(-2px)}
.menu-icon{width:21px;height:21px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.menu-icon svg{width:20px;height:20px;stroke-width:1.8}
.menu-text{overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{margin:0 18px 20px;padding:14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:11px;line-height:2;color:rgba(255,255,255,.9);overflow:hidden}
body.sidebar-collapsed .sidebar{width:var(--sidebar-collapsed-width)}
body.sidebar-collapsed .sidebar-top{padding:18px 12px}
body.sidebar-collapsed .sidebar-control,body.sidebar-collapsed .logo-box{justify-content:center}
body.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
body.sidebar-collapsed .logo-text,body.sidebar-collapsed .menu-title,body.sidebar-collapsed .menu-text,body.sidebar-collapsed .sidebar-bottom{display:none}
body.sidebar-collapsed .menu a{justify-content:center;padding:12px 8px;gap:0}
body.sidebar-collapsed .menu a:hover{transform:none}
body.sidebar-collapsed .menu-icon{width:25px;height:25px}

/* المحتوى */
.main{margin-right:var(--sidebar-width);flex:1;min-width:0;padding:30px 35px;transition:margin-right .25s ease}
body.sidebar-collapsed .main{margin-right:var(--sidebar-collapsed-width)}
.top-bar{background:#fff;padding:22px 25px;border-radius:16px;box-shadow:0 4px 20px rgba(30,58,138,.04);margin-bottom:25px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
.top-bar h1{color:var(--blue);font-size:22px;font-weight:900}
.top-bar p{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.8}
.top-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);flex-shrink:0}
.top-icon svg{width:25px;height:25px;stroke-width:1.8}

/* الشهور */
.months-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:25px}
.month-button{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px;text-align:right;cursor:pointer;transition:.2s;color:var(--text);min-width:0}
.month-button:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 5px 15px rgba(2,104,87,.07)}
.month-button.active{color:#fff;background:linear-gradient(135deg,var(--green),var(--blue));border-color:transparent}
.month-cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;background:#e2e8f0}
.month-button-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.month-button strong{font-size:13px;font-weight:900}
.month-button small{color:var(--muted);font-size:11px}
.month-button.active small{color:rgba(255,255,255,.8)}
.month-number{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);font-weight:900;font-size:12px;flex-shrink:0}
.month-button.active .month-number{background:rgba(255,255,255,.18);color:#fff}
.month-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 17px;padding:17px 20px;background:#fff;border:1px solid var(--border);border-radius:13px}
.month-heading-info{display:flex;align-items:center;gap:13px;min-width:0}
.month-heading img{width:74px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex-shrink:0}
.month-heading h2{font-size:17px;font-weight:900;color:var(--blue)}
.month-heading p{margin-top:5px;font-size:11px;color:var(--muted)}
.month-badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:8px;background:#e8f5e9;color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}

/* المحاضرة */
.lecture-card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:20px;overflow:hidden;box-shadow:0 4px 15px rgba(30,58,138,.03)}
.lecture-header{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:14px 25px;display:flex;align-items:center;gap:14px;cursor:pointer}
.lecture-header:focus-visible,.dropdown-header:focus-visible{outline:3px solid #86efac;outline-offset:-3px}
.lecture-thumb{width:86px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:2px solid rgba(255,255,255,.35);flex-shrink:0;background:#1e3a8a}
.lecture-title{min-width:0;flex:1}
.lecture-title h3{font-size:17px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}
.lecture-title p{font-size:12px;opacity:.9;line-height:1.8;overflow-wrap:anywhere}
.arrow-icon{font-size:18px;transition:transform .3s;flex-shrink:0}
.lecture-body{padding:0;max-height:0;overflow:hidden;background:#fafafa}
.lecture-body.open{padding:20px 25px;max-height:none;overflow:visible}

/* المشغل */
.video-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.video-container iframe,.video-container video{position:absolute;inset:0;width:100%;height:100%;border:none;object-fit:contain;background:#000}
.video-container:fullscreen,.video-container.pseudo-fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;margin:0;border-radius:0;z-index:99999}
.video-container:-webkit-full-screen{width:100vw;height:100vh;background:#000}
.player-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#fff;text-align:center;font-size:13px;line-height:2}
.watermark{position:absolute;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none;color:#fff;opacity:.4;font-weight:700;font-size:clamp(11px,2.2vw,18px);text-shadow:0 0 4px #000,0 0 2px #000;transition:top 1.4s ease,left 1.4s ease;direction:ltr;white-space:nowrap}
.exit-fs{display:none;position:absolute;top:12px;left:12px;z-index:6;border:0;border-radius:50%;width:38px;height:38px;background:rgba(0,0,0,.6);color:#fff;font-size:17px;cursor:pointer}
.pseudo-fs .exit-fs{display:block}
.player-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.quality-wrap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--green-dark)}
.quality-wrap[hidden]{display:none}
.quality-wrap select{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;font-weight:700;color:var(--text)}
.video-fullscreen-btn{flex:1;min-width:170px;padding:11px 15px;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.video-fullscreen-btn:hover{background:var(--green-dark)}
.video-fullscreen-btn:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.action-btn{flex:1;min-width:140px;padding:10px 12px;border:1px solid #c8e6c9;border-radius:9px;background:#fff;color:#2e7d32;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.action-btn.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
.action-btn:disabled{opacity:.6;cursor:wait}
.desc{margin-bottom:15px;color:#475569;font-size:14px;line-height:2;overflow-wrap:anywhere}
.dropdown-section{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:10px;margin-bottom:12px;overflow:hidden}
.dropdown-header{padding:12px 18px;font-weight:700;color:#2e7d32;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:#f1f8e9;font-size:13px}
.dropdown-content{padding:15px 18px;background:#fff;border-top:1px solid #c8e6c9;display:none;font-size:13px;line-height:2;overflow-wrap:anywhere}
.dropdown-content.open{display:block}
.handout-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #e2e8f0}
.handout-row:last-child{border:0}
.handout-row span{font-weight:600;min-width:0}
.btn-link{display:inline-block;background:#026857;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;border:0;cursor:pointer;white-space:nowrap}
.btn-link:hover{background:#014d40}
.muted{color:#64748b}
.loading,.empty{text-align:center;padding:30px;color:#64748b;font-weight:600;background:#fff;border-radius:14px;border:1px solid var(--border);font-size:13px;line-height:2;overflow-wrap:anywhere}
.empty-icon{display:block;margin-bottom:8px;font-size:27px}
.notice{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:15px;font-size:12px;line-height:2;margin-bottom:20px}
.notice a{font-weight:800;text-decoration:underline}
.mobile-bottom{display:none}

@media(max-width:1100px){.months-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px}}
@media(max-width:768px){
.sidebar{display:none}
.main,body.sidebar-collapsed .main{margin-right:0;padding:15px 15px 85px}
.top-bar{padding:17px;margin-bottom:18px}.top-bar h1{font-size:18px}.top-bar p{font-size:11px}
.top-icon{width:41px;height:41px}
.months-grid{gap:9px}.month-button{padding:12px}.month-button strong{font-size:12px}
.month-heading{padding:14px}.month-heading h2{font-size:15px}.month-heading img{width:56px}
.lecture-header{padding:12px 14px;gap:10px}.lecture-thumb{width:62px}
.lecture-title h3{font-size:15px}.lecture-title p{font-size:11px}
.lecture-body.open{padding:13px}
.video-container{border-radius:8px}
.mobile-bottom{display:flex;position:fixed;right:0;bottom:0;left:0;z-index:1500;background:#fff;box-shadow:0 -3px 18px rgba(0,0,0,.08);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:9px;flex:1;min-width:0;text-decoration:none}
.mobile-bottom a.active{color:var(--green);font-weight:900}
.mobile-bottom svg{width:21px;height:21px;stroke-width:1.8}}
@media(max-width:360px){.months-grid{grid-template-columns:1fr}.month-heading{align-items:flex-start}.month-badge{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
"use strict";

if (!window.supabase) {
  document.getElementById("lecturesList").textContent = "تعذر تحميل مكتبة Supabase. تحقق من الإنترنت ثم أعد تحميل الصفحة.";
  throw new Error("Missing dependency: supabase-js");
}

const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
if (window.ArdProgress) ArdProgress.init(supabaseClient);

const MONTHS_TABLE = "lecture_months", LECTURES_TABLE = "lectures";
const VIDEO_BUCKET = "lectures", HANDOUT_BUCKET = "handouts";
const SIGNED_URL_SECONDS = 3600;
const LOGIN_URL = "../login/index.html";
const QUALITY_KEY = "ardAlahyaaQuality";

let allLectures = [], visibleMonths = [], currentList = [], selectedMonth = null;
let viewerLabel = "", progress = new Map();

const $ = id => document.getElementById(id);

/* ---------- الشريط الجانبي ---------- */
const sidebarToggle = $("sidebarToggle");
const SIDEBAR_KEY = "ardAlahyaaSidebarCollapsed";

function setSidebarCollapsed(collapsed, save = true) {
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  const text = collapsed ? "توسيع القائمة الجانبية" : "تصغير القائمة الجانبية";
  sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
  sidebarToggle.setAttribute("aria-label", text);
  sidebarToggle.title = text;
  document.querySelectorAll(".menu a[data-title]").forEach(a => {
    if (collapsed) a.title = a.dataset.title; else a.removeAttribute("title");
  });
  if (save) { try { localStorage.setItem(SIDEBAR_KEY, collapsed ? "true" : "false"); } catch (e) { console.warn(e); } }
}
sidebarToggle.addEventListener("click", () => setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed")));
try { setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === "true", false); } catch { setSidebarCollapsed(false, false); }

/* ---------- أدوات ---------- */
function escapeHtml(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function safeHttps(u) {
  try { const x = new URL(String(u || "").trim()); return x.protocol === "https:" ? x.href : ""; } catch { return ""; }
}

function showNotice(html) { const n = $("pageNotice"); n.innerHTML = html; n.style.display = "block"; }
function hideNotice() { $("pageNotice").style.display = "none"; }

function toStoragePath(raw, bucket) {
  const v = String(raw || "").trim();
  if (!v) return "";
  if (!/^https?:\/\//i.test(v)) {
    return v.replace(/^\/+/, "").replace(/^storage\/v1\/object\/(public|sign|authenticated)\//i, "").replace(new RegExp("^" + bucket + "/"), "");
  }
  try {
    const parts = new URL(v).pathname.split("/").filter(Boolean), i = parts.indexOf("object");
    if (i === -1) return "";
    const rest = ["public", "sign", "authenticated"].includes(parts[i + 1]) ? parts.slice(i + 2) : parts.slice(i + 1);
    if (rest[0] !== bucket) return "";
    return rest.slice(1).map(p => { try { return decodeURIComponent(p); } catch { return p; } }).join("/");
  } catch { return ""; }
}

async function signedUrl(bucket, path) {
  if (!path) return "";
  const { data, error } = await supabaseClient.storage.from(bucket).createSignedUrl(path, SIGNED_URL_SECONDS);
  if (error) { console.error("Signed URL error:", error); return ""; }
  return data?.signedUrl || "";
}

const isYoutube = u => /youtube\.com|youtu\.be|youtube-nocookie\.com/i.test(u || "");

function youtubeEmbed(url) {
  try {
    const p = new URL(url);
    let id = "";
    if (p.hostname.includes("youtu.be")) id = p.pathname.split("/").filter(Boolean)[0] || "";
    else if (p.pathname === "/watch") id = p.searchParams.get("v") || "";
    else { const s = p.pathname.split("/").filter(Boolean); if (["embed", "shorts", "live"].includes(s[0])) id = s[1] || ""; }
    return id ? "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?rel=0&fs=0" : "";
  } catch { return ""; }
}

/* رابط الفيديو: رابط خارجي https كما هو، وغير ذلك مسار في bucket خاص يُوقَّع مؤقتًا */
async function resolveVideo(raw) {
  const v = String(raw || "").trim();
  if (!v) return "";
  if (/^https?:\/\//i.test(v) && !v.includes("/storage/v1/object/")) return safeHttps(v);
  return signedUrl(VIDEO_BUCKET, toStoragePath(v, VIDEO_BUCKET));
}

/* ---------- بيانات المشاهد (للعلامة المائية) ---------- */
async function loadViewer(user) {
  let phone = "";
  try {
    const { data } = await supabaseClient.from("profiles").select("phone").eq("id", user.id).maybeSingle();
    phone = (data?.phone || "").trim();
  } catch (e) { console.warn("Viewer profile:", e); }
  viewerLabel = phone || user.phone || (user.email ? user.email.split("@")[0] : "") || ("ID-" + String(user.id).slice(0, 8));
}

/* ---------- التقدم ---------- */
async function loadProgress() {
  if (!window.ArdProgress) return;
  try { progress = new Map((await ArdProgress.fetchAll()).map(r => [String(r.lecture_id), r])); }
  catch (e) { console.warn("Progress unavailable:", e); }
}

function refreshActions(i) {
  const id = String(currentList[i].id), row = progress.get(id) || {};
  const save = $("save-" + i), done = $("done-" + i);
  if (save) { save.classList.toggle("on", !!row.saved); save.textContent = row.saved ? "★ محفوظة" : "☆ حفظ المحاضرة"; save.disabled = false; }
  if (done) { done.classList.toggle("on", !!row.completed); done.textContent = row.completed ? "✓ تمت المشاهدة" : "تمت المشاهدة؟"; done.disabled = false; }
}

async function updateProgress(i, field) {
  const id = String(currentList[i].id), row = progress.get(id) || { lecture_id: id };
  const btn = $((field === "saved" ? "save-" : "done-") + i);
  const next = !row[field];
  if (btn) btn.disabled = true;
  try {
    if (field === "saved") await ArdProgress.setSaved(id, next); else await ArdProgress.setCompleted(id, next);
    progress.set(id, { ...row, [field]: next });
  } catch (e) { console.error(e); alert("تعذر حفظ التقدم. تحقق من الاتصال وسياسات جدول lecture_progress."); }
  refreshActions(i);
}
const toggleSaved = i => updateProgress(i, "saved");
const toggleCompleted = i => updateProgress(i, "completed");

/* ---------- المشغل ---------- */
function getQualities(lec) {
  const q = lec.qualities && typeof lec.qualities === "object" ? lec.qualities : {};
  let list = Object.entries(q).filter(([, v]) => v)
    .map(([k, v]) => ({ label: /p$/i.test(k) ? k : k + "p", height: parseInt(k, 10) || 0, src: v }))
    .sort((a, b) => b.height - a.height);
  const single = lec.video_url || lec.videoUrl || lec.url;
  if (!list.length && single) list = [{ label: "الأصلية", height: 0, src: single }];
  return list;
}

function watermarkHtml() {
  return '<div class="watermark" aria-hidden="true" style="top:' + (10 + Math.random() * 70) + '%;left:' + (5 + Math.random() * 65) + '%">' + escapeHtml(viewerLabel) + "</div>";
}

setInterval(function () {
  document.querySelectorAll(".watermark").forEach(w => {
    w.style.top = (8 + Math.random() * 78) + "%";
    w.style.left = (4 + Math.random() * 70) + "%";
  });
}, 4000);

async function setSource(i, label) {
  const lec = currentList[i], box = $("video-container-" + i), video = box && box.querySelector("video");
  const q = getQualities(lec).find(x => x.label === label);
  if (!video || !q) return false;

  const t = video.currentTime || 0, wasPlaying = !video.paused && !video.ended;
  const url = await resolveVideo(q.src);
  if (!url) return false;

  video.src = url;
  video.addEventListener("loadedmetadata", () => {
    if (t > 0) video.currentTime = t;
    if (wasPlaying) video.play().catch(() => {});
  }, { once: true });
  video.dataset.quality = label;
  return true;
}

async function changeQuality(i, label) {
  if (!(await setSource(i, label))) { alert("تعذر تغيير الجودة. حاول مرة أخرى."); return; }
  try { localStorage.setItem(QUALITY_KEY, label); } catch {}
}

async function buildPlayer(i) {
  const lec = currentList[i], box = $("video-container-" + i);
  if (!box || box.dataset.ready) return;
  box.dataset.ready = "1";

  const qualities = getQualities(lec);
  const fail = text => { box.innerHTML = '<div class="player-msg">' + text + "</div>"; box.dataset.ready = ""; };
  if (!qualities.length && !lec.bunny_video_id) return fail("لا يوجد فيديو لهذه المحاضرة حتى الآن.");

  box.innerHTML = '<div class="player-msg">جارٍ تجهيز الفيديو...</div>';
  const exitBtn = '<button type="button" class="exit-fs" aria-label="إغلاق ملء الشاشة" onclick="toggleFs(this.parentElement)">✕</button>';

  // فيديو مستضاف على Bunny Stream: رابط موقّع من دالة bunny-embed، ولا ملء شاشة داخل الـ iframe حتى تبقى العلامة المائية
  if (lec.bunny_video_id) {
    try {
      const { data, error } = await supabaseClient.functions.invoke("bunny-embed", { body: { lectureId: lec.id } });
      if (error || !data || !data.url) throw error || new Error("No signed URL");
      box.innerHTML = '<iframe src="' + escapeHtml(data.url) + '" title="فيديو المحاضرة" loading="lazy" allow="encrypted-media; picture-in-picture; accelerometer; gyroscope" referrerpolicy="strict-origin-when-cross-origin"></iframe>' + watermarkHtml() + exitBtn;
    } catch (e) {
      console.error("Bunny embed error:", e);
      fail("تعذر تجهيز الفيديو. تأكد من تسجيل الدخول ثم حاول مرة أخرى.");
    }
    return;
  }

  if (isYoutube(qualities[0].src)) {
    const embed = youtubeEmbed(qualities[0].src);
    if (!embed) return fail("رابط الفيديو غير صالح.");
    box.innerHTML = '<iframe src="' + escapeHtml(embed) + '" title="فيديو المحاضرة" loading="lazy" allow="encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>' + watermarkHtml() + exitBtn;
    return;
  }

  const saved = (() => { try { return localStorage.getItem(QUALITY_KEY); } catch { return null; } })();
  const start = qualities.find(q => q.label === saved) || qualities[0];
  const poster = safeHttps(lec.image_url);

  box.innerHTML = '<video controls playsinline preload="metadata" controlsList="nodownload nofullscreen" disablePictureInPicture' +
    (poster ? ' poster="' + escapeHtml(poster) + '"' : "") + "></video>" + watermarkHtml() + exitBtn;
  const video = box.querySelector("video");

  if (!(await setSource(i, start.label))) return fail("تعذر تجهيز الفيديو. تأكد من تسجيل الدخول ومن صلاحيات قراءة ملفات المحاضرات.");

  if (qualities.length > 1) {
    $("quality-" + i).innerHTML = qualities.map(q => '<option value="' + escapeHtml(q.label) + '"' + (q.label === start.label ? " selected" : "") + ">" + escapeHtml(q.label) + "</option>").join("");
    $("quality-wrap-" + i).hidden = false;
  }

  // انتهاء الرابط المؤقت: نجدده مرة واحدة ونكمل من نفس المكان
  video.addEventListener("error", async () => {
    if (video.dataset.retried) return;
    video.dataset.retried = "1";
    await setSource(i, video.dataset.quality || start.label);
  });

  video.addEventListener("ended", () => { if (window.ArdProgress && !(progress.get(String(lec.id)) || {}).completed) updateProgress(i, "completed"); });
  video.addEventListener("webkitbeginfullscreen", () => { video.webkitExitFullscreen(); toggleFs(box); }); // iPhone
}

/* ملء الشاشة على الحاوية نفسها حتى تبقى العلامة المائية ظاهرة */
async function toggleFs(box) {
  if (!box) return;
  if (box.classList.contains("pseudo-fs")) { box.classList.remove("pseudo-fs"); document.body.style.overflow = ""; return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  if (req) { try { await req.call(box); return; } catch (e) { console.warn(e); } }
  box.classList.add("pseudo-fs");
  document.body.style.overflow = "hidden";
}
const enterVideoFullscreen = i => toggleFs($("video-container-" + i));

function onFsChange() {
  const el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el && el.tagName === "VIDEO") {
    const box = el.closest(".video-container");
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    setTimeout(() => toggleFs(box), 150);
  }
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);

document.addEventListener("visibilitychange", () => { if (document.hidden) document.querySelectorAll("video").forEach(v => v.pause()); });
document.addEventListener("contextmenu", e => { if (e.target.closest(".video-container")) e.preventDefault(); });

/* ---------- فتح المحاضرة والأقسام ---------- */
async function toggleLecture(i) {
  const body = $("body-" + i), arrow = $("arrow-" + i);
  if (!body || !arrow) return;

  const willOpen = !body.classList.contains("open");
  body.classList.toggle("open", willOpen);
  arrow.style.transform = willOpen ? "rotate(180deg)" : "rotate(0deg)";
  if (body.previousElementSibling) body.previousElementSibling.setAttribute("aria-expanded", String(willOpen));

  if (willOpen) {
    await buildPlayer(i);
    const c = body.querySelector(".video-container");
    if (c) c.scrollIntoView({ behavior: "smooth", block: "center" });
  } else {
    const v = body.querySelector("video");
    if (v) v.pause();
  }
}

function toggleSub(header) { const c = header.nextElementSibling; if (c) c.classList.toggle("open"); }

function section(title, content) {
  return '<div class="dropdown-section"><div class="dropdown-header" role="button" tabindex="0" onclick="toggleSub(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleSub(this)}"><span>' +
    title + '</span><span aria-hidden="true">▼</span></div><div class="dropdown-content">' + content + "</div></div>";
}

function externalLink(url, text, emptyText) {
  const href = safeHttps(url);
  return href ? '<a class="btn-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + text + "</a>" : '<p class="muted">' + emptyText + "</p>";
}

/* الملازم: عدد غير محدود لكل محاضرة (مع دعم الحقل القديم pdf_url) */
function getHandouts(lec) {
  let h = lec.handouts;
  if (typeof h === "string") { try { h = JSON.parse(h); } catch { h = []; } }
  h = Array.isArray(h) ? h.filter(x => x && x.url).map(x => ({ title: String(x.title || "ملزمة"), url: String(x.url) })) : [];
  const legacy = lec.pdf_url || lec.pdfUrl;
  if (!h.length && legacy) h = [{ title: "ملزمة المحاضرة", url: String(legacy) }];
  return h;
}

function handoutsHtml(lec, i) {
  const list = getHandouts(lec);
  if (!list.length) return '<p class="muted">لا توجد ملازم لهذه المحاضرة حاليًا.</p>';
  return list.map((h, n) => {
    const external = /^https?:\/\//i.test(h.url) && !h.url.includes("/storage/v1/object/");
    const action = external
      ? externalLink(h.url, "فتح الملزمة", "الرابط غير صالح")
      : '<button type="button" class="btn-link" onclick="openHandout(' + i + "," + n + ')">تنزيل الملزمة</button>';
    return '<div class="handout-row"><span>📄 ' + escapeHtml(h.title) + "</span>" + action + "</div>";
  }).join("");
}

async function openHandout(i, n) {
  const item = getHandouts(currentList[i])[n];
  if (!item) return;
  const w = window.open("about:blank", "_blank"); // نفتح النافذة فورًا حتى لا يمنعها المتصفح
  const url = await signedUrl(HANDOUT_BUCKET, toStoragePath(item.url, HANDOUT_BUCKET));
  if (!url) { if (w) w.close(); alert("تعذر فتح الملزمة. تأكد من تسجيل الدخول ومن صلاحيات قراءة الملازم."); return; }
  if (w) { w.opener = null; w.location.href = url; } else window.location.href = url;
}

/* ---------- الشهور ---------- */
function getMonthNumber(l) { const n = Number(l.month_number); return Number.isInteger(n) && n >= 1 && n <= 12 ? n : null; }

function selectMonth(num) {
  selectedMonth = num;
  document.querySelectorAll(".month-button").forEach(b => b.classList.toggle("active", Number(b.dataset.month) === num));
  renderSelectedMonth();
}

function renderMonths() {
  const grid = $("monthsGrid");
  grid.replaceChildren();
  if (!visibleMonths.length) { grid.style.display = "none"; return; }
  grid.style.display = "grid";

  visibleMonths.forEach(month => {
    const num = Number(month.month_number), count = allLectures.filter(l => getMonthNumber(l) === num).length;
    const img = safeHttps(month.image_url);
    const b = document.createElement("button");
    b.type = "button"; b.className = "month-button"; b.dataset.month = String(num);
    b.innerHTML = (img ? '<img class="month-cover" src="' + escapeHtml(img) + '" alt="" loading="lazy">' : "") +
      '<div class="month-button-top"><strong>' + escapeHtml(month.title) + '</strong><span class="month-number">' + num + "</span></div><small>" + count + " محاضرة</small>";
    b.addEventListener("click", () => selectMonth(num));
    grid.appendChild(b);
  });
}

function renderSelectedMonth() {
  const month = visibleMonths.find(m => Number(m.month_number) === selectedMonth);
  const heading = $("monthHeading"), list = $("lecturesList");

  if (!month) { heading.style.display = "none"; list.innerHTML = '<div class="empty"><span class="empty-icon">📚</span>اختر شهرًا لعرض محاضراته.</div>'; return; }

  currentList = allLectures.filter(l => getMonthNumber(l) === selectedMonth);
  heading.style.display = "flex";
  $("selectedMonthTitle").textContent = month.title;
  $("selectedMonthDescription").textContent = "محاضرات الأحياء الخاصة بهذا الشهر.";
  $("lectureCountBadge").textContent = currentList.length + " محاضرة";

  const mImg = safeHttps(month.image_url), mEl = $("monthHeadingImg");
  mEl.style.display = mImg ? "" : "none";
  if (mImg) mEl.src = mImg; else mEl.removeAttribute("src");

  if (!currentList.length) { list.innerHTML = '<div class="empty"><span class="empty-icon">📚</span>لا توجد محاضرات مضافة لهذا الشهر حتى الآن.</div>'; return; }
  renderLectures(currentList);
}

/* ---------- بطاقات المحاضرات (الفيديو يُجهَّز عند الفتح فقط) ---------- */
function renderLectures(lectures) {
  const list = $("lecturesList");
  list.replaceChildren();
  const hasProgress = !!window.ArdProgress;

  lectures.forEach((lec, i) => {
    const title = lec.title || "محاضرة أحياء", description = lec.description || "";
    const details = lec.details || lec.content || "لا توجد تفاصيل نصية إضافية.";
    const chapter = lec.chapter || lec.lesson || "";
    const img = safeHttps(lec.image_url);

    const card = document.createElement("div");
    card.className = "lecture-card";
    card.innerHTML =
      '<div class="lecture-header" role="button" tabindex="0" aria-expanded="false" onclick="toggleLecture(' + i + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}">' +
        (img ? '<img class="lecture-thumb" src="' + escapeHtml(img) + '" alt="" loading="lazy">' : "") +
        '<div class="lecture-title"><h3>' + escapeHtml(title) + "</h3><p>" + escapeHtml(chapter || description) + "</p></div>" +
        '<div class="arrow-icon" id="arrow-' + i + '" aria-hidden="true">▼</div></div>' +
      '<div class="lecture-body" id="body-' + i + '">' +
        '<div class="video-container" id="video-container-' + i + '"></div>' +
        '<div class="player-bar">' +
          '<label class="quality-wrap" id="quality-wrap-' + i + '" hidden>الجودة <select id="quality-' + i + '" onchange="changeQuality(' + i + ', this.value)"></select></label>' +
          '<button type="button" class="video-fullscreen-btn" onclick="enterVideoFullscreen(' + i + ')">⛶ تكبير الفيديو لملء الشاشة</button>' +
        "</div>" +
        (hasProgress ? '<div class="actions-row"><button type="button" class="action-btn" id="save-' + i + '" onclick="toggleSaved(' + i + ')">☆ حفظ المحاضرة</button>' +
          '<button type="button" class="action-btn" id="done-' + i + '" onclick="toggleCompleted(' + i + ')">تمت المشاهدة؟</button></div>' : "") +
        '<p class="desc">' + escapeHtml(description) + "</p>" +
        section("📖 الشرح التفصيلي", "<p>" + escapeHtml(details) + "</p>") +
        section("📚 ملازم المحاضرة", handoutsHtml(lec, i)) +
        section("✍️ واجب المحاضرة", externalLink(lec.homework_url || lec.homeworkUrl, "فتح الواجب", "لا يوجد واجب لهذه المحاضرة حاليًا.")) +
        section("📝 امتحان المحاضرة", externalLink(lec.exam_url || lec.examUrl, "بدء الامتحان", "لا يوجد امتحان لهذه المحاضرة حاليًا.")) +
      "</div>";

    list.appendChild(card);
    if (hasProgress) refreshActions(i);
  });
}

/* ---------- التحميل ---------- */
async function loadLectures() {
  const list = $("lecturesList");
  list.innerHTML = '<div class="loading">جارٍ تحميل المحاضرات...</div>';
  hideNotice();

  try {
    const { data: months, error: mErr } = await supabaseClient.from(MONTHS_TABLE).select("*").eq("is_visible", true).order("sort_order", { ascending: true });
    if (mErr) throw new Error("تعذر قراءة جدول الشهور. " + mErr.message);

    const { data: lectures, error: lErr } = await supabaseClient.from(LECTURES_TABLE).select("*").order("created_at", { ascending: true });
    if (lErr) throw new Error("تعذر تحميل المحاضرات. " + lErr.message);

    visibleMonths = months || [];
    const visible = new Set(visibleMonths.map(m => Number(m.month_number)));
    allLectures = (lectures || []).filter(l => visible.has(getMonthNumber(l)));

    renderMonths();

    if (!visibleMonths.length) {
      list.innerHTML = '<div class="empty"><span class="empty-icon">📅</span>لا توجد شهور متاحة حاليًا.<br>ستظهر الشهور هنا فور إضافتها.</div>';
      $("monthHeading").style.display = "none";
      return;
    }
    selectMonth(Number(visibleMonths[0].month_number));

  } catch (error) {
    console.error("Lectures loading error:", error);
    list.replaceChildren();
    const box = document.createElement("div"), icon = document.createElement("span"), title = document.createElement("strong"), detail = document.createElement("p");
    box.className = "empty"; icon.className = "empty-icon"; icon.textContent = "⚠️";
    title.textContent = "تعذر تحميل أقسام المحاضرات";
    detail.style.cssText = "margin-top:8px;font-weight:400"; detail.textContent = error.message || "حدث خطأ غير معروف.";
    box.append(icon, title, detail);
    list.appendChild(box);
  }
}

/* ---------- التشغيل: لا محتوى بدون تسجيل دخول (العلامة المائية تحتاج رقم الطالب) ---------- */
async function init() {
  const { data, error } = await supabaseClient.auth.getSession();
  const session = data && data.session;
  if (error || !session) {
    $("lecturesList").replaceChildren();
    showNotice('سجّل الدخول لمشاهدة المحاضرات. <a href="' + LOGIN_URL + '">تسجيل الدخول</a>');
    return;
  }
  await loadViewer(session.user);
  await loadProgress();
  await loadLectures();
}

supabaseClient.auth.onAuthStateChange(event => { if (event === "SIGNED_OUT") window.location.href = LOGIN_URL; });
init();
</script>
