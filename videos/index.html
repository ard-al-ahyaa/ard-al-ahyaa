<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المحاضرات | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7f7;
      color: #222;
    }

    /* الشريط الجانبي */
    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #075e4d;
      color: white;
      padding: 25px 15px;
      z-index: 1000;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-box img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .logo-box h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .logo-box p {
      font-size: 13px;
      opacity: 0.8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      text-decoration: none;
      color: white;
      padding: 14px 15px;
      border-radius: 10px;
      transition: 0.2s;
      font-size: 15px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* المحتوى */
    .main {
      margin-right: 250px;
      padding: 30px;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .topbar h1 {
      color: #075e4d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .topbar p {
      color: #666;
      font-size: 15px;
    }

    /* المحاضرات */
    .lectures-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      color: #075e4d;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .lecture-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .lecture-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 20px;
      background: #fff;
      transition: 0.2s;
    }

    .lecture-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
    }

    .lecture-card h3 {
      color: #075e4d;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .lecture-card p {
      color: #666;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .watch-btn {
      display: inline-block;
      text-decoration: none;
      background: #075e4d;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
    }

    .watch-btn:hover {
      background: #064c3f;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      font-size: 16px;
    }

    .error {
      color: #b00020;
    }

    /* الموبايل */
    @media (max-width: 700px) {

      .sidebar {
        width: 75px;
        padding: 20px 8px;
      }

      .logo-box h2,
      .logo-box p {
        display: none;
      }

      .logo-box img {
        width: 55px;
        height: 55px;
      }

      .menu a {
        text-align: center;
        font-size: 0;
        padding: 14px 5px;
      }

      .menu a::first-letter {
        font-size: 20px;
      }

      .main {
        margin-right: 75px;
        padding: 15px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .lecture-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- الشريط الجانبي -->
  <aside class="sidebar">

    <div class="logo-box">
      <img src="../logo.png" alt="شعار منصة أرض الأحياء">

      <h2>منصة أرض الأحياء</h2>
      <p>منصة تعليمية</p>
    </div>

    <nav class="menu">

      <a href="../index.html">
        🏠 الرئيسية
      </a>

      <a href="index.html" class="active">
        🎥 المحاضرات
      </a>

      <a href="../forum/index.html">
        💬 المنتدى
      </a>

      <a href="../notes/index.html">
        📚 المذكرات
      </a>

    </nav>

  </aside>


  <!-- المحتوى -->
  <main class="main">

    <div class="topbar">
      <h1>🎥 المحاضرات</h1>
      <p>محاضرات الصف الثالث الثانوي</p>
    </div>

    <section class="lectures-container">

      <h2 class="section-title">
        محاضرات الأحياء
      </h2>

      <div id="lectureList" class="lecture-list">

        <div class="loading">
          جاري تحميل المحاضرات...
        </div>

      </div>

    </section>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://cmnmebchevejxhibvgwl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_54UK-Ys41c5wGQvYkeFmYQ_5efdHAQu";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadLectures() {

      const lectureList =
        document.getElementById("lectureList");

      try {

        const { data, error } =
          await supabaseClient
            .from("lectures")
            .select("*")
            .order("created_at", {
              ascending: false
            });


        if (error) {
          throw error;
        }


        if (!data || data.length === 0) {

          lectureList.innerHTML = `
            <div class="empty">
              لا توجد محاضرات مضافة حاليًا.
            </div>
          `;

          return;
        }


        lectureList.innerHTML = "";


        data.forEach(lecture => {

          const card =
            document.createElement("div");

          card.className =
            "lecture-card";


          const title =
            document.createElement("h3");

          title.textContent =
            lecture.title || "محاضرة بدون عنوان";


          const description =
            document.createElement("p");

          description.textContent =
            lecture.description ||
            "لا يوجد وصف لهذه المحاضرة.";


          const button =
            document.createElement("a");

          button.className =
            "watch-btn";

          button.href =
            lecture.video_url;

          button.target =
            "_blank";

          button.rel =
            "noopener noreferrer";

          button.textContent =
            "▶ مشاهدة المحاضرة";


          card.appendChild(title);
          card.appendChild(description);
          card.appendChild(button);

          lectureList.appendChild(card);

        });

      }

      catch (error) {

        console.error(error);

        lectureList.innerHTML = `
          <div class="error">
            تعذر تحميل المحاضرات حاليًا.
            <br>
            تأكد من إعداد جدول المحاضرات في Supabase.
          </div>
        `;

      }

    }


    loadLectures();

  </script>

</body>

</html>
