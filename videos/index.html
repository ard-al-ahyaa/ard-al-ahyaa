<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المحاضرات | منصة أرض الأحياء</title>

  <meta name="description"
    content="محاضرات الأحياء للصف الثالث الثانوي في منصة أرض الأحياء.">

  <link rel="icon" href="../favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    :root {
      --green: #026857;
      --green-dark: #014d40;
      --blue: #1e3a8a;
      --blue-light: #2563eb;
      --bg: #f0f4f8;
      --border: #e2e8f0;
      --text: #2c3e50;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* الشريط الجانبي */

    .sidebar {
      width: 270px;
      background: linear-gradient(
        180deg,
        #026857 0%,
        #075e54 48%,
        #1e3a8a 100%
      );
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
      overflow-y: auto;
    }

    .sidebar-top {
      padding: 28px 18px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.16);
    }

    .logo-box img {
      width: 49px;
      height: 49px;
      object-fit: contain;
      border-radius: 13px;
      background: white;
      padding: 3px;
      flex-shrink: 0;
    }

    .logo-box h2 {
      font-size: 17px;
      color: white;
      font-weight: 900;
    }

    .logo-box p {
      font-size: 11px;
      opacity: .8;
      margin-top: 4px;
    }

    .menu-title {
      color: rgba(255,255,255,.62);
      font-size: 10px;
      font-weight: 700;
      padding: 0 12px;
      margin-bottom: 10px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .2s, transform .2s;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.17);
      color: #fff;
    }

    .menu a:hover {
      transform: translateX(-2px);
    }

    .menu-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .menu-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-bottom {
      margin: 0 18px 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.1);
      font-size: 11px;
      line-height: 2;
      color: rgba(255,255,255,.9);
    }

    /* المحتوى الرئيسي */

    .main {
      margin-right: 270px;
      flex: 1;
      min-width: 0;
      padding: 30px 35px;
    }

    .top-bar {
      background: white;
      padding: 22px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30,58,138,.04);
      margin-bottom: 25px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top-bar h1 {
      color: var(--blue);
      font-size: 22px;
      font-weight: 900;
    }

    .top-bar p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.8;
    }

    .top-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #e8f5e9;
      color: var(--green);
      flex-shrink: 0;
    }

    .top-icon svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* أقسام الشهور */

    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
      margin-bottom: 25px;
    }

    .month-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      text-align: right;
      cursor: pointer;
      transition: .2s;
      color: var(--text);
      min-width: 0;
    }

    .month-button:hover {
      border-color: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(2,104,87,.07);
    }

    .month-button.active {
      color: white;
      background: linear-gradient(135deg, var(--green), var(--blue));
      border-color: transparent;
    }

    .month-button-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .month-button strong {
      font-size: 13px;
      font-weight: 900;
    }

    .month-button small {
      color: var(--muted);
      font-size: 11px;
    }

    .month-button.active small {
      color: rgba(255,255,255,.8);
    }

    .month-number {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #e8f5e9;
      color: var(--green);
      font-weight: 900;
      font-size: 12px;
    }

    .month-button.active .month-number {
      background: rgba(255,255,255,.18);
      color: white;
    }

    /* عنوان الشهر */

    .month-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 5px 0 17px;
      padding: 17px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .month-heading h2 {
      font-size: 17px;
      font-weight: 900;
      color: var(--blue);
    }

    .month-heading p {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .month-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 11px;
      border-radius: 8px;
      background: #e8f5e9;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* بطاقة المحاضرة - الحفاظ على التصميم الأصلي */

    .lecture-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(30,58,138,.03);
    }

    .lecture-header {
      background: linear-gradient(
        135deg,
        #1e3a8a 0%,
        #2563eb 100%
      );
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .lecture-title {
      min-width: 0;
    }

    .lecture-title h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .lecture-title p {
      font-size: 12px;
      opacity: .9;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .arrow-icon {
      font-size: 18px;
      transition: transform .3s;
      flex-shrink: 0;
    }

    .lecture-body {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease-out, padding .3s;
      background: #fafafa;
    }

    .lecture-body.open {
      padding: 20px 25px;
      max-height: 10000px;
      overflow: visible;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .dropdown-section {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .dropdown-header {
      padding: 12px 18px;
      font-weight: 700;
      color: #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: #f1f8e9;
      font-size: 13px;
    }

    .dropdown-content {
      padding: 15px 18px;
      background: white;
      border-top: 1px solid #c8e6c9;
      display: none;
      font-size: 13px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .dropdown-content.open {
      display: block;
    }

    .btn-link {
      display: inline-block;
      background: #026857;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      margin-top: 8px;
    }

    .btn-link:hover {
      background: #014d40;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 2;
    }

    .empty-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .notice {
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 15px;
      font-size: 12px;
      line-height: 2;
      margin-bottom: 20px;
    }

    /* الهاتف */

    .mobile-bottom {
      display: none;
    }

    @media(max-width:1100px) {
      .months-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main {
        padding: 25px;
      }
    }

    @media(max-width:768px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-right: 0;
        padding: 15px;
        padding-bottom: 85px;
      }

      .top-bar {
        padding: 17px;
        margin-bottom: 18px;
      }

      .top-bar h1 {
        font-size: 18px;
      }

      .top-bar p {
        font-size: 11px;
      }

      .top-icon {
        width: 41px;
        height: 41px;
      }

      .months-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .month-button {
        padding: 12px;
      }

      .month-button strong {
        font-size: 12px;
      }

      .month-heading {
        padding: 14px;
      }

      .month-heading h2 {
        font-size: 15px;
      }

      .lecture-header {
        padding: 15px;
      }

      .lecture-title h3 {
        font-size: 15px;
      }

      .lecture-title p {
        font-size: 11px;
      }

      .lecture-body.open {
        padding: 13px;
      }

      .mobile-bottom {
        display: flex;
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1500;
        background: white;
        box-shadow: 0 -3px 18px rgba(0,0,0,.08);
        justify-content: space-around;
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      }

      .mobile-bottom a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #64748b;
        font-size: 10px;
        flex: 1;
      }

      .mobile-bottom a.active {
        color: var(--green);
        font-weight: 900;
      }

      .mobile-bottom svg {
        width: 21px;
        height: 21px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    }

    @media(max-width:360px) {
      .months-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const MONTHS_TABLE = "lecture_months";
    const LECTURES_TABLE = "lectures";

    let allLectures = [];
    let visibleMonths = [];
    let selectedMonth = null;

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showNotice(text) {
      const notice = document.getElementById("pageNotice");
      notice.textContent = text;
      notice.style.display = "block";
    }

    function hideNotice() {
      document.getElementById("pageNotice").style.display = "none";
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return "";

      try {
        const parsed = new URL(url);
        let videoId = "";

        if (parsed.hostname.includes("youtu.be")) {
          videoId = parsed.pathname.split("/").filter(Boolean)[0] || "";
        } else if (
          parsed.hostname.includes("youtube.com") ||
          parsed.hostname.includes("youtube-nocookie.com")
        ) {
          if (parsed.pathname === "/watch") {
            videoId = parsed.searchParams.get("v") || "";
          } else {
            const parts = parsed.pathname.split("/").filter(Boolean);

            if (["embed", "shorts", "live"].includes(parts[0])) {
              videoId = parts[1] || "";
            }
          }
        }

        if (videoId) {
          return "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId);
        }

        return url;

      } catch {
        return url;
      }
    }

    function isYoutubeUrl(url) {
      return /youtube\.com|youtu\.be|youtube-nocookie\.com/i.test(url || "");
    }

    function isDirectVideoUrl(url) {
      return /\.(mp4|webm|ogg|m4v)(?:$|[?#])/i.test(url || "");
    }

    async function resolveVideoUrl(rawUrl) {
      if (!rawUrl) return "";

      const url = String(rawUrl).trim();

      if (/^https?:\/\//i.test(url) || url.startsWith("blob:")) {
        return url;
      }

      const path = url.replace(/^\/+/, "");

      const { data } = supabaseClient.storage
        .from("lectures")
        .getPublicUrl(path);

      return data?.publicUrl || "";
    }

    function createVideoPlayer(url) {
      if (!url) {
        return `
          <div class="empty">
            لم يتم تحديد رابط الفيديو لهذه المحاضرة.
          </div>
        `;
      }

      if (isYoutubeUrl(url)) {
        return `
          <iframe
            src="${escapeHtml(getYoutubeEmbedUrl(url))}"
            title="فيديو المحاضرة"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        `;
      }

      if (
        isDirectVideoUrl(url) ||
        url.includes("/storage/v1/object/")
      ) {
        return `
          <video controls playsinline preload="metadata">
            <source src="${escapeHtml(url)}">
            متصفحك لا يدعم عرض الفيديو.
          </video>
        `;
      }

      return `
        <div style="background:white;padding:20px;text-align:center;">
          <p style="margin-bottom:10px;">
            افتح رابط المحاضرة لمشاهدة الفيديو.
          </p>

          <a class="btn-link"
             href="${escapeHtml(url)}"
             target="_blank"
             rel="noopener noreferrer">
            مشاهدة المحاضرة
          </a>
        </div>
      `;
    }

    function toggleLecture(index) {
      const body = document.getElementById("body-" + index);
      const arrow = document.getElementById("arrow-" + index);

      if (!body || !arrow) return;

      const willOpen = !body.classList.contains("open");

      body.classList.toggle("open", willOpen);

      arrow.style.transform = willOpen
        ? "rotate(180deg)"
        : "rotate(0deg)";
    }

    function toggleSub(header) {
      const content = header.nextElementSibling;
      if (content) content.classList.toggle("open");
    }

    function optionalSection(title, content) {
      return `
        <div class="dropdown-section">
          <div class="dropdown-header" onclick="toggleSub(this)">
            <span>${title}</span>
            <span>▼</span>
          </div>

          <div class="dropdown-content">
            ${content}
          </div>
        </div>
      `;
    }

    function getMonthNumber(lecture) {
      const number = Number(lecture.month_number);

      if (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= 12
      ) {
        return number;
      }

      return null;
    }

    function selectMonth(monthNumber) {
      selectedMonth = monthNumber;

      document.querySelectorAll(".month-button").forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.month) === monthNumber
        );
      });

      renderSelectedMonth();
    }

    function renderMonths() {
      const grid = document.getElementById("monthsGrid");
      grid.replaceChildren();

      if (!visibleMonths.length) {
        grid.style.display = "none";
        return;
      }

      grid.style.display = "grid";

      visibleMonths.forEach(month => {
        const number = Number(month.month_number);

        const count = allLectures.filter(lecture =>
          getMonthNumber(lecture) === number
        ).length;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "month-button";
        button.dataset.month = String(number);

        button.innerHTML = `
          <div class="month-button-top">
            <strong>${escapeHtml(month.title)}</strong>
            <span class="month-number">${number}</span>
          </div>

          <small>${count} محاضرة</small>
        `;

        button.addEventListener("click", () => {
          selectMonth(number);
        });

        grid.appendChild(button);
      });
    }

    function renderSelectedMonth() {
      const month = visibleMonths.find(item =>
        Number(item.month_number) === selectedMonth
      );

      const heading = document.getElementById("monthHeading");
      const list = document.getElementById("lecturesList");

      if (!month) {
        heading.style.display = "none";

        list.innerHTML = `
          <div class="empty">
            <span class="empty-icon">📚</span>
            اختر شهرًا لعرض محاضراته.
          </div>
        `;

        return;
      }

      const lectures = allLectures.filter(lecture =>
        getMonthNumber(lecture) === selectedMonth
      );

      heading.style.display = "flex";

      document.getElementById("selectedMonthTitle").textContent =
        month.title;

      document.getElementById("selectedMonthDescription").textContent =
        "محاضرات الأحياء الخاصة بهذا الشهر.";

      document.getElementById("lectureCountBadge").textContent =
        lectures.length + " محاضرة";

      if (!lectures.length) {
        list.innerHTML = `
          <div class="empty">
            <span class="empty-icon">📚</span>
            لا توجد محاضرات مضافة لهذا الشهر حتى الآن.
          </div>
        `;

        return;
      }

      renderLectures(lectures);
    }

    async function renderLectures(lectures) {
      const list = document.getElementById("lecturesList");

      list.innerHTML = `
        <div class="loading">جارٍ تجهيز المحاضرات...</div>
      `;

      const prepared = await Promise.all(
        lectures.map(async lecture => ({
          lecture,
          videoUrl: await resolveVideoUrl(
            lecture.video_url || lecture.videoUrl || lecture.url || ""
          )
        }))
      );

      list.replaceChildren();

      prepared.forEach(({ lecture, videoUrl }, index) => {
        const title = lecture.title || "محاضرة أحياء";

        const description = lecture.description || "";

        const details =
          lecture.details ||
          lecture.content ||
          "لا توجد تفاصيل نصية إضافية.";

        const pdfUrl =
          lecture.pdf_url ||
          lecture.pdfUrl ||
          "";

        const homeworkUrl =
          lecture.homework_url ||
          lecture.homeworkUrl ||
          "";

        const chapter =
          lecture.chapter ||
          lecture.lesson ||
          "";

        const card = document.createElement("div");
        card.className = "lecture-card";

        card.innerHTML = `
          <div class="lecture-header"
               onclick="toggleLecture(${index})">

            <div class="lecture-title">
              <h3>${escapeHtml(title)}</h3>
              <p>${escapeHtml(chapter || description)}</p>
            </div>

            <div class="arrow-icon" id="arrow-${index}">▼</div>
          </div>

          <div class="lecture-body" id="body-${index}">

            <div class="video-container">
              ${createVideoPlayer(videoUrl)}
            </div>

            <p style="
              margin-bottom:15px;
              color:#475569;
              font-size:14px;
              line-height:2;
            ">
              ${escapeHtml(description)}
            </p>

            ${optionalSection(
              "📖 الشرح التفصيلي",
              `<p>${escapeHtml(details)}</p>`
            )}

            ${optionalSection(
              "📚 مذكرة المحاضرة (PDF)",
              pdfUrl
                ? `<a href="${escapeHtml(pdfUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn-link">
                     تحميل أو استعراض المذكرة
                   </a>`
                : `<p style="color:#64748b">
                     المذكرة غير متوفرة لهذه المحاضرة حاليًا.
                   </p>`
            )}

            ${optionalSection(
              "✏️ واجب المحاضرة",
              homeworkUrl
                ? `<a href="${escapeHtml(homeworkUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn-link">
                     فتح الواجب أو الامتحان
                   </a>`
                : `<p style="color:#64748b">
                     الواجب غير متوفر حاليًا.
                   </p>`
            )}

          </div>
        `;

        list.appendChild(card);
      });
    }

    async function loadLectures() {
      const list = document.getElementById("lecturesList");

      list.innerHTML = `
        <div class="loading">جارٍ تحميل المحاضرات...</div>
      `;

      try {
        // قراءة الشهور المفعلة فقط
        const { data: months, error: monthsError } =
          await supabaseClient
            .from(MONTHS_TABLE)
            .select("month_number,title,is_visible,sort_order")
            .eq("is_visible", true)
            .order("sort_order", { ascending: true });

        if (monthsError) {
          throw new Error(
            "تعذر قراءة جدول الشهور. أنشئ جدول lecture_months باستخدام كود SQL أعلاه. " +
            monthsError.message
          );
        }

        // قراءة المحاضرات
        const { data: lectures, error: lecturesError } =
          await supabaseClient
            .from(LECTURES_TABLE)
            .select("*")
            .order("created_at", { ascending: true });

        if (lecturesError) {
          throw new Error(
            "تعذر تحميل المحاضرات. تحقق من صلاحيات القراءة في جدول lectures. " +
            lecturesError.message
          );
        }

        allLectures = lectures || [];
        visibleMonths = months || [];

        // لا تعرض الشهر إلا إذا كان مفعّلًا في لوحة التحكم/قاعدة البيانات
        const visibleNumbers = new Set(
          visibleMonths.map(month => Number(month.month_number))
        );

        allLectures = allLectures.filter(lecture =>
          visibleNumbers.has(getMonthNumber(lecture))
        );

        renderMonths();

        if (!visibleMonths.length) {
          list.innerHTML = `
            <div class="empty">
              <span class="empty-icon">📅</span>
              لا توجد شهور متاحة حاليًا.
              <br>
              ستظهر الشهور هنا عندما يفعّلها المسؤول من لوحة التحكم.
            </div>
          `;

          document.getElementById("monthHeading").style.display = "none";
          return;
        }

        // افتح أول شهر مفعّل تلقائيًا
        selectMonth(Number(visibleMonths[0].month_number));

      } catch (error) {
        console.error("خطأ تحميل المحاضرات:", error);

        list.innerHTML = "";

        const box = document.createElement("div");
        box.className = "empty";

        const icon = document.createElement("span");
        icon.className = "empty-icon";
        icon.textContent = "⚠️";

        const title = document.createElement("strong");
        title.textContent = "تعذر تحميل أقسام المحاضرات";

        const detail = document.createElement("p");
        detail.style.marginTop = "8px";
        detail.style.fontWeight = "400";
        detail.textContent = error.message || "حدث خطأ غير معروف.";

        box.append(icon, title, detail);
        list.appendChild(box);
      }
    }

    loadLectures();
  </script>

</body>
</html>
