<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المحاضرات | منصة أرض الأحياء</title>

  <meta name="description"
    content="محاضرات وفيديوهات أحياء الصف الثالث الثانوي على منصة أرض الأحياء.">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/videos/">

  <link rel="icon" href="../favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7f7;
      color: #222;
    }

    /* الشريط الجانبي */

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #075e4d;
      color: white;
      padding: 25px 15px;
      z-index: 1000;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-box img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .logo-box h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .logo-box p {
      font-size: 13px;
      opacity: 0.8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      text-decoration: none;
      color: white;
      padding: 14px 15px;
      border-radius: 10px;
      transition: 0.2s;
      font-size: 15px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* المحتوى */

    .main {
      margin-right: 250px;
      padding: 30px;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .topbar h1 {
      color: #075e4d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .topbar p {
      color: #666;
      font-size: 15px;
    }

    /* المحاضرات */

    .lectures-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      color: #075e4d;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .lecture-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .lecture-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      transition: 0.2s;
    }

    .lecture-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
    }

    /* الفيديو */

    .video-box {
      width: 100%;
      background: #000;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-box video {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    /* صندوق تليجرام */

    .telegram-video {
      height: 190px;
      background: linear-gradient(135deg, #168dcc, #229ed9);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .telegram-video .telegram-icon {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    .telegram-video h4 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .telegram-video p {
      color: rgba(255, 255, 255, .9);
      font-size: 13px;
    }

    .lecture-content {
      padding: 18px;
    }

    .lecture-card h3 {
      color: #075e4d;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .lecture-card p {
      color: #666;
      line-height: 1.7;
      font-size: 14px;
    }

    .watch-btn {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      background: #075e4d;
      color: white;
      padding: 10px 17px;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }

    .watch-btn:hover {
      background: #064c3f;
    }

    .telegram-btn {
      background: #229ed9;
    }

    .telegram-btn:hover {
      background: #168dcc;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      font-size: 16px;
      grid-column: 1 / -1;
    }

    .error {
      color: #b00020;
    }

    .security-message {
      text-align: center;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: #fff8e1;
      color: #795548;
      border: 1px solid #ffe082;
      grid-column: 1 / -1;
    }

    .login-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      background: #075e4d;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    /* الموبايل */

    @media (max-width: 700px) {

      .sidebar {
        width: 75px;
        padding: 20px 8px;
      }

      .logo-box h2,
      .logo-box p {
        display: none;
      }

      .logo-box img {
        width: 55px;
        height: 55px;
      }

      .menu a {
        text-align: center;
        font-size: 0;
        padding: 14px 5px;
      }

      .menu a::first-letter {
        font-size: 20px;
      }

      .main {
        margin-right: 75px;
        padding: 15px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .lecture-list {
        grid-template-columns: 1fr;
      }

      .video-box,
      .video-box video,
      .telegram-video {
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <!-- الشريط الجانبي -->

  <aside class="sidebar">

    <div class="logo-box">

      <img
        src="../logo.png"
        alt="شعار منصة أرض الأحياء">

      <h2>منصة أرض الأحياء</h2>

      <p>منصة تعليمية</p>

    </div>

    <nav class="menu">

      <a href="../index.html">
        🏠 الرئيسية
      </a>

      <a href="index.html" class="active">
        🎥 المحاضرات
      </a>

      <a href="../forum/index.html">
        💬 المنتدى
      </a>

      <a href="../notes/index.html">
        📚 المذكرات
      </a>

    </nav>

  </aside>


  <!-- المحتوى -->

  <main class="main">

    <div class="topbar">

      <h1>🎥 المحاضرات</h1>

      <p>
        محاضرات الصف الثالث الثانوي
      </p>

    </div>


    <section class="lectures-container">

      <h2 class="section-title">
        محاضرات الأحياء
      </h2>

      <div
        id="lectureList"
        class="lecture-list">

        <div class="loading">
          جاري تحميل المحاضرات...
        </div>

      </div>

    </section>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =====================================================
       إعداد Supabase - المشروع الحالي
       ===================================================== */

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const BUCKET =
      "lectures";


    /*
      مدة الرابط المؤقت:

      30 دقيقة

      بعد انتهاء المدة يتم إنشاء
      رابط جديد تلقائيًا.
    */

    const SIGNED_URL_TIME =
      30 * 60;


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       محاضرة تليجرام
       ===================================================== */

    const telegramLecture = {

      title:
        "محاضرة أحياء - فيديو تليجرام",

      description:
        "شاهد فيديو المحاضرة على قناة منصة أرض الأحياء في تليجرام.",

      video_url:
        "https://t.me/c/3916276502/60"

    };


    /* =====================================================
       إضافة رسالة تسجيل الدخول
       ===================================================== */

    function showLoginMessage() {

      const lectureList =
        document.getElementById("lectureList");

      lectureList.innerHTML = "";


      const box =
        document.createElement("div");

      box.className =
        "security-message";


      box.innerHTML = `
        <strong>🔐 المحتوى محمي</strong>
        <br>
        يجب تسجيل الدخول إلى منصة أرض الأحياء
        لمشاهدة المحاضرات.
        <br>
        <a
          class="login-btn"
          href="../login/index.html">
          🔑 تسجيل الدخول
        </a>
      `;


      lectureList.appendChild(box);

    }


    /* =====================================================
       إضافة محاضرة تليجرام
       ===================================================== */

    function addTelegramLecture(lectureList) {

      const card =
        document.createElement("div");

      card.className =
        "lecture-card";


      const videoBox =
        document.createElement("div");

      videoBox.className =
        "video-box";


      const telegramBox =
        document.createElement("div");

      telegramBox.className =
        "telegram-video";


      telegramBox.innerHTML = `

        <svg
          class="telegram-icon"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            fill="white"
            d="M21.9 3.3L18.6 20c-.25 1.18-.9 1.47-1.82.92l-5.01-3.69-2.42 2.33c-.27.27-.5.5-1.02.5l.36-5.1 9.28-8.38c.4-.36-.09-.56-.62-.2L5.87 13.63.94 12.09c-1.07-.34-1.09-1.07.22-1.58L20.42 2.9c.91-.34 1.7.2 1.48.4z"
          />

        </svg>

        <h4>
          فيديو المحاضرة
        </h4>

        <p>
          اضغط على زر مشاهدة الفيديو
        </p>

      `;


      videoBox.appendChild(
        telegramBox
      );


      const content =
        document.createElement("div");

      content.className =
        "lecture-content";


      const title =
        document.createElement("h3");

      title.textContent =
        lecture.title;


      const description =
        document.createElement("p");

      description.textContent =
        lecture.description;


      const button =
        document.createElement("a");

      button.className =
        "watch-btn telegram-btn";

      button.href =
        lecture.video_url;

      button.target =
        "_blank";

      button.rel =
        "noopener noreferrer";

      button.textContent =
        "▶ مشاهدة الفيديو";


      content.appendChild(title);

      content.appendChild(description);

      content.appendChild(button);


      card.appendChild(videoBox);

      card.appendChild(content);


      lectureList.appendChild(card);

    }


    /* =====================================================
       التحقق من أن القيمة رابط خارجي
       ===================================================== */

    function isExternalUrl(value) {

      if (!value) {
        return false;
      }


      return (
        value.startsWith("http://") ||
        value.startsWith("https://")
      );

    }


    /* =====================================================
       الحصول على رابط آمن للفيديو
       ===================================================== */

    async function getSecureVideoUrl(videoValue) {

      if (!videoValue) {

        throw new Error(
          "مسار الفيديو غير موجود"
        );

      }


      /*
        لو القيمة رابط خارجي مثل:

        https://youtube.com/...
        https://t.me/...
        https://example.com/video.mp4

        يتم استخدام الرابط كما هو.
      */

      if (isExternalUrl(videoValue)) {

        return videoValue;

      }


      /*
        لو القيمة مسار داخل Supabase
        مثل:

        videos/1750000000_xxx.mp4

        يتم إنشاء Signed URL.
      */

      const {
        data,
        error
      } = await supabaseClient
        .storage
        .from(BUCKET)
        .createSignedUrl(
          videoValue,
          SIGNED_URL_TIME
        );


      if (error) {

        console.error(
          "Signed URL Error:",
          error
        );

        throw error;

      }


      if (!data || !data.signedUrl) {

        throw new Error(
          "تعذر إنشاء رابط الفيديو الآمن"
        );

      }


      return data.signedUrl;

    }


    /* =====================================================
       إضافة فيديو إلى الصفحة
       ===================================================== */

    async function addLecture(lecture) {

      try {

        /*
          الحصول على رابط آمن

          - رابط خارجي → يستخدم مباشرة
          - ملف Private → Signed URL
        */

        const secureVideoUrl =
          await getSecureVideoUrl(
            lecture.video_url
          );


        const card =
          document.createElement("div");

        card.className =
          "lecture-card";


        /* ===============================
           صندوق الفيديو
           =============================== */

        const videoBox =
          document.createElement("div");

        videoBox.className =
          "video-box";


        const video =
          document.createElement("video");


        video.controls =
          true;


        video.preload =
          "metadata";


        video.playsInline =
          true;


        /*
          تقليل خيارات تحميل الفيديو
          من واجهة المتصفح.
        */

        video.setAttribute(
          "controlsList",
          "nodownload"
        );


        video.src =
          secureVideoUrl;


        /*
          منع قائمة الضغط بالزر الأيمن
          على الفيديو.
        */

        video.addEventListener(
          "contextmenu",
          function(event) {

            event.preventDefault();

          }
        );


        videoBox.appendChild(
          video
        );


        /* ===============================
           محتوى المحاضرة
           =============================== */

        const content =
          document.createElement("div");

        content.className =
          "lecture-content";


        const title =
          document.createElement("h3");

        title.textContent =
          lecture.title ||
          "محاضرة بدون عنوان";


        const description =
          document.createElement("p");

        description.textContent =
          lecture.description ||
          "لا يوجد وصف لهذه المحاضرة.";


        /* ===============================
           زر فتح الفيديو
           =============================== */

        const button =
          document.createElement("a");


        button.className =
          "watch-btn";


        button.href =
          secureVideoUrl;


        button.target =
          "_blank";


        button.rel =
          "noopener noreferrer";


        button.textContent =
          "▶ فتح الفيديو";


        content.appendChild(
          title
        );


        content.appendChild(
          description
        );


        content.appendChild(
          button
        );


        card.appendChild(
          videoBox
        );


        card.appendChild(
          content
        );


        return card;

      }


      catch (error) {

        console.error(
          "Video Error:",
          error
        );


        /*
          في حالة فشل إنشاء الرابط الآمن
        */

        const card =
          document.createElement("div");


        card.className =
          "lecture-card";


        const content =
          document.createElement("div");


        content.className =
          "lecture-content";


        const title =
          document.createElement("h3");


        title.textContent =
          lecture.title ||
          "محاضرة";


        const message =
          document.createElement("p");


        message.textContent =
          "تعذر فتح الفيديو حاليًا. حاول تحديث الصفحة.";


        message.style.color =
          "#b00020";


        content.appendChild(
          title
        );


        content.appendChild(
          message
        );


        card.appendChild(
          content
        );


        return card;

      }

    }


    /* =====================================================
       تحميل المحاضرات
       ===================================================== */

    async function loadLectures() {

      const lectureList =
        document.getElementById(
          "lectureList"
        );


      try {

        /*
          التحقق من تسجيل الدخول
        */

        const {
          data: sessionData,
          error: sessionError
        } = await supabaseClient
          .auth
          .getSession();


        if (sessionError) {

          throw sessionError;

        }


        const session =
          sessionData.session;


        /*
          المحتوى محمي للمستخدمين
          المسجلين فقط.
        */

        if (!session) {

          showLoginMessage();

          return;

        }


        /*
          تحميل بيانات المحاضرات
        */

        const {
          data,
          error
        } = await supabaseClient

          .from("lectures")

          .select(
            "id,title,description,video_url,created_at"
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          );


        if (error) {

          throw error;

        }


        /*
          مسح القائمة القديمة
        */

        lectureList.innerHTML = "";


        /*
          إضافة محاضرة تليجرام أولًا
        */

        addTelegramLecture(
          lectureList
        );


        /*
          لا توجد محاضرات
        */

        if (!data || data.length === 0) {

          const empty =
            document.createElement("div");


          empty.className =
            "empty";


          empty.textContent =
            "لا توجد محاضرات مضافة حاليًا.";


          lectureList.appendChild(
            empty
          );


          return;

        }


        /*
          إنشاء بطاقات المحاضرات
        */

        for (
          const lecture of data
        ) {

          const card =
            await addLecture(
              lecture
            );


          lectureList.appendChild(
            card
          );

        }

      }


      catch (error) {

        console.error(
          "Supabase Error:",
          error
        );


        /*
          مسح القائمة
        */

        lectureList.innerHTML = "";


        /*
          تظل محاضرة تليجرام ظاهرة
        */

        addTelegramLecture(
          lectureList
        );


        const errorMessage =
          document.createElement("div");


        errorMessage.className =
          "error";


        errorMessage.style.marginTop =
          "10px";


        errorMessage.textContent =
          "تعذر تحميل المحاضرات حاليًا. حاول تحديث الصفحة.";


        lectureList.appendChild(
          errorMessage
        );

      }

    }


    /* =====================================================
       مراقبة تسجيل الدخول والخروج
       ===================================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (!session) {

            showLoginMessage();

          }
          else {

            loadLectures();

          }

        }
      );


    /* =====================================================
       تشغيل الصفحة
       ===================================================== */

    loadLectures();


    /*
      تحديث Signed URLs كل 25 دقيقة.

      الرابط صالح 30 دقيقة،
      لذلك يتم إنشاء روابط جديدة
      قبل انتهاء الرابط القديم.
    */

    setInterval(
      loadLectures,
      25 * 60 * 1000
    );

  </script>

</body>

</html>
