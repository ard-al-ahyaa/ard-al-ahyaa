<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المحاضرات | منصة أرض الأحياء</title>

  <meta name="description"
    content="محاضرات الأحياء للصف الثالث الثانوي في منصة أرض الأحياء.">

  <meta name="theme-color" content="#026857">

  <link rel="icon" href="../favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    :root {
      --green: #026857;
      --green-dark: #014d40;
      --blue: #1e3a8a;
      --blue-light: #2563eb;
      --bg: #f0f4f8;
      --border: #e2e8f0;
      --text: #2c3e50;
      --muted: #64748b;
      --sidebar-width: 270px;
      --sidebar-collapsed-width: 82px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* الشريط الجانبي */

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(
        180deg,
        #026857 0%,
        #075e54 48%,
        #1e3a8a 100%
      );
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
      overflow-x: hidden;
      overflow-y: auto;
      transition: width .25s ease;
    }

    .sidebar-top {
      padding: 18px;
    }

    .sidebar-control {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 18px;
    }

    .sidebar-toggle {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 11px;
      background: rgba(255,255,255,.12);
      color: white;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s, transform .2s;
    }

    .sidebar-toggle:hover {
      background: rgba(255,255,255,.23);
      transform: scale(1.04);
    }

    .sidebar-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .25s;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.16);
      min-width: 0;
    }

    .logo-box img {
      width: 49px;
      height: 49px;
      object-fit: contain;
      border-radius: 13px;
      background: white;
      padding: 3px;
      flex-shrink: 0;
    }

    .logo-text {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity .2s;
    }

    .logo-box h2 {
      font-size: 17px;
      color: white;
      font-weight: 900;
    }

    .logo-box p {
      font-size: 11px;
      opacity: .8;
      margin-top: 4px;
    }

    .menu-title {
      color: rgba(255,255,255,.62);
      font-size: 10px;
      font-weight: 700;
      padding: 0 12px;
      margin-bottom: 10px;
      white-space: nowrap;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .2s, transform .2s;
      min-height: 46px;
      white-space: nowrap;
      position: relative;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.17);
      color: #fff;
    }

    .menu a:hover {
      transform: translateX(-2px);
    }

    .menu-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .menu-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-text {
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity .2s;
    }

    .sidebar-bottom {
      margin: 0 18px 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.1);
      font-size: 11px;
      line-height: 2;
      color: rgba(255,255,255,.9);
      overflow: hidden;
      transition: opacity .2s;
    }

    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed-width);
    }

    body.sidebar-collapsed .sidebar-top {
      padding: 18px 12px;
    }

    body.sidebar-collapsed .sidebar-control {
      justify-content: center;
    }

    body.sidebar-collapsed .sidebar-toggle svg {
      transform: rotate(180deg);
    }

    body.sidebar-collapsed .logo-box {
      justify-content: center;
      padding-bottom: 18px;
    }

    body.sidebar-collapsed .logo-text,
    body.sidebar-collapsed .menu-title,
    body.sidebar-collapsed .menu-text,
    body.sidebar-collapsed .sidebar-bottom {
      display: none;
    }

    body.sidebar-collapsed .menu a {
      justify-content: center;
      padding: 12px 8px;
      gap: 0;
    }

    body.sidebar-collapsed .menu-icon {
      width: 25px;
      height: 25px;
    }

    body.sidebar-collapsed .menu a[title]:hover::after {
      content: attr(title);
      position: absolute;
      right: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      padding: 7px 12px;
      background: #0f172a;
      color: white;
      font-size: 11px;
      border-radius: 8px;
      white-space: nowrap;
      z-index: 2000;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      pointer-events: none;
    }

    /* المحتوى الرئيسي */

    .main {
      margin-right: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 30px 35px;
      transition: margin-right .25s ease;
    }

    body.sidebar-collapsed .main {
      margin-right: var(--sidebar-collapsed-width);
    }

    .top-bar {
      background: white;
      padding: 22px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30,58,138,.04);
      margin-bottom: 25px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top-bar h1 {
      color: var(--blue);
      font-size: 22px;
      font-weight: 900;
    }

    .top-bar p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.8;
    }

    .top-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #e8f5e9;
      color: var(--green);
      flex-shrink: 0;
    }

    .top-icon svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* أقسام الشهور */

    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
      margin-bottom: 25px;
    }

    .month-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      text-align: right;
      cursor: pointer;
      transition: .2s;
      color: var(--text);
      min-width: 0;
    }

    .month-button:hover {
      border-color: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(2,104,87,.07);
    }

    .month-button.active {
      color: white;
      background: linear-gradient(135deg, var(--green), var(--blue));
      border-color: transparent;
    }

    .month-button-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .month-button strong {
      font-size: 13px;
      font-weight: 900;
    }

    .month-button small {
      color: var(--muted);
      font-size: 11px;
    }

    .month-button.active small {
      color: rgba(255,255,255,.8);
    }

    .month-number {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #e8f5e9;
      color: var(--green);
      font-weight: 900;
      font-size: 12px;
      flex-shrink: 0;
    }

    .month-button.active .month-number {
      background: rgba(255,255,255,.18);
      color: white;
    }

    /* عنوان الشهر */

    .month-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 5px 0 17px;
      padding: 17px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .month-heading h2 {
      font-size: 17px;
      font-weight: 900;
      color: var(--blue);
    }

    .month-heading p {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .month-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 11px;
      border-radius: 8px;
      background: #e8f5e9;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* بطاقة المحاضرة */

    .lecture-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(30,58,138,.03);
    }

    .lecture-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .lecture-header:focus-visible,
    .dropdown-header:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: -3px;
    }

    .lecture-title {
      min-width: 0;
    }

    .lecture-title h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .lecture-title p {
      font-size: 12px;
      opacity: .9;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .arrow-icon {
      font-size: 18px;
      transition: transform .3s;
      flex-shrink: 0;
    }

    .lecture-body {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease-out, padding .3s;
      background: #fafafa;
    }

    .lecture-body.open {
      padding: 20px 25px;
      max-height: 10000px;
      overflow: visible;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .dropdown-section {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .dropdown-header {
      padding: 12px 18px;
      font-weight: 700;
      color: #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: #f1f8e9;
      font-size: 13px;
    }

    .dropdown-content {
      padding: 15px 18px;
      background: white;
      border-top: 1px solid #c8e6c9;
      display: none;
      font-size: 13px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .dropdown-content.open {
      display: block;
    }

    .btn-link {
      display: inline-block;
      background: #026857;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      margin-top: 8px;
    }

    .btn-link:hover {
      background: #014d40;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .empty-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .notice {
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 15px;
      font-size: 12px;
      line-height: 2;
      margin-bottom: 20px;
    }

    /* قائمة الهاتف */

    .mobile-bottom {
      display: none;
    }

    @media(max-width:1100px) {
      .months-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main {
        padding: 25px;
      }
    }

    @media(max-width:768px) {
      .sidebar {
        display: none;
      }

      .main,
      body.sidebar-collapsed .main {
        margin-right: 0;
        padding: 15px;
        padding-bottom: 85px;
      }

      .top-bar {
        padding: 17px;
        margin-bottom: 18px;
      }

      .top-bar h1 {
        font-size: 18px;
      }

      .top-bar p {
        font-size: 11px;
      }

      .top-icon {
        width: 41px;
        height: 41px;
      }

      .months-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .month-button {
        padding: 12px;
      }

      .month-button strong {
        font-size: 12px;
      }

      .month-heading {
        padding: 14px;
      }

      .month-heading h2 {
        font-size: 15px;
      }

      .lecture-header {
        padding: 15px;
      }

      .lecture-title h3 {
        font-size: 15px;
      }

      .lecture-title p {
        font-size: 11px;
      }

      .lecture-body.open {
        padding: 13px;
      }

      .mobile-bottom {
        display: flex;
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1500;
        background: white;
        box-shadow: 0 -3px 18px rgba(0,0,0,.08);
        justify-content: space-around;
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      }

      .mobile-bottom a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #64748b;
        font-size: 10px;
        flex: 1;
        text-decoration: none;
      }

      .mobile-bottom a.active {
        color: var(--green);
        font-weight: 900;
      }

      .mobile-bottom svg {
        width: 21px;
        height: 21px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    }

    @media(max-width:360px) {
      .months-grid {
        grid-template-columns: 1fr;
      }

      .month-heading {
        align-items: flex-start;
      }

      .month-badge {
        font-size: 10px;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

        <path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9 9 0 0 1-4-.9L3 21l1.9-4.3A8.5 8.5 0 1 1 21 11.5Z"></path>
      </svg>
      المنتدى
    </a>

    <a href="../account/index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">

      حسابي
    </a>

  </nav>

  <script>
    "use strict";

    /* إعداد Supabase */

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const MONTHS_TABLE = "lecture_months";
    const LECTURES_TABLE = "lectures";
    const STORAGE_BUCKET = "lectures";
    const SIGNED_URL_SECONDS = 3600;

    let allLectures = [];
    let visibleMonths = [];
    let selectedMonth = null;

    /* التحكم في الشريط الجانبي */

    const sidebarToggle = document.getElementById("sidebarToggle");

    const SIDEBAR_STORAGE_KEY =
      "ardAlahyaaLecturesSidebarCollapsed";

    function setSidebarCollapsed(collapsed, save = true) {
      document.body.classList.toggle("sidebar-collapsed", collapsed);

      sidebarToggle.setAttribute(
        "aria-expanded",
        String(!collapsed)
      );

      sidebarToggle.setAttribute(
        "aria-label",
        collapsed
          ? "توسيع القائمة الجانبية"
          : "تصغير القائمة الجانبية"
      );

      sidebarToggle.title = collapsed
        ? "توسيع القائمة الجانبية"
        : "تصغير القائمة الجانبية";

      if (save) {
        try {
          localStorage.setItem(
            SIDEBAR_STORAGE_KEY,
            collapsed ? "true" : "false"
          );
        } catch (error) {
          console.warn("تعذر حفظ حالة القائمة الجانبية:", error);
        }
      }
    }

    function loadSidebarState() {
      try {
        const savedState = localStorage.getItem(
          SIDEBAR_STORAGE_KEY
        );

        setSidebarCollapsed(savedState === "true", false);
      } catch (error) {
        setSidebarCollapsed(false, false);
      }
    }

    sidebarToggle.addEventListener("click", function () {
      const isCollapsed =
        document.body.classList.contains("sidebar-collapsed");

      setSidebarCollapsed(!isCollapsed);
    });

    loadSidebarState();

    /* أدوات مساعدة */

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showNotice(text) {
      const notice = document.getElementById("pageNotice");
      notice.textContent = text;
      notice.style.display = "block";
    }

    function hideNotice() {
      document.getElementById("pageNotice").style.display = "none";
    }

    /* استخراج مسار الملف من رابط Supabase */

    function decodePathParts(parts) {
      return parts.map(part => {
        try {
          return decodeURIComponent(part);
        } catch {
          return part;
        }
      });
    }

    function getStorageObjectPath(rawValue) {
      if (!rawValue) return "";

      const value = String(rawValue).trim();

      if (!value) return "";

      /*
       * لو القيمة ليست رابطًا، نتعامل معها باعتبارها مسار الملف.
       */

      if (!/^https?:\/\//i.test(value)) {
        let path = value.replace(/^\/+/, "");

        path = path.replace(/^storage\/v1\/object\/(public|sign|authenticated)\//i, "");

        if (path.startsWith(STORAGE_BUCKET + "/")) {
          path = path.slice(STORAGE_BUCKET.length + 1);
        }

        return path;
      }

      /*
       * لو الرابط صادرًا من Supabase Storage،
       * نستخرج اسم الملف حتى لو كان الرابط عامًا أو موقّعًا.
       */

      try {
        const parsed = new URL(value);
        const parts = parsed.pathname.split("/").filter(Boolean);
        const objectIndex = parts.indexOf("object");

        if (objectIndex === -1) {
          return "";
        }

        const accessType = parts[objectIndex + 1] || "";

        if (
          accessType === "public" ||
          accessType === "sign" ||
          accessType === "authenticated"
        ) {
          const bucketName = parts[objectIndex + 2] || "";

          if (bucketName !== STORAGE_BUCKET) {
            return "";
          }

          const fileParts = decodePathParts(
            parts.slice(objectIndex + 3)
          );

          return fileParts.join("/");
        }

        /*
         * يدعم أيضًا المسار بالشكل:
         * /storage/v1/object/lectures/folder/video.mp4
         */

        if (accessType === STORAGE_BUCKET) {
          return decodePathParts(
            parts.slice(objectIndex + 2)
          ).join("/");
        }

        return "";

      } catch (error) {
        console.error("تعذر تحليل رابط ملف المحاضرة:", error);
        return "";
      }
    }

    /*
     * إنشاء رابط مؤقت لفيديو موجود في Bucket خاص.
     * لا نستخدم مفتاح Service Role في المتصفح.
     */

    async function createPrivateLectureUrl(storagePath) {
      if (!storagePath) return "";

      try {
        const {
          data: sessionData,
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          console.error("تعذر التحقق من جلسة المستخدم:", sessionError);
          return "";
        }

        if (!sessionData?.session) {
          console.warn(
            "يجب تسجيل الدخول للحصول على رابط المحاضرة الخاصة."
          );
          return "";
        }

        const {
          data,
          error
        } = await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .createSignedUrl(
            storagePath,
            SIGNED_URL_SECONDS
          );

        if (error) {
          console.error(
            "تعذر إنشاء رابط مؤقت للفيديو:",
            error
          );
          return "";
        }

        return data?.signedUrl || "";

      } catch (error) {
        console.error(
          "حدث خطأ أثناء تجهيز رابط الفيديو:",
          error
        );

        return "";
      }
    }

    /* التعامل مع روابط الفيديو */

    function getYoutubeEmbedUrl(url) {
      if (!url) return "";

      try {
        const parsed = new URL(url);
        let videoId = "";

        if (parsed.hostname.includes("youtu.be")) {
          videoId =
            parsed.pathname.split("/").filter(Boolean)[0] || "";

        } else if (
          parsed.hostname.includes("youtube.com") ||
          parsed.hostname.includes("youtube-nocookie.com")
        ) {
          if (parsed.pathname === "/watch") {
            videoId = parsed.searchParams.get("v") || "";

          } else {
            const parts = parsed.pathname.split("/").filter(Boolean);

            if (["embed", "shorts", "live"].includes(parts[0])) {
              videoId = parts[1] || "";
            }
          }
        }

        if (videoId) {
          return "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId);
        }

        return url;

      } catch {
        return url;
      }
    }

    function isYoutubeUrl(url) {
      return /youtube\.com|youtu\.be|youtube-nocookie\.com/i.test(
        url || ""
      );
    }

    function isDirectVideoUrl(url) {
      return /\.(mp4|webm|ogg|m4v)(?:$|[?#])/i.test(url || "");
    }

    /*
     * حل رابط الفيديو:
     * 1. روابط YouTube والخدمات الخارجية تظل كما هي.
     * 2. روابط Supabase Storage تتحول إلى Signed URL.
     * 3. مسارات الملفات تتحول إلى Signed URL.
     */

    async function resolveVideoUrl(rawUrl) {
      if (!rawUrl) return "";

      const url = String(rawUrl).trim();

      if (!url) return "";

      /*
       * روابط YouTube لا تحتاج إلى Supabase Signed URL.
       */

      if (isYoutubeUrl(url)) {
        return url;
      }

      /*
       * روابط خارجية عادية تظل كما هي.
       */

      if (
        /^https?:\/\//i.test(url) &&
        !url.includes("/storage/v1/object/")
      ) {
        return url;
      }

      /*
       * روابط Supabase Storage أو مسارات الملفات.
       */

      const storagePath = getStorageObjectPath(url);

      if (!storagePath) {
        /*
         * السماح بروابط الفيديو المباشرة الخارجية.
         */

        if (/^https?:\/\//i.test(url)) {
          return url;
        }

        console.error(
          "تعذر استخراج مسار ملف الفيديو من:",
          url
        );

        return "";
      }

      return await createPrivateLectureUrl(storagePath);
    }

    function createVideoPlayer(url) {
      if (!url) {
        return `
          <div class="empty">
            تعذر تجهيز رابط الفيديو.
            <br>
            تأكد من تسجيل الدخول ومن صلاحيات قراءة ملفات المحاضرات.
          </div>
        `;
      }

      if (isYoutubeUrl(url)) {
        return `
          <iframe
            src="${escapeHtml(getYoutubeEmbedUrl(url))}"
            title="فيديو المحاضرة"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        `;
      }

      if (
        isDirectVideoUrl(url) ||
        url.includes("/storage/v1/object/")
      ) {
        return `
          <video controls playsinline preload="metadata">
            <source src="${escapeHtml(url)}">
            متصفحك لا يدعم عرض الفيديو.
          </video>
        `;
      }

      return `
        <div style="background:white;padding:20px;text-align:center;">
          <p style="margin-bottom:10px;">
            افتح رابط المحاضرة لمشاهدة الفيديو.
          </p>

          <a class="btn-link"
             href="${escapeHtml(url)}"
             target="_blank"
             rel="noopener noreferrer">
            مشاهدة المحاضرة
          </a>
        </div>
      `;
    }

    /* فتح وإغلاق المحاضرات */

    function toggleLecture(index) {
      const body = document.getElementById("body-" + index);
      const arrow = document.getElementById("arrow-" + index);

      if (!body || !arrow) return;

      const willOpen = !body.classList.contains("open");

      body.classList.toggle("open", willOpen);

      arrow.style.transform = willOpen
        ? "rotate(180deg)"
        : "rotate(0deg)";
    }

    function toggleSub(header) {
      const content = header.nextElementSibling;

      if (content) {
        content.classList.toggle("open");
      }
    }

    function optionalSection(title, content) {
      return `
        <div class="dropdown-section">

          <div
            class="dropdown-header"
            role="button"
            tabindex="0"
            onclick="toggleSub(this)"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSub(this)}">

            <span>${title}</span>
            <span aria-hidden="true">▼</span>

          </div>

          <div class="dropdown-content">
            ${content}
          </div>

        </div>
      `;
    }

    /* إدارة الشهور */

    function getMonthNumber(lecture) {
      const number = Number(lecture.month_number);

      if (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= 12
      ) {
        return number;
      }

      return null;
    }

    function selectMonth(monthNumber) {
      selectedMonth = monthNumber;

      document.querySelectorAll(".month-button").forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.month) === monthNumber
        );
      });

      renderSelectedMonth();
    }

    function renderMonths() {
      const grid = document.getElementById("monthsGrid");
      grid.replaceChildren();

      if (!visibleMonths.length) {
        grid.style.display = "none";
        return;
      }

      grid.style.display = "grid";

      visibleMonths.forEach(month => {
        const number = Number(month.month_number);

        const count = allLectures.filter(lecture =>
          getMonthNumber(lecture) === number
        ).length;

        const button = document.createElement("button");

        button.type = "button";
        button.className = "month-button";
        button.dataset.month = String(number);

        button.innerHTML = `
          <div class="month-button-top">
            <strong>${escapeHtml(month.title)}</strong>
            <span class="month-number">${number}</span>
          </div>

          <small>${count} محاضرة</small>
        `;

        button.addEventListener("click", () => {
          selectMonth(number);
        });

        grid.appendChild(button);
      });
    }

    /* عرض المحاضرات الخاصة بالشهر المختار */

    function renderSelectedMonth() {
      const month = visibleMonths.find(item =>
        Number(item.month_number) === selectedMonth
      );

      const heading = document.getElementById("monthHeading");
      const list = document.getElementById("lecturesList");

      if (!month) {
        heading.style.display = "none";

        list.innerHTML = `
          <div class="empty">
            <span class="empty-icon">📚</span>
            اختر شهرًا لعرض محاضراته.
          </div>
        `;

        return;
      }

      const lectures = allLectures.filter(lecture =>
        getMonthNumber(lecture) === selectedMonth
      );

      heading.style.display = "flex";

      document.getElementById("selectedMonthTitle").textContent =
        month.title;

      document.getElementById("selectedMonthDescription").textContent =
        "محاضرات الأحياء الخاصة بهذا الشهر.";

      document.getElementById("lectureCountBadge").textContent =
        lectures.length + " محاضرة";

      if (!lectures.length) {
        list.innerHTML = `
          <div class="empty">
            <span class="empty-icon">📚</span>
            لا توجد محاضرات مضافة لهذا الشهر حتى الآن.
          </div>
        `;

        return;
      }

      renderLectures(lectures);
    }

    /* تجهيز وعرض بطاقات المحاضرات */

    async function renderLectures(lectures) {
      const list = document.getElementById("lecturesList");

      list.innerHTML = `
        <div class="loading">جارٍ تجهيز المحاضرات...</div>
      `;

      const prepared = await Promise.all(
        lectures.map(async lecture => ({
          lecture,
          videoUrl: await resolveVideoUrl(
            lecture.video_url ||
            lecture.videoUrl ||
            lecture.url ||
            ""
          )
        }))
      );

      list.replaceChildren();

      prepared.forEach(({ lecture }, index) => {
        const videoUrl = prepared[index].videoUrl;

        const title = lecture.title || "محاضرة أحياء";
        const description = lecture.description || "";

        const details =
          lecture.details ||
          lecture.content ||
          "لا توجد تفاصيل نصية إضافية.";

        const pdfUrl =
          lecture.pdf_url ||
          lecture.pdfUrl ||
          "";

        const homeworkUrl =
          lecture.homework_url ||
          lecture.homeworkUrl ||
          "";

        const chapter =
          lecture.chapter ||
          lecture.lesson ||
          "";

        const card = document.createElement("div");

        card.className = "lecture-card";

        card.innerHTML = `
          <div
            class="lecture-header"
            role="button"
            tabindex="0"
            aria-expanded="false"
            onclick="toggleLecture(${index});this.setAttribute('aria-expanded',String(document.getElementById('body-${index}').classList.contains('open')))"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">

            <div class="lecture-title">
              <h3>${escapeHtml(title)}</h3>
              <p>${escapeHtml(chapter || description)}</p>
            </div>

            <div class="arrow-icon" id="arrow-${index}" aria-hidden="true">▼</div>

          </div>

          <div class="lecture-body" id="body-${index}">

            <div class="video-container">
              ${createVideoPlayer(videoUrl)}
            </div>

            <p style="
              margin-bottom:15px;
              color:#475569;
              font-size:14px;
              line-height:2;
              overflow-wrap:anywhere;
            ">
              ${escapeHtml(description)}
            </p>

            ${optionalSection(
              "📖 الشرح التفصيلي",
              `<p>${escapeHtml(details)}</p>`
            )}

            ${optionalSection(
              "📚 مذكرة المحاضرة (PDF)",
              pdfUrl
                ? `<a href="${escapeHtml(pdfUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn-link">
                     تحميل أو استعراض المذكرة
                   </a>`
                : `<p style="color:#64748b">
                     المذكرة غير متوفرة لهذه المحاضرة حاليًا.
                   </p>`
            )}

            ${optionalSection(
              "✏️ واجب المحاضرة",
              homeworkUrl
                ? `<a href="${escapeHtml(homeworkUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn-link">
                     فتح الواجب أو الامتحان
                   </a>`
                : `<p style="color:#64748b">
                     الواجب غير متوفر حاليًا.
                   </p>`
            )}

          </div>
        `;

        list.appendChild(card);
      });
    }

    /* تحميل البيانات من Supabase */

    async function loadLectures() {
      const list = document.getElementById("lecturesList");

      list.innerHTML = `
        <div class="loading">جارٍ تحميل المحاضرات...</div>
      `;

      hideNotice();

      try {
        const {
          data: months,
          error: monthsError
        } = await supabaseClient
          .from(MONTHS_TABLE)
          .select("month_number,title,is_visible,sort_order")
          .eq("is_visible", true)
          .order("sort_order", { ascending: true });

        if (monthsError) {
          throw new Error(
            "تعذر قراءة جدول الشهور (lecture_months). " +
            "تحقق من وجود الجدول وأسماء الأعمدة وصلاحيات القراءة. " +
            monthsError.message
          );
        }

        const {
          data: lectures,
          error: lecturesError
        } = await supabaseClient
          .from(LECTURES_TABLE)
          .select("*")
          .order("created_at", { ascending: true });

        if (lecturesError) {
          throw new Error(
            "تعذر تحميل المحاضرات. تحقق من صلاحيات القراءة في جدول lectures. " +
            lecturesError.message
          );
        }

        allLectures = lectures || [];
        visibleMonths = months || [];

        const visibleNumbers = new Set(
          visibleMonths.map(month => Number(month.month_number))
        );

        allLectures = allLectures.filter(lecture =>
          visibleNumbers.has(getMonthNumber(lecture))
        );

        renderMonths();

        if (!visibleMonths.length) {
          list.innerHTML = `
            <div class="empty">
              <span class="empty-icon">📅</span>
              لا توجد شهور متاحة حاليًا.
              <br>
              ستظهر الشهور هنا عندما يفعّلها المسؤول من لوحة التحكم.
            </div>
          `;

          document.getElementById("monthHeading").style.display = "none";

          return;
        }

        selectMonth(Number(visibleMonths[0].month_number));

      } catch (error) {
        console.error("خطأ تحميل المحاضرات:", error);

        list.replaceChildren();

        const box = document.createElement("div");
        box.className = "empty";

        const icon = document.createElement("span");
        icon.className = "empty-icon";
        icon.textContent = "⚠️";

        const title = document.createElement("strong");
        title.textContent = "تعذر تحميل أقسام المحاضرات";

        const detail = document.createElement("p");
        detail.style.marginTop = "8px";
        detail.style.fontWeight = "400";
        detail.textContent = error.message || "حدث خطأ غير معروف.";

        box.append(icon, title, detail);
        list.appendChild(box);
      }
    }

    /* تشغيل الصفحة */

    loadLectures();
  </script>
