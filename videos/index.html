<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحاضرات | منصة أرض الأحياء</title>
<meta name="description" content="محاضرات الأحياء للصف الثالث الثانوي في منصة أرض الأحياء">
<meta name="theme-color" content="#004e4d">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../progress.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
 --green:#008866;
 --green-dark:#006e65;
 --dark:#004e4d;
 --blue:#07375b;
 --bg:#f4f7fb;
 --border:#e2eaf3;
 --text:#142f50;
 --muted:#6b7f98;
 --white:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Cairo,sans-serif;
}
button,input,select{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
button:disabled{opacity:.55;cursor:not-allowed}

/* الشريط الجانبي - مطابق لشريط لوحة الطالب */
.sidebar{
 width:272px;
 background:linear-gradient(180deg,#004e4d 0%,#003d50 62%,#07375b 100%);
 color:#fff;
 position:fixed;
 right:0;
 top:0;
 bottom:0;
 display:flex;
 flex-direction:column;
 z-index:1000;
 overflow:hidden;
 transition:width .25s ease,transform .25s ease;
}
.sidebar.collapsed{width:82px}
.sidebar-inner{padding:17px 15px;flex:1;min-width:0;overflow-y:auto;overflow-x:hidden}
.sidebar-top-actions{display:flex;justify-content:flex-start;margin-bottom:8px}
.sidebar-toggle{
 width:39px;height:39px;display:grid;place-items:center;
 border:1px solid rgba(255,255,255,.15);border-radius:50%;
 background:rgba(255,255,255,.08);color:#fff;padding:0;font-size:17px;
}
.sidebar-toggle:hover{background:rgba(255,255,255,.18)}
.sidebar-toggle i{transition:transform .25s}
.brand{
 display:flex;flex-direction:column;align-items:center;gap:8px;
 margin-bottom:27px;padding:0 5px 20px;
 border-bottom:1px solid rgba(255,255,255,.12);min-width:0;
}
.brand-logo-wrap{width:83px;height:83px;flex-shrink:0;display:grid;place-items:center}
.brand img{width:100%;height:100%;object-fit:contain}
.brand-text{text-align:center;min-width:0}
.brand h2{font-size:22px;font-weight:900;white-space:nowrap;margin:0}
.brand p{display:block;margin:1px 0 0;font-size:13px;color:#d2e8e5;opacity:1}
.menu-label{color:rgba(255,255,255,.53);font-size:10px;font-weight:700;padding:0 12px;margin:0 0 9px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{
 color:#f0f8f7;padding:12px 14px;border-radius:14px;font-size:14px;
 font-weight:700;display:flex;align-items:center;gap:14px;width:100%;
 min-height:51px;white-space:nowrap;transition:background .2s,transform .2s;
}
.menu a:hover,.menu a.active{background:linear-gradient(100deg,#13a77c,#159a77);color:#fff}
.menu a:hover{transform:translateX(-2px)}
.menu i{width:25px;min-width:25px;display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.menu span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .sidebar-inner{padding:15px 9px}
.sidebar.collapsed .sidebar-top-actions{justify-content:center}
.sidebar.collapsed .sidebar-toggle i{transform:rotate(180deg)}
.sidebar.collapsed .brand{padding-bottom:15px}
.sidebar.collapsed .brand-logo-wrap{width:54px;height:54px}
.sidebar.collapsed .brand-text,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:none}
.sidebar.collapsed .menu a{justify-content:center;gap:0;padding:13px 5px}
.sidebar.collapsed .menu a:hover{transform:none}
.sidebar-overlay{display:none}
.mobile-sidebar-button{display:none}

/* المحتوى */
.main{
 margin-right:272px;
 padding:27px 28px 45px;
 transition:margin-right .25s;
}
.main.expanded{margin-right:82px}
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 background:white;
 border:1px solid var(--border);
 border-radius:17px;
 padding:21px 24px;
 margin-bottom:23px;
}
.topbar h1{
 color:var(--dark);
 font-size:22px;
 font-weight:900;
 margin:0;
}
.topbar p{
 color:var(--muted);
 font-size:12px;
 margin:5px 0 0;
}
.topbar>i{color:var(--green);font-size:27px}
.section-heading{font-size:17px;margin:0 0 14px}

/* الشهور */
.months-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:13px;
 margin-bottom:23px;
}
.month-btn{
 background:white;
 border:1px solid var(--border);
 border-radius:15px;
 padding:14px;
 text-align:right;
 color:var(--text);
 transition:.2s;
}
.month-btn:hover{
 transform:translateY(-3px);
 border-color:var(--green);
}
.month-btn.active{
 border-color:var(--green);
 background:#f1fbf6;
 box-shadow:0 5px 15px #00886610;
}
.month-btn img{
 width:100%;
 aspect-ratio:16/9;
 object-fit:cover;
 border-radius:10px;
 margin-bottom:10px;
}
.month-btn strong{font-size:13px}
.month-btn small{
 display:block;
 color:var(--muted);
 font-size:11px;
 margin-top:5px;
}
.month-heading{
 background:white;
 border:1px solid var(--border);
 padding:15px 18px;
 border-radius:15px;
 margin-bottom:17px;
}
.month-heading h2{
 font-size:17px;
 color:var(--dark);
 margin:0;
}
.month-heading p{
 color:var(--muted);
 font-size:11px;
 margin:4px 0 0;
}

/* المحاضرات */
.lecture-card{
 background:white;
 border:1px solid var(--border);
 border-radius:16px;
 overflow:hidden;
 margin-bottom:17px;
 box-shadow:0 4px 18px #12375b07;
}
.lecture-header{
 display:flex;
 align-items:center;
 gap:13px;
 padding:15px 18px;
 cursor:pointer;
}
.lecture-header:hover{background:#f9fcff}
.lecture-thumb{
 width:95px;
 aspect-ratio:16/9;
 object-fit:cover;
 border-radius:11px;
 flex-shrink:0;
}
.lecture-placeholder{
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#008866,#07375b);
 color:white;
 font-size:26px;
}
.lecture-info{flex:1;min-width:0}
.lecture-info h3{
 font-size:15px;
 font-weight:900;
 margin:0;
}
.lecture-info p{
 font-size:11px;
 color:var(--muted);
 margin:5px 0 0;
}
.lecture-arrow{
 color:var(--green);
 font-size:18px;
 transition:.2s;
}
.lecture-body{
 display:none;
 padding:18px;
 background:#fbfcfe;
 border-top:1px solid #edf1f6;
}
.lecture-body.open{display:block}

/* المشغل */
.earth-player{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 background:#07111d;
 border-radius:13px;
 overflow:hidden;
 margin-bottom:17px;
 direction:ltr;
 user-select:none;
}
.earth-player:fullscreen{border-radius:0}
.earth-player video,
.earth-player iframe{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:contain;
 border:0;
 background:#07111d;
}
.earth-player video{pointer-events:none}
.player-touch{
 position:absolute;
 inset:0;
 z-index:2;
 cursor:pointer;
}
.player-loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:12px;
 background:#07111d;
 color:white;
 z-index:5;
 font-size:12px;
 pointer-events:none;
 text-align:center;
 padding:20px;
}
.player-loading.hidden{display:none}
.spinner{
 width:38px;
 height:38px;
 border:3px solid #ffffff30;
 border-top-color:#20c997;
 border-radius:50%;
 animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.player-center{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:3;
 pointer-events:none;
 transition:.25s;
}
.player-center.hidden{opacity:0;visibility:hidden}
.player-logo{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:12px;
 color:white;
}
.player-logo img{width:65px;height:65px;object-fit:contain}
.player-logo strong{font-size:15px}
.center-play{
 width:68px;
 height:68px;
 border-radius:50%;
 border:2px solid #ffffff80;
 background:linear-gradient(135deg,#12a77c,#006e65);
 color:white;
 font-size:25px;
 display:grid;
 place-items:center;
 pointer-events:auto;
 box-shadow:0 5px 25px #0008;
}
.watermark{
 position:absolute;
 z-index:4;
 pointer-events:none;
 color:white;
 opacity:.35;
 font-size:clamp(10px,2vw,17px);
 font-weight:800;
 text-shadow:0 1px 4px #000;
 white-space:nowrap;
}
.player-controls{
 position:absolute;
 right:0;
 left:0;
 bottom:0;
 z-index:6;
 padding:25px 15px 12px;
 background:linear-gradient(transparent,#000d);
 color:white;
 transition:.3s;
}
.player-controls.hide{
 opacity:0;
 visibility:hidden;
 transform:translateY(15px);
 pointer-events:none;
}
.progress-container{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:9px;
}
.player-range{
 width:100%;
 height:5px;
 accent-color:#16c48c;
 cursor:pointer;
}
.time-label{
 color:#e5e7eb;
 font-size:10px;
 white-space:nowrap;
 direction:ltr;
}
.controls-row{
 display:flex;
 align-items:center;
 gap:8px;
}
.control-btn{
 border:0;
 background:transparent;
 color:white;
 width:32px;
 height:32px;
 display:grid;
 place-items:center;
 font-size:17px;
 flex-shrink:0;
}
.control-btn:hover{color:#28d5a0}
.control-spacer{flex:1}
.player-volume{width:70px;accent-color:#20c997}
.player-select{
 background:#ffffff18;
 color:white;
 border:1px solid #ffffff40;
 border-radius:7px;
 padding:5px;
 font-size:11px;
}
.player-select option{color:#142f50;background:white}

/* الجودة */
.quality-inside{position:relative}
.quality-trigger{
 width:35px;
 height:35px;
 border:0;
 border-radius:50%;
 background:transparent;
 color:white;
 font-size:18px;
}
.quality-trigger:hover,
.quality-trigger.active{
 background:#00886655;
 color:#35e5b0;
}
.quality-popup{
 display:none;
 position:absolute;
 bottom:calc(100% + 15px);
 right:0;
 width:220px;
 max-width:calc(100vw - 35px);
 padding:10px;
 background:rgba(8,23,37,.97);
 border:1px solid #ffffff25;
 border-radius:16px;
 box-shadow:0 15px 40px #0009;
 color:white;
 direction:rtl;
 text-align:right;
 z-index:30;
}
.quality-popup.open{display:block}
.quality-title{
 padding:10px 8px 13px;
 border-bottom:1px solid #ffffff20;
 margin-bottom:6px;
 font-size:13px;
 font-weight:900;
}
.quality-title i{color:#30dfa9;margin-left:8px}
.quality-option{
 width:100%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:11px;
 border:0;
 border-radius:10px;
 background:transparent;
 color:#e5edf4;
 text-align:right;
 font-size:12px;
 font-weight:800;
}
.quality-option:hover{background:#ffffff16}
.quality-option.active{
 background:#00886645;
 color:#41e8b5;
}
.quality-check{color:#41e8b5}
.quality-badge{
 background:#008866;
 color:white;
 border-radius:5px;
 font-size:9px;
 padding:2px 6px;
}
.quality-hint{
 padding:9px 7px 4px;
 font-size:10px;
 color:#9cabb9;
}
.earth-player.quality-open .player-controls{
 opacity:1!important;
 visibility:visible!important;
 transform:none!important;
 pointer-events:auto!important;
}

/* الأزرار */
.video-actions{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin-bottom:18px;
}
.primary-btn,.secondary-btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 padding:11px 15px;
 border-radius:10px;
 font-size:12px;
 font-weight:800;
 border:0;
}
.primary-btn{
 background:linear-gradient(110deg,#008866,#006e65);
 color:white;
}
.secondary-btn{
 background:white;
 border:1px solid #dce8ef;
 color:#34536c;
}
.action-btn{flex:1;min-width:130px}
.action-btn.on{
 background:#e2f6ec;
 border-color:#a6dec2;
 color:#087a57;
}

/* أقسام المحاضرة تحت بعضها */
.lesson-sections{
 display:flex;
 flex-direction:column;
 gap:16px;
}
.lesson-section{
 background:white;
 border:1px solid var(--border);
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 5px 18px #12375b08;
}
.lesson-section[open]{border-color:#a7dcc9}
.section-header{
 padding:19px 20px;
 cursor:pointer;
 font-size:15px;
 font-weight:900;
 list-style:none;
 display:flex;
 align-items:center;
 gap:10px;
}
.section-header::-webkit-details-marker{display:none}
.section-header i{color:var(--green)}
.section-header:after{
 content:"\f078";
 font-family:"Font Awesome 6 Free";
 font-weight:900;
 margin-right:auto;
 color:var(--green);
 font-size:12px;
}
.lesson-section[open]>.section-header:after{
 transform:rotate(180deg);
}
.section-content{
 border-top:1px solid #edf1f6;
 padding:16px;
 font-size:12px;
 line-height:2;
 color:#435a72;
 overflow-wrap:anywhere;
}
.section-content p{white-space:pre-wrap}
.resource-card,.assessment-card{
 background:#f9fcfb;
 border:1px solid #e1eee8;
 border-radius:12px;
 padding:15px;
 margin:10px 0;
}
.resource-card strong,
.assessment-card strong{
 display:block;
 margin-bottom:9px;
}

/* قارئ المذكرات */
.reader-shell{
 margin:14px 0;
 border:1px solid #cbd5e1;
 border-radius:14px;
 background:#e9eef2;
 overflow:hidden;
}
.reader-head{
 padding:13px;
 background:#07375b;
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.reader-head button{flex-shrink:0}
.reader-pages{
 max-height:72vh;
 overflow-y:auto;
 padding:12px;
 text-align:center;
}
.reader-pages canvas{
 display:block;
 max-width:100%;
 height:auto;
 margin:0 auto 14px;
 box-shadow:0 3px 16px #0002;
 background:white;
}

/* الاختبارات */
.quiz-panel{
 background:#f8fcfa;
 border:1px solid #cfe7dd;
 border-radius:14px;
 padding:18px;
 margin-top:12px;
}
.quiz-choice{
 display:flex;
 align-items:center;
 gap:12px;
 width:100%;
 background:white;
 border:2px solid #e1e8ef;
 border-radius:11px;
 padding:13px;
 text-align:right;
 color:var(--text);
 margin:9px 0;
 font-size:13px;
}
.quiz-choice.selected{
 background:#e8f8f1;
 border-color:var(--green);
}
.quiz-choice b{
 display:grid;
 place-items:center;
 width:30px;
 height:30px;
 border-radius:50%;
 background:#e8eef2;
 flex-shrink:0;
}
.quiz-choice.selected b{
 background:var(--green);
 color:white;
}
.quiz-nav{
 display:flex;
 gap:10px;
 justify-content:space-between;
 margin-top:16px;
 flex-wrap:wrap;
}
.quiz-meter{
 height:7px;
 background:#e2e8f0;
 border-radius:10px;
 overflow:hidden;
 margin:13px 0;
}
.quiz-meter span{
 display:block;
 height:100%;
 background:var(--green);
}
.quiz-photo{
 max-width:100%;
 max-height:280px;
 object-fit:contain;
 border-radius:10px;
 margin:10px auto;
 display:block;
}
.quiz-review{
 border-right:4px solid var(--green);
 padding:13px;
 margin:10px 0;
 background:white;
 border-radius:9px;
}
.quiz-warning{
 padding:12px;
 background:#eff6ff;
 border-radius:10px;
 color:#1e40af;
 margin:12px 0;
}
.loading,.empty{
 background:white;
 border:1px solid var(--border);
 border-radius:15px;
 padding:25px;
 text-align:center;
 color:var(--muted);
 font-size:13px;
 line-height:2;
}
.mobile-bottom{display:none}

@media(max-width:1100px){
 .months-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .main{padding:22px}
}
@media(max-width:768px){
 .sidebar{display:flex;width:272px;max-width:86vw;right:0;transform:translateX(100%);box-shadow:none}
 .sidebar.collapsed{width:272px}
 body.mobile-sidebar-open .sidebar{transform:translateX(0);box-shadow:-12px 0 35px #061b2b35}
 .sidebar-overlay{display:block;position:fixed;inset:0;background:#07182780;z-index:990;opacity:0;visibility:hidden;transition:.25s}
 body.mobile-sidebar-open .sidebar-overlay{opacity:1;visibility:visible}
 .sidebar.collapsed .brand-text,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:initial}
 .sidebar.collapsed .brand-logo-wrap{width:83px;height:83px}
 .sidebar.collapsed .menu a{justify-content:flex-start;gap:14px;padding:12px 14px}
 .sidebar.collapsed .sidebar-top-actions{justify-content:flex-start}
 .sidebar.collapsed .sidebar-toggle i{transform:none}
 .mobile-sidebar-button{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border:0;border-radius:11px;background:#eaf5f1;color:#006e65;font-size:18px}
 .topbar{justify-content:flex-start}
 .topbar>i{margin-right:auto}
 .main,.main.expanded{
  margin-right:0;
  padding:14px 13px 95px;
 }
 .topbar{padding:15px}
 .topbar h1{font-size:18px}
 .topbar p{font-size:11px}
 .lecture-header{padding:12px}
 .lecture-thumb{width:75px}
 .lecture-info h3{font-size:13px}
 .lecture-body{padding:12px}
 .earth-player{border-radius:10px}
 .player-controls{padding:20px 8px 8px}
 .controls-row{gap:3px}
 .control-btn{width:29px;height:29px;font-size:14px}
 .player-volume{width:40px}
 .player-select{padding:3px;font-size:10px}
 .player-logo img{width:55px;height:55px}
 .center-play{width:60px;height:60px}
 .quality-trigger{width:29px;height:29px;font-size:15px}
 .quality-popup{width:195px;right:-34px}
 .mobile-bottom{
  display:flex;
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  background:white;
  border-top:1px solid #e6edf4;
  z-index:1500;
  justify-content:space-around;
  padding:8px 3px calc(8px + env(safe-area-inset-bottom));
 }
 .mobile-bottom a{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:9px;
  color:#6b7f98;
 }
 .mobile-bottom a.active{
  color:var(--green);
  font-weight:900;
 }
 .mobile-bottom i{font-size:19px}
}
@media(max-width:360px){
 .months-grid{grid-template-columns:1fr}
 .player-volume{display:none}
}

/* إظهار زر الجودة بوضوح داخل مشغل MP4، خاصة على الهاتف */
.quality-inside{display:flex!important;position:relative;flex:0 0 auto;z-index:20}
.quality-trigger{display:flex!important;align-items:center;justify-content:center;min-width:34px;width:34px!important;height:34px!important;background:#008866!important;color:#fff!important;border-radius:9px;font-size:17px!important}
.quality-popup{z-index:100}
.controls-row{display:flex;align-items:center;flex-wrap:nowrap;gap:3px;min-width:0}
@media(max-width:768px){
 .player-volume{display:none}
 .controls-row{gap:2px}
 .control-btn{width:26px;min-width:26px}
 .quality-trigger{width:32px!important;height:32px!important;min-width:32px}
}

/* بطاقة ترقية هادئة أسفل صورة الشهر */
.month-btn{cursor:pointer}
.month-upgrade{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:10px 11px;border:1px solid #d9e9e5;border-radius:11px;background:#f6faf9;text-align:right}
.month-upgrade .upgrade-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.month-upgrade .upgrade-text b{font-size:11px;color:#0a6558}
.month-upgrade .upgrade-text span{font-size:10px;color:#67837d}
.month-upgrade i{font-size:15px;color:#0b8d70}
.month-upgrade.unlocked{background:#effaf4;border-color:#c5e9d5}
.month-upgrade.unlocked .upgrade-text b{color:#137b4f}
.month-upgrade.upgrade-error{background:#fff8ee;border-color:#f1dec3}
.month-upgrade.upgrade-error .upgrade-text b{color:#98621d}

/* أدوات مساعدة */
function escapeHtml(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function safeUrl(value){
 try{
  const u=new URL(String(value||"").trim());
  return u.protocol==="https:"?u.href:"";
 }catch{
  return "";
 }
}

function showMessage(message){

 box.className="empty";
 box.textContent=message;
}

function formatTime(value){
 if(!Number.isFinite(value))return "0:00";
 const n=Math.max(0,Math.floor(value));
 const h=Math.floor(n/3600);
 const m=Math.floor((n%3600)/60);
 const s=n%60;
 return h
  ?h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
  :m+":"+String(s).padStart(2,"0");
}

/* روابط Supabase */
function storagePath(raw,bucket){
 const value=String(raw||"").trim();
 if(!value)return "";

 if(!/^https?:\/\//i.test(value)){
  let path=value.replace(/^\/+/,"");
  if(path.startsWith(bucket+"/"))path=path.slice(bucket.length+1);
  return path;
 }

 try{
  const parts=new URL(value).pathname.split("/").filter(Boolean);
  const objectIndex=parts.indexOf("object");
  if(objectIndex<0)return "";

  const after=parts.slice(objectIndex+1);
  if(["public","sign","authenticated"].includes(after[0]))after.shift();
  if(after[0]!==bucket)return "";
  after.shift();

  return after.map(part=>{
   try{return decodeURIComponent(part)}
   catch{return part}
  }).join("/");
 }catch{
  return "";
 }
}

async function resolveMedia(raw,bucket="lectures"){
 const value=String(raw||"").trim();
 if(!value)return "";

 if(/^https:\/\//i.test(value)){
  const url=safeUrl(value);
  if(!url)return "";

  if(!url.includes("/storage/v1/object/") ||
     url.includes("/storage/v1/object/public/")){
   return url;
  }

  if(url.includes("/storage/v1/object/sign/")){
   try{
    const u=new URL(url);
    if(u.searchParams.has("token"))return url;
   }catch{}
  }
 }

 const path=storagePath(value,bucket);
 if(!path)return "";

 const {data,error}=await supabaseClient.storage
  .from(bucket)
  .createSignedUrl(path,3600);

 if(error){
  console.warn("Media error:",error);
  return "";
 }

 return data?.signedUrl||"";
}

/* روابط المشغلات الخارجية */
function getEmbed(raw){
 try{
  const url=new URL(raw);
  const host=url.hostname.toLowerCase();
  const parts=url.pathname.split("/").filter(Boolean);

  if(host==="youtu.be"||host==="www.youtu.be"){
   const id=parts[0];
   if(/^[\w-]{11}$/.test(id||"")){
    return "https://www.youtube-nocookie.com/embed/"+id;
   }
  }

  if(["youtube.com","www.youtube.com","m.youtube.com"].includes(host)){
   const id=url.searchParams.get("v")||
    (["embed","shorts","live"].includes(parts[0])?parts[1]:"");

   if(/^[\w-]{11}$/.test(id||"")){
    return "https://www.youtube-nocookie.com/embed/"+id;
   }
  }

  if(host==="drive.google.com"){
   const i=parts.indexOf("d");
   const id=i>=0?parts[i+1]:url.searchParams.get("id");
   if(id&&/^[\w-]+$/.test(id)){
    return "https://drive.google.com/file/d/"+id+"/preview";
   }
  }

  if(host==="vimeo.com"||host==="www.vimeo.com"){
   const id=parts.find(p=>/^\d+$/.test(p));
   if(id)return "https://player.vimeo.com/video/"+id;
  }

  if(host==="www.loom.com"||host==="loom.com"){
   if(parts[0]==="share"&&/^[\w-]+$/.test(parts[1]||"")){
    return "https://www.loom.com/embed/"+parts[1];
   }
  }

  if(host==="canva.link"||host.endsWith(".canva.link")||
     host==="canva.com"||host.endsWith(".canva.com")){
   return safeUrl(raw);
  }

  return "";
 }catch{
  return "";
 }
}

/* استخراج جودات الفيديو */
function getQualities(lecture){
 const list=[];
 const used=new Set();

 const fields=[
  [1080,["video_1080_url","quality_1080_url","video_url_1080"]],
  [720,["video_720_url","quality_720_url","video_url_720"]],
  [480,["video_480_url","quality_480_url","video_url_480"]],
  [360,["video_360_url","quality_360_url","video_url_360"]]
 ];

 for(const [height,keys] of fields){
  for(const key of keys){
   const src=lecture[key];
   if(typeof src==="string"&&src.trim()){
    list.push({label:height+"p",height,src:src.trim()});
    used.add(height);
    break;
   }
  }
 }

 let extra=lecture.qualities;
 if(typeof extra==="string"){
  try{extra=JSON.parse(extra)}catch{extra=null}
 }

 if(extra&&typeof extra==="object"){
  const entries=Array.isArray(extra)
   ?extra.map(q=>[String(q.label||q.quality||""),q.url||q.src])
   :Object.entries(extra);

  for(const [key,src] of entries){
   const match=key.match(/(1080|720|480|360)/);
   if(match&&typeof src==="string"&&src.trim()){
    const height=Number(match[1]);
    if(!used.has(height)){
     list.push({label:height+"p",height,src:src.trim()});
     used.add(height);
    }
   }
  }
 }

 const original=lecture.video_url||lecture.video_path||lecture.videoUrl||lecture.url;
 if(typeof original==="string"&&original.trim()&&
    !list.some(q=>q.src===original.trim())){
  list.push({label:"الجودة الأصلية",height:0,src:original.trim()});
 }

 return list.sort((a,b)=>b.height-a.height);
}

async function updateProgress(index,field){
 const lecture=currentList[index];
 if(!lecture||!window.ArdProgress)return;

 const id=String(lecture.id);
 const row=progress.get(id)||{};
 const next=!row[field];

 try{
  if(field==="saved"&&typeof ArdProgress.setSaved==="function"){
   await ArdProgress.setSaved(id,next);
  }else if(field==="completed"&&typeof ArdProgress.setCompleted==="function"){
   await ArdProgress.setCompleted(id,next);
  }else{
   return;
  }

  progress.set(id,{...row,[field]:next});
  refreshActions(index);
 }catch(error){
  console.error(error);
  alert("تعذر حفظ تقدم المحاضرة.");
 }
}

/* مشغل الفيديو */
async function buildPlayer(index){
 const lecture=currentList[index];
 const box=$("video-container-"+index);
 if(!lecture||!box)return;

 players.get(index)?.destroy?.();
 players.delete(index);

 const qualities=getQualities(lecture);

 if(!qualities.length){
  box.innerHTML='<div class="player-loading">لم يتم إضافة فيديو لهذه المحاضرة بعد.</div>';
  return;
 }

 // جرّب رابط الفيديو الأصلي أولًا، ثم روابط الجودات البديلة.
 // اختيار أعلى جودة مباشرة قد يفشل على بعض الهواتف.
 const preferred=[...qualities].sort((a,b)=>{
  const original=String(lecture.video_url||lecture.video_path||lecture.videoUrl||lecture.url||"").trim();
  return Number(b.src===original)-Number(a.src===original);
 });
 let currentSourceIndex=0;
 let initialUrl="";
 for(let i=0;i<preferred.length;i++){
  const candidate=preferred[i];
  const embed=getEmbed(candidate.src);
  if(embed){
   box.innerHTML=`<iframe src="${escapeHtml(embed)}" title="فيديو المحاضرة"
    allow="autoplay;fullscreen;picture-in-picture;encrypted-media" allowfullscreen></iframe>
    <div class="watermark">${escapeHtml(viewerLabel)}</div>`;
   return;
  }
  initialUrl=await resolveMedia(candidate.src);
  if(initialUrl){currentSourceIndex=i;break}
 }
 if(!box.isConnected)return;
 if(!initialUrl){
  box.innerHTML='<div class="player-loading">تعذر الوصول إلى روابط الفيديو. تحقق من صلاحيات الملف أو رابط الاستضافة.</div>';

    <button type="button" class="control-btn" id="back-${index}" title="رجوع 10 ثوان">

 function showControls(){

 function renderQualities(){

  qualities.forEach((quality,i)=>{
   const button=document.createElement("button");
   button.type="button";
   button.className="quality-option"+(i===currentQuality?" active":"");
   button.disabled=changing;

   const label=document.createElement("span");
   label.textContent=quality.label;

   const badge=document.createElement("span");
   if(i===currentQuality){
    badge.className="quality-check";
    badge.textContent="✓";
   }else if(quality.height>=720){
    badge.className="quality-badge";
    badge.textContent=quality.height>=1080?"FHD":"HD";
   }

   button.append(label,badge);

   button.addEventListener("click",async()=>{
    if(changing)return;
    if(i===currentQuality){closeQuality();return}

    changing=true;
    renderQualities();

    try{
     const nextEmbed=getEmbed(quality.src);
     if(nextEmbed){
      const currentTime=video.currentTime;
      box.innerHTML=`

      players.delete(index);
      return;
     }

     const url=await resolveMedia(quality.src);
     if(!url)throw Error("رابط الجودة غير متاح");

     restore={
      time:video.currentTime,
      playing:!video.paused,
      speed:video.playbackRate
     };

     currentQuality=i;
     currentSourceIndex=preferred.findIndex(q=>q.src===quality.src);
     video.src=url;
     video.load();
     closeQuality();
    }catch(error){
     console.error(error);
     alert("تعذر تغيير جودة الفيديو.");

 trigger.addEventListener("click",event=>{

  tryingFallback=false;

    code===3?"تعذر فك ترميز الفيديو على هذا الجهاز":

   loading.textContent=reason+". تأكد من الرابط وصلاحيات المشاهدة.";
   console.error("فشلت كل مصادر الفيديو للمحاضرة",lecture.id);
  }
 });

/* المذكرات */
function getOldHandouts(lecture){
 let list=lecture.handouts;

 if(typeof list==="string"){
  try{list=JSON.parse(list)}catch{list=[]}
 }

 const result=Array.isArray(list)
  ?list.filter(item=>item&&(item.url||item.file_path))
   .map(item=>({
    title:item.title||"مذكرة المحاضرة",
    url:item.url||item.file_path
   }))
  :[];

 if(lecture.pdf_url&&!result.some(x=>x.url===lecture.pdf_url)){
  result.push({title:"مذكرة المحاضرة",url:lecture.pdf_url});
 }

 return result;
}

async function loadHandouts(lecture){
 const key=String(lecture.id);
 if(resourcesCache.has(key))return resourcesCache.get(key);

 const old=getOldHandouts(lecture);
 let fresh=[];

 const {data,error}=await supabaseClient
  .from("lecture_resources")
  .select("id,title,file_path")
  .eq("lecture_id",lecture.id);

 if(!error){
  fresh=(data||[]).filter(x=>x.file_path).map(x=>({
   title:x.title||"مذكرة المحاضرة",
   url:x.file_path
  }));
 }else{
  console.warn("lecture_resources:",error.message);
 }

 const seen=new Set();
 const combined=[...fresh,...old].filter(item=>{
  const url=String(item.url||"");
  if(!url||seen.has(url))return false;
  seen.add(url);
  return true;
 });

 resourcesCache.set(key,combined);
 return combined;
}

async function resolveHandout(raw){
 const value=String(raw||"").trim();
 if(!value)return "";

 if(/^https:\/\//i.test(value)){
  const url=safeUrl(value);
  if(!url)return "";

  if(!url.includes("/storage/v1/object/")||
     url.includes("/storage/v1/object/public/")){
   return url;
  }

  if(url.includes("/storage/v1/object/sign/")){
   try{
    if(new URL(url).searchParams.has("token"))return url;
   }catch{}
  }
 }

 for(const bucket of ["lectures","handouts"]){
  const path=storagePath(value,bucket);
  if(!path)continue;

  const {data,error}=await supabaseClient.storage
   .from(bucket)
   .createSignedUrl(path,1800);

  if(!error&&data?.signedUrl)return data.signedUrl;
 }

 return "";
}

 if(!lecture||!box)return;

 box.innerHTML=items.map((item,n)=>`

    <i class="fa-solid fa-book-open-reader"></i>
    قراءة المذكرة
   </button>
  </div>
 `).join("")+`<div id="handout-viewer-${index}" style="display:none"></div>`;

 box.querySelectorAll("[data-open-pdf]").forEach(button=>{

function closeLecturePdf(index){
 const state=pdfReaders.get(index);
 if(state){
  state.cancelled=true;
  try{state.task?.destroy()}catch{}
  pdfReaders.delete(index);
 }

 const box=$("handout-viewer-"+index);
 if(box){
  box.innerHTML="";
  box.style.display="none";
  box.dataset.opened="";
 }
}

async function openLecturePdf(index,number){
 const lecture=currentList[index];
 if(!lecture)return;

 const items=await loadHandouts(lecture);
 const item=items[number];
 const box=$("handout-viewer-"+index);

 if(!item||!box)return;

 if(box.dataset.opened===String(number)){
  closeLecturePdf(index);
  return;
 }

 closeLecturePdf(index);

 box.style.display="block";
 box.dataset.opened=String(number);

 box.innerHTML=`
  <div class="reader-shell">
   <div class="reader-head">
    <strong><i class="fa-solid fa-book-open"></i> ${escapeHtml(item.title)}</strong>
    <button type="button" class="secondary-btn" id="close-pdf-${index}">
     <i class="fa-solid fa-xmark"></i> إغلاق
    </button>
   </div>
   <div class="reader-pages" id="reader-pages-${index}">
    <div class="loading">جارٍ تحميل المذكرة...</div>
   </div>
  </div>
 `;

 $("close-pdf-"+index).addEventListener("click",()=>closeLecturePdf(index));

 const pages=$("reader-pages-"+index);

 if(!window.pdfjsLib){
  pages.innerHTML='<div class="empty">قارئ PDF غير متاح.</div>';
  return;
 }

 try{
  const url=await resolveHandout(item.url);
  if(!url)throw Error("رابط المذكرة غير متاح");

  const task=pdfjsLib.getDocument({url});
  const state={task,cancelled:false};
  pdfReaders.set(index,state);

  const pdf=await task.promise;
  if(state.cancelled)return;

  pages.innerHTML="";

  for(let n=1;n<=pdf.numPages;n++){
   if(state.cancelled)break;

   const page=await pdf.getPage(n);
   const viewport1=page.getViewport({scale:1});
   const width=Math.max(200,pages.clientWidth-24);
   const scale=Math.min(2,width/viewport1.width);
   const viewport=page.getViewport({scale});

   const canvas=document.createElement("canvas");
   canvas.width=Math.ceil(viewport.width);
   canvas.height=Math.ceil(viewport.height);
   canvas.setAttribute("aria-label","صفحة "+n);

   pages.appendChild(canvas);

   await page.render({
    canvasContext:canvas.getContext("2d"),
    viewport
   }).promise;
  }
 }catch(error){
  if(box.dataset.opened===String(number)){
   console.error(error);
   pages.innerHTML=`
    <div class="empty">
     تعذر عرض المذكرة.
     تأكد أن الرابط يشير إلى ملف PDF ويسمح بفتحه من المنصة.
    </div>
   `;
  }
 }
}

async function submitAssessment(id){
 const session=quizSessions.get(String(id));
 const panel=$("assessment-panel-"+id);

 if(!session||!panel||session.submitting||session.finished)return;

 const total=session.questions.length;
 const answered=session.questions.filter(
  q=>session.answers[String(q.id)]
 ).length;

 if(!confirm(
  answered<total
   ?`أجبت عن ${answered} من ${total} سؤال. هل تريد التسليم؟`
   :"هل أنت متأكد من تسليم إجاباتك؟"
 ))return;

 session.submitting=true;

 const answers=session.questions.map(q=>({
  question_id:q.id,
  selected_answer:session.answers[String(q.id)]||null
 }));

 panel.innerHTML='<div class="loading">جارٍ تصحيح الإجابات...</div>';

 try{
  const {data,error}=await supabaseClient.rpc(
   "submit_lecture_assessment",{
    p_assessment_id:id,
    p_answers:answers
   }
  );

  if(error)throw error;

  const result=Array.isArray(data)?data[0]:data;
  if(!result)throw Error("لم يتم إرجاع نتيجة");

  session.finished=true;
  renderAssessmentResult(id,result);

 }catch(error){
  console.error(error);
  session.submitting=false;

  panel.innerHTML=`
   <div class="quiz-warning">
    تعذر تسليم الاختبار. تأكد من إعداد دالة التصحيح في Supabase.
   </div>
   <button type="button" class="primary-btn" id="retry-${escapeHtml(id)}">
    إعادة المحاولة
   </button>
  `;

  $("retry-"+id)?.addEventListener("click",()=>submitAssessment(id));
 }
}

function renderAssessmentResult(id,result){
 const panel=$("assessment-panel-"+id);
 if(!panel)return;

 const score=Number(result.score??0);
 const max=Number(result.max_score??0);
 const percent=max>0?Math.round(score*100/max):0;
 const review=Array.isArray(result.review)?result.review:[];

 panel.innerHTML=`
  <div class="quiz-panel">
   <div style="text-align:center;padding:20px 10px">
    <i class="fa-solid fa-circle-check"
     style="font-size:42px;color:#008866"></i>
    <h2 style="color:#004e4d">تم تسليم الاختبار</h2>
    <p>نتيجتك</p>
    <div style="font-size:35px;font-weight:900;color:#008866">
     ${escapeHtml(score)} / ${escapeHtml(max)}
    </div>
    <strong>النسبة المئوية: ${escapeHtml(percent)}%</strong>
   </div>

   ${review.length?`
    <h3>مراجعة الإجابات</h3>
    ${review.map((item,n)=>`
     <div class="quiz-review">
      <strong>السؤال ${n+1}</strong>
      <p>${escapeHtml(item.question_text||"")}</p>
      <p>إجابتك: <b>${escapeHtml(item.selected_answer||"لم تتم الإجابة")}</b></p>
      <p>الإجابة الصحيحة:
       <b style="color:#008866">${escapeHtml(item.correct_answer||"")}</b>
      </p>
      ${item.explanation?`
       <p><strong>التفسير:</strong> ${escapeHtml(item.explanation)}</p>
      `:""}
     </div>
    `).join("")}
   `:""}
  </div>
 `;
}

/* تحميل المحتويات الإضافية */
async function loadLectureExtras(index){
 await Promise.allSettled([
  renderHandouts(index),
  renderAssessments(index)
 ]);
}

/* تنظيف المشغلات */
function destroyPlayers(){
 for(const player of players.values()){
  try{player.destroy?.()}catch{}
 }
 players.clear();
}

function destroyPdfReaders(){
 for(const index of [...pdfReaders.keys()]){
  closeLecturePdf(index);
 }
}

/* الشهور */
async function loadMonths(){
 const grid=$("monthsGrid");
 grid.innerHTML='<div class="loading">جارٍ تحميل الشهور...</div>';

 const {data,error}=await supabaseClient
  .from("lecture_months")
  .select("*")
  .order("sort_order",{ascending:true});

 if(error){
  console.error(error);
  grid.innerHTML='<div class="empty">تعذر تحميل الشهور.</div>';
  return;
 }

 visibleMonths=(data||[]).filter(month=>
  month.is_visible!==false&&month.visible!==false
 );

 renderMonths();

 if(visibleMonths.length){
  await selectMonth(visibleMonths[0].id);
 }else{
  $("lecturesList").innerHTML=
   '<div class="empty">لا توجد شهور متاحة حاليًا.</div>';
 }
}

function renderMonths(){
 const grid=$("monthsGrid");
 $("monthsTitle").style.display=visibleMonths.length?"block":"none";

 grid.innerHTML=visibleMonths.map(month=>{
  const active=String(selectedMonth)===String(month.id);
  const image=safeUrl(
   month.cover_url||month.image_url||month.cover_path||""
  );

  const status=getMonthStatus(month);
  return `
   <button type="button"
    class="month-btn ${active?"active":""}"
    data-month-id="${escapeHtml(month.id)}">

    ${image?`
     <img src="${escapeHtml(image)}"
      alt="${escapeHtml(month.title||"الشهر")}" loading="lazy">
    `:""}

    <strong>
     <i class="fa-regular fa-calendar" style="color:#008866"></i>
     ${escapeHtml(month.title||"شهر دراسي")}
    </strong>

    <small>اضغط لعرض المحاضرات</small>
    <div class="month-upgrade ${status.type}">
     <span class="upgrade-text"><b>${status.title}</b><span>${status.detail}</span></span>
     <i class="fa-solid ${status.icon}" aria-hidden="true"></i>
    </div>
   </button>
  `;
 }).join("");

 grid.querySelectorAll("[data-month-id]").forEach(button=>{
  button.addEventListener("click",()=>{
   selectMonth(button.dataset.monthId);
  });
 });
}

async function selectMonth(id){
 selectedMonth=id;
 renderMonths();

 const month=visibleMonths.find(x=>String(x.id)===String(id));

 $("monthHeading").style.display="block";
 $("selectedMonthTitle").textContent=month?.title||"محاضرات الشهر";
 $("selectedMonthDescription").textContent=
  month?.description||"اختر المحاضرة التي تريد مشاهدتها.";

 await loadLectures(id);
}

/* المحاضرات */
async function loadLectures(monthId){
 const request=++monthRequest;
 const box=$("lecturesList");

 destroyPlayers();
 destroyPdfReaders();
 quizSessions.clear();

 box.innerHTML='<div class="loading">جارٍ تحميل المحاضرات...</div>';

 const {data,error}=await supabaseClient
  .from("lectures")
  .select("*")
  .eq("month_id",monthId)
  .order("created_at",{ascending:true});

 if(request!==monthRequest)return;

 if(error){
  console.error(error);
  box.innerHTML=`
   <div class="empty">
    تعذر تحميل المحاضرات. تحقق من إعدادات جدول lectures.
   </div>
  `;
  return;
 }

 currentList=data||[];
 renderLectures();
}

function renderLectures(){
 const box=$("lecturesList");
 const activeMonth=visibleMonths.find(m=>String(m.id)===String(selectedMonth));
 const unlocked=canOpenMonth(activeMonth);

 if(!currentList.length){
  box.innerHTML='<div class="empty">لا توجد محاضرات لهذا الشهر بعد.</div>';
  return;
 }

 box.innerHTML=currentList.map((lecture,index)=>{
  const title=escapeHtml(lecture.title||"محاضرة الأحياء");
  const description=escapeHtml(
   lecture.description||"شرح المحاضرة ومحتوياتها التعليمية."
  );
  const image=safeUrl(
   lecture.cover_url||lecture.thumbnail_url||lecture.image_url||""
  );
  const row=progress.get(String(lecture.id))||{};

  return `
   <article class="lecture-card" id="lecture-${index}">
    <div class="lecture-header" data-open="${index}"
     role="button" tabindex="0" aria-expanded="false">

     ${image?`
      <img class="lecture-thumb" src="${escapeHtml(image)}"
       alt="${title}" loading="lazy">
     `:`
      <div class="lecture-thumb lecture-placeholder">
       <i class="fa-regular fa-circle-play"></i>
      </div>
     `}

     <div class="lecture-info">
      <h3>${title}</h3>
      <p>${unlocked?"اضغط لعرض الفيديو ومحتويات المحاضرة":"<i class='fa-solid fa-lock'></i> تتطلب اشتراكًا لفتح المحتوى"}</p>
     </div>

     <i class="fa-solid fa-chevron-down lecture-arrow"
      id="lecture-arrow-${index}"></i>
    </div>

    <div class="lecture-body" id="lecture-body-${index}">
     ${unlocked?`<div class="earth-player" id="video-container-${index}"></div>`:lockedLectureHTML()}
     ${unlocked?`

     <div class="video-actions">
      <button type="button" class="secondary-btn action-btn ${row.saved?"on":""}"
       id="save-${index}" data-save="${index}">
       ${row.saved?"★ تمت الإضافة للمحفوظات":"☆ حفظ المحاضرة"}
      </button>

      <button type="button" class="secondary-btn action-btn ${row.completed?"on":""}"
       id="done-${index}" data-done="${index}">
       ${row.completed?"✓ تمت المشاهدة":"✓ تحديد كمكتملة"}
      </button>
     </div>

     <div class="lesson-sections">

      <details class="lesson-section" open>
       <summary class="section-header">
        <i class="fa-solid fa-align-right"></i>
        تفاصيل المحاضرة
       </summary>
       <div class="section-content">
        <p>${description}</p>
       </div>
      </details>

      <details class="lesson-section">
       <summary class="section-header">
        <i class="fa-solid fa-book-open"></i>
        مذكرات المحاضرة
       </summary>
       <div class="section-content">
        <div id="handouts-list-${index}">
         <div class="loading">جارٍ تحميل المذكرات...</div>
        </div>
       </div>
      </details>

      <details class="lesson-section">
       <summary class="section-header">
        <i class="fa-solid fa-pen-to-square"></i>
        واجب المحاضرة
       </summary>
       <div class="section-content">
        <div id="homework-${index}">
         <div class="loading">جارٍ تحميل الواجب...</div>
        </div>
       </div>
      </details>

      <details class="lesson-section">
       <summary class="section-header">
        <i class="fa-solid fa-clipboard-check"></i>
        امتحان المحاضرة
       </summary>
       <div class="section-content">
        <div id="exam-${index}">
         <div class="loading">جارٍ تحميل الامتحان...</div>
        </div>
       </div>
      </details>

     </div>`:""}
    </div>
   </article>
  `;
 }).join("");

 box.querySelectorAll("[data-open]").forEach(header=>{
  const index=Number(header.dataset.open);

  header.addEventListener("click",()=>toggleLecture(index));

  header.addEventListener("keydown",event=>{
   if(event.key==="Enter"||event.key===" "){
    event.preventDefault();
    toggleLecture(index);
   }
  });
 });

 box.querySelectorAll("[data-save]").forEach(button=>{
  button.addEventListener("click",()=>{
   updateProgress(Number(button.dataset.save),"saved");
  });
 });

 box.querySelectorAll("[data-done]").forEach(button=>{
  button.addEventListener("click",()=>{
   updateProgress(Number(button.dataset.done),"completed");
  });
 });

 if(currentList.length)toggleLecture(0);
}

async function toggleLecture(index){
 const body=$("lecture-body-"+index);
 const arrow=$("lecture-arrow-"+index);
 if(!body)return;

 const wasOpen=body.classList.contains("open");

 document.querySelectorAll(".lecture-body.open").forEach(item=>{
  if(item===body)return;

  item.classList.remove("open");

  const otherIndex=Number(item.id.replace("lecture-body-",""));
  const otherArrow=$("lecture-arrow-"+otherIndex);

  if(otherArrow)otherArrow.style.transform="";
  item.previousElementSibling?.setAttribute("aria-expanded","false");

  players.get(otherIndex)?.video?.pause();
 });

 if(wasOpen){
  body.classList.remove("open");
  if(arrow)arrow.style.transform="";
  body.previousElementSibling?.setAttribute("aria-expanded","false");
  players.get(index)?.video?.pause();
  return;
 }

 body.classList.add("open");
 if(arrow)arrow.style.transform="rotate(180deg)";
 body.previousElementSibling?.setAttribute("aria-expanded","true");

 const activeMonth=visibleMonths.find(m=>String(m.id)===String(selectedMonth));
 if(!canOpenMonth(activeMonth))return;
 if(!body.dataset.initialized){
  body.dataset.initialized="true";

  await Promise.allSettled([
   buildPlayer(index),
   loadLectureExtras(index)
  ]);
 }
}

/* بدء الصفحة */
async function initializePage(){
 try{
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)console.warn(error);

  if(!data?.session?.user){
   $("lecturesList").innerHTML=`
    <div class="empty">
     يجب تسجيل الدخول أولًا لمشاهدة المحاضرات.
     <br><br>
     <a href="../login/index.html" class="primary-btn">
      تسجيل الدخول
     </a>
    </div>
   `;
   return;
  }

  await loadViewer(data.session.user);
  await loadSubscriptionAccess(data.session.user);
  await loadProgress();
  await loadMonths();

 }catch(error){
  console.error(error);
  showMessage("حدث خطأ أثناء تحميل الصفحة. حاول تحديثها.");
 }
}

initializePage();
</script>
