<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 30px 40px;
    }

    .top-bar {
      background: white;
      padding: 22px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.04);
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }

    .top-bar h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
    }

    .lecture-card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(30,58,138,0.03);
    }

    .lecture-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .lecture-title h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .lecture-title p {
      font-size: 13px;
      opacity: 0.9;
    }

    .arrow-icon {
      font-size: 18px;
      transition: transform 0.3s;
    }

    .lecture-body {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s;
      background: #fafafa;
    }

    .lecture-body.open {
      padding: 20px 25px;
      max-height: 5000px;
      overflow: visible;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .dropdown-section {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .dropdown-header {
      padding: 12px 18px;
      font-weight: 700;
      color: #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: #f1f8e9;
    }

    .dropdown-content {
      padding: 15px 18px;
      background: white;
      border-top: 1px solid #c8e6c9;
      display: none;
    }

    .dropdown-content.open {
      display: block;
    }

    .btn-link {
      display: inline-block;
      background: #026857;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-link:hover {
      background: #014d40;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-right: 0;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="../logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>

      <nav class="menu">
        <a href="../index.html">🏠 الرئيسية</a>
        <a href="index.html" class="active">🎥 المحاضرات</a>
        <a href="../champion/index.html">🏆 بطل الفصل</a>
        <a href="../forum/index.html">💬 المنتدى</a>
        <a href="../account/index.html">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1>🎥 محاضرات منهج الأحياء</h1>
    </div>

    <div id="lecturesList">
      <div class="loading">جاري تحميل المحاضرات...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return "";

      try {
        const parsed = new URL(url);
        let videoId = "";

        if (parsed.hostname.includes("youtu.be")) {
          videoId = parsed.pathname.split("/").filter(Boolean)[0] || "";
        } else if (
          parsed.hostname.includes("youtube.com") ||
          parsed.hostname.includes("youtube-nocookie.com")
        ) {
          if (parsed.pathname === "/watch") {
            videoId = parsed.searchParams.get("v") || "";
          } else {
            const parts = parsed.pathname.split("/").filter(Boolean);

            if (["embed", "shorts", "live"].includes(parts[0])) {
              videoId = parts[1] || "";
            }
          }
        }

        if (videoId) {
          return "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId);
        }

        return url;
      } catch {
        return url;
      }
    }

    function isYoutubeUrl(url) {
      return /youtube\.com|youtu\.be|youtube-nocookie\.com/i.test(url || "");
    }

    function isDirectVideoUrl(url) {
      return /\.(mp4|webm|ogg|m4v)(?:$|[?#])/i.test(url || "");
    }

    async function resolveVideoUrl(rawUrl) {
      if (!rawUrl) return "";

      const url = String(rawUrl).trim();

      if (
        /^https?:\/\//i.test(url) ||
        url.startsWith("blob:")
      ) {
        return url;
      }

      /*
        لوحة الأدمن السابقة تحفظ الفيديو في Storage bucket
        اسمه lectures، وغالبًا يكون المسار videos/اسم-الملف.mp4
      */

      const possiblePaths = [
        url.replace(/^\/+/, ""),
        url.replace(/^videos\//, "")
      ];

      for (const path of possiblePaths) {
        const { data } = supabaseClient.storage
          .from("lectures")
          .getPublicUrl(path);

        if (data && data.publicUrl) {
          return data.publicUrl;
        }
      }

      return url;
    }

    function createVideoPlayer(url) {
      if (!url) {
        return `
          <div class="empty">
            لم يتم تحديد رابط الفيديو لهذه المحاضرة.
          </div>
        `;
      }

      if (isYoutubeUrl(url)) {
        const embedUrl = getYoutubeEmbedUrl(url);

        return `
          <iframe
            src="${escapeHtml(embedUrl)}"
            title="فيديو المحاضرة"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        `;
      }

      if (isDirectVideoUrl(url) || url.includes("/storage/v1/object/")) {
        return `
          <video controls playsinline preload="metadata">
            <source src="${escapeHtml(url)}">
            متصفحك لا يدعم عرض الفيديو.
          </video>
        `;
      }

      return `
        <div style="background:white;padding:20px;text-align:center;">
          <p style="margin-bottom:10px;">افتح رابط المحاضرة لمشاهدة الفيديو.</p>
          <a class="btn-link"
             href="${escapeHtml(url)}"
             target="_blank"
             rel="noopener noreferrer">
            ▶️ مشاهدة المحاضرة
          </a>
        </div>
      `;
    }

    function toggleLecture(index) {
      const body = document.getElementById(`body-${index}`);
      const arrow = document.getElementById(`arrow-${index}`);

      if (!body || !arrow) return;

      body.classList.toggle("open");

      arrow.style.transform = body.classList.contains("open")
        ? "rotate(180deg)"
        : "rotate(0deg)";
    }

    function toggleSub(headerElement) {
      const content = headerElement.nextElementSibling;

      if (content) {
        content.classList.toggle("open");
      }
    }

    function createOptionalSection(title, content) {
      return `
        <div class="dropdown-section">
          <div class="dropdown-header" onclick="toggleSub(this)">
            <span>${title}</span>
            <span>▼</span>
          </div>
          <div class="dropdown-content">
            ${content}
          </div>
        </div>
      `;
    }

    async function loadLectures() {
      const listDiv = document.getElementById("lecturesList");

      listDiv.innerHTML = `
        <div class="loading">جاري تحميل المحاضرات...</div>
      `;

      try {
        /*
          المصدر الصحيح حسب لوحة الأدمن:
          جدول lectures وليس جدول videos.
        */

        const { data, error } = await supabaseClient
          .from("lectures")
          .select("*")
          .order("created_at", { ascending: true });

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          listDiv.innerHTML = `
            <div class="empty">
              لا توجد محاضرات ظاهرة حالياً.
            </div>
          `;
          return;
        }

        listDiv.innerHTML = "";

        for (let index = 0; index < data.length; index++) {
          const lec = data[index];

          /*
            دعم أسماء الحقول الشائعة، مع الحفاظ على الحقول
            الأساسية التي تستخدمها لوحة الأدمن.
          */

          const title = lec.title || "محاضرة أحياء";
          const description = lec.description || "";
          const rawVideoUrl =
            lec.video_url ||
            lec.videoUrl ||
            lec.url ||
            "";

          const videoUrl = await resolveVideoUrl(rawVideoUrl);

          const chapter =
            lec.chapter ||
            lec.lesson ||
            "الباب التعليمي";

          const details =
            lec.details ||
            lec.content ||
            "لا توجد تفاصيل نصية إضافية.";

          const pdfUrl =
            lec.pdf_url ||
            lec.pdfUrl ||
            "";

          const homeworkUrl =
            lec.homework_url ||
            lec.homeworkUrl ||
            "";

          const card = document.createElement("div");
          card.className = "lecture-card";

          const videoHtml = createVideoPlayer(videoUrl);

          const detailsHtml = createOptionalSection(
            "📖 الشرح التفصيلي",
            `<p>${escapeHtml(details)}</p>`
          );

          const pdfHtml = createOptionalSection(
            "📚 مذكرة المحاضرة (PDF)",
            pdfUrl
              ? `<a href="${escapeHtml(pdfUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link">تحميل أو استعراض المذكرة 📄</a>`
              : `<p style="color:#64748b;">المذكرة غير متوفرة لهذه المحاضرة حالياً.</p>`
          );

          const homeworkHtml = createOptionalSection(
            "✏️ واجب المحاضرة",
            homeworkUrl
              ? `<a href="${escapeHtml(homeworkUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link">فتح الواجب / الامتحان 📝</a>`
              : `<p style="color:#64748b;">الواجب غير متوفر حالياً.</p>`
          );

          card.innerHTML = `
            <div class="lecture-header" onclick="toggleLecture(${index})">
              <div class="lecture-title">
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(chapter)}</p>
              </div>
              <div class="arrow-icon" id="arrow-${index}">▼</div>
            </div>

            <div class="lecture-body" id="body-${index}">
              <div class="video-container">
                ${videoHtml}
              </div>

              <p style="margin-bottom:15px;color:#475569;font-size:14px;">
                ${escapeHtml(description)}
              </p>

              ${detailsHtml}
              ${pdfHtml}
              ${homeworkHtml}
            </div>
          `;

          listDiv.appendChild(card);
        }

      } catch (err) {
        console.error("خطأ تحميل المحاضرات:", err);

        listDiv.innerHTML = `
          <div class="empty" style="color:#e74c3c;">
            تعذر تحميل المحاضرات من قاعدة البيانات.
            <br>
            <span style="font-size:13px;font-weight:400;">
              ${escapeHtml(err.message || "حدث خطأ غير معروف")}
            </span>
          </div>
        `;
      }
    }

    loadLectures();
  </script>

</body>
</html>
