<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:'Cairo',sans-serif
}
:root{
 --green:#008866;
 --dark:#004e4d;
 --blue:#07375b;
 --bg:#f4f7fb;
 --border:#e2eaf3;

body{

button{

a{

/* القائمة الجانبية */
.sidebar{

.sidebar.collapsed{

.sidebar-toggle{

.brand{

 padding-bottom:23px;

}
.brand img{

 height:75px;

}
.brand h2{

 font-weight:900

.menu{

.sidebar.collapsed .brand p,

.sidebar.collapsed .brand img{

.main{

.main.expanded{

.topbar{

 align-items:center;

.topbar h1{

/* الشهور */
.months-grid{

.month-btn{

.month-btn:hover{

}
.month-btn.active{

}
.month-btn img{

 margin-bottom:10px
}
.month-btn strong{

}
.month-btn small{

}
.month-heading{

.month-heading h2{

/* المحاضرات */
.lecture-card{

 border:1px solid var(--border);
 border-radius:16px;

 margin-bottom:17px;
 box-shadow:0 4px 18px #12375b07

.lecture-header{

 align-items:center;

 padding:15px 18px;

.lecture-header:hover{

}
.lecture-thumb{

 border-radius:11px
}
.lecture-info{

}
.lecture-body.open{

}

/* مشغل أرض الأحياء */
.earth-player{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 background:#07111d;
 border-radius:13px;
 overflow:hidden;
 margin-bottom:17px;
 direction:ltr;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
 touch-action:manipulation
}
.earth-player video,
.earth-player iframe{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:contain;
 border:0;
 background:#07111d
}
.earth-player video{
 pointer-events:none
}

/* شاشة التحميل */
.player-loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:12px;
 background:#07111d;
 color:white;
 z-index:5;
 font-size:12px
}
.player-loading.hidden{
 display:none
}
.spinner{
 width:38px;
 height:38px;
 border:3px solid #ffffff30;
 border-top-color:#20c997;
 border-radius:50%;
 animation:spin .8s linear infinite
}
@keyframes spin{
 to{transform:rotate(360deg)}
}

/* العلامة الرئيسية */
.player-center{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:3;
 pointer-events:none;
 transition:opacity .25s
}
.player-center.hidden{

 visibility:hidden
}
.player-logo{

 flex-direction:column;
 align-items:center;
 gap:13px;

}
.player-logo img{

 height:75px;
 object-fit:contain;
 filter:drop-shadow(0 4px 14px #0007)
}
.player-logo strong{
 font-size:16px;
 text-shadow:0 2px 8px #000
}
.center-play{

 height:75px;
 border-radius:50%;

 background:linear-gradient(135deg,#12a77c,#006e65);
 color:white;
 font-size:27px;

 place-items:center;
 box-shadow:0 5px 25px #0008;
 pointer-events:auto;
 cursor:pointer
}
.center-play:hover{

}

/* علامة الطالب */
.watermark{
 position:absolute;
 z-index:4;
 pointer-events:none;
 color:white;
 opacity:.35;
 font-size:clamp(10px,2vw,17px);
 font-weight:800;
 text-shadow:0 1px 4px black;
 white-space:nowrap
}

/* طبقة اللمس */
.player-touch{
 position:absolute;
 inset:0;
 z-index:2;
 background:transparent
}

/* شريط التحكم */
.player-controls{

 right:0;
 left:0;
 bottom:0;
 z-index:6;
 padding:25px 15px 12px;
 background:linear-gradient(transparent,#000d);
 color:white;
 opacity:1;
 visibility:visible;
 transform:translateY(0);
 transition:opacity .3s,transform .3s,visibility .3s
}
.player-controls.hide{
 opacity:0;
 visibility:hidden;
 transform:translateY(15px);
 pointer-events:none
}
.progress-container{

 align-items:center;
 gap:10px;
 margin-bottom:9px
}
.player-range{

 height:5px;

.time-label{

.loading,

 border-radius:15px;

@media(max-width:360px){

  grid-template-columns:1fr

</style>
</head>

function escapeHtml(value){
 return String(value ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function safeUrl(raw){
 try{
  const url = new URL(String(raw || "").trim());
  return url.protocol === "https:" ? url.href : "";
 }catch{
  return "";
 }
}

function showMessage(message){

/* القائمة الجانبية */
const sidebar = $("sidebar");
const main = $("main");

function setSidebar(collapsed){
 sidebar.classList.toggle("collapsed",collapsed);
 main.classList.toggle("expanded",collapsed);

 try{
  localStorage.setItem(
   "ardAlahyaaSidebarCollapsed",
   String(collapsed)
  );
 }catch{}
}

$("sidebarToggle").addEventListener("click",()=>{
 setSidebar(!sidebar.classList.contains("collapsed"));
});

try{

 );
}catch{}

if(window.ArdProgress){
 ArdProgress.init(supabaseClient);

/* بيانات الجودات */
function getQualities(lecture){
 const result = [];

 const fields = [
  ["video_1080_url","1080p",1080],
  ["quality_1080_url","1080p",1080],
  ["video_url_1080","1080p",1080],
  ["video_720_url","720p",720],
  ["quality_720_url","720p",720],
  ["video_url_720","720p",720],
  ["video_480_url","480p",480],
  ["quality_480_url","480p",480],
  ["video_url_480","480p",480],
  ["video_360_url","360p",360],
  ["quality_360_url","360p",360],
  ["video_url_360","360p",360]
 ];

 fields.forEach(([key,label,height])=>{
  const src = lecture[key];

  if(
   typeof src==="string" &&
   src.trim() &&
   !result.some(q=>q.height===height)
  ){
   result.push({
    label,
    height,
    src:src.trim()
   });
  }
 });

 let extra = lecture.qualities;

 if(typeof extra==="string"){
  try{
   extra=JSON.parse(extra);
  }catch{
   extra={};
  }
 }

 if(extra && typeof extra==="object"){
  Object.entries(extra).forEach(([key,src])=>{
   const match=key.match(/(1080|720|480|360)/);

   if(
    match &&
    typeof src==="string" &&
    src.trim()
   ){
    const height=Number(match[1]);

    if(!result.some(q=>q.height===height)){
     result.push({
      label:height+"p",
      height,
      src:src.trim()
     });
    }
   }
  });
 }

 if(!result.length){
  const src=
   lecture.video_url ||
   lecture.videoUrl ||
   lecture.url;

  if(src){
   result.push({
    label:"الجودة الأصلية",
    height:0,
    src:String(src)
   });
  }
 }

 return result.sort((a,b)=>b.height-a.height);
}

/* روابط الفيديو */
function youtubeEmbed(raw){
 try{
  const url=new URL(raw);
  let id="";

  if(url.hostname.includes("youtu.be")){
   id=url.pathname.split("/").filter(Boolean)[0]||"";
  }else if(url.pathname==="/watch"){
   id=url.searchParams.get("v")||"";
  }else{
   const parts=url.pathname.split("/").filter(Boolean);

   if(["embed","shorts","live"].includes(parts[0])){
    id=parts[1]||"";
   }
  }

  return id
   ?"https://www.youtube-nocookie.com/embed/"+
    encodeURIComponent(id)+"?rel=0&playsinline=1"
   :"";
 }catch{
  return "";
 }
}

function getEmbed(raw){
 const youtube=youtubeEmbed(raw);

 if(youtube)return youtube;

 try{
  const url=new URL(raw);
  const host=url.hostname.toLowerCase();
  const parts=url.pathname.split("/").filter(Boolean);

  if(host==="drive.google.com"){
   const id=
    parts[parts.indexOf("d")+1] ||
    url.searchParams.get("id");

   if(id){
    return "https://drive.google.com/file/d/"+
     encodeURIComponent(id)+"/preview";
   }
  }

  if(host==="vimeo.com" || host.endsWith(".vimeo.com")){
   const id=parts.find(x=>/^\d+$/.test(x));
   if(id)return "https://player.vimeo.com/video/"+id;
  }

  if(host==="loom.com" || host.endsWith(".loom.com")){
   if(["share","embed"].includes(parts[0])){
    return "https://www.loom.com/embed/"+
     encodeURIComponent(parts[1]||"");
   }
  }

  if(host==="dailymotion.com" || host.endsWith(".dailymotion.com")){
   const index=parts.indexOf("video");
   if(index>=0 && parts[index+1]){
    return "https://www.dailymotion.com/embed/video/"+
     parts[index+1].split("_")[0];
   }
  }

  if(
   host==="canva.com" ||
   host.endsWith(".canva.com") ||
   host==="canva.link" ||
   host.endsWith(".canva.link")
  ){
   return raw;
  }

  return "";
 }catch{
  return "";
 }
}

/* روابط التخزين */
function storagePath(raw,bucket){
 const value=String(raw||"").trim();

 if(!value)return "";

 if(!/^https?:\/\//i.test(value)){
  return value
   .replace(/^\/+/,"")
   .replace(new RegExp("^"+bucket+"/"),"");
 }

 try{
  const parts=new URL(value).pathname
   .split("/").filter(Boolean);

  const index=parts.indexOf("object");
  if(index<0)return "";

  const rest=
   ["public","sign","authenticated"].includes(parts[index+1])
    ?parts.slice(index+2)
    :parts.slice(index+1);

  if(rest[0]!==bucket)return "";

  return rest.slice(1).map(x=>{
   try{return decodeURIComponent(x);}
   catch{return x;}
  }).join("/");
 }catch{
  return "";
 }
}

async function resolveMedia(raw,bucket="lectures"){
 const value=String(raw||"").trim();

 if(!value)return "";

 if(/^https:\/\//i.test(value)){
  const url=safeUrl(value);

  if(
   url &&
   (
    url.includes("/storage/v1/object/public/") ||
    !url.includes("/storage/v1/object/")
   )
  ){
   return url;
  }
 }

 const path=storagePath(value,bucket);
 if(!path)return "";

 const {data,error}=await supabaseClient.storage
  .from(bucket)
  .createSignedUrl(path,3600);

 if(error){
  console.error(error);
  return "";
 }

 return data?.signedUrl||"";
}

/* الوقت */
function formatTime(seconds){
 if(!Number.isFinite(seconds))return "0:00";

 seconds=Math.max(0,Math.floor(seconds));

 const hours=Math.floor(seconds/3600);
 const minutes=Math.floor((seconds%3600)/60);
 const secs=seconds%60;

 if(hours){
  return hours+":"+
   String(minutes).padStart(2,"0")+":"+
   String(secs).padStart(2,"0");
 }

 return minutes+":"+String(secs).padStart(2,"0");
}

      class="primary-btn action-btn"
      id="save-${index}"
      onclick="toggleSaved(${index})">
      ☆ حفظ المحاضرة
     </button>

     <button type="button"
      class="secondary-btn action-btn"
      id="done-${index}"
      onclick="toggleCompleted(${index})">
      ✓ تحديد كمكتملة
     </button>

    </div>

    <h3 class="details-title">محتويات المحاضرة</h3>

    <div class="lesson-sections">

     ${section(
      "الشرح التفصيلي",
      "fa-regular fa-file-lines",
      "<p>"+escapeHtml(details)+"</p>",
      true
     )}

     ${section(
      "ملازم المحاضرة",
      "fa-solid fa-book-open",
      handouts
     )}

     ${section(
      "واجب المحاضرة",
      "fa-solid fa-pen",
      homework
     )}

     ${section(
      "امتحان المحاضرة",
      "fa-solid fa-clipboard-check",
      exam
     )}

    </div>
   </div>
  `;

  list.appendChild(card);

  const header=$("header-"+index);

  header.addEventListener("click",()=>{
   toggleLecture(index);
  });

  header.addEventListener("keydown",event=>{
   if(event.key==="Enter" || event.key===" "){
    event.preventDefault();
    toggleLecture(index);
   }
  });

  refreshActions(index);
 });
}

/* فتح المحاضرة */
async function toggleLecture(index){
 const body=$("body-"+index);
 const header=$("header-"+index);
 const arrow=$("arrow-"+index);

 if(!body)return;

 const opening=!body.classList.contains("open");

 body.classList.toggle("open",opening);
 header.setAttribute("aria-expanded",String(opening));

 arrow.style.transform=opening
  ?"rotate(180deg)"
  :"rotate(0deg)";

 if(opening){
  if(!players.has(index)){
   await buildPlayer(index);
  }

  body.scrollIntoView({
   behavior:"smooth",
   block:"nearest"
  });
 }else{
  const player=players.get(index);
  if(player)player.video.pause();
 }
}

/* تحميل بيانات المنصة */
async function loadLectures(){
 const list=$("lecturesList");

 list.innerHTML=
  '<div class="loading">جارٍ تحميل المحاضرات...</div>';

 try{
  const {data:months,error:monthsError}=
   await supabaseClient
    .from("lecture_months")
    .select("*")
    .eq("is_visible",true)
    .order("sort_order",{ascending:true});

  if(monthsError)throw monthsError;

  const {data:lectures,error:lecturesError}=
   await supabaseClient
    .from("lectures")
    .select("*")
    .order("created_at",{ascending:true});

  if(lecturesError)throw lecturesError;

  visibleMonths=months||[];

  const available=new Set(
   visibleMonths.map(x=>Number(x.month_number))
  );

  allLectures=(lectures||[]).filter(
   lecture=>available.has(monthNumber(lecture))
  );

  renderMonths();

  if(!visibleMonths.length){
   list.innerHTML=
    '<div class="empty">لا توجد شهور متاحة حاليًا.</div>';
   return;
  }

  selectMonth(Number(visibleMonths[0].month_number));

 }catch(error){
  console.error(error);

  list.innerHTML=
   '<div class="empty">تعذر تحميل المحاضرات: '+
   escapeHtml(error.message||"خطأ غير معروف")+
   '</div>';
 }
}

/* تشغيل الصفحة */
async function init(){
 try{
  const {data,error}=
   await supabaseClient.auth.getSession();

  if(error || !data?.session){
   $("lecturesList").innerHTML=`
    <div class="empty">
     سجّل الدخول لمشاهدة المحاضرات.
     <br>
     <a class="primary-btn" href="../login/index.html">
      تسجيل الدخول
     </a>
    </div>
   `;
   return;
  }

  await loadViewer(data.session.user);
  await loadProgress();
  await loadLectures();

 }catch(error){
  console.error(error);

  $("lecturesList").innerHTML=
   '<div class="empty">حدث خطأ أثناء فتح الصفحة.</div>';
 }
}

document.addEventListener("click",event=>{
 if(!event.target.closest(".quality-wrap")){
  document.querySelectorAll(".quality-menu").forEach(menu=>{
   menu.classList.remove("open");
  });
 }
});

init();
</script>
