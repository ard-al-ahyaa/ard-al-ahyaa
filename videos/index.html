<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover, .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 30px 40px;
    }

    .top-bar {
      background: white;
      padding: 22px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.04);
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }

    .top-bar h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
    }

    .videos-container {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.05);
      border: 1px solid #e2e8f0;
    }

    .section-title {
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .videos-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .video-card {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: white;
      overflow: hidden;
      padding: 15px;
    }

    .video-card h3 {
      color: #1e3a8a;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .video-card p {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      height: 170px;
      background: #000;
      border-radius: 8px;
    }

    .loading, .empty, .error {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 15px; }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="../logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../index.html">🏠 الرئيسية</a>
        <a href="index.html" class="active">🎥 المحاضرات</a>
        <a href="../notes/index.html">📚 المذكرات</a>
        <a href="../champion/index.html">🏆 بطل الفصل</a>
        <a href="../forum/index.html">💬 المنتدى</a>
        <a href="../account/index.html">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1>🎥 المحاضرات والدروس</h1>
    </div>

    <section class="videos-container">
      <h2 class="section-title">قائمة المحاضرات</h2>
      <div id="videosList" class="videos-list">
        <div class="loading">جاري تحميل المحاضرات...</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadVideos() {
      const listDiv = document.getElementById("videosList");
      try {
        // جلب الفيديوهات مباشرة من الجدول من غير شروط معقدة
        const { data, error } = await supabaseClient
          .from("videos")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          listDiv.innerHTML = `<div class="empty">لا توجد محاضرات مضافة حاليًا. ارفع فيديوهات من لوحة التحكم.</div>`;
          return;
        }

        listDiv.innerHTML = "";
        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "video-card";
          
          let videoSrc = item.video_url || item.file_path || "";
          
          card.innerHTML = `
            <h3>${item.title || "محاضرة بدون عنوان"}</h3>
            <p>${item.description || "شرح منهج الأحياء"}</p>
            <video controls src="${videoSrc}" preload="metadata"></video>
          `;
          listDiv.appendChild(card);
        });

      } catch (err) {
        console.error("Error:", err);
        listDiv.innerHTML = `<div class="error">تأكد من إنشاء جدول videos في Supabase. التفاصيل في الكونسول.</div>`;
      }
    }

    loadVideos();
  </script>

</body>
</html>
