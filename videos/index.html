<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحاضرات | منصة أرض الأحياء</title>
<meta name="description" content="محاضرات الأحياء للثانوية العامة في منصة أرض الأحياء.">
<meta name="theme-color" content="#026857">
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../progress.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
:root{--green:#026857;--green-dark:#014d40;--blue:#1e3a8a;--bg:#f0f4f8;--border:#e2e8f0;--text:#2c3e50;--muted:#64748b;--sidebar-width:270px;--sidebar-collapsed-width:82px}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}

/* الشريط الجانبي */
.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#026857 0%,#075e54 48%,#1e3a8a 100%);color:#fff;position:fixed;right:0;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;z-index:1000;overflow-x:hidden;overflow-y:auto;transition:width .25s ease}
.sidebar-top{padding:18px}
.sidebar-control{display:flex;justify-content:flex-start;margin-bottom:18px}
.sidebar-toggle{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.23);border-radius:11px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;flex-shrink:0;transition:background .2s,transform .2s}
.sidebar-toggle:hover{background:rgba(255,255,255,.23);transform:scale(1.04)}
.sidebar-toggle svg,.menu-icon svg,.top-icon svg,.mobile-bottom svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sidebar-toggle svg{width:20px;height:20px;stroke-width:2;transition:transform .25s}
.logo-box{display:flex;align-items:center;gap:13px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.16);min-width:0}
.logo-box img{width:49px;height:49px;object-fit:contain;border-radius:13px;background:#fff;padding:3px;flex-shrink:0}
.logo-text{min-width:0;overflow:hidden;white-space:nowrap}
.logo-box h2{font-size:17px;color:#fff;font-weight:900}
.logo-box p{font-size:11px;opacity:.8;margin-top:4px}
.menu-title{color:rgba(255,255,255,.62);font-size:10px;font-weight:700;padding:0 12px;margin-bottom:10px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:7px}
.menu a{text-decoration:none;color:#e2f1ee;padding:12px 13px;border-radius:11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;transition:background .2s,transform .2s;min-height:46px;white-space:nowrap}
.menu a:hover,.menu a.active{background:rgba(255,255,255,.17);color:#fff}
.menu a:hover{transform:translateX(-2px)}
.menu-icon{width:21px;height:21px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.menu-icon svg{width:20px;height:20px;stroke-width:1.8}
.menu-text{overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{margin:0 18px 20px;padding:14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:11px;line-height:2;color:rgba(255,255,255,.9);overflow:hidden}
body.sidebar-collapsed .sidebar{width:var(--sidebar-collapsed-width)}
body.sidebar-collapsed .sidebar-top{padding:18px 12px}
body.sidebar-collapsed .sidebar-control,body.sidebar-collapsed .logo-box{justify-content:center}
body.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
body.sidebar-collapsed .logo-text,body.sidebar-collapsed .menu-title,body.sidebar-collapsed .menu-text,body.sidebar-collapsed .sidebar-bottom{display:none}
body.sidebar-collapsed .menu a{justify-content:center;padding:12px 8px;gap:0}
body.sidebar-collapsed .menu a:hover{transform:none}
body.sidebar-collapsed .menu-icon{width:25px;height:25px}

/* المحتوى */
.main{margin-right:var(--sidebar-width);flex:1;min-width:0;padding:30px 35px;transition:margin-right .25s ease}
body.sidebar-collapsed .main{margin-right:var(--sidebar-collapsed-width)}
.top-bar{background:#fff;padding:22px 25px;border-radius:16px;box-shadow:0 4px 20px rgba(30,58,138,.04);margin-bottom:25px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
.top-bar h1{color:var(--blue);font-size:22px;font-weight:900}
.top-bar p{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.8}
.top-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);flex-shrink:0}
.top-icon svg{width:25px;height:25px;stroke-width:1.8}

/* الشهور */
.months-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:25px}
.month-button{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px;text-align:right;cursor:pointer;transition:.2s;color:var(--text);min-width:0}
.month-button:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 5px 15px rgba(2,104,87,.07)}
.month-button.active{color:#fff;background:linear-gradient(135deg,var(--green),var(--blue));border-color:transparent}
.month-cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;background:#e2e8f0}
.month-button-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.month-button strong{font-size:13px;font-weight:900}
.month-button small{color:var(--muted);font-size:11px}
.month-button.active small{color:rgba(255,255,255,.8)}
.month-number{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);font-weight:900;font-size:12px;flex-shrink:0}
.month-button.active .month-number{background:rgba(255,255,255,.18);color:#fff}
.month-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 17px;padding:17px 20px;background:#fff;border:1px solid var(--border);border-radius:13px}
.month-heading-info{display:flex;align-items:center;gap:13px;min-width:0}
.month-heading img{width:74px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex-shrink:0}
.month-heading h2{font-size:17px;font-weight:900;color:var(--blue)}
.month-heading p{margin-top:5px;font-size:11px;color:var(--muted)}
.month-badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:8px;background:#e8f5e9;color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}

/* المحاضرة */
.lecture-card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:20px;overflow:hidden;box-shadow:0 4px 15px rgba(30,58,138,.03)}
.lecture-header{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:14px 25px;display:flex;align-items:center;gap:14px;cursor:pointer}
.lecture-header:focus-visible,.dropdown-header:focus-visible{outline:3px solid #86efac;outline-offset:-3px}
.lecture-thumb{width:86px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:2px solid rgba(255,255,255,.35);flex-shrink:0;background:#1e3a8a}
.lecture-title{min-width:0;flex:1}
.lecture-title h3{font-size:17px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}
.lecture-title p{font-size:12px;opacity:.9;line-height:1.8;overflow-wrap:anywhere}
.arrow-icon{font-size:18px;transition:transform .3s;flex-shrink:0}
.lecture-body{padding:0;max-height:0;overflow:hidden;background:#fafafa}
.lecture-body.open{padding:20px 25px;max-height:none;overflow:visible}

/* مشغل الفيديو */
.video-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.video-container iframe,.video-container video{position:absolute;inset:0;width:100%;height:100%;border:none;object-fit:contain;background:#000}
.video-container:fullscreen,.video-container.pseudo-fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;margin:0;border-radius:0;z-index:99999}
.video-container:-webkit-full-screen{width:100vw;height:100vh;background:#000}
.player-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#fff;text-align:center;font-size:13px;line-height:2}
.watermark{position:absolute;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none;color:#fff;opacity:.4;font-weight:700;font-size:clamp(11px,2.2vw,18px);text-shadow:0 0 4px #000,0 0 2px #000;transition:top 1.4s ease,left 1.4s ease;direction:ltr;white-space:nowrap}
.exit-fs{display:none;position:absolute;top:12px;left:12px;z-index:6;border:0;border-radius:50%;width:38px;height:38px;background:rgba(0,0,0,.6);color:#fff;font-size:17px;cursor:pointer}
.pseudo-fs .exit-fs{display:block}
.player-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.quality-wrap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--green-dark)}
.quality-wrap[hidden]{display:none}
.quality-wrap select{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;font-weight:700;color:var(--text)}
.video-fullscreen-btn{flex:1;min-width:170px;padding:11px 15px;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.video-fullscreen-btn:hover{background:var(--green-dark)}
.video-fullscreen-btn:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.action-btn{flex:1;min-width:140px;padding:10px 12px;border:1px solid #c8e6c9;border-radius:9px;background:#fff;color:#2e7d32;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.action-btn.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
.action-btn:disabled{opacity:.6;cursor:wait}
.desc{margin-bottom:15px;color:#475569;font-size:14px;line-height:2;overflow-wrap:anywhere}
.dropdown-section{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:10px;margin-bottom:12px;overflow:hidden}
.dropdown-header{padding:12px 18px;font-weight:700;color:#2e7d32;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:#f1f8e9;font-size:13px}
.dropdown-content{padding:15px 18px;background:#fff;border-top:1px solid #c8e6c9;display:none;font-size:13px;line-height:2;overflow-wrap:anywhere}
.dropdown-content.open{display:block}
.handout-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #e2e8f0}
.handout-row:last-child{border:0}
.handout-row span{font-weight:600;min-width:0}
.btn-link{display:inline-block;background:#026857;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;border:0;cursor:pointer;white-space:nowrap}
.btn-link:hover{background:#014d40}
.muted{color:#64748b}
.loading,.empty{text-align:center;padding:30px;color:#64748b;font-weight:600;background:#fff;border-radius:14px;border:1px solid var(--border);font-size:13px;line-height:2;overflow-wrap:anywhere}
.empty-icon{display:block;margin-bottom:8px;font-size:27px}
.notice{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:15px;font-size:12px;line-height:2;margin-bottom:20px}
.notice a{font-weight:800;text-decoration:underline}
.mobile-bottom{display:none}

@media(max-width:1100px){.months-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px}}
@media(max-width:768px){
.sidebar{display:none}
.main,body.sidebar-collapsed .main{margin-right:0;padding:15px 15px 85px}
.top-bar{padding:17px;margin-bottom:18px}.top-bar h1{font-size:18px}.top-bar p{font-size:11px}
.top-icon{width:41px;height:41px}
.months-grid{gap:9px}.month-button{padding:12px}.month-button strong{font-size:12px}
.month-heading{padding:14px}.month-heading h2{font-size:15px}.month-heading img{width:56px}
.lecture-header{padding:12px 14px;gap:10px}.lecture-thumb{width:62px}
.lecture-title h3{font-size:15px}.lecture-title p{font-size:11px}
.lecture-body.open{padding:13px}
.video-container{border-radius:8px}
.mobile-bottom{display:flex;position:fixed;right:0;bottom:0;left:0;z-index:1500;background:#fff;box-shadow:0 -3px 18px rgba(0,0,0,.08);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:9px;flex:1;min-width:0;text-decoration:none}
.mobile-bottom a.active{color:var(--green);font-weight:900}
.mobile-bottom svg{width:21px;height:21px;stroke-width:1.8}}
@media(max-width:360px){.months-grid{grid-template-columns:1fr}.month-heading{align-items:flex-start}.month-badge{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
