<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover, .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 30px 40px;
    }

    .top-bar {
      background: white;
      padding: 22px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.04);
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }

    .top-bar h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
    }

    /* تصميم المحاضرات المنسدل */
    .lecture-card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(30,58,138,0.03);
    }

    .lecture-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .lecture-title h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .lecture-title p {
      font-size: 13px;
      opacity: 0.9;
    }

    .arrow-icon {
      font-size: 18px;
      transition: transform 0.3s;
    }

    .lecture-body {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s;
      background: #fafafa;
    }

    .lecture-body.open {
      padding: 20px 25px;
      max-height: 1000px;
    }

    .dropdown-section {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .dropdown-header {
      padding: 12px 18px;
      font-weight: 700;
      color: #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: #f1f8e9;
    }

    .dropdown-content {
      padding: 15px 18px;
      background: white;
      border-top: 1px solid #c8e6c9;
      display: none;
    }

    .dropdown-content.open {
      display: block;
    }

    .btn-link {
      display: inline-block;
      background: #026857;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-link:hover {
      background: #014d40;
    }

    video {
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      background: #000;
      margin-bottom: 15px;
    }

    .loading, .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 15px; }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="../logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../index.html">🏠 الرئيسية</a>
        <a href="index.html" class="active">🎥 المحاضرات</a>
        <a href="../champion/index.html">🏆 بطل الفصل</a>
        <a href="../forum/index.html">💬 المنتدى</a>
        <a href="../account/index.html">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1>🎥 محاضرات منهج الأحياء</h1>
    </div>

    <div id="lecturesList">
      <div class="loading">جاري تحميل المحاضرات...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadLectures() {
      const listDiv = document.getElementById("lecturesList");
      try {
        const { data, error } = await supabaseClient
          .from("videos")
          .select("*")
          .order("created_at", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          listDiv.innerHTML = `<div class="empty">لا توجد محاضرات مرفوعة حالياً.</div>`;
          return;
        }

        listDiv.innerHTML = "";
        data.forEach((lec, index) => {
          const card = document.createElement("div");
          card.className = "lecture-card";
          
          card.innerHTML = `
            <div class="lecture-header" onclick="toggleLecture(${index})">
              <div class="lecture-title">
                <h3>${escapeHtml(lec.title)}</h3>
                <p>${escapeHtml(lec.chapter || "الباب التعليمي")}</p>
              </div>
              <div class="arrow-icon" id="arrow-${index}">▼</div>
            </div>
            <div class="lecture-body" id="body-${index}">
              <video controls>
                <source src="${lec.video_url}" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
              </video>
              <p style="margin-bottom: 15px; color: #475569; font-size: 14px;">${escapeHtml(lec.description || "")}</p>

              <!-- الشرح -->
              <div class="dropdown-section">
                <div class="dropdown-header" onclick="toggleSub(this)">
                  <span>📖 الشرح التفصيلي</span>
                  <span>▼</span>
                </div>
                <div class="dropdown-content">
                  <p>${escapeHtml(lec.details || "لا توجد تفاصيل نصية إضافية.")}</p>
                </div>
              </div>

              <!-- المذكرة (PDF) -->
              <div class="dropdown-section">
                <div class="dropdown-header" onclick="toggleSub(this)">
                  <span>📚 مذكرة المحاضرة (PDF)</span>
                  <span>▼</span>
                </div>
                <div class="dropdown-content">
                  ${lec.pdf_url ? `<a href="\${lec.pdf_url}" target="_blank" class="btn-link">تحميل أو استعراض المذكرة 📄</a>` : '<p style="color:#64748b;">المذكرة غير متوفرة لهذه المحاضرة حالياً.</p>'}
                </div>
              </div>

              <!-- تسليم الواجب / الواجب -->
              <div class="dropdown-section">
                <div class="dropdown-header" onclick="toggleSub(this)">
                  <span>✏️ واجب المحاضرة</span>
                  <span>▼</span>
                </div>
                <div class="dropdown-content">
                  ${lec.homework_url ? `<a href="\${lec.homework_url}" target="_blank" class="btn-link">فتح الواجب / الامتحان 📝</a>` : '<p style="color:#64748b;">الواجب غير متوفر حالياً.</p>'}
                </div>
              </div>

            </div>
          `;
          listDiv.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        listDiv.innerHTML = `<div class="empty" style="color:#e74c3c;">تعذر تحميل المحاضرات: ${err.message}</div>`;
      }
    }

    function toggleLecture(index) {
      const body = document.getElementById(`body-${index}`);
      const arrow = document.getElementById(`arrow-${index}`);
      body.classList.toggle("open");
      arrow.style.transform = body.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
    }

    function toggleSub(headerElement) {
      const content = headerElement.nextElementSibling;
      content.classList.toggle("open");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadLectures();
  </script>

</body>

</html>
