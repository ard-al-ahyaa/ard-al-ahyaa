<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
:root{--green:#026857;--green-dark:#014d40;--blue:#1e3a8a;--bg:#f0f4f8;--border:#e2e8f0;--text:#2c3e50;--muted:#64748b;--sidebar-width:270px;--sidebar-collapsed-width:82px}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}
.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#026857 0%,#075e54 48%,#1e3a8a 100%);color:#fff;position:fixed;right:0;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;z-index:1000;overflow-x:hidden;overflow-y:auto;transition:width .25s}
.sidebar-top{padding:18px}.sidebar-control{display:flex;justify-content:flex-start;margin-bottom:18px}
.sidebar-toggle{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff3b;border-radius:11px;background:#ffffff1f;color:#fff;cursor:pointer}
.sidebar-toggle svg,.menu-icon svg,.mobile-bottom svg,.top-icon svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sidebar-toggle svg{width:20px;height:20px;stroke-width:2;transition:transform .25s}
.logo-box{display:flex;align-items:center;gap:13px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #ffffff29;min-width:0}
.logo-box img{width:49px;height:49px;object-fit:contain;border-radius:13px;background:#fff;padding:3px;flex-shrink:0}
.logo-text{min-width:0;overflow:hidden;white-space:nowrap}.logo-box h2{font-size:17px;font-weight:900}.logo-box p{font-size:11px;opacity:.8;margin-top:4px}
.menu-title{color:#ffffff9e;font-size:10px;font-weight:700;padding:0 12px;margin-bottom:10px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:7px}.menu a{text-decoration:none;color:#e2f1ee;padding:12px 13px;border-radius:11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;min-height:46px;white-space:nowrap;transition:.2s}
.menu a:hover,.menu a.active{background:#ffffff2b;color:#fff}.menu a:hover{transform:translateX(-2px)}
.menu-icon{width:21px;height:21px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}.menu-icon svg{width:20px;height:20px;stroke-width:1.8}.menu-text{overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{margin:0 18px 20px;padding:14px;border-radius:12px;background:#ffffff1a;font-size:11px;line-height:2;color:#ffffffe6;overflow:hidden}
body.sidebar-collapsed .sidebar{width:var(--sidebar-collapsed-width)}body.sidebar-collapsed .sidebar-top{padding:18px 12px}
body.sidebar-collapsed .sidebar-control,body.sidebar-collapsed .logo-box{justify-content:center}
body.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
body.sidebar-collapsed .logo-text,body.sidebar-collapsed .menu-title,body.sidebar-collapsed .menu-text,body.sidebar-collapsed .sidebar-bottom{display:none}
body.sidebar-collapsed .menu a{justify-content:center;padding:12px 8px;gap:0}body.sidebar-collapsed .menu a:hover{transform:none}
.main{margin-right:var(--sidebar-width);flex:1;min-width:0;padding:30px 35px;transition:margin-right .25s}
body.sidebar-collapsed .main{margin-right:var(--sidebar-collapsed-width)}
.top-bar{background:#fff;padding:22px 25px;border-radius:16px;box-shadow:0 4px 20px #1e3a8a0a;margin-bottom:25px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
.top-bar h1{color:var(--blue);font-size:22px;font-weight:900}.top-bar p{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.8}
.top-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);flex-shrink:0}.top-icon svg{width:25px;height:25px;stroke-width:1.8}
.months-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:25px}
.month-button{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px;text-align:right;cursor:pointer;transition:.2s;color:var(--text);min-width:0}
.month-button:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 5px 15px #02685712}
.month-button.active{color:#fff;background:linear-gradient(135deg,var(--green),var(--blue));border-color:transparent}
.month-cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;background:#e2e8f0}
.month-button-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.month-button strong{font-size:13px;font-weight:900}.month-button small{color:var(--muted);font-size:11px}.month-button.active small{color:#ffffffcc}
.month-number{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#e8f5e9;color:var(--green);font-weight:900;font-size:12px;flex-shrink:0}
.month-button.active .month-number{background:#ffffff2e;color:#fff}
.month-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 17px;padding:17px 20px;background:#fff;border:1px solid var(--border);border-radius:13px}
.month-heading-info{display:flex;align-items:center;gap:13px;min-width:0}.month-heading img{width:74px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex-shrink:0}
.month-heading h2{font-size:17px;font-weight:900;color:var(--blue)}.month-heading p{margin-top:5px;font-size:11px;color:var(--muted)}
.month-badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:8px;background:#e8f5e9;color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}
.lecture-card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:20px;overflow:hidden;box-shadow:0 4px 15px #1e3a8a08}
.lecture-header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:14px 25px;display:flex;align-items:center;gap:14px;cursor:pointer}
.lecture-header:focus-visible,.dropdown-header:focus-visible{outline:3px solid #86efac;outline-offset:-3px}
.lecture-thumb{width:86px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:2px solid #ffffff59;flex-shrink:0;background:#1e3a8a}
.lecture-title{min-width:0;flex:1}.lecture-title h3{font-size:17px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}.lecture-title p{font-size:12px;opacity:.9;line-height:1.8;overflow-wrap:anywhere}
.arrow-icon{font-size:18px;transition:transform .3s;flex-shrink:0}.lecture-body{padding:0;max-height:0;overflow:hidden;background:#fafafa}.lecture-body.open{padding:20px 25px;max-height:none;overflow:visible}
.video-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.video-container iframe,.video-container video{position:absolute;inset:0;width:100%;height:100%;border:none;object-fit:contain;background:#000}
.video-container video{z-index:1}
.custom-player-controls{position:absolute;z-index:8;right:0;left:0;bottom:0;padding:36px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.88));color:#fff;display:flex;flex-direction:column;gap:7px;direction:ltr;opacity:1;transition:opacity .2s}
.custom-player-controls button{font-family:'Cairo',sans-serif}
.custom-progress{width:100%;height:4px;accent-color:#18b981;cursor:pointer;margin:0}
.custom-controls-row{display:flex;align-items:center;gap:9px;min-height:34px}
.custom-control-btn{border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;min-width:30px;height:32px;border-radius:7px;font-size:20px;line-height:1}
.custom-control-btn:hover,.custom-control-btn:focus-visible{background:#ffffff26;outline:1px solid #ffffff65}
.custom-time{font:600 11px Arial,sans-serif;white-space:nowrap;direction:ltr;color:#f8fafc}
.custom-controls-spacer{flex:1}
.player-settings-wrap{position:relative;display:flex;align-items:center;gap:3px;direction:ltr}
.player-settings-wrap .quality-menu-wrap{display:inline-flex!important;position:relative}
.player-settings-wrap .quality-gear{width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:#fff;box-shadow:none;font-size:19px;padding:0}
.player-settings-wrap .quality-gear:hover,.player-settings-wrap .quality-gear:focus-visible{background:#ffffff26;border-color:transparent;outline:1px solid #ffffff65}
.player-settings-wrap .quality-gear small{display:none}
.player-settings-wrap .quality-menu{bottom:calc(100% + 10px);right:0;left:auto}
.player-settings-wrap .dots-menu{display:none;position:absolute;right:0;bottom:calc(100% + 10px);width:150px;padding:6px;background:#fff;color:#1f2937;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 30px #0005;direction:rtl}
.player-settings-wrap .dots-menu.open{display:block}
.dots-menu button{display:flex;width:100%;padding:8px;border:0;border-radius:7px;background:#fff;color:#1f2937;text-align:right;font-size:12px;cursor:pointer}
.dots-menu button:hover{background:#f1f5f9}
.video-container.pseudo-fs .custom-player-controls{padding:45px 20px 18px}
.video-container:fullscreen .custom-player-controls{padding:45px 20px 18px}
@media(max-width:480px){.custom-player-controls{padding:28px 7px 7px;gap:5px}.custom-controls-row{gap:5px}.custom-time{font-size:10px}.custom-control-btn{min-width:27px}.player-settings-wrap .quality-menu{width:155px}}
.video-container:fullscreen,.video-container.pseudo-fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;margin:0;border-radius:0;z-index:99999}
.video-container:-webkit-full-screen{width:100vw;height:100vh;background:#000}
.player-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#fff;text-align:center;font-size:13px;line-height:2}
.watermark{position:absolute;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none;color:#fff;opacity:.4;font-weight:700;font-size:clamp(11px,2.2vw,18px);text-shadow:0 0 4px #000,0 0 2px #000;transition:top 1.4s,left 1.4s;direction:ltr;white-space:nowrap}
.exit-fs{display:none;position:absolute;top:12px;left:12px;z-index:6;border:0;border-radius:50%;width:38px;height:38px;background:#0009;color:#fff;font-size:17px;cursor:pointer}.pseudo-fs .exit-fs{display:block}
.player-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.quality-wrap{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--green-dark)}
.quality-wrap[hidden]{display:none!important}
.quality-select{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.quality-menu-wrap{position:relative}
.quality-gear{width:44px;height:44px;border:1px solid #dbe3ed;border-radius:11px;background:#fff;color:var(--green);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:20px;box-shadow:0 2px 7px #0f172a0a}
.quality-gear:hover,.quality-gear:focus-visible{background:#e8f5e9;border-color:#80cbc4;outline:2px solid #b2dfdb}
.quality-gear small{font-size:10px;font-weight:900}
.quality-menu{display:none;position:absolute;bottom:calc(100% + 8px);right:0;z-index:20;width:180px;padding:7px;background:#fff;border:1px solid #dbe3ed;border-radius:12px;box-shadow:0 10px 30px #0f172a24}
.quality-menu.open{display:block}
.quality-menu-title{padding:7px 10px 9px;font-size:11px;color:var(--muted);border-bottom:1px solid #eef2f7;margin-bottom:4px}
.quality-option{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border:0;border-radius:8px;background:#fff;color:var(--text);font-size:12px;text-align:right;cursor:pointer}
.quality-option:hover{background:#f1f8e9}.quality-option.active{color:var(--green);font-weight:900;background:#e8f5e9}
.quality-option:disabled{opacity:.5;cursor:not-allowed}
.video-fullscreen-btn{flex:1;min-width:170px;padding:11px 15px;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.video-fullscreen-btn:hover{background:var(--green-dark)}.video-fullscreen-btn:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.action-btn{flex:1;min-width:140px;padding:10px 12px;border:1px solid #c8e6c9;border-radius:9px;background:#fff;color:#2e7d32;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.action-btn.on{background:#2e7d32;color:#fff;border-color:#2e7d32}.action-btn:disabled{opacity:.6;cursor:wait}
.desc{margin-bottom:15px;color:#475569;font-size:14px;line-height:2;overflow-wrap:anywhere}
.dropdown-section{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:10px;margin-bottom:12px;overflow:hidden}
.dropdown-header{padding:12px 18px;font-weight:700;color:#2e7d32;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:#f1f8e9;font-size:13px}
.dropdown-content{padding:15px 18px;background:#fff;border-top:1px solid #c8e6c9;display:none;font-size:13px;line-height:2;overflow-wrap:anywhere}.dropdown-content.open{display:block}
.handout-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #e2e8f0}.handout-row:last-child{border:0}.handout-row span{font-weight:600;min-width:0}
.btn-link{display:inline-block;background:#026857;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;border:0;cursor:pointer;white-space:nowrap}.btn-link:hover{background:#014d40}
.muted{color:#64748b}.loading,.empty{text-align:center;padding:30px;color:#64748b;font-weight:600;background:#fff;border-radius:14px;border:1px solid var(--border);font-size:13px;line-height:2;overflow-wrap:anywhere}
.empty-icon{display:block;margin-bottom:8px;font-size:27px}.notice{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:15px;font-size:12px;line-height:2;margin-bottom:20px}.notice a{font-weight:800;text-decoration:underline}
.mobile-bottom{display:none}
@media(max-width:1100px){.months-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px}}
@media(max-width:768px){.sidebar{display:none}.main,body.sidebar-collapsed .main{margin-right:0;padding:15px 15px 85px}
.top-bar{padding:17px;margin-bottom:18px}.top-bar h1{font-size:18px}.top-bar p{font-size:11px}.top-icon{width:41px;height:41px}
.months-grid{gap:9px}.month-button{padding:12px}.month-button strong{font-size:12px}.month-heading{padding:14px}.month-heading h2{font-size:15px}.month-heading img{width:56px}
.lecture-header{padding:12px 14px;gap:10px}.lecture-thumb{width:62px}.lecture-title h3{font-size:15px}.lecture-title p{font-size:11px}.lecture-body.open{padding:13px}.video-container{border-radius:8px}
.mobile-bottom{display:flex;position:fixed;right:0;bottom:0;left:0;z-index:1500;background:#fff;box-shadow:0 -3px 18px #00000014;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:9px;flex:1;min-width:0;text-decoration:none}.mobile-bottom a.active{color:var(--green);font-weight:900}.mobile-bottom svg{width:21px;height:21px;stroke-width:1.8}}
@media(max-width:360px){.months-grid{grid-template-columns:1fr}.month-heading{align-items:flex-start}.month-badge{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}

function selectMonth(num){selectedMonth=num;document.querySelectorAll(".month-button").forEach(b=>b.classList.toggle("active",Number(b.dataset.month)===num));renderSelectedMonth()}
function renderMonths(){const grid=$("monthsGrid");grid.replaceChildren();if(!visibleMonths.length){grid.style.display="none";return}grid.style.display="grid";visibleMonths.forEach(month=>{const num=Number(month.month_number),count=allLectures.filter(l=>getMonthNumber(l)===num).length,img=safeHttps(month.image_url),b=document.createElement("button");b.type="button";b.className="month-button";b.dataset.month=String(num);b.innerHTML+(img?'<img class="month-cover" src="'+escapeHtml(img)+'" alt="" loading="lazy">':"");b.innerHTML=(img?'<img class="month-cover" src="'+escapeHtml(img)+'" alt="" loading="lazy">':"")+'<div class="month-button-top"><strong>'+escapeHtml(month.title)+'</strong><span class="month-number">'+num+"</span></div><small>"+count+" محاضرة</small>";b.addEventListener("click",()=>selectMonth(num));grid.appendChild(b)})}
function renderSelectedMonth(){const month=visibleMonths.find(m=>Number(m.month_number)===selectedMonth),heading=$("monthHeading"),list=$("lecturesList");if(!month){heading.style.display="none";list.innerHTML='<div class="empty"><span class="empty-icon">📚</span>اختر شهرًا لعرض محاضراته.</div>';return}currentList=allLectures.filter(l=>getMonthNumber(l)===selectedMonth);heading.style.display="flex";$("selectedMonthTitle").textContent=month.title;$("selectedMonthDescription").textContent="محاضرات الأحياء الخاصة بهذا الشهر.";$("lectureCountBadge").textContent=currentList.length+" محاضرة";const mImg=safeHttps(month.image_url),mEl=$("monthHeadingImg");mEl.style.display=mImg?"":"none";if(mImg)mEl.src=mImg;else mEl.removeAttribute("src");if(!currentList.length){list.innerHTML='<div class="empty"><span class="empty-icon">📚</span>لا توجد محاضرات مضافة لهذا الشهر حتى الآن.</div>';return}renderLectures(currentList)}
function renderLectures(lectures){const list=$("lecturesList");list.replaceChildren();const hasProgress=!!window.ArdProgress;lectures.forEach((lec,i)=>{const title=lec.title||"محاضرة أحياء",description=lec.description||"",details=lec.details||lec.content||"لا توجد تفاصيل نصية إضافية.",chapter=lec.chapter||lec.lesson||"",img=safeHttps(lec.image_url),card=document.createElement("div");card.className="lecture-card";card.innerHTML='<div class="lecture-header" role="button" tabindex="0" aria-expanded="false" onclick="toggleLecture('+i+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}">'+(img?'<img class="lecture-thumb" src="'+escapeHtml(img)+'" alt="" loading="lazy">':"")+'<div class="lecture-title"><h3>'+escapeHtml(title)+"</h3><p>"+escapeHtml(chapter||description)+'</p></div><div class="arrow-icon" id="arrow-'+i+'" aria-hidden="true">▼</div></div><div class="lecture-body" id="body-'+i+'"><div class="video-container" id="video-container-'+i+'"></div><div class="player-bar"><div class="quality-wrap quality-menu-wrap" id="quality-wrap-'+i+'" hidden><button type="button" class="quality-gear" id="quality-btn-'+i+'" aria-label="اختيار جودة الفيديو" onclick="const m=document.getElementById(\'quality-menu-'+i+'\');closeQualityMenus(m.id);m.classList.toggle(\'open\')">⚙️<small>الجودة</small></button><div class="quality-menu" id="quality-menu-'+i+'"></div></div><button type="button" class="video-fullscreen-btn" onclick="enterVideoFullscreen('+i+')">⛶ تكبير الفيديو لملء الشاشة</button></div>'+(hasProgress?'<div class="actions-row"><button type="button" class="action-btn" id="save-'+i+'" onclick="toggleSaved('+i+')">☆ حفظ المحاضرة</button><button type="button" class="action-btn" id="done-'+i+'" onclick="toggleCompleted('+i+')">تمت المشاهدة؟</button></div>':"")+'<p class="desc">'+escapeHtml(description)+"</p>"+section("📖 الشرح التفصيلي","<p>"+escapeHtml(details)+"</p>")+section("📚 ملازم المحاضرة",handoutsHtml(lec,i))+section("✍️ واجب المحاضرة",externalLink(lec.homework_url||lec.homeworkUrl,"فتح الواجب","لا يوجد واجب لهذه المحاضرة حاليًا."))+section("📝 امتحان المحاضرة",externalLink(lec.exam_url||lec.examUrl,"بدء الامتحان","لا يوجد امتحان لهذه المحاضرة حاليًا."))+"</div>";list.appendChild(card);if(hasProgress)refreshActions(i)})}
async function loadLectures(){const list=$("lecturesList");list.innerHTML='<div class="loading">جارٍ تحميل المحاضرات...</div>';hideNotice();try{const {data:months,error:mErr}=await supabaseClient.from(MONTHS_TABLE).select("*").eq("is_visible",true).order("sort_order",{ascending:true});if(mErr)throw new Error("تعذر قراءة جدول الشهور. "+mErr.message);const {data:lectures,error:lErr}=await supabaseClient.from(LECTURES_TABLE).select("*").order("created_at",{ascending:true});if(lErr)throw new Error("تعذر تحميل المحاضرات. "+lErr.message);visibleMonths=months||[];const visible=new Set(visibleMonths.map(m=>Number(m.month_number)));allLectures=(lectures||[]).filter(l=>visible.has(getMonthNumber(l)));renderMonths();if(!visibleMonths.length){list.innerHTML='<div class="empty"><span class="empty-icon">📅</span>لا توجد شهور متاحة حاليًا.<br>ستظهر الشهور هنا فور إضافتها.</div>';$("monthHeading").style.display="none";return}selectMonth(Number(visibleMonths[0].month_number))}catch(error){console.error("Lectures loading error:",error);list.replaceChildren();const box=document.createElement("div"),icon=document.createElement("span"),title=document.createElement("strong"),detail=document.createElement("p");box.className="empty";icon.className="empty-icon";icon.textContent="⚠️";title.textContent="تعذر تحميل أقسام المحاضرات";detail.style.cssText="margin-top:8px;font-weight:400";detail.textContent=error.message||"حدث خطأ غير معروف.";box.append(icon,title,detail);list.appendChild(box)}}
async function init(){const {data,error}=await supabaseClient.auth.getSession(),session=data&&data.session;if(error||!session){$("lecturesList").replaceChildren();showNotice('سجّل الدخول لمشاهدة المحاضرات. <a href="'+LOGIN_URL+'">تسجيل الدخول</a>');return}await loadViewer(session.user);await loadProgress();await loadLectures()}
supabaseClient.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")window.location.href=LOGIN_URL});
init();
</script>
</body>
