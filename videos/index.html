<style>
:root{

 --dark:#004e4d;
 --blue:#07375b;

*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif}

.brand{text-align:center;padding-bottom:23px;border-bottom:1px solid #ffffff20;margin-bottom:25px}
.brand img{width:75px;height:75px;object-fit:contain}

.menu{display:flex;flex-direction:column;gap:7px}

 background:#fff;border:1px solid var(--border);border-radius:17px;
 padding:21px 24px;margin-bottom:23px

.topbar h1{color:var(--dark);font-size:22px;font-weight:900}

.topbar>i{color:var(--green);font-size:27px}
.months-grid{

.month-btn{

.month-btn:hover{transform:translateY(-2px);border-color:var(--green)}

.month-btn img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:10px}
.month-btn strong{font-size:13px}
.month-btn small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.month-heading{
 background:#fff;border:1px solid var(--border);padding:15px 18px;

}
.month-heading h2{font-size:17px;color:var(--dark)}
.month-heading p{color:var(--muted);font-size:11px}
.lecture-card{

 overflow:hidden;margin-bottom:17px;box-shadow:0 4px 18px #12375b07
}
.lecture-header{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer}

.lecture-info{flex:1;min-width:0}

/* مشغل أرض الأحياء */
.earth-player{
 position:relative;width:100%;aspect-ratio:16/9;background:#07111d;
 border-radius:13px;overflow:hidden;margin-bottom:17px;direction:ltr;
 user-select:none;-webkit-user-select:none
}
.earth-player:fullscreen{border-radius:0}
.earth-player video,.earth-player iframe{
 position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
 border:0;background:#07111d
}
.earth-player video{pointer-events:none}
.player-touch{position:absolute;inset:0;z-index:2;background:transparent}
.player-loading{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;flex-direction:column;gap:12px;
 background:#07111d;color:white;z-index:5;font-size:12px;pointer-events:none
}
.player-loading.hidden{display:none}
.spinner{
 width:38px;height:38px;border:3px solid #ffffff30;
 border-top-color:#20c997;border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.player-center{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;z-index:3;pointer-events:none;transition:.25s
}
.player-center.hidden{opacity:0;visibility:hidden}
.player-logo{display:flex;flex-direction:column;align-items:center;gap:13px;color:#fff}
.player-logo img{width:75px;height:75px;object-fit:contain;filter:drop-shadow(0 4px 14px #0007)}
.player-logo strong{font-size:16px;text-shadow:0 2px 8px #000}
.center-play{
 width:75px;height:75px;border-radius:50%;border:2px solid #ffffff80;
 background:linear-gradient(135deg,#12a77c,#006e65);color:white;
 font-size:27px;display:grid;place-items:center;box-shadow:0 5px 25px #0008;
 pointer-events:auto
}
.center-play:hover{transform:scale(1.05)}
.watermark{
 position:absolute;z-index:4;pointer-events:none;color:#fff;opacity:.35;
 font-size:clamp(10px,2vw,17px);font-weight:800;
 text-shadow:0 1px 4px #000;white-space:nowrap
}
.player-controls{
 position:absolute;right:0;left:0;bottom:0;z-index:6;
 padding:25px 15px 12px;background:linear-gradient(transparent,#000d);
 color:#fff;opacity:1;visibility:visible;transform:translateY(0);
 transition:opacity .3s,transform .3s,visibility .3s
}
.player-controls.hide{
 opacity:0;visibility:hidden;transform:translateY(15px);pointer-events:none
}
.progress-container{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.player-range{width:100%;height:5px;accent-color:#16c48c;cursor:pointer}
.time-label{color:#e5e7eb;font-size:10px;white-space:nowrap;direction:ltr}
.controls-row{display:flex;align-items:center;gap:10px}
.control-btn{
 border:0;background:transparent;color:#fff;width:32px;height:32px;
 display:grid;place-items:center;font-size:17px;flex-shrink:0
}
.control-btn:hover,.control-btn.active{color:#28d5a0}
.control-spacer{flex:1}
.player-volume{width:70px;accent-color:#20c997}
.player-select{
 background:#ffffff18;color:white;border:1px solid #ffffff40;
 border-radius:7px;padding:5px;font-size:11px;cursor:pointer
}
.player-select option{color:#142f50;background:white}

/* قائمة الجودة الاحترافية داخل الفيديو */
.quality-inside{position:relative;display:flex;align-items:center}
.quality-trigger{
 position:relative;width:35px;height:35px;border:0;border-radius:50%;
 background:transparent;color:white;font-size:18px;
 display:grid;place-items:center;transition:.2s
}
.quality-trigger:hover,.quality-trigger.active{
 background:rgba(0,136,102,.35);color:#35e5b0
}
.quality-popup{
 display:none;position:absolute;bottom:calc(100% + 15px);right:0;
 width:220px;max-width:calc(100vw - 35px);padding:10px;
 background:rgba(8,23,37,.97);border:1px solid #ffffff25;
 border-radius:16px;box-shadow:0 15px 40px #0009;
 backdrop-filter:blur(14px);color:white;direction:rtl;text-align:right;
 z-index:30
}
.quality-popup.open{display:block;animation:qualityOpen .18s ease-out}
@keyframes qualityOpen{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:translateY(0)}
}

}
@media(max-width:360px){
 .months-grid{grid-template-columns:1fr}
 .player-volume{display:none}
}
</style>
</head>

function escapeHtml(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")

/* قراءة الجودات المتاحة */
function getQualities(lecture){
 const result=[];

 const fields=[
  ["video_1080_url","1080p",1080],
  ["quality_1080_url","1080p",1080],
  ["video_url_1080","1080p",1080],
  ["video_720_url","720p",720],
  ["quality_720_url","720p",720],
  ["video_url_720","720p",720],
  ["video_480_url","480p",480],
  ["quality_480_url","480p",480],
  ["video_url_480","480p",480],
  ["video_360_url","360p",360],
  ["quality_360_url","360p",360],
  ["video_url_360","360p",360]
 ];

 fields.forEach(([key,label,height])=>{
  const src=lecture[key];
  if(
   typeof src==="string" &&
   src.trim() &&
   !result.some(q=>q.height===height)
  ){
   result.push({label,height,src:src.trim()});
  }
 });

 let extra=lecture.qualities;

 if(typeof extra==="string"){
  try{extra=JSON.parse(extra);}
  catch{extra={};}
 }

 if(extra && typeof extra==="object"){
  Object.entries(extra).forEach(([key,src])=>{
   const match=key.match(/(1080|720|480|360)/);

   if(match && typeof src==="string" && src.trim()){
    const height=Number(match[1]);

    if(!result.some(q=>q.height===height)){
     result.push({
      label:height+"p",
      height,
      src:src.trim()
     });
    }
   }
  });
 }

 const original=
  lecture.video_url||
  lecture.videoUrl||
  lecture.url;

 if(original){
  const src=String(original).trim();

  if(!result.some(q=>q.src===src)){
   result.push({
    label:"الجودة الأصلية",
    height:0,
    src
   });
  }
 }

 return result.sort((a,b)=>b.height-a.height);
}

/* الفيديوهات الخارجية */
function youtubeEmbed(raw){
 try{
  const url=new URL(raw);
  let id="";

  if(url.hostname.includes("youtu.be")){
   id=url.pathname.split("/").filter(Boolean)[0]||"";
  }else if(url.pathname==="/watch"){
   id=url.searchParams.get("v")||"";
  }else{
   const parts=url.pathname.split("/").filter(Boolean);
   if(["embed","shorts","live"].includes(parts[0])){
    id=parts[1]||"";
   }
  }

  return id
   ?"https://www.youtube-nocookie.com/embed/"+
    encodeURIComponent(id)+"?rel=0&playsinline=1"
   :"";
 }catch{
  return "";
 }
}

function getEmbed(raw){
 const youtube=youtubeEmbed(raw);
 if(youtube)return youtube;

 try{
  const url=new URL(raw);
  const host=url.hostname.toLowerCase();
  const parts=url.pathname.split("/").filter(Boolean);

  if(host==="drive.google.com"){
   const id=
    parts[parts.indexOf("d")+1]||
    url.searchParams.get("id");

   if(id){
    return "https://drive.google.com/file/d/"+
     encodeURIComponent(id)+"/preview";
   }
  }

  if(host==="vimeo.com"||host.endsWith(".vimeo.com")){
   const id=parts.find(x=>/^\d+$/.test(x));
   if(id)return "https://player.vimeo.com/video/"+id;
  }

  if(host==="loom.com"||host.endsWith(".loom.com")){
   if(["share","embed"].includes(parts[0])){
    return "https://www.loom.com/embed/"+
     encodeURIComponent(parts[1]||"");
   }
  }

  if(host==="dailymotion.com"||host.endsWith(".dailymotion.com")){
   const i=parts.indexOf("video");
   if(i>=0&&parts[i+1]){
    return "https://www.dailymotion.com/embed/video/"+
     parts[i+1].split("_")[0];
   }
  }

  if(
   host==="canva.com"||
   host.endsWith(".canva.com")||
   host==="canva.link"||
   host.endsWith(".canva.link")
  ){
   return raw;
  }

  return "";
 }catch{
  return "";
 }
}

/* روابط التخزين */
function storagePath(raw,bucket){
 const value=String(raw||"").trim();
 if(!value)return "";

 if(!/^https?:\/\//i.test(value)){
  return value
   .replace(/^\/+/,"")
   .replace(new RegExp("^"+bucket+"/"),"");
 }

 try{
  const parts=new URL(value).pathname.split("/").filter(Boolean);
  const index=parts.indexOf("object");
  if(index<0)return "";

  const rest=
   ["public","sign","authenticated"].includes(parts[index+1])
   ?parts.slice(index+2)
   :parts.slice(index+1);

  if(rest[0]!==bucket)return "";

  return rest.slice(1).map(x=>{
   try{return decodeURIComponent(x);}
   catch{return x;}
  }).join("");
 }catch{
  return "";
 }
}

async function resolveMedia(raw,bucket="lectures"){
 const value=String(raw||"").trim();
 if(!value)return "";

 if(/^https:\/\//i.test(value)){
  const url=safeUrl(value);

  if(
   url &&
   (
    url.includes("/storage/v1/object/public/")||
    !url.includes("/storage/v1/object/")
   )
  ){
   return url;
  }
 }

 const path=storagePath(value,bucket);
 if(!path)return "";

 const {data,error}=await supabaseClient.storage
  .from(bucket)
  .createSignedUrl(path,3600);

 if(error){
  console.error(error);
  return "";
 }

 return data?.signedUrl||"";
}

function formatTime(seconds){
 if(!Number.isFinite(seconds))return "0:00";

 seconds=Math.max(0,Math.floor(seconds));

 const hours=Math.floor(seconds/3600);
 const minutes=Math.floor((seconds%3600)/60);
 const secs=seconds%60;

 if(hours){
  return hours+":"+
   String(minutes).padStart(2,"0")+":"+
   String(secs).padStart(2,"0");
 }

 return minutes+":"+String(secs).padStart(2,"0");
}

 const video=box.querySelector("video");
 const loading=$("loading-"+index);
 const center=$("center-"+index);
 const centerPlay=$("centerPlay-"+index);
 const controls=$("controls-"+index);
 const playButton=$("play-"+index);
 const seek=$("seek-"+index);
 const time=$("time-"+index);
 const volume=$("volume-"+index);
 const mute=$("mute-"+index);
 const speed=$("speed-"+index);
 const fullscreen=$("fullscreen-"+index);
 const touch=box.querySelector(".player-touch");

 const qualityInside=$("qualityInside-"+index);
 const qualityTrigger=$("qualityTrigger-"+index);
 const qualityPopup=$("qualityPopup-"+index);
 const qualityOptions=$("qualityOptions-"+index);

 let hideTimer=null;
 let loadingTimer=null;
 let destroyed=false;
 let currentQuality=0;
 let changingQuality=false;
 let pendingRestore=null;

 function isQualityOpen(){
  return qualityPopup.classList.contains("open");
 }

 function showControls(){
  if(destroyed)return;

  controls.classList.remove("hide");
  clearTimeout(hideTimer);

  if(!video.paused&&!video.ended&&!isQualityOpen()){
   hideTimer=setTimeout(()=>{
    if(
     !destroyed &&
     !video.paused &&
     !video.ended &&
     !isQualityOpen()
    ){
     controls.classList.add("hide");
    }
   },5000);
  }
 }

 function closeQuality(){
  qualityPopup.classList.remove("open");
  qualityTrigger.classList.remove("active");
  qualityTrigger.setAttribute("aria-expanded","false");
  box.classList.remove("quality-open");
  showControls();
 }

 function toggleQuality(){
  const opening=!isQualityOpen();

  if(opening){
   clearTimeout(hideTimer);
   controls.classList.remove("hide");
   qualityPopup.classList.add("open");
   qualityTrigger.classList.add("active");
   qualityTrigger.setAttribute("aria-expanded","true");
   box.classList.add("quality-open");
  }else{
   closeQuality();
  }
 }

 function renderQualityOptions(){
  qualityOptions.replaceChildren();

  qualities.forEach((quality,i)=>{
   const button=document.createElement("button");

   button.type="button";
   button.className=
    "quality-option"+(i===currentQuality?" active":"");

   button.disabled=changingQuality;

   const label=document.createElement("span");
   label.textContent=quality.label;

   const indicator=document.createElement("span");

   if(i===currentQuality){
    indicator.className="quality-check";
    indicator.textContent="✓";
   }else if(quality.height>=720){
    indicator.className="quality-badge";
    indicator.textContent=quality.height>=1080?"FHD":"HD";
   }

   button.append(label,indicator);

   button.addEventListener("click",async event=>{
    event.stopPropagation();

    if(changingQuality)return;

    if(i===currentQuality){
     closeQuality();
     return;
    }

    changingQuality=true;
    renderQualityOptions();

    try{
     const nextUrl=await resolveMedia(quality.src,"lectures");

     if(!nextUrl){
      throw new Error("تعذر تحميل رابط الجودة");
     }

     const oldTime=video.currentTime;
     const wasPlaying=!video.paused;
     const oldSpeed=video.playbackRate;

     pendingRestore={
      time:oldTime,
      playing:wasPlaying,
      speed:oldSpeed
     };

     currentQuality=i;

     video.src=nextUrl;
     video.load();

     closeQuality();
    }catch(error){
     console.error(error);
     alert("تعذر تغيير جودة الفيديو.");
    }finally{
     changingQuality=false;
     renderQualityOptions();
    }
   });

   qualityOptions.appendChild(button);
  });
 }

 qualityTrigger.addEventListener("click",event=>{

  toggleQuality();
 });

 qualityInside.addEventListener("click",event=>{

 $("back-"+index).addEventListener("click",()=>{

 });

 $("forward-"+index).addEventListener("click",()=>{
  if(Number.isFinite(video.duration)){
   video.currentTime=Math.min(
    video.duration,video.currentTime+10
   );
  }else{
   video.currentTime+=10;
  }
  showControls();
 });

 video.addEventListener("timeupdate",()=>{
  const duration=video.duration||0;

  if(Number.isFinite(duration)&&duration>0){
   seek.value=(video.currentTime/duration)*100;
  }

  time.textContent=
   formatTime(video.currentTime)+
   " / "+
   formatTime(video.duration);
 });

 seek.addEventListener("input",()=>{
  const duration=video.duration;

  if(Number.isFinite(duration)&&duration>0){
   video.currentTime=
    (Number(seek.value)/100)*duration;
  }

  showControls();
 });

 volume.addEventListener("input",()=>{
  video.volume=Number(volume.value);
  video.muted=video.volume===0;
  showControls();
 });

 mute.addEventListener("click",()=>{
  video.muted=!video.muted;

  mute.innerHTML=video.muted
   ?'<i class="fa-solid fa-volume-xmark"></i>'
   :'<i class="fa-solid fa-volume-high"></i>';

  showControls();
 });

 speed.addEventListener("change",()=>{
  video.playbackRate=Number(speed.value);
  showControls();
 });

 fullscreen.addEventListener("click",async()=>{
  try{
   if(document.fullscreenElement){
    await document.exitFullscreen();
   }else if(box.requestFullscreen){
    await box.requestFullscreen();
   }else if(video.webkitEnterFullscreen){
    video.webkitEnterFullscreen();
   }
  }catch(error){
   console.warn(error);
  }

  showControls();
 });

 video.addEventListener("loadstart",showLoading);

 video.addEventListener("loadedmetadata",()=>{
  hideLoading();

  if(pendingRestore){
   const restore=pendingRestore;
   pendingRestore=null;

   video.playbackRate=restore.speed;

   if(Number.isFinite(restore.time)){
    try{
     video.currentTime=
      Number.isFinite(video.duration)
      ?Math.min(restore.time,video.duration)
      :restore.time;
    }catch(error){
     console.warn(error);
    }
   }

   if(restore.playing){
    video.play().catch(console.warn);
   }
  }

  showControls();
 });

 video.addEventListener("loadeddata",hideLoading);
 video.addEventListener("canplay",hideLoading);
 video.addEventListener("waiting",showLoading);

 video.addEventListener("playing",()=>{
  hideLoading();
  updatePlayButton();
  showControls();
 });

 video.addEventListener("pause",()=>{
  updatePlayButton();
  showControls();
 });

 video.addEventListener("ended",()=>{

    '<span>تعذر تشغيل الفيديو. تحقق من الرابط والاتصال.</span>';
  }
 });

 video.addEventListener("contextmenu",event=>{
  event.preventDefault();
 });

 video.addEventListener("dragstart",event=>{
  event.preventDefault();
 });

 video.src=url;
 video.load();

 renderQualityOptions();

 players.set(index,{
  video,
  destroy(){
   destroyed=true;
   clearTimeout(hideTimer);
   clearTimeout(loadingTimer);
   video.pause();
   video.removeAttribute("src");
   video.load();
  }
 });

 showControls();
}

function getHandouts(lecture){
 let list=lecture.handouts;

 if(typeof list==="string"){
  try{list=JSON.parse(list);}
  catch{list=[];}

 list=Array.isArray(list)
  ?list.filter(x=>x&&x.url).map(x=>({
   title:String(x.title||"ملزمة المحاضرة"),
   url:String(x.url)
  }))
  :[];

 if(!list.length&&(lecture.pdf_url||lecture.pdfUrl)){
  list=[{
   title:"ملزمة المحاضرة",
   url:String(lecture.pdf_url||lecture.pdfUrl)
  }];
 }

 return list;
}

      handouts
     )}

     ${section(
      "واجب المحاضرة",
      "fa-solid fa-pen",
      homework
     )}

     ${section(
      "امتحان المحاضرة",
      "fa-solid fa-clipboard-check",
      exam
     )}
    </div>
   </div>
  `;

  list.appendChild(card);

  const header=$("header-"+index);

  header.addEventListener("click",()=>{
   toggleLecture(index);
  });

  header.addEventListener("keydown",event=>{
   if(event.key==="Enter"||event.key===" "){
    event.preventDefault();
    toggleLecture(index);
   }
  });

  refreshActions(index);
 });
}

/* فتح المحاضرة */
async function toggleLecture(index){
 const body=$("body-"+index);
 const header=$("header-"+index);
 const arrow=$("arrow-"+index);

 if(!body)return;

 const opening=!body.classList.contains("open");

 body.classList.toggle("open",opening);
 header.setAttribute("aria-expanded",String(opening));

 arrow.style.transform=opening
  ?"rotate(180deg)"
  :"rotate(0deg)";

 if(opening){
  if(!players.has(index)){
   await buildPlayer(index);
  }

  body.scrollIntoView({
   behavior:"smooth",
   block:"nearest"
  });
 }else{
  const player=players.get(index);
  if(player)player.video.pause();
 }
}

/* تحميل المحاضرات */
async function loadLectures(){
 const list=$("lecturesList");

 list.innerHTML=
  '<div class="loading">جارٍ تحميل المحاضرات...</div>';

 try{
  const {data:months,error:monthsError}=
   await supabaseClient
    .from("lecture_months")
    .select("*")
    .eq("is_visible",true)
    .order("sort_order",{ascending:true});

  if(monthsError)throw monthsError;

  const {data:lectures,error:lecturesError}=
   await supabaseClient
    .from("lectures")
    .select("*")
    .order("created_at",{ascending:true});

  if(lecturesError)throw lecturesError;

  visibleMonths=months||[];

  const available=new Set(
   visibleMonths.map(x=>Number(x.month_number))
  );

  allLectures=(lectures||[]).filter(
   lecture=>available.has(monthNumber(lecture))
  );

  renderMonths();

  if(!visibleMonths.length){
   list.innerHTML=
    '<div class="empty">لا توجد شهور متاحة حاليًا.</div>';
   return;
  }

  selectMonth(Number(visibleMonths[0].month_number));

 }catch(error){
  console.error(error);

  list.innerHTML=
   '<div class="empty">تعذر تحميل المحاضرات: '+
   escapeHtml(error.message||"خطأ غير معروف")+
   '</div>';
 }
}

/* تشغيل الصفحة */
async function init(){
 try{
  const {data,error}=
   await supabaseClient.auth.getSession();

  if(error||!data?.session){
   $("lecturesList").innerHTML=`
    <div class="empty">
     سجّل الدخول لمشاهدة المحاضرات.
     <br>
     <a class="primary-btn" href="../login/index.html">
      تسجيل الدخول
     </a>
    </div>
   `;
   return;
  }

  await loadViewer(data.session.user);
  await loadProgress();
  await loadLectures();

 }catch(error){
  console.error(error);

  $("lecturesList").innerHTML=
   '<div class="empty">حدث خطأ أثناء فتح الصفحة.</div>';
 }
}

init();
</script>
