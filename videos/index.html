<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحاضرات | منصة أرض الأحياء</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../progress.js"></script>

<style>
:root{--green:#008866;--dark:#004e4d;--bg:#f4f7fb;--border:#e4ecf3;--text:#142f50;--muted:#6b7f98}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
[hidden]{display:none!important}

/* ===== الشريط الجانبي ===== */
.sidebar{width:272px;background:linear-gradient(180deg,#004e4d 0%,#003d50 62%,#07375b 100%);color:#fff;position:fixed;right:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:1000;transition:width .25s,transform .25s;overflow:hidden}
.sidebar.collapsed{width:82px}
.sb-inner{padding:17px 15px;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-toggle{width:39px;height:39px;border-radius:50%;border:1px solid #ffffff26;background:#ffffff14;color:#fff;display:grid;place-items:center;margin-bottom:8px}
.sidebar.collapsed .sb-toggle i{transform:rotate(180deg)}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:27px;padding:0 5px 20px;border-bottom:1px solid #ffffff1f}
.brand img{width:83px;height:83px;object-fit:contain}
.brand h2{margin:0;font-size:22px;font-weight:900}
.brand p{margin:0;font-size:13px;color:#d2e8e5}
.menu-label{color:#ffffff88;font-size:10px;font-weight:700;padding:0 12px;margin:0 0 9px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{color:#f0f8f7;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:14px;min-height:51px;white-space:nowrap}
.menu a:hover,.menu a.active{background:linear-gradient(100deg,#13a77c,#159a77);color:#fff}
.menu i{width:25px;font-size:22px;text-align:center}
.menu span{overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .brand h2,.sidebar.collapsed .brand p,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:none}
.sidebar.collapsed .brand img{width:54px;height:54px}
.sidebar.collapsed .menu a{justify-content:center;gap:0;padding:13px 5px}
.overlay{display:none}

/* ===== المحتوى ===== */
.main{margin-right:272px;padding:26px 28px 60px;transition:margin-right .25s;min-width:0}
.main.expanded{margin-right:82px}
.hero{border-radius:22px;padding:26px 30px;color:#fff;background:linear-gradient(120deg,#004e4d,#006e65 45%,#07375b);box-shadow:0 18px 40px #004e4d33;display:flex;align-items:center;gap:14px}
.hero h1{margin:0;font-size:24px;font-weight:900}
.hero p{margin:6px 0 0;font-size:13px;color:#d2e8e5}
.mob-btn{display:none;width:40px;height:40px;border:0;border-radius:11px;background:#ffffff1f;color:#fff;font-size:18px;flex-shrink:0}
.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff4dc;color:#80580b;font-size:13px;line-height:1.8;display:none}
.notice.show{display:block}
.muted{color:var(--muted);font-size:13px}

/* ===== الكورسات ===== */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.course-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #12375b0d;display:flex;flex-direction:column}
.cover{aspect-ratio:16/9;background:linear-gradient(135deg,#008866,#07375b);display:grid;place-items:center;color:#fff;font-size:40px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.course-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.course-body h3{margin:0;font-size:17px;font-weight:900}
.course-body p{margin:0;font-size:12px;color:var(--muted);line-height:1.8;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:0;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(110deg,#008866,#006e65)}
.btn.ghost{background:#fff;color:#34536c;border:1px solid #dce8ef}
.btn.warn{background:linear-gradient(110deg,#e99510,#c77a05)}
.course-top{display:flex;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.course-top h2{margin:0;font-size:20px;font-weight:900;color:var(--dark)}

/* ===== المحاضرات ===== */
.lec{background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}
.lec-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border:0;text-align:right;font-weight:900;font-size:15px;color:var(--text)}
.lec-num{width:38px;height:38px;border-radius:12px;background:#e8f6f1;color:#0a6558;display:grid;place-items:center;flex-shrink:0}
.lec-head .chev{margin-right:auto;color:var(--green);transition:transform .2s}
.lec.open .lec-head .chev{transform:rotate(180deg)}
.lec-body{padding:0 14px 14px;border-top:1px solid #edf1f6}
.lec-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.sec{border:1px solid #e6eef5;border-radius:13px;margin-top:12px;overflow:hidden}
.sec-head{width:100%;padding:13px 14px;background:#f9fcfb;border:0;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--text)}
.sec-head .chev{margin-right:auto;color:var(--green);transition:transform .2s}
.sec.open .sec-head .chev{transform:rotate(180deg)}
.sec-head .lock{color:#98621d;font-size:12px}
.sec-body{display:none;padding:14px}
.sec.open .sec-body{display:block}

.item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;border:1px solid #e1eee8;border-radius:12px;margin-bottom:10px;background:#fff}
.item strong{font-size:13px}
.item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-ok{background:#e4f7ee;color:#08734f}
.b-bad{background:#ffeded;color:#b52b3c}
.b-todo{background:#edf5ff;color:#245a9d}
.lock-box{text-align:center;padding:22px;background:#f8fbfa;border:1px dashed #cfe3dc;border-radius:14px;color:#4f6b66;font-size:13px;line-height:1.9}
.lock-box i{font-size:26px;color:#0a8a6a;display:block;margin-bottom:8px}
.motiv{margin-top:10px;padding:11px 13px;background:linear-gradient(100deg,#fff7e6,#fffdf6);border-radius:12px;color:#8a5a00;font-weight:800;font-size:13px}

/* ===== مشغل الفيديو المطور ===== */
.player{
  position:relative;
  background:#07111d;
  border-radius:14px;
  overflow:hidden;
  aspect-ratio:16/9;
  direction:ltr;
  isolation:isolate;
}
.player video,.player iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.player video{
  object-fit:contain;
  background:#07111d;
}
.player:fullscreen{
  width:100vw;
  height:100vh;
  max-width:none;
  max-height:none;
  aspect-ratio:auto;
  border-radius:0;
  background:#000;
}
.player:fullscreen video{
  width:100%;
  height:100%;
  object-fit:contain;
}
.player:-webkit-full-screen{
  width:100%;
  height:100%;
  border-radius:0;
  background:#000;
}
.player:-webkit-full-screen video{
  width:100%;
  height:100%;
  object-fit:contain;
}
.player:fullscreen .wm,
.player:-webkit-full-screen .wm{
  bottom:85px;
}
.wm{
  position:absolute;
  bottom:55px;
  right:12px;
  color:#fff;
  opacity:.35;
  font-size:12px;
  font-weight:800;
  pointer-events:none;
  text-shadow:0 1px 3px #000;
  z-index:3;
}
.q-select{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  background:#102a3dcc;
  color:#fff;
  border:1px solid #ffffff45;
  border-radius:9px;
  padding:7px 10px;
  font-family:Cairo,sans-serif;
  font-size:12px;
  font-weight:800;
  outline:none;
  max-width:120px;
}
.q-select option{color:#142f50;background:#fff}
.player-controls{
  position:absolute;
  left:10px;
  bottom:9px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border-radius:12px;
  background:#071827d9;
  border:1px solid #ffffff24;
  backdrop-filter:blur(8px);
  direction:ltr;
}
.player-control-btn{
  width:35px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff25;
  border-radius:9px;
  background:#ffffff12;
  color:#fff;
  font-size:13px;
  transition:.2s;
}
.player-control-btn:hover{background:#008866}
.player-control-btn:active{transform:scale(.94)}
.speed-select{
  height:34px;
  min-width:72px;
  padding:0 7px;
  border-radius:9px;
  border:1px solid #ffffff25;
  background:#ffffff12;
  color:#fff;
  font-family:Cairo,sans-serif;
  font-size:12px;
  font-weight:800;
  outline:none;
  direction:ltr;
}
.speed-select option{background:#fff;color:#142f50}
.player-status{
  position:absolute;
  top:10px;
  right:10px;
  z-index:4;
  color:#fff;
  background:#071827b8;
  padding:5px 9px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  pointer-events:none;
}
.player:fullscreen .player-controls,
.player:-webkit-full-screen .player-controls{
  bottom:20px;
  left:20px;
}
.player:fullscreen .q-select,
.player:-webkit-full-screen .q-select{
  top:18px;
  left:18px;
}
@media(max-width:600px){
  .player-controls{gap:5px;padding:5px;bottom:7px;left:7px}
  .player-control-btn{width:31px;height:31px;font-size:11px}
  .speed-select{height:31px;min-width:65px;font-size:11px}
  .q-select{top:7px;left:7px;padding:5px 7px;font-size:11px}
  .wm{font-size:10px;bottom:48px}
}

/* ===== النتائج ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cat-btn{padding:9px 12px;border-radius:11px;border:1px solid #dce8ef;background:#fff;font-weight:800;font-size:12px;color:#34536c}
.cat-btn.on{background:#008866;color:#fff;border-color:#008866}
.q{border-right:4px solid #008866;background:#f9fcfb;padding:12px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.8}
.q.bad{border-color:#d83e4c}

/* ===== الموبايل ===== */
@media(max-width:1100px){.main{padding:22px}}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.collapsed{width:272px}
  .sidebar.collapsed .brand h2,.sidebar.collapsed .brand p,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:initial}
  .sidebar.collapsed .brand img{width:83px;height:83px}
  .sidebar.collapsed .menu a{justify-content:flex-start;gap:14px;padding:12px 14px}
  body.m-open .sidebar{transform:none}
  .overlay{position:fixed;inset:0;background:#0007;z-index:900}
  body.m-open .overlay{display:block}
  .main,.main.expanded{margin-right:0;padding:14px}
  .mob-btn{display:grid;place-items:center}
  .hero{padding:20px}
  .hero h1{font-size:19px}
}
</style>
</head>

<script>
"use strict";

/* ================= إعداد Supabase ================= */
const SB_URL="https://fpfbmjtpzamzlyzitmsd.supabase.co";
const SB_KEY="sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"ardAlahyaaAuth"}
});

const $=id=>document.getElementById(id);
const LOGIN_URL="../login/index.html";
const SUBSCRIPTION_URL="../subscriptions/index.html";
const LOGIN_AT_KEY="ardLoginAt";
const SESSION_MAX_MS=24*60*60*1000;

let user=null;
let watermark="أرض الأحياء";
let months=[];
let accessMap=new Map();
let attempts=new Map();
let progress=new Map();
let lectures=[];
let assessCache=new Map();

/* ================= أدوات ================= */
function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function safeUrl(v){
  try{const u=new URL(String(v||"").trim());return u.protocol==="https:"?u.href:""}catch{return ""}
}
function errText(e){return [e?.message,e?.details,e?.hint].filter(Boolean).join(" | ")||"خطأ غير معروف"}
function showNotice(t){const n=$("notice");n.textContent=t;n.classList.add("show")}

/* ================= الجلسة (24 ساعة) ================= */
function sessionAgeOk(){
  let at=Number(localStorage.getItem(LOGIN_AT_KEY));
  if(!at){at=Date.now();localStorage.setItem(LOGIN_AT_KEY,String(at))}
  return Date.now()-at<SESSION_MAX_MS;
}
async function expireSession(){
  try{await sb.auth.signOut()}catch{}
  localStorage.removeItem(LOGIN_AT_KEY);
  location.replace(LOGIN_URL);
}
async function requireSession(){
  const {data}=await sb.auth.getSession();
  const u=data?.session?.user;
  if(!u){location.replace(LOGIN_URL);return null}
  if(!sessionAgeOk()){await expireSession();return null}
  return u;
}
setInterval(()=>{if(!sessionAgeOk())expireSession()},5*60*1000);

/* ================= الشريط الجانبي ================= */
function applySidebar(collapsed){
  $("sidebar").classList.toggle("collapsed",collapsed);
  $("main").classList.toggle("expanded",collapsed);
  try{localStorage.setItem("ardAlahyaaSidebarCollapsed",String(collapsed))}catch{}
}
function setupSidebar(){
  applySidebar(localStorage.getItem("ardAlahyaaSidebarCollapsed")==="true");
  $("sbToggle").onclick=()=>{
    if(innerWidth<=768){document.body.classList.toggle("m-open");return}
    applySidebar(!$("sidebar").classList.contains("collapsed"));
  };
  $("mobBtn").onclick=()=>document.body.classList.add("m-open");
  $("overlay").onclick=()=>document.body.classList.remove("m-open");
}

/* ================= ملفات ووسائط ================= */
async function resolveMedia(raw,bucket="lectures"){
  const v=String(raw||"").trim();
  if(!v)return "";
  if(/^https:\/\//i.test(v)){
    if(!v.includes("/storage/v1/object/")||v.includes("/storage/v1/object/public/"))return safeUrl(v);
    if(v.includes("/storage/v1/object/sign/")&&v.includes("token="))return safeUrl(v);
  }
  let path;
  if(/^https?:\/\//i.test(v)){
    try{
      const parts=new URL(v).pathname.split("/").filter(Boolean);
      const i=parts.indexOf("object");
      if(i<0)return "";
      let after=parts.slice(i+1);
      if(["public","sign","authenticated"].includes(after[0]))after.shift();
      if(after[0]!==bucket)return "";
      after.shift();
      path=decodeURIComponent(after.join("/"));
    }catch{return ""}
  }else{
    path=v.replace(/^\/+/,"");
    if(path.startsWith(bucket+"/"))path=path.slice(bucket.length+1);
  }
  const {data,error}=await sb.storage.from(bucket).createSignedUrl(path,3600);
  return error?"":(data?.signedUrl||"");
}

async function openFile(raw){
  const url=await resolveMedia(raw,"lectures")||await resolveMedia(raw,"handouts");
  if(!url){alert("تعذر فتح الملف");return}
  window.open(url,"_blank","noopener");
}

function getEmbed(raw){
  try{
    const u=new URL(raw);
    const h=u.hostname.replace(/^www\./,"");
    const p=u.pathname.split("/").filter(Boolean);
    if(h==="youtu.be"&&p[0])return "https://www.youtube-nocookie.com/embed/"+p[0];
    if(h==="youtube.com"){
      const id=u.searchParams.get("v")||(["embed","shorts"].includes(p[0])?p[1]:"");
      if(id)return "https://www.youtube-nocookie.com/embed/"+id;
    }
    if(h==="drive.google.com"){
      const i=p.indexOf("d");
      const id=i>=0?p[i+1]:u.searchParams.get("id");
      if(id)return "https://drive.google.com/file/d/"+id+"/preview";
    }
    if(h==="vimeo.com"){
      const id=p.find(x=>/^\d+$/.test(x));
      if(id)return "https://player.vimeo.com/video/"+id;
    }
  }catch{}
  return "";
}

function getQualities(l){
  const out=[];
  [[1080,["video_1080_url","quality_1080_url"]],[720,["video_720_url","quality_720_url"]],
   [480,["video_480_url","quality_480_url"]],[360,["video_360_url","quality_360_url"]]]
  .forEach(([h,keys])=>{
    const k=keys.find(k=>typeof l[k]==="string"&&l[k].trim());
    if(k)out.push({label:h+"p",height:h,src:l[k].trim()});
  });
  out.sort((a,b)=>b.height-a.height);
  const orig=l.video_url||l.video_path||l.videoUrl||l.url;
  if(typeof orig==="string"&&orig.trim()){
    const src=orig.trim();
    if(!out.some(q=>q.src===src))out.unshift({label:"الأصلية",height:0,src});
  }
  return out;
}

/* ================= بيانات الطالب ================= */
async function loadViewer(){
  const {data}=await sb.from("profiles").select("phone").eq("id",user.id).maybeSingle();
  watermark=String(data?.phone||"").trim()||"أرض الأحياء";
}

async function loadProgress(){
  if(!window.ArdProgress)return;
  try{
    await ArdProgress.init(sb);
    const rows=(await ArdProgress.fetchAll())||[];
    progress=new Map(rows.map(r=>[String(r.lecture_id),r]));
  }catch(e){console.warn("progress:",e)}
}

async function loadAttempts(){
  const {data,error}=await sb.from("assessment_attempts")
    .select("assessment_id,score,max_score,answers,submitted_at")
    .eq("student_id",user.id);
  if(error){console.warn("attempts:",error);return}
  attempts=new Map((data||[]).map(r=>[String(r.assessment_id),r]));
}

/* ================= التحقق من الاشتراك ================= */
async function hasAccessFallback(month){
  const monthId=String(month.id);
  const termCode=String(month.term_code||"").trim();

  const [acc,grants]=await Promise.all([
    sb.from("student_access").select("month_id,term_code").eq("student_id",user.id),
    sb.from("student_subscription_grants").select("month_id,term_code,expires_at").eq("student_id",user.id)
  ]);

  const now=Date.now();
  const rows=[
    ...(acc.error?[]:(acc.data||[])),
    ...(grants.error?[]:(grants.data||[])).filter(g=>!g.expires_at||new Date(g.expires_at).getTime()>now)
  ];

  return rows.some(r=>
    (r.month_id!=null && String(r.month_id)===monthId) ||
    (termCode && r.term_code && String(r.term_code).trim()===termCode)
  );
}

async function checkMonthAccess(month){
  const r=await sb.rpc("my_month_access",{p_month_id:String(month.id)});
  if(!r.error)return r.data===true;

  console.warn("my_month_access failed, using fallback:",r.error);
  try{
    return await hasAccessFallback(month);
  }catch(e){
    console.error("fallback access check failed:",e);
    return false;
  }
}

async function loadMonths(){
  const {data,error}=await sb.from("lecture_months").select("*").order("sort_order",{ascending:true});
  if(error){
    showNotice("تعذر تحميل الكورسات: "+errText(error));
    $("coursesGrid").innerHTML="";
    return;
  }
  months=(data||[]).filter(m=>m.is_visible!==false&&m.visible!==false);

  const results=await Promise.all(months.map(m=>checkMonthAccess(m)));
  accessMap=new Map();
  months.forEach((m,i)=>accessMap.set(String(m.id),results[i]));

  renderCourses();
}

/* ================= الكورسات ================= */
function renderCourses(){
  $("coursesView").hidden=false;
  $("courseView").hidden=true;
  if(!months.length){
    $("coursesGrid").innerHTML='<p class="muted">لا توجد كورسات متاحة حاليًا.</p>';
    return;
  }
  $("coursesGrid").innerHTML=months.map(m=>{
    const ok=accessMap.get(String(m.id))===true;
    const img=safeUrl(m.cover_url||m.image_url);
    const btn=ok
      ?`<button class="btn" type="button" data-open="${esc(m.id)}"><i class="fa-solid fa-lock-open"></i> فتح الكورس</button>`
      :`<a class="btn warn" href="${SUBSCRIPTION_URL}"><i class="fa-solid fa-crown"></i> ترقية الكورس</a>`;
    return `<article class="course-card">
      <div class="cover">${img?`<img src="${esc(img)}" alt="">`:'<i class="fa-regular fa-calendar"></i>'}</div>
      <div class="course-body">
        <h3>${esc(m.title||"شهر دراسي")}</h3>
        <p>${esc(m.description||"")}</p>
        ${ok?"":'<small style="color:#98621d">محتوى الكورس يتطلب الاشتراك</small>'}
        ${btn}
      </div>
    </article>`;
  }).join("");
  $("coursesGrid").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCourse(b.dataset.open));
}

async function openCourse(monthId){
  const m=months.find(x=>String(x.id)===String(monthId));
  $("coursesView").hidden=true;
  $("courseView").hidden=false;
  $("courseTitle").textContent=m?.title||"الكورس";
  $("lecAcc").innerHTML='<p class="muted">جارٍ تحميل المحاضرات...</p>';

  const {data,error}=await sb.from("lectures")
    .select("id,title,description,created_at")
    .eq("month_id",monthId)
    .order("created_at",{ascending:true});

  if(error){
    $("lecAcc").innerHTML=`<div class="lock-box">تعذر تحميل المحاضرات: ${esc(errText(error))}</div>`;
    return;
  }
  lectures=data||[];
  if(!lectures.length){
    $("lecAcc").innerHTML='<div class="lock-box">لا توجد محاضرات في هذا الكورس بعد.</div>';
    return;
  }

  $("lecAcc").innerHTML=lectures.map((l,i)=>`
    <div class="lec">
      <button class="lec-head" type="button" data-head="${i}">
        <span class="lec-num">${i+1}</span>
        <span>${esc(l.title||"محاضرة")}</span>
        <i class="fa-solid fa-chevron-down chev"></i>
      </button>
      <div class="lec-body" hidden></div>
    </div>`).join("");

  $("lecAcc").querySelectorAll("[data-head]").forEach(b=>b.onclick=()=>toggleLecture(Number(b.dataset.head)));
}

async function toggleLecture(i){
  const wrap=$("lecAcc").children[i];
  const body=wrap.querySelector(".lec-body");
  const open=!wrap.classList.contains("open");
  wrap.classList.toggle("open",open);
  body.hidden=!open;
  if(open){
    body.innerHTML='<p class="muted" style="padding:12px">جارٍ التحميل...</p>';
    await loadAttempts();
    await renderLecture(i,body);
  }
}

async function getAssessments(lectureId){
  const key=String(lectureId);
  if(assessCache.has(key))return assessCache.get(key);
  const {data,error}=await sb.from("lecture_assessments")
    .select("id,title,assessment_type,duration_minutes")
    .eq("lecture_id",lectureId)
    .eq("is_published",true);
  if(error)console.warn("assessments:",error);
  const list=error?[]:(data||[]);
  assessCache.set(key,list);
  return list;
}

function sec(key,title,icon,inner,locked,open){
  return `<div class="sec ${open?"open":""}" data-sec="${key}">
    <button class="sec-head" type="button">
      <i class="fa-solid ${icon}"></i><span>${title}</span>
      ${locked?'<span class="lock"><i class="fa-solid fa-lock"></i></span>':""}
      <i class="fa-solid fa-chevron-down chev"></i>
    </button>
    <div class="sec-body">${inner}</div>
  </div>`;
}

function lockBox(text){
  return `<div class="lock-box"><i class="fa-solid fa-lock"></i>${esc(text)}</div>`;
}

function fileItem(r){
  return `<div class="item"><strong>${esc(r.title||"ملف")}</strong>
    <button class="btn ghost" type="button" data-file="${esc(r.file_path)}"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح في نافذة جديدة</button></div>`;
}

async function renderLecture(i,body){
  const lec=lectures[i];
  const id=String(lec.id);
  const row=progress.get(id)||{};

  const [assess,unl]=await Promise.all([
    getAssessments(lec.id),
    sb.rpc("lecture_unlocked_for_me",{p_lecture_id:id})
  ]);
  if(unl.error)console.warn("unlock:",unl.error);
  const unlocked=!unl.error&&unl.data===true;

  let content=null;
  if(unlocked){
    const c=await sb.rpc("get_lecture_content",{p_lecture_id:id});
    if(c.error)console.warn("content:",c.error);
    else content=c.data;
  }

  const exams=assess.filter(a=>a.assessment_type==="exam");
  const homeworks=assess.filter(a=>a.assessment_type==="homework");
  const resources=content?.resources||[];
  const handouts=resources.filter(r=>r.kind==="homework");
  const notes=resources.filter(r=>r.kind!=="homework");

  const examsHTML=exams.length?exams.map(a=>{
    const at=attempts.get(String(a.id));
    const passed=at&&at.max_score>0&&at.score>=at.max_score/2;
    const status=!at?'<span class="badge b-todo">لم يُمتحن</span>'
      :passed?'<span class="badge b-ok">ناجح ✓</span>'
      :'<span class="badge b-bad">لم تنجح</span>';
    const action=!at
      ?`<a class="btn" href="exam.html?id=${encodeURIComponent(a.id)}"><i class="fa-solid fa-play"></i> ابدأ الامتحان</a>`
      :`<button class="btn ghost" type="button" data-result="${esc(a.id)}">عرض النتيجة</button>`;
    return `<div class="item"><div><strong>${esc(a.title)}</strong>
        <small>${a.duration_minutes?"المدة: "+esc(a.duration_minutes)+" دقيقة":"اختبار إلكتروني"}</small></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${status}${action}</div></div>
      <div data-result-box="${esc(a.id)}"></div>`;
  }).join(""):'<p class="muted">لا يوجد امتحان لهذه المحاضرة.</p>';

  const videoHTML=!unlocked
    ?lockBox("امتحن الامتحان واحصل على 50% على الأقل علشان تفتح الشرح والمذكرات")
    :`<div class="player" data-player></div>
      <div style="margin-top:12px"><button class="btn ghost" type="button" data-toggle-notes><i class="fa-regular fa-file-lines"></i> فتح المذكرات</button></div>
      <div data-notes hidden style="margin-top:10px">
        ${notes.length?notes.map(fileItem).join(""):'<p class="muted">لا توجد مذكرات لهذه المحاضرة.</p>'}
      </div>`;

  const pagesHTML=!unlocked
    ?lockBox("صفحات الواجب تفتح بعد الامتحان")
    :(handouts.length?handouts.map(fileItem).join(""):'<p class="muted">لا توجد صفحات واجب لهذه المحاضرة.</p>');

  const submitHTML=!unlocked
    ?lockBox("سلّم الامتحان الأول علشان تفتح الواجب")
    :(homeworks.length?homeworks.map(a=>{
        const at=attempts.get(String(a.id));
        return `<div class="item"><div><strong>${esc(a.title)}</strong><small>واجب يُسلَّم مرة واحدة</small></div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${
            at?`<span class="badge b-ok">تم التسليم ✓</span><button class="btn ghost" type="button" data-result="${esc(a.id)}">عرض النتيجة</button>`
              :`<a class="btn" href="exam.html?id=${encodeURIComponent(a.id)}"><i class="fa-solid fa-paper-plane"></i> ابدأ وسلّم الواجب</a>`
          }</div></div>
          <div data-result-box="${esc(a.id)}"></div>`;
      }).join(""):'<p class="muted">لا يوجد واجب لهذه المحاضرة.</p>')
    +'<div class="motiv">شاطر! كمّل الواجب وسلّمه 💪</div>';

  body.innerHTML=`
    <div class="lec-tools">
      <button class="btn ghost" type="button" data-save>${row.saved?'<i class="fa-solid fa-star"></i> محفوظة':'<i class="fa-regular fa-star"></i> حفظ المحاضرة'}</button>
      <button class="btn ghost" type="button" data-done>${row.completed?'<i class="fa-solid fa-circle-check"></i> تمت المشاهدة':'<i class="fa-regular fa-circle-check"></i> تحديد كمكتملة'}</button>
    </div>
    ${sec("exam","1. الامتحان","fa-file-circle-check",examsHTML,false,true)}
    ${sec("video","2. الشرح والفيديو","fa-circle-play",videoHTML,!unlocked,false)}
    ${sec("pages","3. صفحات الواجب","fa-file-lines",pagesHTML,!unlocked,false)}
    ${sec("submit","4. تسليم الواجب","fa-paper-plane",submitHTML,!unlocked,false)}`;

  body.querySelectorAll(".sec-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  body.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>showResult(b.dataset.result));
  body.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>openFile(b.dataset.file));
  body.querySelector("[data-toggle-notes]")?.addEventListener("click",()=>{
    const n=body.querySelector("[data-notes]");n.hidden=!n.hidden;
  });
  body.querySelector("[data-save]").onclick=()=>setFlag(id,"saved",!row.saved);
  body.querySelector("[data-done]").onclick=()=>setFlag(id,"completed",!row.completed);

  if(unlocked&&content)mountVideo(body.querySelector("[data-player]"),content.lecture,id);
}

/* ================= أدوات حفظ واستكمال الفيديو ================= */
function videoProgressKey(lectureId){
  return "ardVideoPosition_"+user.id+"_"+lectureId;
}

function getSavedVideoPosition(lectureId){
  try{
    const value=Number(localStorage.getItem(videoProgressKey(lectureId)));
    return Number.isFinite(value)&&value>0?value:0;
  }catch{return 0}
}

function saveVideoPosition(video,lectureId){
  if(!video||!Number.isFinite(video.currentTime))return;
  if(video.currentTime<1)return;
  try{
    localStorage.setItem(videoProgressKey(lectureId),String(video.currentTime));
  }catch(e){console.warn("video position save:",e)}
}

function enterPlayerFullscreen(box,video){
  try{
    if(document.fullscreenElement===box)return;

    if(box.requestFullscreen){
      const result=box.requestFullscreen();
      if(result&&typeof result.catch==="function")result.catch(()=>{});
      return;
    }

    if(box.webkitRequestFullscreen){
      box.webkitRequestFullscreen();
      return;
    }

    if(video&&video.webkitEnterFullscreen){
      video.webkitEnterFullscreen();
    }
  }catch(e){
    console.warn("fullscreen:",e);
  }
}

/* ================= المشغل المطور ================= */
async function mountVideo(box,lecture,lectureId){
  if(!box)return;

  const qs=getQualities(lecture);
  if(!qs.length){
    box.innerHTML='<div class="lock-box">لم يتم رفع فيديو لهذه المحاضرة بعد.</div>';
    return;
  }

  for(const q of qs){
    const embed=getEmbed(q.src);
    if(embed){
      box.innerHTML=`
        <iframe src="${esc(embed)}"
          allow="autoplay;fullscreen;picture-in-picture"
          allowfullscreen></iframe>
        <div class="wm">${esc(watermark)}</div>`;
      return;
    }
  }

  let url="",idx=0;

  for(let i=0;i<qs.length&&!url;i++){
    url=await resolveMedia(qs[i].src);
    idx=i;
  }

  if(!url){
    box.innerHTML='<div class="lock-box">تعذر تشغيل الفيديو. تحقق من رابط الفيديو.</div>';
    return;
  }

  box.innerHTML=`
    <video controls playsinline webkit-playsinline
      controlsList="nodownload noremoteplayback"
      disablePictureInPicture
      preload="metadata"></video>

    <div class="wm">${esc(watermark)}</div>
    <div class="player-status">مشغل أرض الأحياء</div>

    <div class="player-controls">
      <button class="player-control-btn" type="button" data-back title="تأخير 10 ثوانٍ">
        <i class="fa-solid fa-backward"></i>
      </button>

      <button class="player-control-btn" type="button" data-forward title="تقديم 10 ثوانٍ">
        <i class="fa-solid fa-forward"></i>
      </button>

      <select class="speed-select" data-speed aria-label="سرعة التشغيل">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
        <option value="2.5">2.5x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="7">7x</option>
        <option value="8">8x</option>
        <option value="9">9x</option>
        <option value="10">10x</option>
      </select>
    </div>
  `;

  const video=box.querySelector("video");
  const speedSelect=box.querySelector("[data-speed]");
  const backBtn=box.querySelector("[data-back]");
  const forwardBtn=box.querySelector("[data-forward]");

  video.src=url;

  /* استكمال المشاهدة من آخر نقطة */
  let restored=false;
  const savedPosition=getSavedVideoPosition(lectureId);

  video.addEventListener("loadedmetadata",()=>{
    if(restored)return;
    restored=true;

    if(savedPosition>5&&Number.isFinite(video.duration)&&savedPosition<video.duration-3){
      video.currentTime=savedPosition;
    }
  });

  /* ملء الشاشة عند بدء التشغيل */
  video.addEventListener("play",()=>{
    enterPlayerFullscreen(box,video);
  });

  /* سرعة التشغيل بحد أقصى 10x */
  speedSelect.addEventListener("change",()=>{
    const speed=Math.min(10,Math.max(0.5,Number(speedSelect.value)||1));
    video.playbackRate=speed;
  });

  /* تقديم 10 ثوانٍ */
  backBtn.addEventListener("click",()=>{
    video.currentTime=Math.max(0,video.currentTime-10);
  });

  /* تأخير/تقديم للأمام 10 ثوانٍ */
  forwardBtn.addEventListener("click",()=>{
    const end=Number.isFinite(video.duration)?video.duration:video.currentTime+10;
    video.currentTime=Math.min(end,video.currentTime+10);
  });

  /* حفظ نقطة المشاهدة بشكل دوري */
  const saveTimer=setInterval(()=>{
    if(!video.paused&&!video.ended){
      saveVideoPosition(video,lectureId);
    }
  },3000);

  video.addEventListener("pause",()=>{
    saveVideoPosition(video,lectureId);
  });

  video.addEventListener("seeked",()=>{
    saveVideoPosition(video,lectureId);
  });

  video.addEventListener("ended",()=>{
    clearInterval(saveTimer);

    try{
      localStorage.removeItem(videoProgressKey(lectureId));
    }catch{}

    const row=progress.get(String(lectureId))||{};
    if(!row.completed)setFlag(lectureId,"completed",true);
  });

  window.addEventListener("pagehide",()=>{
    saveVideoPosition(video,lectureId);
  },{once:true});

  /* اختيار جودة الفيديو مع الاحتفاظ بالوقت والسرعة */
  if(qs.length>1){
    const sel=document.createElement("select");
    sel.className="q-select";
    sel.setAttribute("aria-label","جودة الفيديو");

    qs.forEach((q,i)=>{
      const o=document.createElement("option");
      o.value=i;
      o.textContent=q.label;
      if(i===idx)o.selected=true;
      sel.appendChild(o);
    });

    sel.addEventListener("change",async()=>{
      const selectedIndex=Number(sel.value);
      const selected=qs[selectedIndex];
      if(!selected)return;

      const u=await resolveMedia(selected.src);
      if(!u){
        alert("تعذر تحميل الجودة المختارة");
        sel.value=String(idx);
        return;
      }

      const t=video.currentTime;
      const playing=!video.paused;
      const rate=video.playbackRate;

      video.src=u;

      video.addEventListener("loadedmetadata",function restoreQuality(){
        video.removeEventListener("loadedmetadata",restoreQuality);

        if(Number.isFinite(video.duration)){
          video.currentTime=Math.min(t,Math.max(0,video.duration-1));
        }else{
          video.currentTime=t;
        }

        video.playbackRate=rate;

        if(playing){
          video.play().catch(()=>{});
        }
      });

      idx=selectedIndex;
    });

    box.appendChild(sel);
  }
}

/* ================= التقدم ================= */
async function setFlag(id,field,value){
  if(!window.ArdProgress){alert("خدمة التقدم غير متاحة");return}
  try{
    if(field==="saved")await ArdProgress.setSaved(id,value);
    else await ArdProgress.setCompleted(id,value);
    progress.set(id,{...(progress.get(id)||{}),[field]:value});

    const i=lectures.findIndex(l=>String(l.id)===String(id));
    if(i>=0){
      const body=$("lecAcc").children[i].querySelector(".lec-body");
      const btn=body.querySelector(field==="saved"?"[data-save]":"[data-done]");
      if(btn){
        btn.innerHTML=field==="saved"
          ?(value?'<i class="fa-solid fa-star"></i> محفوظة':'<i class="fa-regular fa-star"></i> حفظ المحاضرة')
          :(value?'<i class="fa-solid fa-circle-check"></i> تمت المشاهدة':'<i class="fa-regular fa-circle-check"></i> تحديد كمكتملة');
        btn.onclick=()=>setFlag(id,field,!(progress.get(id)||{})[field]);
      }
    }
  }catch(e){console.error(e);alert("تعذر حفظ التقدم")}
}

/* ================= النتائج ================= */
function showResult(aid){
  const box=document.querySelector(`[data-result-box="${CSS.escape(String(aid))}"]`);
  if(!box)return;
  if(box.childElementCount){box.innerHTML="";return}
  const at=attempts.get(String(aid));
  if(!at)return;
  box.appendChild(buildResult(at));
}

function buildResult(at){
  const review=Array.isArray(at.answers)?at.answers:[];
  const cats={
    "الأسئلة المحلولة":review.filter(x=>x.selected_answer),
    "الأسئلة الغير محلولة":review.filter(x=>!x.selected_answer),
    "الأسئلة الصحيحة":review.filter(x=>x.selected_answer&&x.selected_answer===x.correct_answer),
    "الأسئلة الخاطئة":review.filter(x=>x.selected_answer&&x.selected_answer!==x.correct_answer)
  };

  const wrap=document.createElement("div");
  wrap.style.marginTop="12px";
  wrap.innerHTML=`<div class="item"><strong>نتيجتك: ${esc(at.score)} / ${esc(at.max_score)}</strong></div>
    <div class="cats"></div><div class="cat-list"></div>`;
  const catsBox=wrap.querySelector(".cats");
  const list=wrap.querySelector(".cat-list");

  Object.entries(cats).forEach(([name,items])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="cat-btn";
    b.textContent=`${name} (${items.length})`;
    b.onclick=()=>{
      const wasOn=b.classList.contains("on");
      catsBox.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("on"));
      if(wasOn){list.innerHTML="";return}
      b.classList.add("on");
      list.innerHTML=items.length
        ?items.map((q,n)=>`<div class="q ${q.selected_answer&&q.selected_answer!==q.correct_answer?"bad":""}">
            <strong>س${n+1}: ${esc(q.question_text||"")}</strong>
            <div>إجابتك: ${esc(q.selected_answer||"لم تُجب")} — الصحيحة: <b>${esc(q.correct_answer||"")}</b></div>
            ${q.explanation?`<div style="margin-top:6px">${esc(q.explanation)}</div>`:""}
          </div>`).join("")
        :'<p class="muted" style="margin-top:10px">لا توجد أسئلة في هذا القسم.</p>';
    };
    catsBox.appendChild(b);
  });
  return wrap;
}

/* ================= بدء الصفحة ================= */
async function init(){
  user=await requireSession();
  if(!user)return;
  setupSidebar();
  $("backToCourses").onclick=renderCourses;
  await loadViewer();
  await loadProgress();
  await loadAttempts();
  await loadMonths();
}
window.addEventListener("pageshow",e=>{if(e.persisted)location.reload()});
init();
</script>
