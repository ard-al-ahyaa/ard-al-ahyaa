<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتدى | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover, .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 30px 40px;
    }

    .top-bar {
      background: white;
      padding: 22px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.04);
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }

    .top-bar h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
    }

    .card h3 {
      color: #1e3a8a;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      resize: vertical;
      min-height: 100px;
      margin-bottom: 12px;
    }

    textarea:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1e40af;
    }

    .post-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-top: 15px;
    }

    .post-author {
      font-weight: 700;
      color: #026857;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .post-content {
      color: #334155;
      font-size: 14px;
      line-height: 1.7;
    }

    .loading, .empty {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 15px; }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="../logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../index.html">🏠 الرئيسية</a>
        <a href="../videos/index.html">🎥 المحاضرات</a>
        <a href="../notes/index.html">📚 المذكرات</a>
        <a href="../champion/index.html">🏆 بطل الفصل</a>
        <a href="index.html" class="active">💬 المنتدى</a>
        <a href="../account/index.html">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1>💬 منتدى النقاش والأسئلة</h1>
    </div>

    <!-- صندوق إضافة منشور جديد -->
    <div class="card">
      <h3>اكتب سؤالك أو استفسارك لزملائك وأستاذ المادة:</h3>
      <textarea id="postContent" placeholder="شارك فكرة، اسأل عن جزئية في الأحياء..."></textarea>
      <button onclick="addPost()">نشر المنشور 🚀</button>
      <div id="statusMsg" style="margin-top: 10px; font-weight: bold; font-size: 14px;"></div>
    </div>

    <!-- قائمة المنشورات -->
    <div class="card">
      <h3>المناقشات الأخيرة</h3>
      <div id="postsList">
        <div class="loading">جاري تحميل المناقشات...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function addPost() {
      const content = document.getElementById("postContent").value.trim();
      const status = document.getElementById("statusMsg");

      if (!content) {
        status.style.color = "#e74c3c";
        status.textContent = "❌ يرجى كتابة محتوى المنشور أولاً.";
        return;
      }

      status.style.color = "#1e3a8a";
      status.textContent = "⏳ جاري النشر...";

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        let authorName = "طالب بالمنصة";
        if (session && session.user) {
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name")
            .eq("id", session.user.id)
            .maybeSingle();
          if (profile?.full_name) authorName = profile.full_name;
        }

        const { error } = await supabaseClient
          .from("forum")
          .insert({ content: content, author_name: authorName });

        if (error) throw error;

        status.style.color = "#026857";
        status.textContent = "✅ تم النشر بنجاح!";
        document.getElementById("postContent").value = "";
        loadPosts();

        setTimeout(() => { status.textContent = ""; }, 3000);

      } catch (err) {
        console.error(err);
        status.style.color = "#e74c3c";
        status.textContent = "❌ تعذر النشر. (تأكد من إنشاء جدول forum في Supabase).";
      }
    }

    async function loadPosts() {
      const listDiv = document.getElementById("postsList");
      try {
        const { data, error } = await supabaseClient
          .from("forum")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          listDiv.innerHTML = `<div class="empty">لا توجد مناقشات حتى الآن. كن أول من يشارك!</div>`;
          return;
        }

        listDiv.innerHTML = "";
        data.forEach(post => {
          const box = document.createElement("div");
          box.className = "post-box";
          box.innerHTML = `
            <div class="post-author">👤 ${escapeHtml(post.author_name || "طالب")}</div>
            <div class="post-content">${escapeHtml(post.content)}</div>
          `;
          listDiv.appendChild(box);
        });

      } catch (err) {
        console.error(err);
        listDiv.innerHTML = `<div class="empty" style="color:#e74c3c;">تعذر تحميل المنتدى. تأكد من وجود جدول forum في Supabase.</div>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadPosts();
  </script>

</body>

</html>
