<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة المنصة</title>
  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      direction: rtl;
      text-align: right;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h2, h3 {
      color: #075e4d;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #075e4d;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #054c3f;
    }
    button.danger {
      background-color: #e74c3c;
    }
    button.danger:hover {
      background-color: #c0392b;
    }
    .hidden {
      display: none;
    }
    .exam-item, .question-box {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      margin-top: 10px;
      border-right: 4px solid #075e4d;
    }
    .exam-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .correct-answer {
      color: #27ae60;
      font-weight: bold;
      margin-top: 5px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #075e4d;
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .header-bar button {
      background: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h2>لوحة التحكم الإدارية</h2>
      <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- الإحصائيات السريعة -->
    <div class="card">
      <h3>📊 إحصائيات عامة</h3>
      <div id="statsContainer">جاري تحميل الإحصائيات...</div>
    </div>

    <!-- قسم إضافة وتحديث بطل الفصل بالنقاط -->
    <div class="card">
      <h3>🏆 إدارة أبطال الفصل (لوحة الشرف)</h3>
      <div class="form-group" style="margin-top: 15px;">
        <input type="text" id="championName" placeholder="اسم الطالب المميز">
        <input type="number" id="championPoints" placeholder="عدد النقاط" style="margin-top: 10px;">
        <button onclick="addChampion()" style="margin-top: 10px;">➕ إضافة للبطل / لوحة الشرف</button>
      </div>
      <div id="championsList" style="margin-top: 20px;">
        <!-- سيتم عرض قائمة الأبطال هنا -->
      </div>
    </div>

    <!-- قسم إنشاء اختبار جديد -->
    <div class="card">
      <h3>📝 إنشاء اختبار جديد</h3>
      <div class="form-group">
        <label>عنوان الاختبار:</label>
        <input type="text" id="examTitle" placeholder="مثال: اختبار الوحدة الأولى في الكيمياء">
      </div>
      <div class="form-group">
        <label>وصف الاختبار:</label>
        <textarea id="examDescription" placeholder="وصف قصير أو تعليمات للاختبار"></textarea>
      </div>
      <div class="form-group">
        <label>مدة الاختبار (بالدقائق):</label>
        <input type="number" id="examDuration" value="15">
      </div>
      <button onclick="createExam()">إنشاء والانتقال لإضافة الأسئلة</button>
      <div id="examStatus" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- قسم قائمة الاختبارات الحالية -->
    <div class="card">
      <h3>📚 الاختبارات المتاحة</h3>
      <div id="examsList">جاري تحميل الاختبارات...</div>
    </div>

    <!-- قسم إضافة الأسئلة (يظهر عند اختيار اختبار) -->
    <div id="questionEditor" class="card hidden">
      <h3 id="selectedExamName" style="color: #075e4d;">إضافة أسئلة للاختبار</h3>
      
      <div class="form-group">
        <label>نص السؤال:</label>
        <textarea id="questionText" placeholder="اكتب السؤال هنا..."></textarea>
      </div>
      
      <div class="form-group"><label>الاختيار أ:</label><input type="text" id="optionA"></div>
      <div class="form-group"><label>الاختيار ب:</label><input type="text" id="optionB"></div>
      <div class="form-group"><label>الاختيار ج:</label><input type="text" id="optionC"></div>
      <div class="form-group"><label>الاختيار د:</label><input type="text" id="optionD"></div>
      
      <div class="form-group">
        <label>الإجابة الصحيحة:</label>
        <select id="correctAnswer">
          <option value="">-- اختر الإجابة الصحيحة --</option>
          <option value="a">الاختيار أ</option>
          <option value="b">الاختيار ب</option>
          <option value="c">الاختيار ج</option>
          <option value="d">الاختيار د</option>
        </select>
      </div>

      <button onclick="addQuestion()">➕ حفظ وإضافة السؤال</button>
      <button class="danger" onclick="closeQuestionEditor()" style="margin-right: 10px;">إغلاق محرر الأسئلة</button>
      <div id="questionStatus" style="margin-top: 10px; font-weight: bold;"></div>

      <div id="currentQuestions"></div>
    </div>
  </div>

  <script>
    // إعدادات اتصال Supabase (استبدل القيم بالبيانات الخاصة بك)
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedExamId = null;

    // التحقق من صلاحيات الأدمين
    async function checkAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("⚠️️ يجب تسجيل الدخول أولاً كأدمين");
        location.href = "../login/index.html";
        return false;
      }
      return true;
    }

    // جلب الإحصائيات السريعة
    async function loadStats() {
      const container = document.getElementById("statsContainer");
      try {
        const { count: examsCount } = await supabaseClient.from("exams").select("*", { count: 'exact', head: true });
        const { count: questionsCount } = await supabaseClient.from("questions").select("*", { count: 'exact', head: true });
        const { count: championsCount } = await supabaseClient.from("champions").select("*", { count: 'exact', head: true });

        container.innerHTML = `
          <p>📝 عدد الاختبارات الكلي: <strong>${examsCount || 0}</strong></p>
          <p>❓ عدد الأسئلة الكلي: <strong>${questionsCount || 0}</strong></p>
          <p>🏆 عدد الطلاب في لوحة الشرف: <strong>${championsCount || 0}</strong></p>
        `;
      } catch (error) {
        console.error(error);
        container.innerHTML = "تعذر تحميل الإحصائيات.";
      }
    }

    // =========================
    // إدارة أبطال الفصل (لوحة الشرف)
    // =========================
    async function addChampion() {
      const name = document.getElementById("championName").value.trim();
      const points = parseInt(document.getElementById("championPoints").value);

      if (!name || isNaN(points)) {
        alert("❌ يرجى إدخال اسم الطالب وعدد النقاط بشكل صحيح");
        return;
      }

      try {
        const { error } = await supabaseClient
          .from("champions")
          .insert({ 
            student_name: name, 
            points: points 
          });

        if (error) throw error;

        alert("🏆 تم إضافة البطل بنجاح!");
        document.getElementById("championName").value = "";
        document.getElementById("championPoints").value = "";
        loadChampions();
        loadStats();
      } catch (error) {
        console.error(error);
        alert("❌ فشل إضافة البطل: " + error.message);
      }
    }

    async function loadChampions() {
      const container = document.getElementById("championsList");
      if (!container) return;

      container.innerHTML = "⏳ جاري تحميل قائمة الأبطال...";

      try {
        const { data, error } = await supabaseClient
          .from("champions")
          .select("*")
          .order("points", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = "<p style='color:#666; margin-top:10px;'>لا يوجد أبطال مسجلين حتى الآن.</p>";
          return;
        }

        container.innerHTML = `<h4 style="color:#075e4d; margin-top:15px;">لوحة الشرف والأبطال (${data.length}):</h4>`;

        data.forEach((champ, index) => {
          const champBox = document.createElement("div");
          champBox.style.cssText = "background: #f9f9f9; padding: 10px; margin-top: 8px; border-radius: 5px; border-right: 4px solid #075e4d; display: flex; justify-content: space-between; align-items: center;";
          
          champBox.innerHTML = `
            <div>
              <strong>#${index + 1} - ${escapeHtml(champ.student_name)}</strong> 
              <span style="color: #e67e22; margin-right: 15px;">⭐ ${champ.points} نقطة</span>
            </div>
            <button class="danger" onclick="deleteChampion('${champ.id}')" style="padding: 5px 10px; font-size: 12px;">🗑️ حذف</button>
          `;
          container.appendChild(champBox);
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = "❌ تعذر تحميل قائمة الأبطال";
      }
    }

    async function deleteChampion(champId) {
      if (!confirm("هل تريد حذف هذا الطالب من لوحة الشرف؟")) return;
      
      try {
        const { error } = await supabaseClient
          .from("champions")
          .delete()
          .eq("id", champId);

        if (error) throw error;
        
        alert("✅ تم الحذف بنجاح");
        loadChampions();
        loadStats();
      } catch (error) {
        console.error(error);
        alert("❌ فشل الحذف: " + error.message);
      }
    }

    // =========================
    // إنشاء الاختبارات
    // =========================
    async function createExam() {
      const title = document.getElementById("examTitle").value.trim();
      const description = document.getElementById("examDescription").value.trim();
      const duration = parseInt(document.getElementById("examDuration").value) || 15;
      const status = document.getElementById("examStatus");

      if (!title) {
        status.innerHTML = "❌ يرجى كتابة عنوان الاختبار";
        return;
      }

      status.innerHTML = "⏳ جاري إنشاء الاختبار...";

      try {
        const { data, error } = await supabaseClient
          .from("exams")
          .insert({ title, description, duration })
          .select()
          .single();

        if (error) throw error;

        status.innerHTML = "✅ تم إنشاء الاختبار بنجاح، يمكنك إضافة الأسئلة الآن.";
        document.getElementById("examTitle").value = "";
        document.getElementById("examDescription").value = "";

        await loadExams();
        loadStats();
        openQuestionEditor(data.id, data.title);

      } catch (error) {
        console.error(error);
        status.innerHTML = "❌ فشل إنشاء الاختبار: " + error.message;
      }
    }

    // =========================
    // إدارة الأسئلة
    // =========================
    async function openQuestionEditor(examId, examTitle) {
      selectedExamId = examId;
      document.getElementById("selectedExamName").textContent = "إضافة أسئلة للاختبار: " + examTitle;
      document.getElementById("questionEditor").classList.remove("hidden");
      document.getElementById("questionEditor").scrollIntoView({ behavior: "smooth" });
      await loadCurrentQuestions();
    }

    function closeQuestionEditor() {
      selectedExamId = null;
      document.getElementById("questionEditor").classList.add("hidden");
      document.getElementById("questionText").value = "";
      document.getElementById("optionA").value = "";
      document.getElementById("optionB").value = "";
      document.getElementById("optionC").value = "";
      document.getElementById("optionD").value = "";
      document.getElementById("correctAnswer").value = "";
      document.getElementById("currentQuestions").innerHTML = "";
    }

    async function addQuestion() {
      if (!selectedExamId) {
        alert("❌ يرجى اختيار الاختبار أولاً");
        return;
      }

      const text = document.getElementById("questionText").value.trim();
      const option_a = document.getElementById("optionA").value.trim();
      const option_b = document.getElementById("optionB").value.trim();
      const option_c = document.getElementById("optionC").value.trim();
      const option_d = document.getElementById("optionD").value.trim();
      const correct_answer = document.getElementById("correctAnswer").value;
      const status = document.getElementById("questionStatus");

      if (!text || !option_a || !option_b || !option_c || !option_d || !correct_answer) {
        status.innerHTML = "❌ يرجى ملء جميع حقول السؤال والاختيارات وتحديد الإجابة الصحيحة";
        return;
      }

      status.innerHTML = "⏳ جاري إضافة السؤال...";

      try {
        const { error } = await supabaseClient
          .from("questions")
          .insert({
            exam_id: selectedExamId,
            question_text: text,
            option_a,
            option_b,
            option_c,
            option_d,
            correct_answer
          });

        if (error) throw error;

        status.innerHTML = "✅ تمت إضافة السؤال بنجاح";
        document.getElementById("questionText").value = "";
        document.getElementById("optionA").value = "";
        document.getElementById("optionB").value = "";
        document.getElementById("optionC").value = "";
        document.getElementById("optionD").value = "";
        document.getElementById("correctAnswer").value = "";

        await loadCurrentQuestions();
        loadStats();
      } catch (error) {
        console.error(error);
        status.innerHTML = "❌ فشل إضافة السؤال: " + error.message;
      }
    }

    async function loadCurrentQuestions() {
      const container = document.getElementById("currentQuestions");
      if (!selectedExamId) return;

      container.innerHTML = "⏳ جاري تحميل الأسئلة...";

      try {
        const { data, error } = await supabaseClient
          .from("questions")
          .select("*")
          .eq("exam_id", selectedExamId);

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = "<p style='color:#666; margin-top:10px;'>لا توجد أسئلة مضافة لهذا الاختبار حتى الآن.</p>";
          return;
        }

        container.innerHTML = `<h4 style="color:#075e4d; margin-top:15px;">الأسئلة الحالية (${data.length}):</h4>`;

        data.forEach((q, index) => {
          const qBox = document.createElement("div");
          qBox.className = "question-box";
          qBox.innerHTML = `
            <h4>سؤال ${index + 1}: ${escapeHtml(q.question_text)}</h4>
            <p>أ) ${escapeHtml(q.option_a)}</p>
            <p>ب) ${escapeHtml(q.option_b)}</p>
            <p>ج) ${escapeHtml(q.option_c)}</p>
            <p>د) ${escapeHtml(q.option_d)}</p>
            <div class="correct-answer">الإجابة الصحيحة: <strong>${q.correct_answer.toUpperCase()}</strong></div>
            <button class="danger" onclick="deleteQuestion('${q.id}')" style="margin-top: 10px;">🗑️ حذف السؤال</button>
          `;
          container.appendChild(qBox);
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = "❌ تعذر تحميل الأسئلة";
      }
    }

    async function deleteQuestion(qId) {
      if (!confirm("هل تريد حذف هذا السؤال؟")) return;
      try {
        const { error } = await supabaseClient.from("questions").delete().eq("id", qId);
        if (error) throw error;
        alert("✅ تم حذف السؤال");
        await loadCurrentQuestions();
        loadStats();
      } catch (error) {
        console.error(error);
        alert("❌ فشل حذف السؤال: " + error.message);
      }
    }

    async function loadExams() {
      const list = document.getElementById("examsList");
      if (!list) return;

      list.innerHTML = "⏳ جاري تحميل الاختبارات...";

      try {
        const { data, error } = await supabaseClient
          .from("exams")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          list.innerHTML = "لا توجد اختبارات مضافة حتى الآن.";
          return;
        }

        list.innerHTML = "";

        data.forEach(exam => {
          const item = document.createElement("div");
          item.className = "exam-item";
          item.innerHTML = `
            <h3>📝 ${escapeHtml(exam.title)}</h3>
            <p>${escapeHtml(exam.description || "بدون وصف")}</p>
            <p>⏱️ المدة: <strong>${exam.duration}</strong> دقائق</p>
            <div class="exam-actions">
              <button onclick="openQuestionEditor('${exam.id}', '${escapeHtml(exam.title)}')">✏️ إدارة الأسئلة</button>
              <button class="danger" onclick="deleteExam('${exam.id}')">🗑️ حذف الاختبار</button>
            </div>
          `;
          list.appendChild(item);
        });
      } catch (error) {
        console.error(error);
        list.innerHTML = "❌ تعذر تحميل الاختبارات";
      }
    }

    async function deleteExam(examId) {
      if (!confirm("⚠️ هل أنت متأكد من حذف هذا الاختبار وجميع الأسئلة المرتبطة به؟")) return;

      try {
        const { error } = await supabaseClient.from("exams").delete().eq("id", examId);
        if (error) throw error;

        alert("✅ تم حذف الاختبار بنجاح");
        if (selectedExamId === examId) closeQuestionEditor();
        await loadExams();
        loadStats();
      } catch (error) {
        console.error(error);
        alert("❌ فشل حذف الاختبار: " + error.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function logout() {
      supabaseClient.auth.signOut().then(() => {
        location.href = "../login/index.html";
      });
    }

    // تشغيل الدوال عند تحميل الصفحة
    window.addEventListener("DOMContentLoaded", async () => {
      const isAdmin = await checkAdmin();
      if (isAdmin) {
        loadStats();
        loadChampions();
        loadExams();
      }
    });
  </script>
</body>
</html>
