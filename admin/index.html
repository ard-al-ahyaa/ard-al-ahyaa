<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
    }

    .card h2 {
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      color: #026857;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    input[type="file"] {
      padding: 8px;
      background: #f8fafc;
      cursor: pointer;
    }

    input:focus, textarea:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1e40af;
    }

    .lecture-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background: #e74c3c;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <h1 style="color: #1e3a8a; font-size: 24px;">⚙️ لوحة التحكم الشاملة</h1>
      <a href="../index.html" style="background:#026857; color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700;">🏠 العودة للمنصة</a>
    </div>

    <!-- إحصائيات المنصة (عدد الطلاب) -->
    <div class="card">
      <h2>📊 إحصائيات المنصة</h2>
      <div style="font-size: 18px; font-weight: 700; color: #1e3a8a;" id="usersCount">
        ⏳ جاري حساب عدد الطلاب المسجلين...
      </div>
    </div>

    <!-- إضافة محاضرة جديدة -->
    <div class="card">
      <h2>🎥 إضافة محاضرة جديدة</h2>
      <div class="form-group">
        <label>عنوان المحاضرة:</label>
        <input type="text" id="lecTitle" placeholder="مثال: المحاضرة الأولى: الدعامة والجهاز الحركي">
      </div>
      <div class="form-group">
        <label>الباب / الفصل التعليمي:</label>
        <input type="text" id="lecChapter" placeholder="مثال: الباب الأول - الأحياء">
      </div>
      
      <div class="form-group">
        <label>📁 اختر ملف الفيديو من الجهاز:</label>
        <input type="file" id="videoFile" accept="video/*">
      </div>
      <div style="text-align: center; margin: 8px 0; color: #64748b; font-size: 13px;">أو ضع رابط يوتيوب/فيديو خارجي:</div>
      <div class="form-group">
        <input type="text" id="lecVideoUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>تفاصيل الشرح (النصي):</label>
        <textarea id="lecDetails" placeholder="اكتب تفاصيل الشرح هنا..."></textarea>
      </div>

      <div class="form-group">
        <label>📄 اختر ملف المذكرة (PDF) من الجهاز:</label>
        <input type="file" id="pdfFile" accept="application/pdf">
      </div>
      <div style="text-align: center; margin: 8px 0; color: #64748b; font-size: 13px;">أو رابط مذكرة خارجي:</div>
      <div class="form-group">
        <input type="text" id="lecPdfUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>رابط الواجب / الامتحان:</label>
        <input type="text" id="lecHomeworkUrl" placeholder="رابط جوجل فورم أو الامتحان">
      </div>
      <div class="form-group">
        <label>وصف مختصر:</label>
        <input type="text" id="lecDesc" placeholder="وصف قصير للمحاضرة">
      </div>
      <button onclick="addLecture()">رفع المحاضرة والمذكرة وحفظها 🚀</button>
      <div id="lecStatus" class="status"></div>
    </div>

    <!-- قائمة المحاضرات الحالية (للحذف والتعديل) -->
    <div class="card">
      <h2>🗑️ إدارة وحذف المحاضرات الحالية</h2>
      <div id="manageLecturesList">
        <p style="color: #64748b;">جاري تحميل المحاضرات...</p>
      </div>
    </div>

    <!-- إدارة أبطال الفصل -->
    <div class="card">
      <h2>🏆 إدارة أبطال الفصل</h2>
      <div class="form-group">
        <label>اسم الطالب:</label>
        <input type="text" id="champName" placeholder="اسم البطل">
      </div>
      <div class="form-group">
        <label>الدرجة / النقاط:</label>
        <input type="text" id="champScore" placeholder="مثال: الدرجة النهائية 50/50">
      </div>
      <button onclick="addChampion()">إضافة البطل 🌟</button>
      <div id="champStatus" class="status"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. حساب عدد الطلاب
    async function fetchStudentsCount() {
      try {
        const { count, error } = await supabaseClient
          .from("profiles")
          .select("*", { count: 'exact', head: true });
        if (error) throw error;
        document.getElementById("usersCount").innerHTML = `👥 عدد الطلاب المسجلين على المنصة: <span style="color: #026857; font-size: 22px;">${count || 0}</span> طالب`;
      } catch (err) {
        console.error(err);
        document.getElementById("usersCount").textContent = "تعذر حساب عدد الطلاب.";
      }
    }
    fetchStudentsCount();

    // 2. جلب وعرض المحاضرات في لوحة التحكم لحذفها
    async function loadAdminLectures() {
      const container = document.getElementById("manageLecturesList");
      try {
        const { data, error } = await supabaseClient
          .from("videos")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<p style="color: #64748b;">لا توجد محاضرات مرفوعة حالياً.</p>`;
          return;
        }

        container.innerHTML = "";
        data.forEach(lec => {
          const item = document.createElement("div");
          item.className = "lecture-item";
          item.innerHTML = `
            <div>
              <strong style="color: #1e3a8a; font-size: 15px;">${lec.title}</strong>
              <div style="font-size: 12px; color: #64748b;">${lec.chapter || 'بدون باب'}</div>
            </div>
            <button class="delete-btn" onclick="deleteLecture(${lec.id})">حذف 🗑️</button>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="color: #e74c3c;">خطأ في تحميل القائمة.</p>`;
      }
    }
    loadAdminLectures();

    // 3. دالة حذف المحاضرة
    async function deleteLecture(id) {
      if (!confirm("هل أنت متأكد من حذف هذه المحاضرة نهائياً؟")) return;

      try {
        const { error } = await supabaseClient
          .from("videos")
          .delete()
          .eq("id", id);

        if (error) throw error;

        alert("✅ تم حذف المحاضرة بنجاح!");
        loadAdminLectures(); // تحديث القائمة فوراً
      } catch (err) {
        console.error(err);
        alert("❌ خطأ أثناء الحذف: " + err.message);
      }
    }

    // 4. رفع الملفات للسحابة
    async function uploadFileToStorage(file, bucketName) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { data, error } = await supabaseClient.storage.from(bucketName).upload(fileName, file);
      if (error) throw error;
      const { data: { publicUrl } } = supabaseClient.storage.from(bucketName).getPublicUrl(fileName);
      return publicUrl;
    }

    // 5. إضافة محاضرة جديدة
    async function addLecture() {
      const title = document.getElementById("lecTitle").value.trim();
      const chapter = document.getElementById("lecChapter").value.trim();
      const details = document.getElementById("lecDetails").value.trim();
      const homework_url = document.getElementById("lecHomeworkUrl").value.trim();
      const description = document.getElementById("lecDesc").value.trim();
      
      const videoFileInput = document.getElementById("videoFile");
      const pdfFileInput = document.getElementById("pdfFile");
      let video_url = document.getElementById("lecVideoUrl").value.trim();
      let pdf_url = document.getElementById("lecPdfUrl").value.trim();
      
      const status = document.getElementById("lecStatus");

      if (!title) {
        status.style.color = "#e74c3c";
        status.textContent = "❌ يرجى إدخال عنوان المحاضرة على الأقل.";
        return;
      }

      status.style.color = "#1e3a8a";
      status.textContent = "⏳ جاري رفع الملفات ومعالجة البيانات...";

      try {
        if (videoFileInput.files.length > 0) {
          status.textContent = "⏳ جاري رفع الفيديو للسحابة...";
          video_url = await uploadFileToStorage(videoFileInput.files[0], "uploads");
        }

        if (pdfFileInput.files.length > 0) {
          status.textContent = "⏳ جاري رفع المذكرة PDF للسحابة...";
          pdf_url = await uploadFileToStorage(pdfFileInput.files[0], "uploads");
        }

        if (!video_url) {
          throw new Error("يجب اختيار ملف فيديو أو وضع رابط.");
        }

        const { error } = await supabaseClient.from("videos").insert({
          title, chapter, video_url, details, pdf_url, homework_url, description
        });

        if (error) throw error;

        status.style.color = "#026857";
        status.textContent = "✅ تمت إضافة المحاضرة بنجاح!";
        
        document.getElementById("lecTitle").value = "";
        document.getElementById("lecChapter").value = "";
        document.getElementById("lecVideoUrl").value = "";
        document.getElementById("lecDetails").value = "";
        document.getElementById("lecPdfUrl").value = "";
        document.getElementById("lecHomeworkUrl").value = "";
        document.getElementById("lecDesc").value = "";
        videoFileInput.value = "";
        pdfFileInput.value = "";

        loadAdminLectures(); // إعادة تحميل القائمة لتظهر المحاضرة الجديدة

      } catch (err) {
        console.error(err);
        status.style.color = "#e74c3c";
        status.textContent = "❌ خطأ أثناء الرفع: " + err.message;
      }
    }

    // 6. إضافة بطل الفصل
    async function addChampion() {
      const student_name = document.getElementById("champName").value.trim();
      const score = document.getElementById("champScore").value.trim();
      const status = document.getElementById("champStatus");

      if (!student_name) {
        status.style.color = "#e74c3c";
        status.textContent = "❌ يرجى كتابة اسم الطالب.";
        return;
      }

      status.style.color = "#1e3a8a";
      status.textContent = "⏳ جاري الإضافة...";

      try {
        const { error } = await supabaseClient.from("champions").insert({ student_name, score });
        if (error) throw error;
        status.style.color = "#026857";
        status.textContent = "✅ تمت إضافة البطل بنجاح!";
        document.getElementById("champName").value = "";
        document.getElementById("champScore").value = "";
      } catch (err) {
        console.error(err);
        status.style.color = "#e74c3c";
        status.textContent = "❌ خطأ: " + err.message;
      }
    }
    <!-- 💬 قسم الرد على المنتدى (نص أو بصوت) -->
<div class="card">
  <h2>💬 استفسارات الطلاب في المنتدى والرد عليها</h2>
  
  <div id="forumPostsList">
    <p style="text-align: center; color: #64748b;">جاري تحميل الأسئلة...</p>
  </div>
</div>

<style>
  .forum-item {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
  }
  .forum-user {
    font-weight: 700;
    color: #1e3a8a;
    font-size: 15px;
    margin-bottom: 5px;
  }
  .forum-content {
    color: #334155;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .reply-box {
    background: white;
    padding: 12px;
    border-radius: 10px;
    border: 1px dashed #cbd5e1;
    margin-top: 10px;
  }
  .audio-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .btn-mic {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-mic.recording {
    animation: pulse 1s infinite;
    background: #c0392b;
  }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
</style>

<script>
  // متغيرة لتسجيل الصوت
  let mediaRecorder;
  let audioChunks = [];
  let recordedAudioBlob = null;

  // جلب منشورات المنتدى التي تحتاج لرد
  async function loadForumPosts() {
    const container = document.getElementById("forumPostsList");
    try {
      const { data, error } = await supabaseClient
        .from("forum")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = `<p style="text-align:center;">لا توجد أسئلة في المنتدى حالياً.</p>`;
        return;
      }

      container.innerHTML = "";
      data.forEach(post => {
        const hasReply = post.admin_reply_text || post.admin_reply_voice;

        const postDiv = document.createElement("div");
        postDiv.className = "forum-item";
        postDiv.innerHTML = `
          <div class="forum-user">👤 ${post.user_name || 'طالب'}</div>
          <div class="forum-content">❓ ${post.content || ''}</div>
          
          ${hasReply ? `
            <div style="background:#e0f2fe; padding:10px; border-radius:8px; margin-top:10px; color:#0369a1;">
              <strong>الرد الحالي:</strong> ${post.admin_reply_text \vert{}\vert{} ''}${post.admin_reply_voice ? `<br><audio controls src="${post.admin_reply_voice}" style="margin-top:5px; height:35px;"></audio>` : ''}
            </div>
          ` : ''}

          <div class="reply-box">
            <h4 style="font-size:14px; color:#026857; margin-bottom:8px;">إضافة رد (كتابة أو تسجيل صوتي):</h4>
            <textarea id="textReply_${post.id}" placeholder="اكتب ردك هنا..." rows="2" style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;"></textarea>
            
            <div class="audio-controls">
              <button type="button" class="btn-mic" id="micBtn_${post.id}" onclick="toggleRecord('${post.id}')">🎙️ تسجيل فويس</button>
              <span id="micStatus_${post.id}" style="font-size:12px; color:#64748b;">لم يتم التسجيل</span>
              <audio id="audioPreview_${post.id}" controls style="display:none; height:35px;"></audio>
            </div>

            <button type="button" class="btn-submit" onclick="sendReply('${post.id}')" style="margin-top:8px;">إرسال الرد 🚀</button>
          </div>
        `;
        container.appendChild(postDiv);
      });

    } catch (err) {
      container.innerHTML = `<p style="color:red; text-align:center;">حدث خطأ أثناء جلب الأسئلة.</p>`;
    }
  }

  // التحكم في المايك والتسجيل الصوتي
  async function toggleRecord(postId) {
    const micBtn = document.getElementById(`micBtn_${postId}`);
    const micStatus = document.getElementById(`micStatus_${postId}`);
    const audioPreview = document.getElementById(`audioPreview_${postId}`);

    if (mediaRecorder && mediaRecorder.state === "recording") {
      // إيقاف التسجيل
      mediaRecorder.stop();
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎙️ تسجيل فويس";
      micStatus.textContent = "تم التسجيل جاهز للرفع ✓";
    } else {
      // بدء التسجيل
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
          const audioUrl = URL.createObjectURL(recordedAudioBlob);
          audioPreview.src = audioUrl;
          audioPreview.style.display = "inline-block";
        };

        mediaRecorder.start();
        micBtn.classList.add("recording");
        micBtn.textContent = "⏹️ إيقاف التسجيل";
        micStatus.textContent = "جاري التسجيل...";
      } catch (err) {
        alert("يرجى السماح بصلاحيات المايك في المتصفح لاستخدام التسجيل الصوتي!");
      }
    }
  }

  // إرسال الرد إلى Supabase
  async function sendReply(postId) {
    const textReply = document.getElementById(`textReply_${postId}`).value;
    let voiceUrl = null;

    try {
      // 1. رفع الصوت لو فيه تسجيل صوتي
      if (recordedAudioBlob) {
        const fileName = `voice_reply_${postId}_${Date.now()}.mp3`;
        const { data: uploadData, error: uploadErr } = await supabaseClient
          .storage
          .from("uploads")
          .upload(fileName, recordedAudioBlob);

        if (uploadErr) throw uploadErr;

        const { data: publicUrlData } = supabaseClient
          .storage
          .from("uploads")
          .getPublicUrl(fileName);

        voiceUrl = publicUrlData.publicUrl;
      }

      // 2. تحديث المنشور بالرد النصي أو الصوتي
      const { error: updateErr } = await supabaseClient
        .from("forum")
        .update({
          admin_reply_text: textReply,
          admin_reply_voice: voiceUrl
        })
        .eq("id", postId);

      if (updateErr) throw updateErr;

      alert("تم إرسال الرد للجميع بنجاح! 🎉");
      recordedAudioBlob = null;
      loadForumPosts();

    } catch (err) {
      alert("حدث خطأ أثناء الحفظ: " + err.message);
    }
  }

  // تشغيل القائمة
  loadForumPosts();
</script>
  
  </script>

</body>
