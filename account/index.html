<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب الطالب | منصة أرض الأحياء</title>
  <link rel="icon" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif !important;
    }

    body {
      background: #f0f4f8;
      color: #2c3e50;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #026857 0%, #1e3a8a 100%);
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1000;
    }

    .sidebar-top {
      padding: 30px 20px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-box img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    .logo-box h2 {
      font-size: 19px;
      color: #fff;
      font-weight: 700;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      text-decoration: none;
      color: #e2f1ee;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu a:hover, .menu a.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .main {
      margin-right: 270px;
      flex: 1;
      padding: 30px 40px;
    }

    .top-bar {
      background: white;
      padding: 22px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.04);
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }

    .top-bar h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
      max-width: 600px;
    }

    .card h3 {
      color: #1e3a8a;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .info-group {
      margin-bottom: 15px;
      font-size: 15px;
    }

    .info-group label {
      font-weight: 700;
      color: #026857;
      display: inline-block;
      width: 130px;
    }

    .info-group span {
      color: #334155;
    }

    button.logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 15px;
    }

    button.logout-btn:hover {
      background: #c0392b;
    }

    .loading, .error {
      color: #64748b;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 15px; }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-box">
        <img src="../logo.png" alt="شعار">
        <div>
          <h2>أرض الأحياء</h2>
          <p style="font-size: 12px; opacity: 0.85;">ثالثة ثانوي</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../index.html">🏠 الرئيسية</a>
        <a href="../videos/index.html">🎥 المحاضرات</a>
        <a href="../notes/index.html">📚 المذكرات</a>
        <a href="../champion/index.html">🏆 بطل الفصل</a>
        <a href="../forum/index.html">💬 المنتدى</a>
        <a href="index.html" class="active">👤 حساب الطالب</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1>👤 لوحة تحكم حساب الطالب</h1>
    </div>

    <div class="card">
      <h3>بيانات الحساب الشخصي</h3>
      <div id="profileDetails">
        <div class="loading">جاري تحميل بيانات الحساب...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fpfbmjtpzamzlyzitmsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSessionAndLoadProfile() {
      const container = document.getElementById("profileDetails");
      
      try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        
        if (sessionError || !session) {
          container.innerHTML = `
            <div class="error">لم تقم بتسجيل الدخول بعد.</div>
            <a href="../index.html" style="display:inline-block; margin-top:15px; background:#1e3a8a; color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none;">تسجيل الدخول</a>
          `;
          return;
        }

        const user = session.user;
        const userId = user.id;

        // نظام الجلسة الواحدة النشطة
        let currentSessionId = localStorage.getItem("device_session_id");
        if (!currentSessionId) {
          currentSessionId = Math.random().toString(36).substring(2) + Date.now();
          localStorage.setItem("device_session_id", currentSessionId);
          
          await supabaseClient
            .from("profiles")
            .update({ last_active_token: currentSessionId })
            .eq("id", userId);
        }

        // فحص دوري كل 10 ثوانٍ لو تم فتح الحساب من مكان آخر
        setInterval(async () => {
          const { data: profileCheck } = await supabaseClient
            .from("profiles")
            .select("last_active_token")
            .eq("id", userId)
            .maybeSingle();

          if (profileCheck && profileCheck.last_active_token && profileCheck.last_active_token !== currentSessionId) {
            alert("⚠️ تم تسجيل الدخول إلى هذا الحساب من جهاز أو متصفح آخر. سيتم تسجيل خروجك.");
            await supabaseClient.auth.signOut();
            localStorage.removeItem("device_session_id");
            window.location.href = "../index.html";
          }
        }, 10000);

        // جلب بيانات البروفايل
        const { data: profile } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", userId)
          .maybeSingle();

        const fullName = profile?.full_name || profile?.name || "طالب بالمنصة";
        const phone = profile?.phone || profile?.phone_number || "غير متوفر";

        container.innerHTML = `
          <div class="info-group"><label>البريد:</label> <span>${user.email}</span></div>
          <div class="info-group"><label>اسم الطالب:</label> <span>${fullName}</span></div>
          <div class="info-group"><label>رقم الهاتف:</label> <span>${phone}</span></div>
          <button class="logout-btn" onclick="logout()">تسجيل الخروج 🚪</button>
        `;

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="error">حدث خطأ أثناء تحميل البيانات.</div>`;
      }
    }

    async function logout() {
      localStorage.removeItem("device_session_id");
      await supabaseClient.auth.signOut();
      window.location.href = "../index.html";
    }

    checkSessionAndLoadProfile();
  </script>

</body>

</html>
