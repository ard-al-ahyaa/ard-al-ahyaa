<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #087f5b, #0b9b70);
      color: white;
      padding: 18px 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    .header-content {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      padding: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 21px;
    }

    .brand p {
      margin: 3px 0 0;
      opacity: .9;
      font-size: 13px;
    }

    .back-btn {
      border: 0;
      background: white;
      color: #087f5b;
      padding: 10px 15px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .profile-top {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: #e5f7f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .profile-top h2 {
      margin: 12px 0 5px;
      color: #087f5b;
    }

    .profile-top p {
      margin: 0;
      color: #777;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .info-box {
      background: #f7faf9;
      border: 1px solid #e3eee9;
      border-radius: 14px;
      padding: 17px;
    }

    .info-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .info-value {
      font-weight: 700;
      font-size: 16px;
      word-break: break-word;
    }

    .results-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    .results-card h2 {
      margin-top: 0;
      color: #087f5b;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .no-results {
      text-align: center;
      padding: 25px;
      color: #777;
      background: #f7f8fa;
      border-radius: 12px;
    }

    .result-item {
      border: 1px solid #e5e9ed;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 12px;
      background: #fbfcfd;
    }

    .result-name {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .result-details {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .result-badge {
      background: #e7f7f1;
      color: #087f5b;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px 10px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .header-content {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 17px;
      }

      .back-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .profile-card,
      .results-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">

    <div class="brand">
      <img src="../logo.png" alt="منصة أرض الأحياء">
      <div>
        <h1>منصة أرض الأحياء</h1>
        <p>الحساب الشخصي</p>
      </div>
    </div>

    <button class="back-btn" onclick="goHome()">
      🏠 الرئيسية
    </button>

  </div>
</header>

<main>

  <section class="profile-card">

    <div class="profile-top">
      <div class="avatar">👤</div>

      <h2 id="studentName">
        جاري التحميل...
      </h2>

      <p id="accountType">
        جاري التحميل...
      </p>
    </div>

    <div class="info-grid">

      <div class="info-box">
        <div class="info-title">👤 اسم الطالب</div>
        <div class="info-value" id="nameValue">
          جاري التحميل...
        </div>
      </div>

      <div class="info-box">
        <div class="info-title">📱 رقم الهاتف</div>
        <div class="info-value" id="phoneValue">
          جاري التحميل...
        </div>
      </div>

      <div class="info-box">
        <div class="info-title">📧 البريد الإلكتروني</div>
        <div class="info-value" id="emailValue">
          جاري التحميل...
        </div>
      </div>

      <div class="info-box">
        <div class="info-title">🔐 نوع الحساب</div>
        <div class="info-value" id="roleValue">
          جاري التحميل...
        </div>
      </div>

    </div>

  </section>


  <section class="results-card">

    <h2>📊 النتائج والدرجات</h2>

    <div id="resultsContainer">
      <div class="loading">
        جاري تحميل النتائج...
      </div>
    </div>

  </section>

</main>

<footer>
  © منصة أرض الأحياء التعليمية
</footer>


<script>

  /* =========================
     إعدادات Supabase
  ========================= */

  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =========================
     الرجوع للرئيسية
  ========================= */

  function goHome() {
    window.location.href = "../index.html";
  }


  /* =========================
     تحميل الحساب
  ========================= */

  async function loadAccount() {

    try {

      const {
        data: {
          user
        },
        error: authError
      } = await supabaseClient.auth.getUser();


      if (authError) {
        throw authError;
      }


      if (!user) {

        window.location.href = "../index.html";

        return;
      }


      /* =========================
         البيانات الأساسية
      ========================= */

      const email =
        user.email || "غير متوفر";


      const metadata =
        user.user_metadata || {};


      let fullName =
        metadata.full_name ||
        metadata.name ||
        "";


      /* =========================
         جلب بيانات profiles
      ========================= */

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("id, full_name, email, role, phone, created_at")
        .eq("id", user.id)
        .maybeSingle();


      if (profileError) {

        console.error(
          "Profile error:",
          profileError
        );

        document.getElementById("studentName").textContent =
          fullName || email;

        document.getElementById("nameValue").textContent =
          fullName || email;

        document.getElementById("emailValue").textContent =
          email;

        document.getElementById("phoneValue").textContent =
          "غير مضاف";

        document.getElementById("roleValue").textContent =
          "طالب";

        document.getElementById("accountType").textContent =
          "حساب طالب";

        document.getElementById("resultsContainer").innerHTML =
          `
          <div class="error">
            تعذر تحميل بيانات الملف الشخصي.
            <br>
            تأكد من أن حساب الموقع متصل بنفس مشروع Supabase الذي يحتوي على جدول profiles.
          </div>
          `;

        return;
      }


      /* =========================
         استخدام بيانات profile
      ========================= */

      if (profile) {

        fullName =
          profile.full_name ||
          fullName ||
          email;

      }


      const phone =
        profile && profile.phone
          ? profile.phone
          : "غير مضاف";


      const role =
        profile && profile.role
          ? profile.role
          : "student";


      let roleText =
        "طالب";


      if (role === "admin") {
        roleText = "مدير المنصة";
      }

      else if (role === "teacher") {
        roleText = "معلم";
      }


      /* =========================
         عرض البيانات
      ========================= */

      document.getElementById("studentName").textContent =
        fullName;

      document.getElementById("nameValue").textContent =
        fullName;

      document.getElementById("phoneValue").textContent =
        phone;

      document.getElementById("emailValue").textContent =
        profile && profile.email
          ? profile.email
          : email;

      document.getElementById("roleValue").textContent =
        roleText;

      document.getElementById("accountType").textContent =
        roleText;


      /* =========================
         تحميل النتائج
      ========================= */

      await loadResults(user.id);

    }

    catch (error) {

      console.error(
        "Account error:",
        error
      );

      document.getElementById("studentName").textContent =
        "تعذر تحميل الحساب";

      document.getElementById("nameValue").textContent =
        "تعذر التحميل";

      document.getElementById("phoneValue").textContent =
        "غير متوفر";

      document.getElementById("emailValue").textContent =
        "غير متوفر";

      document.getElementById("roleValue").textContent =
        "غير معروف";

      document.getElementById("accountType").textContent =
        "تعذر التحميل";

      document.getElementById("resultsContainer").innerHTML =
        `
        <div class="error">
          حدث خطأ أثناء تحميل الحساب.
          <br>
          ${escapeHtml(error.message || "")}
        </div>
        `;
    }

  }


  /* =========================
     تحميل النتائج
  ========================= */

  async function loadResults(userId) {

    const container =
      document.getElementById(
        "resultsContainer"
      );


    const {
      data,
      error
    } = await supabaseClient
      .from("results")
      .select("*")
      .eq("user_id", userId)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(
        "Results error:",
        error
      );

      container.innerHTML =
        `
        <div class="no-results">
          لا توجد نتائج متاحة حاليًا.
        </div>
        `;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        `
        <div class="no-results">
          📚 لا توجد نتائج أو درجات مسجلة حتى الآن.
        </div>
        `;

      return;
    }


    container.innerHTML =
      data.map(result => {

        const examName =
          result.exam_name ||
          result.name ||
          "اختبار";


        const score =
          result.score ??
          "-";


        const total =
          result.total ??
          "-";


        const percentage =
          result.percentage != null
            ? `${result.percentage}%`
            : "-";


        return `
          <div class="result-item">

            <div class="result-name">
              📝 ${escapeHtml(examName)}
            </div>

            <div class="result-details">

              <span class="result-badge">
                الدرجة: ${escapeHtml(String(score))}/${escapeHtml(String(total))}
              </span>

              <span class="result-badge">
                النسبة: ${escapeHtml(String(percentage))}
              </span>

            </div>

          </div>
        `;

      }).join("");

  }


  /* =========================
     حماية النصوص
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     تشغيل الصفحة
  ========================= */

  loadAccount();

</script>

</body>
</html>
