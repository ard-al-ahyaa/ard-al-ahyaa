<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | منصة أرض الأحياء</title>

  <link rel="icon" type="image/png" href="../favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Tajawal", sans-serif;
      background: #f4f8f6;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: white;
      min-height: 75px;
      padding: 12px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-name {
      color: #047857;
      font-size: 21px;
      font-weight: 800;
    }

    .back-btn {
      border: none;
      background: #047857;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #065f46;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .page-title {
      text-align: center;
      color: #064e3b;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .account-card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-icon {
      width: 85px;
      height: 85px;
      margin: auto;
      border-radius: 50%;
      background: #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 12px;
    }

    .profile-name {
      color: #047857;
      font-size: 24px;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }

    .info-label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .info-value {
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .results-title {
      color: #064e3b;
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th {
      background: #047857;
      color: white;
      padding: 13px;
      text-align: center;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    tr:hover td {
      background: #f0fdf4;
    }

    .no-results {
      background: #f8fafc;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      color: #6b7280;
    }

    .message {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }

    @media (max-width: 650px) {

      header {
        padding: 10px 12px;
      }

      .brand-name {
        font-size: 16px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .back-btn {
        padding: 8px 10px;
        font-size: 13px;
      }

      .account-card {
        padding: 20px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 25px;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="brand">

      <img
        src="../logo.png"
        alt="منصة أرض الأحياء">

      <div class="brand-name">
        منصة أرض الأحياء
      </div>

    </div>

    <button
      class="back-btn"
      onclick="goHome()">
      🏠 الرئيسية
    </button>

  </header>


  <main>

    <h1 class="page-title">
      👤 حسابي
    </h1>

    <div
      id="errorMessage"
      class="message">
    </div>


    <!-- PROFILE -->

    <section class="account-card">

      <div class="profile-header">

        <div class="profile-icon">
          👤
        </div>

        <div
          id="profileName"
          class="profile-name">
          جاري التحميل...
        </div>

      </div>


      <div class="info-grid">

        <div class="info-box">

          <div class="info-label">
            اسم الطالب
          </div>

          <div
            id="fullName"
            class="info-value">
            جاري التحميل...
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            رقم الهاتف
          </div>

          <div
            id="phone"
            class="info-value">
            غير مضاف
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            البريد الإلكتروني
          </div>

          <div
            id="email"
            class="info-value">
            جاري التحميل...
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            نوع الحساب
          </div>

          <div
            id="role"
            class="info-value">
            طالب
          </div>

        </div>

      </div>

    </section>


    <!-- RESULTS -->

    <section class="account-card">

      <h2 class="results-title">
        📊 النتائج والدرجات
      </h2>

      <div
        id="resultsContainer">

        <div class="no-results">
          جاري تحميل النتائج...
        </div>

      </div>

    </section>

  </main>


  <footer>

    © 2026 منصة أرض الأحياء - جميع الحقوق محفوظة

  </footer>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://gvehygqxjqucxwussaye.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================
       HOME
    ========================= */

    function goHome() {

      window.location.href =
        "../index.html";

    }


    /* =========================
       ERROR
    ========================= */

    function showError(message) {

      const box =
        document.getElementById(
          "errorMessage"
        );

      box.textContent = message;

      box.style.display = "block";

    }


    /* =========================
       LOAD ACCOUNT
    ========================= */

    async function loadAccount() {

      try {

        /*
         * الحصول على المستخدم الحالي
         */

        const {
          data: userData,
          error: userError
        } =
          await supabaseClient.auth.getUser();


        if (userError) {

          throw userError;

        }


        const user =
          userData.user;


        if (!user) {

          window.location.href =
            "../index.html";

          return;

        }


        /*
         * بيانات الحساب الأساسية
         */

        document.getElementById(
          "email"
        ).textContent =
          user.email || "غير متوفر";


        let profile = null;


        /*
         * تحميل profile
         */

        const {
          data,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id, full_name, email, role, phone, created_at"
            )
            .eq("id", user.id)
            .maybeSingle();


        if (profileError) {

          throw profileError;

        }


        profile = data;


        /*
         * الاسم
         */

        let fullName =
          profile?.full_name ||
          user.user_metadata?.full_name ||
          user.user_metadata?.name ||
          "";


        if (!fullName) {

          fullName =
            user.email
              ? user.email.split("@")[0]
              : "طالب";

        }


        document.getElementById(
          "profileName"
        ).textContent =
          fullName;


        document.getElementById(
          "fullName"
        ).textContent =
          fullName;


        /*
         * الهاتف
         */

        document.getElementById(
          "phone"
        ).textContent =
          profile?.phone ||
          "غير مضاف";


        /*
         * الدور
         */

        let role =
          profile?.role || "student";


        if (role === "admin") {

          role = "مدير المنصة";

        } else {

          role = "طالب";

        }


        document.getElementById(
          "role"
        ).textContent =
          role;


        /*
         * تحميل النتائج
         */

        await loadResults(user.id);


      } catch (error) {

        console.error(
          "Account error:",
          error
        );

        showError(
          "حدث خطأ أثناء تحميل الحساب: " +
          error.message
        );

      }

    }


    /* =========================
       LOAD RESULTS
    ========================= */

    async function loadResults(userId) {

      const container =
        document.getElementById(
          "resultsContainer"
        );


      const {
        data,
        error
      } =
        await supabaseClient
          .from("results")
          .select(
            "id, exam_name, score, total, percentage, created_at"
          )
          .eq("user_id", userId)
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        /*
         * إذا لم يكن جدول النتائج جاهزًا
         */

        container.innerHTML = `
          <div class="no-results">
            لا توجد نتائج متاحة حاليًا.
          </div>
        `;

        console.log(
          "Results error:",
          error
        );

        return;

      }


      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="no-results">
            لا توجد نتائج حتى الآن.
          </div>
        `;

        return;

      }


      let html = `

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>
                  الاختبار
                </th>

                <th>
                  الدرجة
                </th>

                <th>
                  النسبة
                </th>

                <th>
                  التاريخ
                </th>

              </tr>

            </thead>

            <tbody>
      `;


      data.forEach(function(result) {

        let percentage =
          result.percentage;


        if (
          percentage === null ||
          percentage === undefined
        ) {

          if (
            result.total &&
            result.total > 0
          ) {

            percentage =
              (
                Number(result.score) /
                Number(result.total)
              ) * 100;

          }

        }


        let percentageText =
          percentage !== null &&
          percentage !== undefined
            ? Number(percentage).toFixed(1) + "%"
            : "—";


        let dateText = "—";


        if (result.created_at) {

          dateText =
            new Date(
              result.created_at
            ).toLocaleDateString(
              "ar-EG"
            );

        }


        html += `

          <tr>

            <td>
              ${escapeHTML(
                result.exam_name || "اختبار"
              )}
            </td>

            <td>
              ${escapeHTML(
                String(result.score ?? "—")
              )}
              /
              ${escapeHTML(
                String(result.total ?? "—")
              )}
            </td>

            <td>
              ${percentageText}
            </td>

            <td>
              ${dateText}
            </td>

          </tr>

        `;

      });


      html += `

            </tbody>

          </table>

        </div>

      `;


      container.innerHTML =
        html;

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       START
    ========================= */

    loadAccount();

  </script>

</body>

</html>
