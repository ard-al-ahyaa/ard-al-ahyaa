<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0b5ed7, #084298);
      color: white;
      min-height: 75px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      padding: 3px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      font-size: 12px;
      opacity: .9;
      margin-top: 3px;
    }

    .back-btn {
      background: white;
      color: #084298;
      border: none;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .page-title {
      margin-bottom: 20px;
      color: #084298;
      font-size: 28px;
    }

    .account-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 7px 25px rgba(0, 0, 0, .07);
      margin-bottom: 20px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid #e8edf5;
    }

    .avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #e7f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      flex-shrink: 0;
    }

    .profile-top h2 {
      color: #084298;
      margin-bottom: 5px;
    }

    .profile-top p {
      color: #667085;
      font-size: 14px;
    }

    .info-list {
      display: grid;
      gap: 12px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #edf1f7;
    }

    .info-label {
      font-weight: bold;
      color: #475467;
    }

    .info-value {
      color: #172033;
      font-weight: bold;
      text-align: left;
      word-break: break-word;
    }

    .role-student {
      color: #027a48;
    }

    .role-admin {
      color: #b54708;
    }

    .results-title {
      color: #084298;
      margin-bottom: 18px;
    }

    .result-card {
      background: #f8fafc;
      border: 1px solid #e7ecf3;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .result-card h3 {
      color: #084298;
      margin-bottom: 10px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .result-item {
      background: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .result-item span {
      display: block;
      color: #667085;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .result-item strong {
      font-size: 17px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #667085;
      background: #f8fafc;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #667085;
    }

    .error {
      background: #fff0f1;
      color: #b42318;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    footer {
      margin-top: 40px;
      padding: 22px;
      text-align: center;
      background: #172033;
      color: white;
      font-size: 14px;
    }

    @media (max-width: 650px) {

      header {
        flex-direction: column;
        text-align: center;
      }

      .profile-top {
        flex-direction: column;
        text-align: center;
      }

      .info-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-value {
        text-align: right;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="brand">

      <img src="../logo.png" alt="منصة أرض الأحياء">

      <div>
        <h1>منصة أرض الأحياء</h1>
        <p>الحساب الشخصي</p>
      </div>

    </div>

    <button class="back-btn" onclick="goHome()">
      🏠 الرئيسية
    </button>

  </header>


  <main class="container">

    <h1 class="page-title">
      👤 حسابي
    </h1>

    <div id="accountContent">

      <div class="loading">
        جاري تحميل بيانات الحساب...
      </div>

    </div>

  </main>


  <footer>
    © 2026 منصة أرض الأحياء - جميع الحقوق محفوظة
  </footer>


  <script>

    /* ================= SUPABASE ================= */

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ================= START ================= */

    document.addEventListener(
      "DOMContentLoaded",
      loadAccount
    );


    /* ================= LOAD ACCOUNT ================= */

    async function loadAccount() {

      const container =
        document.getElementById("accountContent");

      try {

        /* الحصول على المستخدم الحالي */

        const {
          data: userData,
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError) {

          console.error(userError);

          showError(
            "حدث خطأ أثناء تحميل الحساب."
          );

          return;

        }


        const user = userData.user;


        if (!user) {

          window.location.href =
            "../index.html";

          return;

        }


        /* ================= USER DATA ================= */

        const metadata =
          user.user_metadata || {};


        /* الاسم */

        let name =
          metadata.full_name ||
          metadata.name ||
          metadata.username ||
          metadata.user_name ||
          "";


        /* الإيميل */

        const email =
          user.email || "غير متوفر";


        /* ================= PROFILE ================= */

        let phone = "";

        let role = "student";


        try {

          const {
            data: profile,
            error: profileError
          } = await supabaseClient
            .from("profiles")
            .select(
              "id, full_name, email, phone, role"
            )
            .eq("id", user.id)
            .maybeSingle();


          if (
            !profileError &&
            profile
          ) {

            /* الاسم من profiles */

            if (
              profile.full_name &&
              profile.full_name.trim()
            ) {

              name =
                profile.full_name;

            }


            /* رقم الهاتف */

            if (
              profile.phone &&
              String(profile.phone).trim()
            ) {

              phone =
                String(profile.phone).trim();

            }


            /* الدور */

            if (profile.role) {

              role =
                profile.role;

            }

          }

        } catch (profileError) {

          console.log(
            "Profile loading error:",
            profileError
          );

        }


        /* ================= PHONE FALLBACK ================= */

        /*
          لو الرقم غير موجود في profiles،
          نحاول الحصول عليه من بيانات Auth.
        */

        if (!phone) {

          phone =
            metadata.phone ||
            metadata.phone_number ||
            "";

        }


        /*
          بعض الحسابات القديمة قد تحتوي
          على phone في user_metadata
        */

        if (!phone && metadata.user_phone) {

          phone =
            metadata.user_phone;

        }


        /* لو الرقم غير موجود */

        if (!phone) {

          phone = "غير مضاف";

        }


        /* ================= NAME FALLBACK ================= */

        if (!name.trim()) {

          if (email) {

            name =
              email.split("@")[0];

          } else {

            name =
              "مستخدم المنصة";

          }

        }


        /* ================= ROLE ================= */

        let roleText = "طالب";

        let roleClass = "role-student";


        if (
          role === "admin" ||
          role === "administrator"
        ) {

          roleText =
            "مدير المنصة";

          roleClass =
            "role-admin";

        } else if (
          role === "teacher"
        ) {

          roleText =
            "معلم";

          roleClass =
            "role-student";

        }


        /* ================= DISPLAY ACCOUNT ================= */

        container.innerHTML = `

          <section class="account-card">

            <div class="profile-top">

              <div class="avatar">
                👤
              </div>

              <div>

                <h2>
                  ${escapeHTML(name)}
                </h2>

                <p>
                  مرحبًا بك في حسابك على منصة أرض الأحياء
                </p>

              </div>

            </div>


            <div class="info-list">

              <div class="info-row">

                <span class="info-label">
                  👤 الاسم
                </span>

                <span class="info-value">
                  ${escapeHTML(name)}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  📧 البريد الإلكتروني
                </span>

                <span class="info-value">
                  ${escapeHTML(email)}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  📱 رقم الهاتف
                </span>

                <span class="info-value">
                  ${escapeHTML(phone)}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  🎓 نوع الحساب
                </span>

                <span class="info-value ${roleClass}">
                  ${escapeHTML(roleText)}
                </span>

              </div>

            </div>

          </section>


          <section class="account-card">

            <h2 class="results-title">
              📊 نتائج الاختبارات
            </h2>

            <div id="resultsContainer">

              <div class="loading">
                جاري تحميل النتائج...
              </div>

            </div>

          </section>

        `;


        /* تحميل النتائج */

        await loadResults(user.id);


      } catch (error) {

        console.error(error);

        showError(
          "حدث خطأ غير متوقع أثناء تحميل الحساب."
        );

      }

    }


    /* ================= LOAD RESULTS ================= */

    async function loadResults(userId) {

      const resultsContainer =
        document.getElementById(
          "resultsContainer"
        );


      if (!resultsContainer) {
        return;
      }


      try {

        const {
          data: results,
          error
        } = await supabaseClient
          .from("results")
          .select(
            "id, exam_name, score, total, percentage, created_at"
          )
          .eq("user_id", userId)
          .order(
            "created_at",
            {
              ascending: false
            }
          );


        if (error) {

          console.log(
            "Results error:",
            error
          );

          resultsContainer.innerHTML = `

            <div class="empty">
              لا توجد نتائج اختبارات مسجلة حاليًا.
            </div>

          `;

          return;

        }


        if (
          !results ||
          results.length === 0
        ) {

          resultsContainer.innerHTML = `

            <div class="empty">
              📚 لا توجد نتائج اختبارات مسجلة حاليًا.
            </div>

          `;

          return;

        }


        resultsContainer.innerHTML =
          results.map(result => {

            const examName =
              result.exam_name ||
              "اختبار";

            const score =
              result.score ?? "-";

            const total =
              result.total ?? "-";

            const percentage =
              result.percentage != null
                ? result.percentage + "%"
                : "-";


            let date = "";

            if (result.created_at) {

              try {

                date =
                  new Date(
                    result.created_at
                  ).toLocaleDateString(
                    "ar-EG"
                  );

              } catch {

                date = "";

              }

            }


            return `

              <div class="result-card">

                <h3>
                  📝 ${escapeHTML(examName)}
                </h3>

                <div class="result-grid">

                  <div class="result-item">

                    <span>
                      الدرجة
                    </span>

                    <strong>
                      ${escapeHTML(String(score))}
                    </strong>

                  </div>


                  <div class="result-item">

                    <span>
                      من
                    </span>

                    <strong>
                      ${escapeHTML(String(total))}
                    </strong>

                  </div>


                  <div class="result-item">

                    <span>
                      النسبة
                    </span>

                    <strong>
                      ${escapeHTML(String(percentage))}
                    </strong>

                  </div>

                </div>


                ${
                  date
                    ? `
                      <div style="
                        margin-top:12px;
                        color:#667085;
                        font-size:13px;
                      ">
                        📅 ${escapeHTML(date)}
                      </div>
                    `
                    : ""
                }

              </div>

            `;

          }).join("");


      } catch (error) {

        console.error(error);

        resultsContainer.innerHTML = `

          <div class="empty">
            لا توجد نتائج اختبارات مسجلة حاليًا.
          </div>

        `;

      }

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ================= ERROR ================= */

    function showError(message) {

      document.getElementById(
        "accountContent"
      ).innerHTML = `

        <div class="error">
          ${escapeHTML(message)}
        </div>

      `;

    }


    /* ================= HOME ================= */

    function goHome() {

      window.location.href =
        "../index.html";

    }

  </script>

</body>

</html>
