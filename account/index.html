<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابي | منصة أرض الأحياء</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../progress.js"></script>

<style>
:root{--green:#008866;--dark:#004e4d;--bg:#f4f7fb;--border:#e4ecf3;--text:#142f50;--muted:#6b7f98}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
[hidden]{display:none!important}

/* ===== الشريط الجانبي (نفس صفحة المحاضرات) ===== */
.sidebar{width:272px;background:linear-gradient(180deg,#004e4d 0%,#003d50 62%,#07375b 100%);color:#fff;position:fixed;right:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:1000;transition:width .25s,transform .25s;overflow:hidden}
.sidebar.collapsed{width:82px}
.sb-inner{padding:17px 15px;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-toggle{width:39px;height:39px;border-radius:50%;border:1px solid #ffffff26;background:#ffffff14;color:#fff;display:grid;place-items:center;margin-bottom:8px}
.sidebar.collapsed .sb-toggle i{transform:rotate(180deg)}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:27px;padding:0 5px 20px;border-bottom:1px solid #ffffff1f}
.brand img{width:83px;height:83px;object-fit:contain}
.brand h2{margin:0;font-size:22px;font-weight:900}
.brand p{margin:0;font-size:13px;color:#d2e8e5}
.menu-label{color:#ffffff88;font-size:10px;font-weight:700;padding:0 12px;margin:0 0 9px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{color:#f0f8f7;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:14px;min-height:51px;white-space:nowrap}
.menu a:hover,.menu a.active{background:linear-gradient(100deg,#13a77c,#159a77);color:#fff}
.menu i{width:25px;font-size:22px;text-align:center}
.menu span{overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .brand h2,.sidebar.collapsed .brand p,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:none}
.sidebar.collapsed .brand img{width:54px;height:54px}
.sidebar.collapsed .menu a{justify-content:center;gap:0;padding:13px 5px}
.overlay{display:none}

/* ===== المحتوى ===== */
.main{margin-right:272px;padding:26px 28px 60px;transition:margin-right .25s;min-width:0}
.main.expanded{margin-right:82px}
.hero{border-radius:22px;padding:26px 30px;color:#fff;background:linear-gradient(120deg,#004e4d,#006e65 45%,#07375b);box-shadow:0 18px 40px #004e4d33;display:flex;align-items:center;gap:14px}
.hero h1{margin:0;font-size:24px;font-weight:900}
.hero p{margin:6px 0 0;font-size:13px;color:#d2e8e5}
.mob-btn{display:none;width:40px;height:40px;border:0;border-radius:11px;background:#ffffff1f;color:#fff;font-size:18px;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px #12375b0d}
.stat i{width:50px;height:50px;border-radius:15px;background:#e5f6ef;color:#087e64;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:24px;font-weight:900;margin-top:3px}

.tabs{display:flex;gap:10px;overflow-x:auto;margin:6px 0 16px}
.tab{flex-shrink:0;border:1px solid #dce9ec;background:#fff;color:#426075;padding:12px 18px;border-radius:14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:9px}
.tab.active{background:linear-gradient(115deg,#087f68,#004e4d);color:#fff;border-color:transparent}

.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px #12375b0d}
.card h3{margin:0 0 14px;font-size:17px;font-weight:900}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input{width:100%;height:46px;border:1px solid #dfe9f5;border-radius:11px;padding:10px 13px;background:#fbfdff;font-size:14px;outline:none}
.field input:focus{border-color:#0b9b74}
.field input[readonly]{background:#f2f6fb;color:#637b9b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:0;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(110deg,#008866,#006e65)}
.btn.ghost{background:#fff;color:#34536c;border:1px solid #dce8ef}
.btn.danger{background:#fff0f0;color:#d83e4c}
.msg{margin-top:12px;padding:11px 13px;border-radius:11px;font-size:13px;display:none}
.msg.ok{display:block;background:#e8f8f0;color:#087b50}
.msg.err{display:block;background:#fff0f0;color:#b52b3c}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;border:1px solid #e1eee8;border-radius:12px;margin-bottom:10px}
.item strong{font-size:14px}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-ok{background:#e4f7ee;color:#08734f}
.b-bad{background:#ffeded;color:#b52b3c}
.b-todo{background:#edf5ff;color:#245a9d}
.muted{color:var(--muted);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d8e3ec;border-radius:14px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cat-btn{padding:9px 12px;border-radius:11px;border:1px solid #dce8ef;background:#fff;font-weight:800;font-size:12px;color:#34536c}
.cat-btn.on{background:#008866;color:#fff;border-color:#008866}
.q{border-right:4px solid #008866;background:#f9fcfb;padding:12px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.8}
.q.bad{border-color:#d83e4c}

@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.collapsed{width:272px}
  .sidebar.collapsed .brand h2,.sidebar.collapsed .brand p,.sidebar.collapsed .menu-label,.sidebar.collapsed .menu span{display:initial}
  .sidebar.collapsed .brand img{width:83px;height:83px}
  .sidebar.collapsed .menu a{justify-content:flex-start;gap:14px;padding:12px 14px}
  body.m-open .sidebar{transform:none}
  .overlay{position:fixed;inset:0;background:#0007;z-index:900}
  body.m-open .overlay{display:block}
  .main,.main.expanded{margin-right:0;padding:14px}
  .mob-btn{display:grid;place-items:center}
  .hero{padding:20px}
  .hero h1{font-size:19px}
  .stats{gap:10px}
  .stat{padding:12px}
  .stat b{font-size:20px}
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-inner">
    <button class="sb-toggle" id="sbToggle" type="button" aria-label="تصغير القائمة"><i class="fa-solid fa-angles-right"></i></button>
    <div class="brand"><img src="../logo.png" alt=""><div><h2>أرض الأحياء</h2><p>الثانوية العامة</p></div></div>
    <p class="menu-label">القائمة الرئيسية</p>
    <nav class="menu">
      <a href="../index.html"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
      <a href="../videos/index.html"><i class="fa-regular fa-circle-play"></i><span>المحاضرات</span></a>
      <a href="../notes/index.html"><i class="fa-regular fa-book-open"></i><span>المذكرات</span></a>
      <a href="../champion/index.html"><i class="fa-solid fa-trophy"></i><span>بطل الفصل</span></a>
      <a href="../forum/index.html"><i class="fa-regular fa-comments"></i><span>المنتدى</span></a>
      <a href="index.html" class="active"><i class="fa-regular fa-user"></i><span>حسابي</span></a>
    </nav>
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main" id="main">
  <header class="hero">
    <button class="mob-btn" id="mobBtn" type="button" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
    <div>
      <h1 id="hName">حسابي</h1>
      <p>بياناتك ونتائجك واشتراكاتك في مكان واحد.</p>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><i class="fa-regular fa-bookmark"></i><div><span>محاضرات محفوظة</span><b id="sSaved">—</b></div></div>
    <div class="stat"><i class="fa-solid fa-circle-check"></i><div><span>محاضرات مكتملة</span><b id="sDone">—</b></div></div>
    <div class="stat"><i class="fa-solid fa-circle-play"></i><div><span>إجمالي المحاضرات</span><b id="sTotal">—</b></div></div>
    <div class="stat"><i class="fa-solid fa-file-circle-check"></i><div><span>اختبارات مسلّمة</span><b id="sExams">—</b></div></div>
  </section>

  <nav class="tabs">
    <button class="tab active" type="button" data-tab="profile"><i class="fa-regular fa-user"></i> بياناتي</button>
    <button class="tab" type="button" data-tab="results"><i class="fa-solid fa-square-poll-vertical"></i> نتائجي</button>
    <button class="tab" type="button" data-tab="subs"><i class="fa-solid fa-crown"></i> اشتراكاتي</button>
  </nav>

  <section id="pane-profile">
    <div class="card">
      <h3>البيانات الشخصية</h3>
      <div class="field"><label>الاسم</label><input id="fName" readonly></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="fEmail" readonly></div>
      <div class="field"><label for="fPhone">رقم الهاتف</label><input id="fPhone" type="tel" maxlength="25" placeholder="أدخل رقم الهاتف"></div>
      <button class="btn" id="saveProfile" type="button"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
      <div class="msg" id="profileMsg"></div>
    </div>
    <div class="card">
      <h3>الحساب</h3>
      <button class="btn danger" id="logoutBtn" type="button"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
    </div>
  </section>

  <section id="pane-results" hidden>
    <div id="resultsList"><p class="muted">جارٍ التحميل...</p></div>
  </section>

  <section id="pane-subs" hidden>
    <div id="subsBox"><p class="muted">جارٍ التحميل...</p></div>
  </section>
</main>

<script>
"use strict";

const SB_URL="https://fpfbmjtpzamzlyzitmsd.supabase.co";
const SB_KEY="sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"ardAlahyaaAuth"}
});

const $=id=>document.getElementById(id);
const LOGIN_URL="../login/index.html";
const SUBSCRIPTION_URL="../subscriptions/index.html";
const LOGIN_AT_KEY="ardLoginAt";
const SESSION_MAX_MS=24*60*60*1000;
let user=null;

function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function errText(e){return [e?.message,e?.details,e?.hint].filter(Boolean).join(" | ")||"خطأ غير معروف"}
function showMsg(id,text,type){const m=$(id);m.textContent=text;m.className="msg "+type}

/* ================= الجلسة (24 ساعة) ================= */
function sessionAgeOk(){
  let at=Number(localStorage.getItem(LOGIN_AT_KEY));
  if(!at){at=Date.now();localStorage.setItem(LOGIN_AT_KEY,String(at))}
  return Date.now()-at<SESSION_MAX_MS;
}
async function expireSession(){
  try{await sb.auth.signOut()}catch{}
  localStorage.removeItem(LOGIN_AT_KEY);
  location.replace(LOGIN_URL);
}
async function requireSession(){
  const {data}=await sb.auth.getSession();
  const u=data?.session?.user;
  if(!u){location.replace(LOGIN_URL);return null}
  if(!sessionAgeOk()){await expireSession();return null}
  return u;
}
setInterval(()=>{if(!sessionAgeOk())expireSession()},5*60*1000);

/* ================= الشريط الجانبي ================= */
function applySidebar(c){
  $("sidebar").classList.toggle("collapsed",c);
  $("main").classList.toggle("expanded",c);
  try{localStorage.setItem("ardAlahyaaSidebarCollapsed",String(c))}catch{}
}
function setupSidebar(){
  applySidebar(localStorage.getItem("ardAlahyaaSidebarCollapsed")==="true");
  $("sbToggle").onclick=()=>{
    if(innerWidth<=768){document.body.classList.toggle("m-open");return}
    applySidebar(!$("sidebar").classList.contains("collapsed"));
  };
  $("mobBtn").onclick=()=>document.body.classList.add("m-open");
  $("overlay").onclick=()=>document.body.classList.remove("m-open");
}

/* ================= التبويبات ================= */
document.querySelectorAll("[data-tab]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));
    ["profile","results","subs"].forEach(n=>{$("pane-"+n).hidden=n!==b.dataset.tab});
  };
});

/* ================= البيانات الشخصية ================= */
async function loadProfile(){
  const {data,error}=await sb.from("profiles").select("full_name,phone").eq("id",user.id).maybeSingle();
  if(error)console.warn(error);
  const name=data?.full_name||user.user_metadata?.full_name||user.email||"الطالب";
  $("hName").textContent="أهلاً، "+name;
  $("fName").value=name;
  $("fEmail").value=user.email||"";
  $("fPhone").value=data?.phone||"";
}

async function saveProfile(){
  const phone=$("fPhone").value.trim();
  if(phone.length>25){showMsg("profileMsg","رقم الهاتف طويل أكثر من اللازم","err");return}
  if(!navigator.onLine){showMsg("profileMsg","لا يوجد اتصال بالإنترنت","err");return}
  const {error}=await sb.from("profiles").update({phone:phone||null}).eq("id",user.id);
  if(error){showMsg("profileMsg","تعذر الحفظ: "+errText(error),"err");return}
  showMsg("profileMsg","تم حفظ رقم الهاتف بنجاح","ok");
}

/* ================= الإحصائيات ================= */
async function loadStats(){
  const [tot,att]=await Promise.all([
    sb.from("lectures").select("id",{count:"exact",head:true}),
    sb.from("assessment_attempts").select("id",{count:"exact",head:true}).eq("student_id",user.id)
  ]);
  $("sTotal").textContent=tot.count??"—";
  $("sExams").textContent=att.count??"—";
  try{
    if(window.ArdProgress){
      await ArdProgress.init(sb);
      const rows=(await ArdProgress.fetchAll())||[];
      $("sSaved").textContent=rows.filter(r=>r.saved).length;
      $("sDone").textContent=rows.filter(r=>r.completed).length;
    }
  }catch(e){console.warn(e)}
}

/* ================= النتائج ================= */
function buildResult(at){
  const review=Array.isArray(at.answers)?at.answers:[];
  const cats={
    "الأسئلة المحلولة":review.filter(x=>x.selected_answer),
    "الأسئلة الغير محلولة":review.filter(x=>!x.selected_answer),
    "الأسئلة الصحيحة":review.filter(x=>x.selected_answer&&x.selected_answer===x.correct_answer),
    "الأسئلة الخاطئة":review.filter(x=>x.selected_answer&&x.selected_answer!==x.correct_answer)
  };
  const wrap=document.createElement("div");
  wrap.style.marginTop="12px";
  wrap.innerHTML=`<div class="cats"></div><div class="cat-list"></div>`;
  const catsBox=wrap.querySelector(".cats");
  const list=wrap.querySelector(".cat-list");

  Object.entries(cats).forEach(([name,items])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="cat-btn";
    b.textContent=`${name} (${items.length})`;
    b.onclick=()=>{
      const wasOn=b.classList.contains("on");
      catsBox.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("on"));
      if(wasOn){list.innerHTML="";return}
      b.classList.add("on");
      list.innerHTML=items.length
        ?items.map((q,n)=>`<div class="q ${q.selected_answer&&q.selected_answer!==q.correct_answer?"bad":""}">
            <strong>س${n+1}: ${esc(q.question_text||"")}</strong>
            <div>إجابتك: ${esc(q.selected_answer||"لم تُجب")} — الصحيحة: <b>${esc(q.correct_answer||"")}</b></div>
            ${q.explanation?`<div style="margin-top:6px">${esc(q.explanation)}</div>`:""}
          </div>`).join("")
        :'<p class="muted" style="margin-top:10px">لا توجد أسئلة في هذا القسم.</p>';
    };
    catsBox.appendChild(b);
  });
  return wrap;
}

async function loadResults(){
  const box=$("resultsList");
  const {data:att,error}=await sb.from("assessment_attempts")
    .select("assessment_id,score,max_score,answers,submitted_at")
    .eq("student_id",user.id)
    .order("submitted_at",{ascending:false});

  if(error){box.innerHTML=`<div class="empty">تعذر تحميل النتائج: ${esc(errText(error))}</div>`;return}
  if(!att?.length){box.innerHTML='<div class="empty">لم تسلّم أي امتحان أو واجب بعد.</div>';return}

  const ids=att.map(a=>a.assessment_id);
  const {data:info}=await sb.from("lecture_assessments").select("id,title,assessment_type").in("id",ids);
  const map=new Map((info||[]).map(a=>[String(a.id),a]));

  box.innerHTML="";
  att.forEach(a=>{
    const i=map.get(String(a.assessment_id))||{};
    const pct=a.max_score>0?Math.round(a.score*100/a.max_score):0;
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="item" style="margin:0">
        <div>
          <strong>${esc(i.title||"اختبار")}</strong>
          <small>${i.assessment_type==="homework"?"واجب":"امتحان"} • ${esc(new Date(a.submitted_at).toLocaleDateString("ar-EG"))}</small>
        </div>
        <span class="badge ${pct>=50?"b-ok":"b-bad"}">${esc(a.score)} / ${esc(a.max_score)} (${pct}%)</span>
      </div>
      <button class="btn ghost" type="button" style="margin-top:12px">عرض التفاصيل</button>
      <div class="det"></div>`;
    const det=card.querySelector(".det");
    card.querySelector("button").onclick=()=>{
      if(det.childElementCount){det.innerHTML="";return}
      det.appendChild(buildResult(a));
    };
    box.appendChild(card);
  });
}

/* ================= الاشتراكات ================= */
async function loadSubs(){
  const now=new Date().toISOString();
  const [acc,gr,req,ms]=await Promise.all([
    sb.from("student_access").select("month_id,term_code").eq("student_id",user.id),
    sb.from("student_subscription_grants").select("month_id,term_code,expires_at").eq("student_id",user.id).gt("expires_at",now),
    sb.from("subscription_requests").select("created_at,package_type,amount_egp,status").eq("student_id",user.id).order("created_at",{ascending:false}).limit(20),
    sb.from("lecture_months").select("id,title,term_code")
  ]);

  const months=ms.data||[];
  const name=(mid,tc)=>{
    const m=months.find(x=>String(x.id)===String(mid));
    return m?.title||(tc?"ترم "+tc:"اشتراك");
  };

  const rows=[
    ...(acc.data||[]).map(a=>({n:name(a.month_id,a.term_code),t:"مفعّل"})),
    ...(gr.data||[]).map(g=>({n:name(g.month_id,g.term_code),t:"منحة حتى "+new Date(g.expires_at).toLocaleDateString("ar-EG")}))
  ];
  const statusTxt={pending:"قيد المراجعة",approved:"تمت الموافقة",rejected:"مرفوض"};
  const reqs=req.data||[];

  $("subsBox").innerHTML=`
    <div class="card">
      <h3>اشتراكاتي</h3>
      ${rows.length?rows.map(r=>`<div class="item"><strong>${esc(r.n)}</strong><span class="badge b-ok">${esc(r.t)}</span></div>`).join("")
        :'<p class="muted">لا توجد اشتراكات مفعّلة حاليًا.</p>'}
      <a class="btn" href="${SUBSCRIPTION_URL}" style="margin-top:10px"><i class="fa-solid fa-crown"></i> ترقية / تجديد</a>
    </div>
    <div class="card">
      <h3>طلبات الاشتراك</h3>
      ${reqs.length?reqs.map(r=>`<div class="item">
          <div><strong>${r.package_type==="term"?"اشتراك ترم":"اشتراك شهر"}</strong>
          <small>${esc(new Date(r.created_at).toLocaleDateString("ar-EG"))} • ${esc(r.amount_egp??"—")} جنيه</small></div>
          <span class="badge ${r.status==="approved"?"b-ok":r.status==="rejected"?"b-bad":"b-todo"}">${statusTxt[r.status]||esc(r.status)}</span>
        </div>`).join(""):'<p class="muted">لم ترسل أي طلبات بعد.</p>'}
    </div>`;
}

/* ================= بدء الصفحة ================= */
async function init(){
  user=await requireSession();
  if(!user)return;
  setupSidebar();

  $("saveProfile").onclick=saveProfile;
  $("logoutBtn").onclick=async()=>{
    if(!confirm("هل تريد تسجيل الخروج؟"))return;
    try{await sb.auth.signOut()}catch{}
    localStorage.removeItem(LOGIN_AT_KEY);
    location.replace(LOGIN_URL);
  };

  await Promise.allSettled([loadProfile(),loadStats(),loadResults(),loadSubs()]);
}

init();
</script>
