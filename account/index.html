<script>
  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  function goHome() {
    window.location.href = "../index.html";
  }


  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  async function loadAccount() {

    try {

      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();


      if (error) {
        throw error;
      }


      if (!user) {
        window.location.href = "../index.html";
        return;
      }


      /*
       * =================================
       * اسم الحساب من تسجيل الدخول فقط
       * =================================
       */

      const metadata = user.user_metadata || {};

      let loginName =
        metadata.full_name ||
        metadata.name ||
        metadata.username ||
        metadata.user_name ||
        "";


      /*
       * لو مفيش اسم محفوظ في بيانات الدخول
       * نستخدم جزء من البريد الإلكتروني
       */

      if (!loginName.trim()) {

        if (user.email) {

          loginName =
            user.email.split("@")[0];

        } else {

          loginName = "مستخدم المنصة";

        }
      }


      /*
       * البريد الإلكتروني من حساب تسجيل الدخول
       */

      const email =
        user.email || "غير متوفر";


      /*
       * =================================
       * بيانات إضافية من profiles
       * =================================
       *
       * هنا نقرأ الهاتف والدور فقط.
       * ممنوع profiles.full_name يغير اسم الحساب.
       */

      let phone = "غير مضاف";
      let role = "student";


      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("id, email, role, phone")
        .eq("id", user.id)
        .maybeSingle();


      if (!profileError && profile) {

        if (profile.phone) {
          phone = profile.phone;
        }

        if (profile.role) {
          role = profile.role;
        }
      }


      /*
       * =================================
       * نوع الحساب
       * =================================
       */

      let roleText = "طالب";


      if (role === "admin") {
        roleText = "مدير المنصة";
      }

      else if (role === "teacher") {
        roleText = "معلم";
      }


      /*
       * =================================
       * عرض الاسم
       * =================================
       *
       * الاسم هنا من تسجيل الدخول فقط
       */

      document.getElementById("studentName").textContent =
        loginName;

      document.getElementById("nameValue").textContent =
        loginName;


      /*
       * البريد
       */

      document.getElementById("emailValue").textContent =
        email;


      /*
       * الهاتف
       */

      document.getElementById("phoneValue").textContent =
        phone;


      /*
       * نوع الحساب
       */

      document.getElementById("roleValue").textContent =
        roleText;

      document.getElementById("accountType").textContent =
        roleText;


      /*
       * =================================
       * النتائج
       * =================================
       */

      await loadResults(user.id);

    }

    catch (error) {

      console.error(
        "Account error:",
        error
      );


      document.getElementById("studentName").textContent =
        "تعذر تحميل الحساب";

      document.getElementById("nameValue").textContent =
        "تعذر التحميل";

      document.getElementById("phoneValue").textContent =
        "غير متوفر";

      document.getElementById("emailValue").textContent =
        "غير متوفر";

      document.getElementById("roleValue").textContent =
        "غير معروف";

      document.getElementById("accountType").textContent =
        "غير معروف";

      document.getElementById("resultsContainer").innerHTML =
        `
        <div class="error">
          حدث خطأ أثناء تحميل الحساب.
          <br>
          ${escapeHtml(error.message)}
        </div>
        `;
    }
  }


  async function loadResults(userId) {

    const container =
      document.getElementById("resultsContainer");


    const {
      data,
      error
    } = await supabaseClient
      .from("results")
      .select("*")
      .eq("user_id", userId)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(
        "Results error:",
        error
      );

      container.innerHTML =
        `
        <div class="no-results">
          📚 لا توجد نتائج متاحة حاليًا.
        </div>
        `;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        `
        <div class="no-results">
          📚 لا توجد نتائج أو درجات مسجلة حتى الآن.
        </div>
        `;

      return;
    }


    container.innerHTML =
      data.map(result => {

        const examName =
          result.exam_name ||
          result.name ||
          "اختبار";

        const score =
          result.score ?? "-";

        const total =
          result.total ?? "-";

        const percentage =
          result.percentage != null
            ? `${result.percentage}%`
            : "-";


        return `
          <div class="result-item">

            <div class="result-name">
              📝 ${escapeHtml(examName)}
            </div>

            <div class="result-details">

              <span class="result-badge">
                الدرجة:
                ${escapeHtml(String(score))}
                /
                ${escapeHtml(String(total))}
              </span>

              <span class="result-badge">
                النسبة:
                ${escapeHtml(String(percentage))}
              </span>

            </div>

          </div>
        `;

      }).join("");
  }


  loadAccount();

</script>
