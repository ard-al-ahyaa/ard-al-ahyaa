<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المذكرات | منصة أرض الأحياء</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #0f5132;
      color: white;
      padding: 18px 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    header h1 {
      font-size: 23px;
    }

    header p {
      font-size: 13px;
      opacity: .8;
      margin-top: 5px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top {
      background: white;
      border-radius: 17px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .top h2 {
      color: #0f5132;
      margin-bottom: 8px;
    }

    .top p {
      color: #777;
      font-size: 14px;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .note {
      background: white;
      border-radius: 17px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      transition: .2s;
    }

    .note:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 22px rgba(0,0,0,.1);
    }

    .pdf-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: #e8f5ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .note h3 {
      color: #0f5132;
      font-size: 17px;
      line-height: 1.6;
      word-break: break-word;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      padding: 11px 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .open {
      background: #198754;
      color: white;
    }

    .download {
      background: #e9ecef;
      color: #333;
    }

    .status {
      background: white;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #777;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .error {
      color: #842029;
      background: #f8d7da;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #198754;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 19px;
      }

      .notes-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <img
      src="../logo.png"
      class="logo"
      alt="منصة أرض الأحياء"
      onerror="this.style.display='none'"
    >

    <div>
      <h1>منصة أرض الأحياء</h1>
      <p>المذكرات التعليمية</p>
    </div>

  </div>

</header>


<main class="container">

  <section class="top">

    <h2>📚 المذكرات</h2>

    <p>
      جميع المذكرات والملفات التعليمية المتاحة للطلاب.
    </p>

  </section>


  <div
    id="status"
    class="status"
  >
    ⏳ جاري تحميل المذكرات...
  </div>


  <div
    id="notesGrid"
    class="notes-grid"
  ></div>


  <a
    href="../index.html"
    class="back"
  >
    ← العودة إلى الرئيسية
  </a>

</main>


<script>

  /* ==========================================
     Supabase الجديد
     ========================================== */

  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  const BUCKET =
    "lectures";


  const status =
    document.getElementById("status");

  const notesGrid =
    document.getElementById("notesGrid");


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function loadNotes() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .list(
            "pdf",
            {
              limit: 1000,
              sortBy: {
                column: "created_at",
                order: "desc"
              }
            }
          );


      if (error) {

        throw error;

      }


      const files =
        (data || [])
          .filter(
            file =>
              file.name &&
              file.name
                .toLowerCase()
                .endsWith(".pdf")
          );


      if (!files.length) {

        status.className =
          "status";

        status.textContent =
          "📚 لا توجد مذكرات حاليًا.";

        return;

      }


      status.style.display =
        "none";


      notesGrid.innerHTML =
        "";


      files.forEach(file => {

        const {
          data: urlData
        } =
          supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
              "pdf/" + file.name
            );


        const url =
          urlData.publicUrl;


        const card =
          document.createElement("div");

        card.className =
          "note";


        card.innerHTML = `

          <div class="pdf-icon">
            📕
          </div>

          <h3>
            ${escapeHtml(file.name)}
          </h3>

          <div class="buttons">

            <a
              class="btn open"
              href="${escapeHtml(url)}"
              target="_blank"
              rel="noopener"
            >
              📖 فتح المذكرة
            </a>

            <a
              class="btn download"
              href="${escapeHtml(url)}"
              target="_blank"
              rel="noopener"
              download
            >
              ⬇️ تحميل
            </a>

          </div>

        `;


        notesGrid.appendChild(card);

      });

    }
    catch (error) {

      console.error(error);


      status.className =
        "status error";


      status.innerHTML =
        `
        ❌ تعذر تحميل المذكرات.

        <br><br>

        ${escapeHtml(error.message)}
        `;

    }

  }


  loadNotes();

</script>

</body>
</html>
