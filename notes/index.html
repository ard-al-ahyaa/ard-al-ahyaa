<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المذكرات | منصة أرض الأحياء</title>

  <meta name="description"
    content="مذكرات وملخصات أحياء الصف الثالث الثانوي على منصة أرض الأحياء.">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
    href="https://ard-al-ahyaa.github.io/ard-al-ahyaa/notes/">

  <link rel="icon" href="../favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7f7;
      color: #222;
    }

    /* ===============================
       الشريط الجانبي
       =============================== */

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #075e4d;
      color: white;
      padding: 25px 15px;
      z-index: 1000;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-box img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .logo-box h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .logo-box p {
      font-size: 13px;
      opacity: 0.8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      text-decoration: none;
      color: white;
      padding: 14px 15px;
      border-radius: 10px;
      transition: 0.2s;
      font-size: 15px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* ===============================
       المحتوى
       =============================== */

    .main {
      margin-right: 250px;
      padding: 30px;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .topbar h1 {
      color: #075e4d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .topbar p {
      color: #666;
      font-size: 15px;
    }

    /* ===============================
       المذكرات
       =============================== */

    .notes-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      color: #075e4d;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .notes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .note-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: white;
      overflow: hidden;
      transition: 0.2s;
    }

    .note-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
    }

    .note-header {
      height: 150px;
      background: linear-gradient(
        135deg,
        #075e4d,
        #0b806a
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 55px;
    }

    .note-content {
      padding: 18px;
    }

    .note-content h3 {
      color: #075e4d;
      font-size: 19px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .note-content p {
      color: #666;
      font-size: 13px;
      line-height: 1.7;
    }

    .note-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .note-btn {
      display: inline-block;
      text-decoration: none;
      background: #075e4d;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }

    .note-btn:hover {
      background: #064c3f;
    }

    .note-btn.download {
      background: #555;
    }

    .note-btn.download:hover {
      background: #333;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      font-size: 16px;
      grid-column: 1 / -1;
    }

    .error {
      color: #b00020;
    }

    .security-message {
      text-align: center;
      padding: 25px;
      border-radius: 12px;
      background: #fff8e1;
      color: #795548;
      border: 1px solid #ffe082;
      grid-column: 1 / -1;
    }

    .login-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      background: #075e4d;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    /* ===============================
       الموبايل
       =============================== */

    @media (max-width: 700px) {

      .sidebar {
        width: 75px;
        padding: 20px 8px;
      }

      .logo-box h2,
      .logo-box p {
        display: none;
      }

      .logo-box img {
        width: 55px;
        height: 55px;
      }

      .menu a {
        text-align: center;
        font-size: 0;
        padding: 14px 5px;
      }

      .menu a::first-letter {
        font-size: 20px;
      }

      .main {
        margin-right: 75px;
        padding: 15px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .notes-list {
        grid-template-columns: 1fr;
      }

      .note-header {
        height: 170px;
      }
    }
  </style>
</head>

<body>

  <!-- ===============================
       الشريط الجانبي
       =============================== -->

  <aside class="sidebar">

    <div class="logo-box">

      <img
        src="../logo.png"
        alt="شعار منصة أرض الأحياء">

      <h2>منصة أرض الأحياء</h2>

      <p>منصة تعليمية</p>

    </div>

    <nav class="menu">

      <a href="../index.html">
        🏠 الرئيسية
      </a>

      <a href="../videos/index.html">
        🎥 المحاضرات
      </a>

      <a href="../forum/index.html">
        💬 المنتدى
      </a>

      <a href="index.html" class="active">
        📚 المذكرات
      </a>

    </nav>

  </aside>


  <!-- ===============================
       المحتوى
       =============================== -->

  <main class="main">

    <div class="topbar">

      <h1>📚 المذكرات</h1>

      <p>
        مذكرات أحياء الصف الثالث الثانوي
      </p>

    </div>


    <section class="notes-container">

      <h2 class="section-title">
        مذكرات الأحياء
      </h2>

      <div
        id="notesList"
        class="notes-list">

        <div class="loading">
          جاري تحميل المذكرات...
        </div>

      </div>

    </section>

  </main>


  <!-- ===============================
       Supabase
       =============================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =====================================================
       إعداد Supabase - المشروع الحالي
       ===================================================== */

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";

    const BUCKET =
      "lectures";


    /*
      مدة Signed URL:

      30 دقيقة
    */

    const SIGNED_URL_TIME =
      30 * 60;


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       رسالة تسجيل الدخول
       ===================================================== */

    function showLoginMessage() {

      const notesList =
        document.getElementById(
          "notesList"
        );

      notesList.innerHTML = "";


      const box =
        document.createElement("div");


      box.className =
        "security-message";


      box.innerHTML = `

        <strong>
          🔐 المحتوى محمي
        </strong>

        <br>

        يجب تسجيل الدخول إلى منصة
        أرض الأحياء لمشاهدة المذكرات.

        <br>

        <a
          class="login-btn"
          href="../login/index.html">

          🔑 تسجيل الدخول

        </a>

      `;


      notesList.appendChild(
        box
      );

    }


    /* =====================================================
       التحقق من نوع الرابط
       ===================================================== */

    function isExternalUrl(value) {

      if (!value) {
        return false;
      }


      return (
        value.startsWith("http://") ||
        value.startsWith("https://")
      );

    }


    /* =====================================================
       إنشاء Signed URL للمذكرة
       ===================================================== */

    async function getSecureNoteUrl(
      filePath
    ) {

      if (!filePath) {

        throw new Error(
          "مسار المذكرة غير موجود"
        );

      }


      /*
        لو كان رابطًا خارجيًا
        نستخدمه كما هو.
      */

      if (
        isExternalUrl(filePath)
      ) {

        return filePath;

      }


      /*
        لو كان مسارًا داخل
        Private Bucket

        مثال:

        pdf/1750000000000_xxxxx.pdf

        ننشئ Signed URL مؤقت.
      */

      const {
        data,
        error
      } = await supabaseClient
        .storage
        .from(BUCKET)
        .createSignedUrl(
          filePath,
          SIGNED_URL_TIME
        );


      if (error) {

        console.error(
          "Signed URL Error:",
          error
        );

        throw error;

      }


      if (
        !data ||
        !data.signedUrl
      ) {

        throw new Error(
          "تعذر إنشاء الرابط الآمن للمذكرة"
        );

      }


      return data.signedUrl;

    }


    /* =====================================================
       إضافة مذكرة
       ===================================================== */

    async function createNoteCard(
      note
    ) {

      const card =
        document.createElement("div");


      card.className =
        "note-card";


      /* ===============================
         رأس المذكرة
         =============================== */

      const header =
        document.createElement("div");


      header.className =
        "note-header";


      header.textContent =
        "📖";


      /* ===============================
         محتوى المذكرة
         =============================== */

      const content =
        document.createElement("div");


      content.className =
        "note-content";


      const title =
        document.createElement("h3");


      title.textContent =
        note.title ||
        "مذكرة بدون عنوان";


      const description =
        document.createElement("p");


      description.textContent =
        "مذكرة أحياء للصف الثالث الثانوي";


      /* ===============================
         الأزرار
         =============================== */

      const buttons =
        document.createElement("div");


      buttons.className =
        "note-buttons";


      const openButton =
        document.createElement("a");


      openButton.className =
        "note-btn";


      openButton.textContent =
        "📖 فتح المذكرة";


      const downloadButton =
        document.createElement("a");


      downloadButton.className =
        "note-btn download";


      downloadButton.textContent =
        "⬇️ تحميل";


      /* ===============================
         إنشاء الرابط الآمن
         =============================== */

      try {

        const secureUrl =
          await getSecureNoteUrl(
            note.file_path
          );


        /*
          زر فتح المذكرة
        */

        openButton.href =
          secureUrl;


        openButton.target =
          "_blank";


        openButton.rel =
          "noopener noreferrer";


        /*
          زر التحميل
        */

        downloadButton.href =
          secureUrl;


        downloadButton.target =
          "_blank";


        downloadButton.rel =
          "noopener noreferrer";


        downloadButton.setAttribute(
          "download",
          ""
        );

      }

      catch (error) {

        console.error(
          "Note URL Error:",
          error
        );


        openButton.href =
          "#";


        downloadButton.href =
          "#";


        openButton.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            alert(
              "تعذر فتح المذكرة حاليًا. حاول تحديث الصفحة."
            );

          }
        );


        downloadButton.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            alert(
              "تعذر تحميل المذكرة حاليًا. حاول تحديث الصفحة."
            );

          }
        );

      }


      buttons.appendChild(
        openButton
      );


      buttons.appendChild(
        downloadButton
      );


      content.appendChild(
        title
      );


      content.appendChild(
        description
      );


      content.appendChild(
        buttons
      );


      card.appendChild(
        header
      );


      card.appendChild(
        content
      );


      return card;

    }


    /* =====================================================
       تحميل المذكرات
       ===================================================== */

    async function loadNotes() {

      const notesList =
        document.getElementById(
          "notesList"
        );


      try {

        /*
          التحقق من تسجيل الدخول
        */

        const {
          data: sessionData,
          error: sessionError
        } = await supabaseClient
          .auth
          .getSession();


        if (sessionError) {

          throw sessionError;

        }


        const session =
          sessionData.session;


        /*
          المحتوى محمي
          للمستخدمين المسجلين فقط
        */

        if (!session) {

          showLoginMessage();

          return;

        }


        /*
          تحميل المذكرات
        */

        const {
          data,
          error
        } = await supabaseClient

          .from("notes")

          .select(
            "id,title,file_path,created_at"
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          );


        if (error) {

          throw error;

        }


        notesList.innerHTML = "";


        /*
          لا توجد مذكرات
        */

        if (
          !data ||
          data.length === 0
        ) {

          const empty =
            document.createElement("div");


          empty.className =
            "empty";


          empty.textContent =
            "لا توجد مذكرات مضافة حاليًا.";


          notesList.appendChild(
            empty
          );


          return;

        }


        /*
          إضافة المذكرات
        */

        for (
          const note of data
        ) {

          const card =
            await createNoteCard(
              note
            );


          notesList.appendChild(
            card
          );

        }

      }

      catch (error) {

        console.error(
          "Supabase Error:",
          error
        );


        notesList.innerHTML = "";


        const errorMessage =
          document.createElement("div");


        errorMessage.className =
          "error";


        errorMessage.textContent =
          "تعذر تحميل المذكرات حاليًا. حاول تحديث الصفحة.";


        notesList.appendChild(
          errorMessage
        );

      }

    }


    /* =====================================================
       مراقبة تسجيل الدخول والخروج
       ===================================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (!session) {

            showLoginMessage();

          }
          else {

            loadNotes();

          }

        }
      );


    /* =====================================================
       تشغيل الصفحة
       ===================================================== */

    loadNotes();


    /*
      تجديد Signed URLs كل 25 دقيقة
      قبل انتهاء صلاحيتها.
    */

    setInterval(
      loadNotes,
      25 * 60 * 1000
    );

  </script>

</body>

</html>
