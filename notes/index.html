<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>المذكرات | منصة أرض الأحياء</title>

  <link
    rel="icon"
    href="../favicon.png"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7f7;
      color: #222;
    }

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #075e4d;
      color: white;
      padding: 25px 15px;
      z-index: 1000;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-box img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .logo-box h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .logo-box p {
      font-size: 13px;
      opacity: .8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      text-decoration: none;
      color: white;
      padding: 14px 15px;
      border-radius: 10px;
      transition: .2s;
      font-size: 15px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.15);
    }

    .main {
      margin-right: 250px;
      padding: 30px;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .topbar h1 {
      color: #075e4d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .topbar p {
      color: #666;
      font-size: 15px;
    }

    .notes-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .section-title {
      color: #075e4d;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .notes-list {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px, 1fr)
        );

      gap: 20px;
    }

    .note-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 20px;
      background: white;
      transition: .2s;
    }

    .note-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .note-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .note-card h3 {
      color: #075e4d;
      font-size: 19px;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .note-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .note-btn {
      display: inline-block;
      text-decoration: none;
      background: #075e4d;
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 14px;
      transition: .2s;
    }

    .note-btn:hover {
      background: #064c3f;
    }

    .download {
      background: #444;
    }

    .download:hover {
      background: #333;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      font-size: 16px;
      grid-column: 1 / -1;
    }

    .error {
      color: #b00020;
    }

    @media(max-width:700px) {

      .sidebar {
        width: 75px;
        padding: 20px 8px;
      }

      .logo-box h2,
      .logo-box p {
        display: none;
      }

      .logo-box img {
        width: 55px;
        height: 55px;
      }

      .menu a {
        text-align: center;
        font-size: 0;
        padding: 14px 5px;
      }

      .menu a::first-letter {
        font-size: 20px;
      }

      .main {
        margin-right: 75px;
        padding: 15px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .notes-list {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <aside class="sidebar">

    <div class="logo-box">

      <img
        src="../logo.png"
        alt="شعار منصة أرض الأحياء"
      >

      <h2>
        منصة أرض الأحياء
      </h2>

      <p>
        منصة تعليمية
      </p>

    </div>


    <nav class="menu">

      <a href="../index.html">
        🏠 الرئيسية
      </a>

      <a href="../videos/index.html">
        🎥 المحاضرات
      </a>

      <a href="../forum/index.html">
        💬 المنتدى
      </a>

      <a
        href="index.html"
        class="active"
      >
        📚 المذكرات
      </a>

    </nav>

  </aside>


  <main class="main">


    <div class="topbar">

      <h1>
        📚 المذكرات
      </h1>

      <p>
        مذكرات وملفات مادة الأحياء
      </p>

    </div>


    <section class="notes-container">

      <h2 class="section-title">
        مذكرات الأحياء
      </h2>


      <div
        id="notesList"
        class="notes-list"
      >

        <div class="loading">
          جاري تحميل المذكرات...
        </div>

      </div>

    </section>


  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://fpfbmjtpzamzlyzitmsd.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";


    const BUCKET =
      "lectures";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadNotes() {

      const notesList =
        document.getElementById(
          "notesList"
        );


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("notes")
            .select(
              "id, title, file_path, created_at"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          throw error;

        }


        if (!data || data.length === 0) {

          notesList.innerHTML = `
            <div class="empty">
              📚 لا توجد مذكرات حاليًا.
            </div>
          `;

          return;

        }


        notesList.innerHTML = "";


        data.forEach(note => {

          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from(BUCKET)
              .getPublicUrl(
                note.file_path
              );


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "note-card";


          const date =
            note.created_at
              ? new Date(
                  note.created_at
                ).toLocaleDateString(
                  "ar-EG"
                )
              : "";


          card.innerHTML = `

            <div class="note-icon">
              📕
            </div>

            <h3>
              ${escapeHtml(
                note.title
              )}
            </h3>

            <div class="note-date">
              📅 ${date}
            </div>

            <div class="buttons">

              <a
                class="note-btn"
                href="${publicData.publicUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >
                📖 فتح المذكرة
              </a>

              <a
                class="note-btn download"
                href="${publicData.publicUrl}"
                download
              >
                ⬇️ تحميل
              </a>

            </div>

          `;


          notesList.appendChild(
            card
          );

        });

      }

      catch (error) {

        console.error(error);


        notesList.innerHTML = `

          <div class="error">

            ❌ تعذر تحميل المذكرات.

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      }

    }


    function escapeHtml(text) {

      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    loadNotes();

  </script>


</body>

</html>
