<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الاختبار | منصة أرض الأحياء</title>

  <link rel="icon" href="../favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #075e54, #0b806f);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      padding: 3px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .timer {
      background: white;
      color: #075e54;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      min-width: 95px;
      text-align: center;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .exam-header {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .exam-header h2 {
      color: #075e54;
      margin-bottom: 10px;
    }

    .exam-header p {
      color: #687386;
      line-height: 1.8;
    }

    .question {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.05);
    }

    .question h3 {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .option {
      display: block;
      background: #f7f8fa;
      border: 1px solid #e2e5eb;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: .2s;
    }

    .option:hover {
      background: #eaf6f3;
      border-color: #0b806f;
    }

    .option input {
      margin-left: 8px;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: #075e54;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      margin: 10px 0 30px;
    }

    .submit-btn:hover {
      background: #064d45;
    }

    .loading,
    .error-box,
    .empty-box {
      background: white;
      padding: 35px 20px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .error-box {
      color: #b00020;
    }

    .result {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 30px;
    }

    .result h2 {
      color: #075e54;
      margin-bottom: 15px;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      color: #0b806f;
      margin: 15px 0;
    }

    .back-btn {
      display: inline-block;
      text-decoration: none;
      background: #075e54;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      color: #7b8494;
      padding: 25px;
      font-size: 13px;
    }

    @media(max-width:600px) {

      .brand h1 {
        font-size: 16px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .timer {
        padding: 8px 10px;
        min-width: 80px;
        font-size: 13px;
      }

      .question {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">

    <img
      src="../logo.png"
      alt="شعار منصة أرض الأحياء"
    >

    <h1>منصة أرض الأحياء</h1>

  </div>

  <div
    class="timer"
    id="timer"
  >
    ⏱️ --:--
  </div>

</header>


<main>

  <div
    id="loading"
    class="loading"
  >
    ⏳ جاري تحميل الاختبار...
  </div>


  <div
    id="errorBox"
    class="error-box"
    style="display:none;"
  ></div>


  <div
    id="examArea"
    style="display:none;"
  >

    <div class="exam-header">

      <h2 id="examTitle">
        الاختبار
      </h2>

      <p id="examDescription"></p>

    </div>


    <form id="examForm">

      <div id="questionsContainer"></div>

      <button
        type="submit"
        class="submit-btn"
      >
        📤 تسليم الاختبار
      </button>

    </form>

  </div>


  <div
    id="result"
    class="result"
  >

    <h2>🎉 انتهى الاختبار</h2>

    <p>نتيجتك:</p>

    <div
      class="score"
      id="score"
    >
      0 / 0
    </div>

    <p id="message"></p>

    <a
      href="index.html"
      class="back-btn"
    >
      ↩️ العودة إلى الاختبارات
    </a>

  </div>

</main>


<footer>
  © 2026 منصة أرض الأحياء
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  let examId = null;
  let questions = [];
  let timeLeft = 0;
  let timerInterval = null;
  let submitted = false;


  // =========================
  // الحصول على ID الاختبار
  // =========================

  function getExamId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("id");

  }


  // =========================
  // تحميل الاختبار
  // =========================

  async function loadExam() {

    examId = getExamId();


    if (!examId) {

      showError(
        "❌ لم يتم تحديد الاختبار."
      );

      return;

    }


    try {

      const {
        data: exam,
        error: examError
      } =
        await supabaseClient
          .from("exams")
          .select("*")
          .eq("id", examId)
          .single();


      if (examError) {
        throw examError;
      }


      if (!exam) {

        showError(
          "❌ الاختبار غير موجود."
        );

        return;

      }


      document.title =
        exam.title
        + " | منصة أرض الأحياء";


      document
        .getElementById("examTitle")
        .textContent =
          "📝 " + exam.title;


      document
        .getElementById("examDescription")
        .textContent =
          exam.description ||
          "أجب عن جميع الأسئلة ثم اضغط على تسليم الاختبار.";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("exam_questions")
          .select("*")
          .eq("exam_id", examId)
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {
        throw error;
      }


      questions = data || [];


      if (questions.length === 0) {

        showError(
          "⚠️ هذا الاختبار لا يحتوي على أسئلة حتى الآن."
        );

        return;

      }


      renderQuestions();


      document
        .getElementById("loading")
        .style.display = "none";


      document
        .getElementById("examArea")
        .style.display = "block";


      startTimer(
        Number(exam.duration) || 10
      );

    }

    catch (error) {

      console.error(error);

      showError(
        "❌ حدث خطأ أثناء تحميل الاختبار: "
        + error.message
      );

    }

  }


  // =========================
  // عرض الأسئلة
  // =========================

  function renderQuestions() {

    const container =
      document
        .getElementById(
          "questionsContainer"
        );


    container.innerHTML = "";


    questions.forEach(
      (question, index) => {

        const box =
          document.createElement("div");


        box.className =
          "question";


        box.innerHTML = `

          <h3>
            ${index + 1}.
            ${escapeHtml(
              question.question
            )}
          </h3>

          <label class="option">

            <input
              type="radio"
              name="question_${question.id}"
              value="a"
            >

            أ)
            ${escapeHtml(
              question.option_a
            )}

          </label>


          <label class="option">

            <input
              type="radio"
              name="question_${question.id}"
              value="b"
            >

            ب)
            ${escapeHtml(
              question.option_b
            )}

          </label>


          <label class="option">

            <input
              type="radio"
              name="question_${question.id}"
              value="c"
            >

            ج)
            ${escapeHtml(
              question.option_c
            )}

          </label>


          <label class="option">

            <input
              type="radio"
              name="question_${question.id}"
              value="d"
            >

            د)
            ${escapeHtml(
              question.option_d
            )}

          </label>

        `;


        container.appendChild(box);

      }
    );

  }


  // =========================
  // المؤقت
  // =========================

  function startTimer(minutes) {

    timeLeft =
      minutes * 60;


    updateTimer();


    timerInterval =
      setInterval(
        function() {

          timeLeft--;

          updateTimer();


          if (timeLeft <= 0) {

            clearInterval(
              timerInterval
            );


            alert(
              "⏰ انتهى وقت الاختبار وسيتم تسليم الإجابات."
            );


            submitExam();

          }

        },
        1000
      );

  }


  function updateTimer() {

    const minutes =
      Math.floor(
        timeLeft / 60
      );


    const seconds =
      timeLeft % 60;


    document
      .getElementById("timer")
      .textContent =
        "⏱️ "
        + minutes
        + ":"
        + String(seconds)
            .padStart(2, "0");

  }


  // =========================
  // تسليم الاختبار
  // =========================

  document
    .getElementById("examForm")
    .addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        submitExam();

      }
    );


  function submitExam() {

    if (submitted) return;


    submitted = true;


    clearInterval(
      timerInterval
    );


    let score = 0;


    questions.forEach(
      question => {

        const selected =
          document.querySelector(
            `input[name="question_${question.id}"]:checked`
          );


        if (
          selected &&
          selected.value ===
          question.correct_answer
        ) {

          score++;

        }

      }
    );


    document
      .getElementById("examArea")
      .style.display = "none";


    const result =
      document
        .getElementById("result");


    result.style.display =
      "block";


    document
      .getElementById("score")
      .textContent =
        score
        + " / "
        + questions.length;


    const percentage =
      Math.round(
        (score / questions.length) * 100
      );


    let message = "";


    if (percentage === 100) {

      message =
        "🌟 ممتاز جدًا! حصلت على الدرجة الكاملة.";

    }
    else if (percentage >= 80) {

      message =
        "👏 أداء رائع! استمر في المراجعة.";

    }
    else if (percentage >= 60) {

      message =
        "👍 نتيجة جيدة، ويمكنك تحسينها بالمزيد من التدريب.";

    }
    else {

      message =
        "📚 راجع الدرس وحاول مرة أخرى.";

    }


    document
      .getElementById("message")
      .textContent =
        message;

  }


  // =========================
  // رسالة خطأ
  // =========================

  function showError(message) {

    document
      .getElementById("loading")
      .style.display = "none";


    const box =
      document
        .getElementById("errorBox");


    box.textContent =
      message;


    box.style.display =
      "block";

  }


  // =========================
  // حماية النصوص
  // =========================

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =========================
  // بدء الصفحة
  // =========================

  loadExam();

</script>

</body>
</html>
