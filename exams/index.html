<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الاختبارات | منصة أرض الأحياء</title>

  <meta
    name="description"
    content="اختبارات الأحياء الإلكترونية - منصة أرض الأحياء"
  >

  <link rel="icon" href="../favicon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #075e54, #0b806f);
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
      background: white;
      padding: 3px;
    }

    .brand h1 {
      font-size: 21px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      padding: 10px 16px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h2 {
      font-size: 30px;
      color: #075e54;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #687386;
      font-size: 15px;
    }

    .exams-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
      );
      gap: 20px;
    }

    .exam-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      border: 1px solid #e8ebf1;
      transition: 0.25s;
    }

    .exam-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.11);
    }

    .exam-icon {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f7f4;
      border-radius: 15px;
      font-size: 29px;
      margin-bottom: 17px;
    }

    .exam-card h3 {
      color: #075e54;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .exam-card p {
      color: #697386;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .info {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .info span {
      background: #f2f4f8;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #596273;
    }

    .start-btn {
      display: block;
      width: 100%;
      border: none;
      background: #075e54;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: 0.2s;
    }

    .start-btn:hover {
      background: #064d45;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: #697386;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      grid-column: 1 / -1;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .loading {
      background: white;
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: #697386;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      grid-column: 1 / -1;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcaca;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      color: #b42318;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      color: #7b8494;
      padding: 30px 15px;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .back-btn {
        padding: 8px 10px;
        font-size: 13px;
      }

      .page-title h2 {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="brand">

    <img
      src="../logo.png"
      alt="شعار منصة أرض الأحياء"
    >

    <h1>منصة أرض الأحياء</h1>

  </div>


  <a
    class="back-btn"
    href="../index.html"
  >
    🏠 الرئيسية
  </a>

</header>



<main>

  <div class="page-title">

    <h2>📝 الاختبارات</h2>

    <p>
      اختبر معلوماتك في الأحياء واعرف مستواك
    </p>

  </div>


  <div
    id="examsGrid"
    class="exams-grid"
  >

    <div class="loading">
      ⏳ جاري تحميل الاختبارات...
    </div>

  </div>

</main>



<footer>

  © 2026 منصة أرض الأحياء - جميع الحقوق محفوظة

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  // ==============================
  // إعداد Supabase
  // ==============================

  const SUPABASE_URL =
    "https://fpfbmjtpzamzlyzitmsd.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_J10919zw5BMKBqXnId0NyA_qLTz8X7d";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );



  // ==============================
  // تحميل الاختبارات
  // ==============================

  async function loadExams() {

    const grid =
      document.getElementById(
        "examsGrid"
      );


    try {

      const {
        data: exams,
        error
      } =
        await supabaseClient
          .from("exams")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="error">
            ❌ حدث خطأ أثناء تحميل الاختبارات.
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

        return;

      }


      // لا توجد اختبارات

      if (
        !exams ||
        exams.length === 0
      ) {

        grid.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              📝
            </div>

            <h3>
              لا توجد اختبارات حاليًا
            </h3>

            <p style="margin-top:10px;">
              سيتم إضافة الاختبارات قريبًا.
            </p>

          </div>
        `;

        return;

      }


      // تنظيف الصفحة

      grid.innerHTML = "";


      // إنشاء بطاقات الاختبارات

      for (
        const exam of exams
      ) {

        const questionCount =
          await getQuestionCount(
            exam.id
          );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "exam-card";


        card.innerHTML = `

          <div class="exam-icon">
            🧬
          </div>


          <h3>
            ${escapeHtml(
              exam.title
            )}
          </h3>


          <p>
            ${escapeHtml(
              exam.description ||
              "اختبار تدريبي في الأحياء."
            )}
          </p>


          <div class="info">

            <span>
              ❓ ${questionCount} سؤال
            </span>

            <span>
              ⏱️ ${Number(
                exam.duration || 10
              )} دقيقة
            </span>

          </div>


          <a
            class="start-btn"
            href="exam.html?id=${encodeURIComponent(
              exam.id
            )}"
          >
            🚀 بدء الاختبار
          </a>

        `;


        grid.appendChild(card);

      }

    }

    catch (error) {

      console.error(error);


      grid.innerHTML = `

        <div class="error">

          ❌ تعذر تحميل الاختبارات.

          <br><br>

          حاول تحديث الصفحة.

        </div>

      `;

    }

  }



  // ==============================
  // عدد الأسئلة
  // ==============================

  async function getQuestionCount(
    examId
  ) {

    const {
      count,
      error
    } =
      await supabaseClient
        .from("exam_questions")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "exam_id",
          examId
        );


    if (error) {

      console.error(error);

      return 0;

    }


    return count || 0;

  }



  // ==============================
  // حماية النصوص
  // ==============================

  function escapeHtml(text) {

    return String(text)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  // تشغيل الصفحة

  loadExams();

</script>


</body>

</html>
